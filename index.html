    // grew a copse in the middle of its lake and the Vault had a forest
    // indoors.
    const trees = dg === 'water' ? 3 : dg === 'vault' ? 0
                : dg === 'cellar' ? 11 : (30 + rnd()*12) * this.theme.trees;
    // The Vault is members only, so it gets a roped gallery and the crowd to
    // stand behind it. The Floodlit Green gets its lamps.
    const pylons = dg === 'cellar'
      ? [[LEN - 3, -1], [LEN - 3, 1], [LEN + 7, -1], [LEN + 7, 1]]
          .map(([d, sx]) => ({ d, x: sx * (this.fwWidth(Math.min(d, LEN)) + 2.2) }))
      : null;
    this.layProps(rnd, { trees, kind: this.theme.kind, ropes: dg === 'vault', pylons,
                         crowd: dg === 'vault' ? 18 : dg === 'water' ? 0 : 6 });

    this.hills = [[], []];
    for(let L = 0; L < 2; L++) for(let i = 0; i <= 40; i++) this.hills[L].push(rnd());
    this.camD = 0;
    this.balls.length = 0; this.nums.length = 0; this.sparks.length = 0;
    this.buildSky();
  },

  /* ---- sky: dithered bands, never a gradient ---- */
  // The moon used to be a pale disc with a sky-coloured disc painted over it
  // to make the crescent. That only works while the sky behind it is exactly
  // that one colour -- against a gradient the bite showed as a flat patch of
  // the wrong blue, sitting a shade off whatever it was covering. Built on its
  // own layer and BITTEN out instead, so what shows through the crescent is
  // the sky itself, whatever the sky happens to be doing there.
  drawMoon(g, mx, my, r){
    // A little air around it. Stacked discs one pixel apart rather than four
    // fat ones: four read as four rings drawn round the moon, which is not
    // what a halo is.
    const G = Math.max(4, Math.round(r*2.2));
    for(let i = G; i >= 1; i--){
      const t = i/G;
      g.globalAlpha = 0.030 * (1 - t) * (1 - t);
      pxCircle(g, mx, my, r + i, '#CFDCF2');
    }
    g.globalAlpha = 1;
    const n = r*2 + 3, c0 = r + 1;
    const cv = document.createElement('canvas');
    cv.width = cv.height = n;
    const m = cv.getContext('2d');
    pxCircle(m, c0, c0, r, '#DCE2D2');
    // the lit limb, and a brighter core inside it
    pxCircle(m, c0 - Math.round(r*0.22), c0 - Math.round(r*0.20), Math.round(r*0.82), '#EDF1E3');
    pxCircle(m, c0 - Math.round(r*0.40), c0 - Math.round(r*0.34), Math.round(r*0.46), '#F8FAF0');
    // maria: flat grey seas, not a scatter of single pixels
    const mr = seeded(0x5EA51);
    for(let i = 0; i < 6; i++){
      const a = mr()*Math.PI*2, rad = Math.sqrt(mr())*r*0.66;
      pxCircle(m, c0 + Math.round(Math.cos(a)*rad), c0 + Math.round(Math.sin(a)*rad),
               Math.max(1, Math.round(r*(0.09 + mr()*0.15))),
               i & 1 ? '#C2CAB8' : '#CED6C4');
    }
    m.globalCompositeOperation = 'destination-out';
    pxCircle(m, c0 + Math.round(r*0.66), c0 - Math.round(r*0.36), r, '#000');
    m.globalCompositeOperation = 'source-over';
    g.drawImage(cv, mx - c0, my - c0);
  },

  buildSky(){
    // Dithering a sky is thousands of single-pixel writes. It only depends on
    // the conditions and the frame size, so it is cached against those and not
    // rebuilt for every hole, which at a high Tour Card is several a second.
    const key = [this.themeId, this.night, this.aurora, this.rain, VW, HORIZON].join('|');
    if(key === this.skyKey && this.sky) return;
    this.skyKey = key;
    const H = Math.max(2, HORIZON + 2);
    const c = document.createElement('canvas');
    c.width = Math.max(2, VW); c.height = H;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    const ramp = (this.theme || THEMES.day).sky;
    smoothRamp(g, 0, 0, VW, H, ramp);

    const rnd = seeded(hash32(key.length*7919 + VW*31 + (this.night?3:0) + (this.aurora?7:0)));
    if(this.night){
      // A field of one tone at one brightness reads as dust on the screen.
      // Three tiers, thinning towards the horizon where the air thickens, and
      // a few bright enough to throw a glint.
      for(let i = 0; i < 130; i++){
        const x = Math.floor(rnd()*VW);
        const y = Math.floor(Math.pow(rnd(), 1.35) * H * 0.92);
        const v = rnd();
        g.globalAlpha = (0.30 + v*0.70) * clamp(1.15 - y/(H*0.92), 0.25, 1);
        g.fillStyle = v < 0.34 ? '#8FA6C4' : v < 0.86 ? '#C6D2E6' : '#F2F6FF';
        g.fillRect(x, y, 1, 1);
        if(v > 0.965){
          g.globalAlpha *= 0.42;
          g.fillRect(x - 1, y, 1, 1); g.fillRect(x + 1, y, 1, 1);
          g.fillRect(x, y - 1, 1, 1); g.fillRect(x, y + 1, 1, 1);
        }
      }
      g.globalAlpha = 1;
      this.drawMoon(g, Math.round(VW*0.775), Math.round(H*0.23),
                    Math.max(5, Math.round(VW*0.055)));
    }
    if(this.aurora){
      // Two thin ribbons with a bright core and a short dithered falloff.
      // The previous version drew three seven-pixel bands of heavy dither
      // across a sky only seventy pixels tall, which filled it with noise.
      for(let i = 0; i < 2; i++){
        const base = Math.round(H*(0.20 + i*0.17));
        const col = i ? PX.myth : PX.aur;
        for(let x = 0; x < VW; x++){
          const yy = Math.round(base + Math.sin(x*0.045 + i*2.2)*H*0.055);
          g.fillStyle = col;
          g.globalAlpha = 0.55;
          g.fillRect(x, yy, 1, 1);
          g.globalAlpha = 0.22;
          for(let k = 1; k <= 3; k++)
            if(BAYER[(yy+k) & 3][x & 3] < 6 - k) g.fillRect(x, yy + k, 1, 1);
          g.globalAlpha = 1;
        }
      }
    }
    if(!this.night && !this.rain){
      // Opaque, in three flat tones. Stacked translucent circles darkened
      // wherever two overlapped, so a cloud read as a clump of discs rather
      // than one body, and whatever was behind it showed through every seam.
      const body = lite(ramp[0], 0.80), lit = lite(ramp[0], 0.96),
            shade = lite(ramp[0], 0.56);
      for(let i = 0; i < 5; i++){
        const cx = Math.floor(rnd()*VW), cy = Math.floor(H*0.12 + rnd()*H*0.38);
        const w = Math.round(VW*(0.10 + rnd()*0.11));
        const lobes = [];
        const n = 4 + Math.floor(rnd()*3);
        for(let k = 0; k < n; k++){
          const t = n === 1 ? 0.5 : k/(n-1);
          // fattest in the middle, tapering to each end, and a flat base
          const hump = Math.sin(t*Math.PI);
          lobes.push({ ox: Math.round((t - 0.5)*w*1.5),
                       oy: -Math.round(hump*w*0.16) + Math.round((rnd()-0.5)*2),
                       r: Math.max(2, Math.round(w*(0.17 + hump*0.20))) });
        }
        // shadowed underside first, then the body lifted off it, then a rim
        for(const L of lobes) pxCircle(g, cx + L.ox, cy + L.oy + Math.max(1, w*0.05|0), L.r, shade);
        for(const L of lobes) pxCircle(g, cx + L.ox, cy + L.oy, L.r, body);
        for(const L of lobes)
          if(L.r > 3) pxCircle(g, cx + L.ox, cy + L.oy - Math.max(1, L.r*0.30|0),
                               Math.max(2, Math.round(L.r*0.62)), lit);
      }
    }
    this.sky = c;
  },

  /* ---- events from the sim ---- */
  swing(dmg, crit, el){
    // A visual swing takes swingDur to play, and launch() only fires as it
    // crosses its halfway point. Restarting it before then means that crossing
    // never happens, so past about five swings a second the ball, the damage
    // number and the crit spark all stopped appearing while the sim carried on
    // hitting. Above that rate the eye cannot follow individual swings anyway.
    if(this.swingT > this.swingDur*0.5) return;
    this.swingT = this.swingDur; this.pendingBall = { crit, el, dmg };
  },
  // A shot at something in particular: the pin, or the water beside it.
  aimed(dmg, el, targetD, lat, crit){
    this.swingT = this.swingDur;
    this.pendingBall = { crit, el, dmg, target:targetD, lat };
  },
  launch(){
    const p = this.pendingBall || { crit:false, el:null, dmg:0 };
    this.pendingBall = null;
    // the sound of the strike, on the frame the club meets the ball
    Sfx.play('strike', p.crit);
    // Off the face, not out of the middle of the screen: it leaves from where
    // the clubhead is and drifts across to wherever it is going.
    const lat0 = this.teeLat === undefined ? 0.42 : this.teeLat;
    this.balls.push({ d0:this.camD,
                      // an aimed shot flies to the point it was aimed at
                      dist: p.target !== undefined ? Math.max(3, p.target - this.camD)
                                                   : 14 + Math.random()*9,
                      t:0, dur:.55 + Math.random()*.14, el:p.el, crit:p.crit, seed: Math.random()*100,
                      lat0: lat0,
                      lat: p.lat !== undefined ? p.lat : -0.15 + (Math.random()-.5)*0.30 });
    if(this.nums.length < 12 && p.dmg > 0){
      // Kept clear of whatever is already floating there, measured in the
      // numbers' real widths. They all rise at the same speed, so a number
      // placed clear stays clear. The old nudge assumed short numbers and only
      // looked at the newest ones; at a billion yards a swing and a fast tempo
      // they piled on top of each other. No room within a few lines and the
      // number is skipped rather than drawn over another.
      const lab = n => (n.crit ? '*' : '') + fmt(n.v);
      const me = { t:0, v:p.dmg, crit:p.crit, x:(Math.random()-.5)*10, y:0 };
      const w = textW(lab(me), TSC), line = (FH + 3) * TSC;
      let tries = 0, hit = true;
      while(hit && tries++ < 5){
        hit = false;
        for(const q of this.nums){
          const qy = (q.y || 0) - q.t*20*TSC;
          const gapX = Math.abs((q.x || 0) - me.x) * US, reach = (textW(lab(q), TSC) + w) / 2 + TSC;
          if(gapX < reach && Math.abs(qy - me.y) < line){ me.y = qy - line; hit = true; }
        }
      }
      if(!hit) this.nums.push(me);
    }
    if(p.crit && this.sparks.length < 20) this.sparks.push({ t:0, k:'crit' });
  },
  spark(el){ if(this.sparks.length < 20) this.sparks.push({ t:0, k:el }); },
  burst(id){ if(this.sparks.length < 20) this.sparks.push({ t:0, k:'skill', id }); },
  cast(g){ this.casts.push({ t:0, g }); if(this.casts.length > 4) this.casts.shift(); },
  holed(sc){ this.banner = { t:0, n:sc.n, d:sc.d }; },
  depthsFlash(col){ this.flash = 1; this.flashCol = col; }
};

// Two legs from the hip: the far one first, in the darker cloth, then the
// near one, each ending in a shoe. ph is the stride phase (a whole number is
// a full cycle of two steps); null stands them straight. Each leg bends at
// the knee as it swings through, so the stride is not a pair of compasses.
function drawLegs(c, hx, hy, len, w, ph, near, far, shoe){
  const th = Math.max(1, Math.round(w * 0.09)), fw = Math.max(2, Math.round(th * 2.2));
  const leg = (swing, col, dx) => {
    const a = swing * 0.42, lift = Math.max(0, -Math.cos(ph * Math.PI * 2 + (dx > 0 ? 0 : Math.PI))) * 0.25;
    const kx = hx + dx + Math.sin(a) * len * 0.5, ky = hy + Math.cos(a) * len * 0.5;
    const b = a - (ph === null ? 0 : lift);
    const fx = kx + Math.sin(b) * len * 0.5, fy = ky + Math.cos(b) * len * 0.5;
    pxLine(c, hx + dx, hy, kx, ky, col, th);
    pxLine(c, kx, ky, fx, fy, col, th);
    c.fillStyle = shoe; c.fillRect(Math.round(fx - th * 0.3), Math.round(fy), fw, Math.max(1, th));
  };
  const s = ph === null ? 0 : Math.sin(ph * Math.PI * 2);
  leg(-s, far, -th * 0.4);
  leg(s, near, th * 0.6);
}
function pxRing(c, cx, cy, r, col){
  c.fillStyle = col;
  const n = Math.max(10, Math.round(r*4.2));
  for(let i = 0; i < n; i++){
    const a = i/n * 6.28318;
    c.fillRect(Math.round(cx + Math.cos(a)*r), Math.round(cy + Math.sin(a)*r), 1, 1);
  }
}
// A flat panel with a one-pixel border and the corner pixels knocked out, which
// is how a box gets rounded when a box is nine pixels tall.
function panel(c, x, y, w, h, fill, border){
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  c.fillStyle = fill;
  c.fillRect(x+1, y, w-2, h);
  c.fillRect(x, y+1, w, h-2);
  if(border){
    c.fillStyle = border;
    c.fillRect(x+1, y, w-2, 1); c.fillRect(x+1, y+h-1, w-2, 1);
    c.fillRect(x, y+1, 1, h-2); c.fillRect(x+w-1, y+1, 1, h-2);
  }
}

/* ---- the hole from above ----
   From the tee the rolling ground hides most of a dogleg, so a small map of
   the hole sits on the stage: fairway, sand, water, trees, the green and the
   flag, with the golfer and any ball in the air on it. The hole is drawn once
   when it changes; each frame only lays the markers over that. */
Object.assign(Scene, {
  placeMap(){
    const cv = $('holeMap'), st = $('stage'), pk = $('perkBtn');
    if(!cv || !st || !pk || !this.cv) return;
    const SW = st.clientWidth, SH = st.clientHeight;
    const top = pk.offsetTop + pk.offsetHeight + Math.max(8, Math.round(SW * 0.03));
    // the weather lines are drawn in the frame, up to four of them, above
    // the pull tab's corner: measured in buffer rows and scaled to the screen
    const k = SH / Math.max(1, VH);
    const floor = Math.round((VH - LH*4 - 2 - VH*0.045) * k) - 6;
    const W = clamp(Math.round(SW * 0.16 / 2) * 2, 40, 92);
    const room = floor - top;
    if(room < W * 1.15 || S.dgnRun){ cv.style.display = 'none'; this.mapOn = false; return; }
    const H = Math.min(Math.round(W * 1.7 / 2) * 2, Math.floor(room / 2) * 2);
    const mw = W / 2, mh = H / 2;
    if(cv.width !== mw || cv.height !== mh){ cv.width = mw; cv.height = mh; this.mapKey = null; }
    cv.style.width = W + 'px'; cv.style.height = H + 'px'; cv.style.top = top + 'px';
    cv.style.display = 'block'; this.mapOn = true;
  },
  // world (distance d, lateral x from the centre line) to map pixels
  mapXY(d, x){
    const M = this.mapM;
    return [M.ox + (this.curveAt(d) + x - M.cx) * M.kx, M.oy - (d - M.d0) * M.k];
  },
  buildMap(mw, mh){
    const T = this.theme || THEMES.day;
    const key = [this.hole, this.tier, this.themeId, mw, mh].join('|');
    if(this.mapKey === key && this.mapStatic) return;
    this.mapKey = key;
    const d0 = -3, d1 = LEN + 11;
    let lo = Infinity, hi = -Infinity;
    for(let d = d0; d <= d1; d += 1){ const c = this.curveAt(d); lo = Math.min(lo, c); hi = Math.max(hi, c); }
    lo -= 5; hi += 5;
    // Drawn wider than it is, the way a course guide is: at true scale a
    // fairway six wide and seventy long is a two-pixel thread.
    const k = Math.min((mw - 2) / (hi - lo), (mh - 2) / (d1 - d0));
    const kx = Math.min((mw - 2) / (hi - lo), k * 2.4);
    this.mapM = { k, kx, d0, cx: (lo + hi) / 2, ox: mw / 2, oy: mh - 1 - ((mh - 2) - (d1 - d0) * k) / 2 };
    const cv = this.mapStatic || (this.mapStatic = document.createElement('canvas'));
    cv.width = mw; cv.height = mh;
    const g = cv.getContext('2d');
    g.fillStyle = T.rg[2]; g.fillRect(0, 0, mw, mh);
    // Every row of the map is a distance down the hole, and each shape is
    // its width across the hole at that distance -- the same measure the
    // view uses, so a bunker beside the fairway out there is beside it here.
    // Walked at half a row so a corner, where the hole runs across the map,
    // has no gaps in it.
    const span = (d, x0, x1, col, striped) => {
      const [a, y] = this.mapXY(d, x0), [b] = this.mapXY(d, x1);
      const l = Math.round(Math.min(a, b)), r = Math.round(Math.max(a, b)), yy = Math.round(y);
      g.fillStyle = striped ? ((yy >> 1) & 1 ? col[0] : col[1]) : col;
      g.fillRect(l, yy, Math.max(1, r - l), 1);
    };
    const step = 0.5 / k;
    for(let d = d0; d <= d1; d += step){
      if(d > -0.5 && d < LEN + 7){ const hw = this.fwWidth(d); span(d, -hw, hw, [T.fw[4], T.fw[5]], true); }
      const gd = d - LEN;
      if(Math.abs(gd) < 8.6){ const a = 3.05 * Math.sqrt(1 - (gd/8.6)*(gd/8.6)); span(d, -a, a, T.apron); }
      if(Math.abs(gd) < 7.5){ const a = 2.35 * Math.sqrt(1 - (gd/7.5)*(gd/7.5)); span(d, -a, a, T.gr[4]); }
      for(const hz of this.bunkers){ const sp = this.hazSpan(hz, d); if(sp) span(d, hz.x - sp.l, hz.x + sp.r, T.sd[4]); }
      if(this.water){ const sp = this.hazSpan(this.water, d); if(sp) span(d, this.water.x - sp.l, this.water.x + sp.r, T.wt[3]); }
    }
    // the tee
    { const [x, y] = this.mapXY(0, 0); g.fillStyle = T.gr[3]; g.fillRect(Math.round(x) - 1, Math.round(y) - 1, 3, 2); }
    // trees, as dark clumps
    for(const p of (this.props || [])){
      if(p.kind !== 0 || p.d < d0 || p.d > d1) continue;
      const [x, y] = this.mapXY(p.d, p.x);
      if(x < 0 || x >= mw || y < 0 || y >= mh) continue;
      g.fillStyle = T.tl2; g.fillRect(Math.round(x), Math.round(y), 2, 2);
      g.fillStyle = T.tl;  g.fillRect(Math.round(x), Math.round(y), 1, 1);
    }
    // the flag
    { const [x, y] = this.mapXY(LEN, 0), fx = Math.round(x), fy = Math.round(y);
      g.fillStyle = '#F4F6EF'; g.fillRect(fx, fy - 3, 1, 4);
      g.fillStyle = '#E4574A'; g.fillRect(fx + 1, fy - 3, 2, 1); }
    // a frame, one pixel of the rough's own dark
    g.fillStyle = T.rg[0];
    g.fillRect(0, 0, mw, 1); g.fillRect(0, mh - 1, mw, 1); g.fillRect(0, 0, 1, mh); g.fillRect(mw - 1, 0, 1, mh);
  },
  drawMap(){
    if(!this.mapOn){
      // placed on the first frame, and again whenever the stage changes shape
      if(this._mapTry !== VW + 'x' + VH){ this._mapTry = VW + 'x' + VH; this.placeMap(); }
      if(!this.mapOn) return;
    }
    const cv = $('holeMap'), mw = cv.width, mh = cv.height;
    // ten times a second is plenty for a map
    if(this.t - (this._mapT || 0) < 0.1 && this.mapKey) return;
    this._mapT = this.t;
    this.buildMap(mw, mh);
    const g = cv.getContext('2d');
    g.drawImage(this.mapStatic, 0, 0);
    // balls in the air, as a white pixel each
    g.fillStyle = '#FFFFFF';
    for(const b of this.balls){
      const u = clamp(b.t / b.dur, 0, 1), lt = this.ballLat(b, u);
      const [x, y] = this.mapXY(b.d0 + b.dist*u, lt);
      g.fillRect(Math.round(x), Math.round(y), 1, 1);
    }
    // the golfer, blinking
    const [x, y] = this.mapXY(this.camD, -0.30);
    g.fillStyle = (this.t * 2.5) % 1 < 0.6 ? '#FFD66B' : '#1A1F1A';
    g.fillRect(Math.round(x) - 1, Math.round(y) - 1, 2, 2);
  },
  fwWidth(d){
    const t = clamp(d/LEN, 0, 1);
    const L = this.land || { fw:3.10, taper:0.85 };
    return L.fw - (L.taper || 0.85)*t*(L.fw/3.10) + Math.sin(d*0.05 + this.seed)*0.22;
  },
  // Left and right extent of a blob hazard at world distance d. Two outlines
  // rather than one mirrored half: a bunker with the same silhouette either
  // side of its own centre line reads as a stamped shape, not as dug ground.
  hazSpan(hz, d){
    const t = (d - hz.d) / hz.rd;
    if(t <= -1 || t >= 1) return null;
    const u = Math.acos(clamp(t, -1, 1)) / Math.PI;
    const base = hz.rx * Math.sqrt(1 - t*t);
    return { l: base * shapeAt(hz.shape, u),
             r: base * shapeAt(hz.shape2 || hz.shape, u) };
  },

  /* ---- terrain, one scanline at a time ---- */
  // Distance haze. Ground and props are drawn crisp, then this one blit lifts
  // everything far away toward the horizon colour, which is what actually makes
  // a flat scanline field read as depth. Cached per theme and size, so it costs
  // a single drawImage a frame rather than a hundred alpha fills.
  buildHaze(){
    const key = this.themeId + '|' + VW + 'x' + VH;
    if(this.hazeKey === key && this.haze) return;
    const T = this.theme || THEMES.day;
    const cv = document.createElement('canvas');
    cv.width = VW; cv.height = VH;
    const g = cv.getContext('2d');
    g.clearRect(0, 0, VW, VH);
    g.fillStyle = T.sky[4];
    // Starts ABOVE the horizon. With a height field a rise can stand higher
    // than the horizon line, and haze that began at the line left that ground
    // as a hard, fully saturated slab sitting on top of the mountains.
    //
    // It has to ARRIVE there gradually as well. Above the line there is no
    // ground to measure a distance against, so the strength saturated and the
    // layer came in at full alpha on its very first row: an opaque bar ruled
    // straight across the sky. Faded in over the run-up instead, so the only
    // thing it does up there is take the edge off a crest that breaks the
    // skyline.
    // ONE hump, and both halves of it measured in screen space.
    //
    // It used to fade IN over a fraction of the buffer height and fade OUT over
    // a WORLD distance, through K_PROJ and GROUND. Those two do not scale
    // together: on the short buffer it was written against, the fade-out spanned
    // a fifth of the frame and read as depth, and on a tall one it collapsed to
    // seven per cent of it and read as a bar ruled across the middle of the
    // screen, through the trees and everything else, because the haze goes down
    // after the props. Screen space either side keeps the band the same shape at
    // any buffer size, and the horizon is where it peaks because that is where
    // the far ground actually is.
    const top  = Math.max(0, HORIZON - Math.round(VH*0.18));
    const deep = HORIZON + Math.round((VH - HORIZON) * 0.55);
    const ss   = t => t*t*(3 - 2*t);
    for(let y = top; y < VH; y++){
      const u = clamp((y - top) / Math.max(1, HORIZON - top), 0, 1);
      const v = clamp((y - HORIZON) / Math.max(1, deep - HORIZON), 0, 1);
      const a = ss(u) * (1 - ss(v)) * 0.34;
      if(a <= 0.004) continue;
      g.globalAlpha = a;
      g.fillRect(0, y, VW, 1);
    }
    g.globalAlpha = 1;
    this.haze = cv; this.hazeKey = key;
  },

  // The ground's first row is the far end of the world and it arrives at full
  // saturation, while the sky's last row directly above it is sky: a hard line
  // ruled across the frame at the horizon, one buffer row thick and two or
  // three on screen once the blit has scaled it. This lays the sky colour back
  // over the top of the ground, strong at the line and gone within a few per
  // cent of the frame, so the two actually meet. It goes down with the GROUND,
  // under the props, so unlike the haze it can never cut a tree in half.
  drawFarFade(){
    const c = this.b;
    // Blended toward whatever is actually up there rather than toward the sky
    // colour: at the horizon that is usually the far treeline, not sky, and
    // painting sky over the ground instead put a bar back twice as bright as
    // the one it was closing. The row above is drawn back over the first few
    // ground rows at a decaying alpha, so the two meet whatever they are.
    const n = Math.max(3, Math.round(VH * 0.032));
    for(let i = 0; i < n; i++){
      const t = i / n;
      const a = (1 - t) * (1 - t) * 0.85;
      if(a <= 0.01) continue;
      c.globalAlpha = a;
      c.drawImage(this.buf, 0, HORIZON - 1, VW, 1, 0, HORIZON + i, VW, 1);
    }
    c.globalAlpha = 1;
  },

  drawGround(){
    const c = this.b, cam = this.camD, T = this.theme || THEMES.day;
    // Rim ramps, built once per theme. The green feathers by tone rather than
    // by scattering pixels of the neighbouring colour, which read as grit.
    if(!T._rim){
      T._rim = [mixC(T.gr[3], T.apron, 0.30), mixC(T.gr[3], T.apron, 0.60),
                mixC(T.gr[3], T.apron, 0.84)];
      T._arim = [mixC(T.apron, T.fw[5], 0.45), mixC(T.apron, T.fw[5], 0.78)];
      // The authored ramps are short enough to read, but a short ramp across a
      // whole field is a handful of visible steps. Resampled once to something
      // finer than the eye resolves, distance shading becomes continuous: no
      // bands to see, and nothing that needs dithering to hide them.
      T._fw = expandC(T.fw, 48); T._rg = expandC(T.rg, 48);
      T._gr = expandC(T.gr, 40); T._sd = expandC(T.sd, 40); T._wt = expandC(T.wt, 40);
      // The bank of a pond read top to bottom: turf at the rim, bare earth
      // where the ground was cut, wet mud at the waterline. Drawn as a ramp so
      // the far side of the water is a slope you are looking at rather than a
      // flat grey card stood up behind it.
      T._bk = expandC([mixC(T.rg[4], T.bank, 0.34), T.bank,
                       dark(mixC(T.bank, T.wt[1], 0.40), 0.22)], 20);
      // Sand shaded as a BOWL needs more range than sand shaded by distance.
      // The authored ramp spans about a third of a stop either side of the
      // course colour, which is right for haze and nowhere near enough for one
      // wall of a pit being in shadow while the opposite one faces the sun.
      T._sdb = expandC([dark(T.sd[0], 0.13), dark(T.sd[0], 0.04), T.sd[1],
                        T.sd[3], T.sd[5], lite(T.sd[6], 0.10)], 44);
    }
    // March outward from the camera rather than down the screen. With a height
    // field one screen row no longer means one world distance -- a rise can
    // hide everything behind it -- so slices are walked near to far and a slice
    // is only painted where it stands above everything drawn already. That one
    // clip is what makes a ridge occlude the ground beyond it.
    const SKY = HORIZON - Math.round(VH*0.10);   // how far a rise may break the skyline
    // The march already knows what each crest hides; props need the same
    // answer. Every step records the clip level in front of that distance, so
    // anything standing further out can be cut against it instead of being
    // painted straight over the hill in front of it.
    const cd = this._clipD || (this._clipD = new Float32Array(6400));
    const cy = this._clipY || (this._clipY = new Float32Array(6400));
    let cn = 0;
    // Every hazard is marched as its own sunk surface, with its own clip and
    // its own record of where the previous slice put it. Cleared here so the
    // pit starts again from the near rim on each frame.
    const hzClear = hz => { hz._on = 0; };
    for(const bk of this.bunkers) hzClear(bk);
    if(this.water) hzClear(this.water);
    let maxy = VH, d = cam - CAM_BACK + 0.62, guard = 0;
    let prevD = d, prevH = this.hAt(d);
    while(d < cam + 300 && maxy > SKY && guard++ < 6000){
      const rel = Math.max(0.6, d - cam + CAM_BACK);
      const s = K_PROJ / rel;
      const gh = this.groundH(d);
      const y = Math.round(HORIZON + GROUND*s - gh * LAT * s * 0.55);
      // Step so the projection advances about half a row: fine enough that a
      // steep face cannot tear, coarse enough that the loop stays bounded.
      const step = Math.max(0.03, rel*rel / (GROUND*K_PROJ) * 0.5);
      if(cn < 6400){ cd[cn] = d; cy[cn] = maxy; cn++; }
      if(y < maxy){
        // Light the ground by the way it tilts. This is the whole payoff for
        // having a height field: without it every slice at a given distance is
        // the same flat tone and the field reads as paper, however good the
        // outlines on it are.
        const slope = (gh - prevH) / Math.max(1e-4, d - prevD);
        this.groundSlice(c, T, d, s, rel, y, maxy - y, clamp(slope*0.42, -0.15, 0.15));
        maxy = y;
      }
      prevD = d; prevH = gh;
      d += step;
    }
    this._clipN = cn;
    // whatever is left between the furthest slice and the horizon
    if(maxy > HORIZON){
      c.fillStyle = pickC(T._rg, 0);
      c.fillRect(0, HORIZON, VW, maxy - HORIZON);
      maxy = HORIZON;
    }
    // and the wood at the back of it, standing on whatever the march left as
    // the skyline rather than on the horizon line
    this.buildWood();
    if(this.wood) c.drawImage(this.wood, 0, maxy - this.woodBase);
    // Three ruled lines of haze used to be blended in just under the horizon
    // to soften the join. The haze layer now ramps THROUGH the line instead of
    // starting at it, so the join is soft on its own and all the lines did was
    // draw themselves across the top of the field.
  },

  // One band of ground, at one distance. Everything here was a single scanline
  // before; it now fills hgt rows, because a slice covers however much screen
  // the terrain gives it.
  groundSlice(c, T, d, s, rel, y, hgt, litIn){
    const near = clamp(1 - rel/110, 0, 1);
    const lit = litIn || 0;
      c.fillStyle = pickC(T._rg, near + lit);
      c.fillRect(0, y, VW, hgt);
      if(rel < 1.2) return;

      const C0 = Math.round(CX + (this.bendOff(d) - CAM_LAT) * LAT * s);

      if(d > -3.2 && d < 2.4){
        const tw = Math.round(1.75 * LAT * s);
        if(tw > 0){
          c.fillStyle = pickC(T._gr, d > -3.0 && d < 2.2 ? 0.75 : 0.45);
          c.fillRect(C0 - tw, y, tw*2, hgt);
          c.fillStyle = T.edge;
          c.fillRect(C0 - tw - 1, y, 1, hgt); c.fillRect(C0 + tw, y, 1, hgt);
        }
      }

      if(d < LEN + 7){
        const hw = Math.round(this.fwWidth(d) * LAT * s);
        if(hw > 0){
          // No mowing stripes. Their period is set in world units, so close to
          // the camera a single stripe covered a large band of the screen and
          // slid up it as he walked: a dark shape moving with the player rather
          // than ground he was moving over.
          const ft = near*0.60 + lit;
          c.fillStyle = pickC(T._fw, ft);
          c.fillRect(C0 - hw, y, hw*2, hgt);
          if(hw > 5){
            const iw = Math.round(hw*0.55);
            c.fillStyle = pickC(T._fw, ft + 0.12);
            c.fillRect(C0 - iw, y, iw*2, hgt);
          }
          if(hw > 9){
            const ew = Math.round(hw*0.86);
            c.fillStyle = pickC(T._fw, ft - 0.12);
            c.fillRect(C0 - hw, y, hw - ew, hgt);
            c.fillRect(C0 + ew, y, hw - ew, hgt);
          }
          // a cut collar either side, two solid steps rather than a ragged
          // scatter of pixels into the rough
          const cw = hw > 14 ? 2 : 1;
          c.fillStyle = T.apron;
          c.fillRect(C0 - hw - cw, y, cw, hgt); c.fillRect(C0 + hw, y, cw, hgt);
          c.fillStyle = T._arim[1];
          c.fillRect(C0 - hw - cw - 1, y, 1, hgt); c.fillRect(C0 + hw + cw, y, 1, hgt);
        }
      }

      for(const bk of this.bunkers) this.hazSlice(c, T, bk, P_SAND, d, s, y, hgt, near, C0);
      if(this.water) this.hazSlice(c, T, this.water, P_WATER, d, s, y, hgt, near, C0);

      const gd = d - LEN;
      const lobe = 1 + 0.085*Math.sin(gd*0.85 + this.seed);
      if(gd > -8.6 && gd < 8.6){
        const ga = Math.round(3.05*lobe * Math.sqrt(Math.max(0, 1 - (gd/8.6)*(gd/8.6))) * LAT * s);
        if(ga > 0){
          c.fillStyle = T.apron;
          c.fillRect(C0 - ga, y, ga*2, hgt);
          c.fillStyle = T._arim[0];
          c.fillRect(C0 - ga - 1, y, 1, hgt); c.fillRect(C0 + ga, y, 1, hgt);
          c.fillStyle = T._arim[1];
          c.fillRect(C0 - ga - 2, y, 1, hgt); c.fillRect(C0 + ga + 1, y, 1, hgt);
        }
        if(gd > -7.5 && gd < 7.5){
          const gh = Math.round(2.35*lobe * Math.sqrt(Math.max(0, 1 - (gd/7.5)*(gd/7.5))) * LAT * s);
          if(gh > 0){
            const gt = 0.40 + near*0.36;
            c.fillStyle = pickC(T._gr, gt);
            c.fillRect(C0 - gh, y, gh*2, hgt);
            if(gh > 7){
              c.fillStyle = pickC(T._gr, gt + 0.18);
              const iw = Math.round(gh*0.46);
              c.fillRect(C0 - iw, y, iw*2, hgt);
            }
            // three graded pixels into the apron, so the rim is a gradient
            for(let k = 0; k < 3 && gh > k + 1; k++){
              c.fillStyle = T._rim[k];
              c.fillRect(C0 - gh + (2 - k), y, 1, hgt);
              c.fillRect(C0 + gh - 3 + k, y, 1, hgt);
            }
          }
        }
      }
  },

  // The ranges do not move with the camera and do not animate, so they are
  // rasterised once per hole and blitted. That buys enough budget to shade
  // every column by which way its face turns, instead of stamping flat
  // silhouettes and a row of random two pixel columns for the trees.
  buildRidge(){
    const key = [this.themeId, this.hole, VW, VH, HORIZON].join('|');
    if(this.ridgeKey === key && this.ridge) return;
    this.ridgeKey = key;
    const T = this.theme || THEMES.day;
    const H = Math.max(4, HORIZON + 6);
    const cv = document.createElement('canvas');
    cv.width = Math.max(2, VW); cv.height = H;
    const g = cv.getContext('2d');
    const rnd = seeded(hash32(this.hole*7919 + 17));

    // Four ranges, back to front. Distance is carried by haze: the range at
    // the back is mixed furthest toward the sky colour and the foothills in
    // front are nearly their own rock. It used to run the other way round,
    // which washed out the nearest ridge and left the far peaks reading as
    // the ones close enough to touch.
    const LAYERS = [
      { amp: 0.150, base: 0.040, haze: 0.66, snow: 0.52, p: 26 },
      { amp: 0.108, base: 0.030, haze: 0.46, snow: 0.62, p: 21 },
      { amp: 0.072, base: 0.019, haze: 0.27, snow: 0,    p: 16 },
      { amp: 0.045, base: 0.007, haze: 0.11, snow: 0,    p: 12 }
    ];
    for(let L = 0; L < LAYERS.length; L++){
      const Y = LAYERS[L];
      const amp  = Y.amp * VH;
      const base = HORIZON - Math.round(VH*Y.base);
      const body  = mixC(T.rk[2], T.sky[4], Y.haze);
      const lit   = mixC(T.rk[4], T.sky[4], Y.haze);
      const shade = mixC(T.rk[0], T.sky[4], Y.haze);
      const foot  = mixC(body,    T.sky[4], 0.52);
      const snow  = mixC(T.snow,  T.sky[4], Y.haze * 0.55);
      const snowL = mixC(lite(T.snow, 0.35), T.sky[4], Y.haze * 0.45);
      const snowS = mixC(mixC(T.snow, T.rk[1], 0.34), T.sky[4], Y.haze * 0.55);
      const p1 = Y.p, p2 = Y.p*0.38, p3 = Y.p*0.16;
      const a1 = rnd()*99, a2 = rnd()*99, a3 = rnd()*99, a4 = rnd()*99;
      // three octaves, so a peak has shoulders and scree rather than being a sine
      const topAt = x => base - amp*(0.42
        + 0.36*Math.sin(x/p1 + a1)
        + 0.15*Math.sin(x/p2 + a2)
        + 0.07*Math.sin(x/p3 + a3));
      // The snowline follows the weather, not a ruler. Cut straight across it
      // read as a sheet of paper laid over the peaks.
      const snowAt = x => base - amp*(Y.snow + 0.075*Math.sin(x/(p2*1.7) + a4));
      let prev = topAt(-1);
      for(let x = 0; x < VW; x++){
        const top = Math.round(topAt(x));
        g.fillStyle = body;
        g.fillRect(x, top, 1, H - top);
        // the foot of a range stands in the haze of the valley in front of it
        const fh = Math.max(2, Math.round(amp*0.30));
        g.fillStyle = foot;
        g.fillRect(x, H - fh, 1, fh);
        const slope = top - prev;
        if(slope !== 0){
          // rising toward the light is a lit face, falling away is in shadow
          g.fillStyle = slope < 0 ? lit : shade;
          g.fillRect(x, top, 1, Math.min(4, Math.abs(slope) + 1));
        }
        if(Y.snow){
          const sy = snowAt(x);
          if(top < sy){
            const capH = Math.min(Math.round(amp*0.30), Math.round((sy - top) * 0.75));
            if(capH > 0){
              // A cap shaded like the rock under it, rather than one flat
              // sheet of white laid over the peaks.
              g.fillStyle = slope > 0 ? snowS : snow;
              g.fillRect(x, top, 1, capH);
              if(slope < 0){ g.fillStyle = snowL; g.fillRect(x, top, 1, Math.min(capH, 2)); }
              // it thins out as it runs down into the rock
              g.fillStyle = mixC(snow, body, 0.55);
              g.fillRect(x, top + capH - Math.max(1, capH >> 2), 1, Math.max(1, capH >> 2));
            }
          }
        }
        prev = top;
      }
    }

    // Treeline. A wood at that distance is one dark mass with a broken top
    // edge, so it is drawn as a band with conifers standing out of it. Built
    // from two rows of boxes before, which is what it looked like. Keyed to
    // the hole, not to camD -- tied to the camera the whole distant wood
    // crawled sideways every time he took a step.
    this.ridge = cv;
  },

  drawRidge(){
    this.buildRidge();
    if(this.ridge) this.b.drawImage(this.ridge, 0, 0);
  },

  // The wood at the back of the course sits on the SKYLINE, and with a height
  // field that is not the horizon line: a rise in the middle distance stands
  // well above the line, and every slice of ground is full width, so its crest
  // is a ruled horizontal cut straight across the frame. A treeline pinned to
  // the horizon was simply painted over by that cut, which is why the far edge
  // of the course was a bare edge with nothing standing on it. Built once and
  // blitted to wherever the march actually ended up.
  buildWood(){
    const key = [this.themeId, this.hole, VW, VH].join('|');
    if(this.woodKey === key && this.wood) return;
    this.woodKey = key;
    const T = this.theme || THEMES.day;
    const mist = Math.max(4, Math.round(VH*0.048));
    const band = Math.max(2, Math.round(VH*0.016));
    const tall = Math.round(VH*0.055);
    // It stands at the back of the course, so it carries its own air. Drawn on
    // the skyline it is above most of the haze layer, and left in its own
    // colour it came out as a black wall with the ranges behind it gone.
    const air  = c => mixC(c, T.sky[4], 0.34);
    const base = mist + tall;                 // where the ground line falls
    const cv = document.createElement('canvas');
    cv.width = Math.max(2, VW); cv.height = base + 3;
    const g = cv.getContext('2d');
    const rnd = seeded(hash32(this.hole*7919 + 41));

    // A pale bar of haze lying in the valley behind it. A dark wood in front
    // of a dark range is a smudge; in front of this it is a silhouette, which
    // is the whole reason a treeline is worth drawing.
    g.fillStyle = T.sky[4];
    for(let k = 0; k < mist; k++){
      g.globalAlpha = 0.12 + 0.42 * (k/(mist - 1));
      g.fillRect(0, base - mist + k, VW, 1);
    }
    g.globalAlpha = 1;
    g.fillStyle = air(T.tl2);
    g.fillRect(0, base - band, VW, cv.height - base + band);
    for(let pass = 0; pass < 2; pass++){
      const back = pass === 0;
      const col  = back ? mixC(T.tl2, T.sky[4], 0.46) : air(T.tl);
      const foot = base - (back ? Math.round(band*0.70) : 0);
      let x = -8;
      while(x < VW + 8){
        // Squared, so most of the canopy is even and a few stand well clear of
        // it. Width follows height, or a tall one comes out as a fence post
        // rather than as a tree.
        const t = rnd();
        const h = 2 + Math.round(VH*(back ? 0.010 : 0.016) * (0.40 + t*t*1.9));
        const w = Math.max(3, Math.round(h * (0.55 + rnd()*0.28)));
        const steps = Math.max(2, Math.round(h/2));
        g.fillStyle = col;
        for(let k = 0; k < steps; k++){
          const ww = Math.max(1, Math.round(w*(1 - k/steps*0.78)));
          const yy = foot - Math.round(h*(k+1)/steps);
          g.fillRect(x + ((w - ww) >> 1), yy, ww, Math.max(1, Math.round(h/steps)) + 1);
        }
        x += Math.max(2, Math.round(w*0.55) - Math.floor(rnd()*2));
      }
    }
    this.wood = cv; this.woodBase = base;
  },

  // One back-to-front pass over everything standing beside the hole.
  drawProps(){
    const c = this.b, T = this.theme || THEMES.day, night = this.night;
    for(const p of (this.props || [])){
      // A rope post is culled on the far end of the span it carries, not on
      // itself: the post the span starts from goes behind the camera while the
      // rope is still crossing the bottom of the frame.
      const back = p.kind === 2 && p.nd !== undefined ? p.nd : p.d;
      if(back < this.camD - 5) continue;
      const pr = this.proj(p.d, p.x);
      if(pr.s < 0.05) continue;
      // Ground is drawn with occlusion but props were not, so a tree standing
      // behind a rise painted straight over the fairway in front of it.
      const cut = this.clipAt(p.d);
      if(pr.y > cut + 1){
        // its feet are behind the crest: draw only what stands above it
        c.save(); c.beginPath(); c.rect(0, 0, VW, Math.max(0, cut)); c.clip();
        this.drawProp(c, T, night, p, pr);
        c.restore();
        continue;
      }
      this.drawProp(c, T, night, p, pr);
    }
  },

  // One span of gallery rope, from this post to the next one along its side.
  // Nearer than ROPE_REL the projection clamps at its minimum and the span
  // whips across the screen, so a span that starts behind that line is walked
  // forward in WORLD space to where it crosses it and drawn from there. That
  // keeps the rope running off the bottom of the frame instead of ending at
  // whichever post happened to survive the cull.
  drawRope(c, p, night){
    const near = this.camD - CAM_BACK + ROPE_REL;
    if(p.nd <= near) return;
    let d0 = p.d, x0 = p.x;
    if(d0 < near){
      const u = (near - d0) / (p.nd - d0);
      x0 += (p.nx - x0) * u; d0 = near;
    }
    const a = this.proj(d0, x0), b = this.proj(p.nd, p.nx);
    if((a.x < -2 && b.x < -2) || (a.x > VW + 2 && b.x > VW + 2)) return;
    const ah = Math.max(2, Math.round(6 * a.s * US));
    const bh = Math.max(2, Math.round(6 * b.s * US));
    const y0 = a.y - ah + 1, y1 = b.y - bh + 1;
    if(y0 < 0 && y1 < 0) return;
    const sag = Math.max(1, Math.round(ah * 0.34));
    const steps = Math.min(400, Math.max(2, Math.abs(b.x - a.x) + Math.abs(y1 - y0)));
    c.fillStyle = night ? '#6E6A5C' : '#B9B2A0';
    for(let i = 0; i <= steps; i++){
      const u = i/steps;
      const xx = Math.round(a.x + (b.x - a.x)*u);
      if(xx < 0 || xx >= VW) continue;
      const yy = Math.round(y0 + (y1 - y0)*u + Math.sin(u*Math.PI)*sag);
      if(yy < 0 || yy >= VH) continue;
      c.fillRect(xx, yy, 1, 1);
    }
  },

  drawProp(c, T, night, p, pr){
    if(p.kind === 0){
      const TS = this.treeSpr || SPRITE;
      const spr = p.k ? TS.oak : TS.pine;
      const h = Math.round(p.s * 46 * pr.s * US);
      if(h < 3) return;
      const w = Math.round(h * spr.w / spr.h);
      if(pr.x + w < -4 || pr.x - w > VW + 4) return;
      c.fillStyle = 'rgba(8,16,10,.30)';
      c.fillRect(pr.x - Math.round(w*0.34), pr.y - 1,
                 Math.round(w*0.68), Math.max(1, Math.round(h*0.035)));
      blit(c, spr, pr.x - w/2, pr.y - h, w, h);
    }else if(p.kind === 2){
      // The rope goes down first, and before any cull on the post, because the
      // two posts either side of the camera swing right out of frame while the
      // rope strung between them is still crossing the bottom of it. Culling
      // the span along with its post made the gallery stop dead at the
      // golfer's feet and pick up again in front of him.
      if(p.nd !== undefined) this.drawRope(c, p, night);
      // A gallery rope post: waist high on a spectator, not over their heads.
      // The old pillars were 17 against a spectator's 12, which is why they
      // read as poles looming out of the fairway rather than as furniture.
      if(p.d < this.camD - CAM_BACK + ROPE_REL) return;
      const h = Math.max(2, Math.round(6 * pr.s * US));
      if(pr.x < -8 || pr.x > VW + 8) return;
      const w = Math.max(1, Math.round(h * 0.22));
      c.fillStyle = 'rgba(8,16,10,.26)';
      c.fillRect(pr.x - (w>>1), pr.y - 1, Math.max(1, w), 1);
      c.fillStyle = '#1A2A20';
      c.fillRect(pr.x - (w>>1), pr.y - h, Math.max(1, w), h);
      c.fillStyle = PX.brass2;
      c.fillRect(pr.x - (w>>1), pr.y - h, Math.max(1, w), 1);

    }else if(p.kind === 3){
      // A floodlight over the green. Tall on purpose, and the beam is drawn
      // with it so a tree standing in front of the lamp covers its light too.
      const h = Math.max(8, Math.round(46 * pr.s * US));
      if(pr.x < -30 || pr.x > VW + 30) return;
      const w = Math.max(1, Math.round(h * 0.07));
      const hw = Math.max(3, Math.round(h * 0.26)), hh = Math.max(2, Math.round(h * 0.09));
      const gp = this.proj(LEN, 0);
      const top = pr.y - h, reach = Math.max(8, gp.y - top);
      for(let k = 1; k <= 9; k++){
        const u = k/9;
        c.globalAlpha = 0.085 * (1 - u*0.55);
        c.fillStyle = '#CBAAFF';
        const sw = Math.max(1, Math.round(hw * (0.9 + u*5.5)));
        const cx = Math.round(pr.x + (gp.x - pr.x) * u * 0.85);
        c.fillRect(cx - (sw>>1), top + Math.round(reach*(u - 1/9)), sw, Math.ceil(reach/9));
      }
      c.globalAlpha = 1;
      c.fillStyle = '#241A33';
      c.fillRect(pr.x - (w>>1), pr.y - h, Math.max(1, w), h);
      for(const t of [0.36, 0.62]){
        const bw = Math.max(2, Math.round(h * 0.11));
        c.fillRect(pr.x - (bw>>1), pr.y - Math.round(h*t), bw, 1);
      }
      c.fillStyle = '#4C3A68';
      c.fillRect(pr.x - (hw>>1), pr.y - h - hh, hw, hh);
      c.fillStyle = '#F2E6FF';
      c.fillRect(pr.x - (hw>>1) + 1, pr.y - h - hh + 1, Math.max(1, hw - 2), Math.max(1, hh - 2));

    }else{
      const h = Math.max(3, Math.round(12 * pr.s * US));
      if(pr.x < -6 || pr.x > VW + 6) return;
      const spr = spectSpr(p.c, Math.sin(this.t*0.9 + p.p) > 0 ? 0 : 1, night);
      const w = Math.max(1, Math.round(h * spr.w / spr.h));
      c.fillStyle = 'rgba(8,16,10,.26)';
      c.fillRect(pr.x - Math.round(w/2), pr.y - 1, w, 1);
      blit(c, spr, pr.x - w/2, pr.y - h, w, h);
    }
  },

  drawGolfer(D, atCam){
    previewTick();
    const c = this.b;
    const p = this.proj(atCam === undefined ? this.camD : atCam, 0);
    const ph = this.swingT > 0 ? 1 - this.swingT/this.swingDur : 0;
    // Between shots, while the camera carries him on to the ball, he walks:
    // upright, the club on his shoulder, his legs striding.
    const walking = ph === 0 && !!this.walkOn;
    // Past the ball he comes up out of the posture, so the silhouette changes
    // rather than the same bent figure sliding around.
    const spr = walking ? SPRITE.gWalk : ph > 0.60 ? SPRITE.gFinish : SPRITE.gAddr;
    // He stood 1:2.9 against the fairway. Real golf is nearer 1:17; a figure
    // that small is unreadable in pixel art, so 1:7 is the compromise. The
    // number is his world height in the same units the lateral scale uses.
    const h = Math.max(6, Math.round(B_GOLFER * US * p.s));
    const w = Math.max(4, Math.round(h * spr.w / spr.h));
    const FX = STYLEFX[outfitNow().fx] || null;
    const x = p.x - Math.round(w*0.42);
    const stepUp = walking && (Math.floor(this.walkPh * 4) & 1) ? Math.max(1, Math.round(h / 40)) : 0;
    const y = p.y - h - stepUp - (FX && FX.bob ? Math.round(2 + Math.sin(this.t * 2.2) * 2) : 0);

    // his caddie, a stride to his left and a touch behind, walking when he does
    if(atCam === undefined && SPRITE.caddie) this.drawCaddie(c, h, walking);

    c.fillStyle = 'rgba(8,16,10,.34)';
    c.fillRect(x + Math.round(w*0.05), p.y - 1, Math.round(w*0.62), Math.max(1, Math.round(h*0.045)));

    // Club angle: 0 is straight down, positive swings toward the target.
    // Address, up and behind the head, back down through the ball, and up
    // over the lead shoulder.
    const ADDR = 0.50, TOP = -2.50, FIN = 2.60;
    let arm, coil = 0;
    if(walking) arm = -2.8;                  // resting on his shoulder
    else if(ph === 0) arm = ADDR;
    else if(ph < 0.36){ const t = ph/0.36; arm = ADDR + (TOP - ADDR)*t; coil = -t*0.5; }
    else if(ph < 0.55){ const t = (ph - 0.36)/0.19; arm = TOP + (ADDR - TOP)*t; coil = -(1-t)*0.5; }
    else { const t = (ph - 0.55)/0.45; arm = ADDR + (FIN - ADDR)*t; coil = t*0.7; }

    // the skin's effect, if it has one: its back half now, its front half
    // after the arms and club, so wisps pass both behind him and in front
    const cb = spr === SPRITE.gFinish ? CAP_FIN : CAP_ADDR;
    const g = { x, y, w, h, cx: x + w*0.55, cy: y + h*0.53, bot: p.y, t: this.t, ph,
                k: Math.max(1, Math.round(h / 40)), spr,
                head: { x: x + w*cb.x, y: y + h*cb.y, w: w*cb.w, hh: h*cb.h } };
    const shear0 = f => coil * (1 - f) * w * 0.16;
    const shear = FX && FX.shearMod ? f => shear0(f) + FX.shearMod(f, g) : shear0;
    g.shear = shear0;
    if(FX && FX.back) FX.back(c, g);
    if(FX && FX.outline) outlineAt(c, g, FX.outline, RING1, FX.outlineA * (0.8 + 0.2 * Math.sin(this.t * 3)));
    if(FX && FX.alpha) c.globalAlpha = FX.alpha;
    if(walking){
      const O = outfitNow();
      drawLegs(c, x + w*0.52, y + h*(32/58), h*(25/58), w, this.walkPh, O.pant || '#2B3B4F', O.pant2 || O.pant || '#1C2937', O.shoe || PX.shoe);
    }
    blitShear(c, spr, x, y, w, h, shear);

    const sx = x + w*(spr.ax || 0.66), sy = y + h*(spr.ay || 0.30);
    const al = h*0.30, cl = h*0.60;
    const armH = arm * 0.55;
    const hx = sx + Math.sin(armH)*al, hy = sy + Math.cos(armH)*al*0.85;
    const tx = hx + Math.sin(arm)*cl, ty = hy + Math.cos(arm)*cl*0.90;
    const th = h > 34 ? 2 : 1;
    pxLine(c, sx, sy, hx, hy, PX.skin, th);
    pxLine(c, sx - w*0.10, sy + 1, hx, hy, PX.skin2, th);
    if(h > 22){ c.fillStyle = outfitNow().shirt; c.fillRect(Math.round(hx) - 1, Math.round(hy) - 1, th + 1, th + 1); }
    pxLine(c, hx, hy, tx, ty, h > 26 ? PX.club : PX.club2, th);
    c.fillStyle = PX.club3;
    c.fillRect(Math.round(tx) - th, Math.round(ty) - 1, th*2 + 1, th + 1);
    c.globalAlpha = 1;
    if(FX && FX.front) FX.front(c, g);
    c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';

    // the ball waits out in front, on the ground, where he is looking
    const bx = Math.round(x + w*1.19);
    // Where the club actually meets it, in world lateral units. The struck
    // ball used to be launched from the middle of the lane, so every shot
    // appeared out of thin air a body's width away from the face.
    this.teeLat = (bx - p.x) / Math.max(0.001, LAT * p.s);
    if(this.swingT === 0 || ph < 0.5){
      const bs = h > 30 ? 2 : 1;
      c.fillStyle = PX.white;
      c.fillRect(bx, Math.round(p.y - bs), bs, bs);
    }
  },

  // Two markers on the tee. Skipped once the camera has walked past them,
  // or the projection clamp blows them up across the bottom of the screen.
  /* ---- what makes each wager its own place ----
     Four palettes on one hole read as one contest painted four ways, which is
     exactly what these were: same fairway, same green, same flag, different
     hue. Each one has furniture of its own now: yardage plates and drive pegs
     on the range, a roped gallery in the Vault, floodlights over the Floodlit
     Green, a moat that opens at the golfer's feet on the Island. ---- */
  // The range is the one that has to be repainted as the contest runs, because
  // a peg appears with every drive. The gallery ropes and the floodlights are
  // fixed furniture, so they are laid down with the trees instead and sort with
  // them: see layProps.
  drawWagerStage(R){
    if(R.mode === 'drive') this.drawRange(R);
  },

  // A long drive contest is a measured range, not a hole: plates down both
  // sides, and a peg where each of the six finished with the longest flagged.
  // World distances, never camera distances. The Long Drive watches from the
  // tee and never moves, so camera-relative looked fine here and was only
  // caught in the Vault, where the camera walks a whole hole and took the
  // furniture along with it.
  drawRange(R){
    const c = this.b;
    for(const d of [9, 17, 28, 43]){
      for(const sx of [-1, 1]){
        const p = this.proj(d, sx * (this.fwWidth(d) + 0.4));
        if(p.y < HORIZON + 1 || p.y > VH + 4 || p.y > this.clipAt(d)) continue;
        const h = Math.max(2, Math.round(11 * US * p.s));
        const w = Math.max(1, Math.round(h * 0.55));
        c.fillStyle = PX.ink;   c.fillRect(p.x - (w>>1), p.y - h, w, h);
        c.fillStyle = PX.brass; c.fillRect(p.x - (w>>1), p.y - h, w, Math.max(1, Math.round(h*0.55)));
        c.fillStyle = PX.brass2; c.fillRect(p.x - (w>>1), p.y - 1, w, 1);
      }
    }
    const log = R.log || [];
    if(!log.length) return;
    // A pure strike is worth four times a normal one and a provisional adds
    // more on top, so six drives can span three orders of magnitude. Placed on
    // a linear scale five of them pile up on the tee. Placed on a log scale
    // between the shortest and the longest, all six are legible.
    let lo = Infinity, hi = 0;
    for(const v of log){ if(v > 0){ lo = Math.min(lo, v); hi = Math.max(hi, v); } }
    if(!(hi > 0)) return;
    const span = Math.log(hi / Math.max(lo, hi*1e-6)) || 1;
    for(let i = 0; i < log.length; i++){
      if(!(log[i] > 0)) continue;
      const u = 0.18 + 0.74 * (Math.log(log[i] / lo) / span);
      const d = 4 + u * 46;
      const best = log[i] >= hi - 1e-9;
      // fanned across the fairway so six pegs do not stack into one
      const p = this.proj(d, (i - (B.DRIVE_SHOTS - 1)/2) * 0.62);
      if(p.y < HORIZON + 1 || p.y > VH + 4 || p.y > this.clipAt(d)) continue;
      const h = Math.max(3, Math.round((best ? 20 : 9) * US * p.s));
      const pw = Math.max(1, Math.round(h * 0.12));
      c.fillStyle = PX.ink;  c.fillRect(p.x - (pw>>1) + 1, p.y - h + 1, Math.max(1, pw), h);
      c.fillStyle = best ? PX.white : PX.bone;
      c.fillRect(p.x - (pw>>1), p.y - h, Math.max(1, pw), h);
      const fw = Math.max(2, Math.round(h * (best ? 0.5 : 0.34)));
      const fh = Math.max(1, Math.round(h * (best ? 0.34 : 0.24)));
      c.fillStyle = best ? PX.brass : PX.grey;
      c.fillRect(p.x + (pw>>1), p.y - h, fw, fh);
    }
  },

  drawTee(){
    if(0.2 - this.camD + CAM_BACK < 1.2) return;
    const c = this.b;
    for(const sx of [-1, 1]){
      const p = this.proj(0.2, sx*1.55);
      if(p.y < HORIZON + 2 || p.y > VH + 4) continue;
      const h = Math.max(2, Math.round(2.4 * US * p.s));
      const w = Math.max(1, Math.round(h*0.75));
      c.fillStyle = sx < 0 ? PX.flag : PX.bone;
      c.fillRect(p.x - (w >> 1), p.y - h, w, h);
      c.fillStyle = PX.white;
      c.fillRect(p.x - (w >> 1), p.y - h, w, Math.max(1, Math.round(h*0.3)));
    }
  },

  drawBalls(dt){
    const c = this.b;
    for(let i = this.balls.length - 1; i >= 0; i--){
      const b = this.balls[i];
      b.t += dt;
      const u = b.t / b.dur;
      if(u >= 1){ this.balls.splice(i, 1); continue; }
      const col = b.el ? (PX[b.el] || PX.white) : PX.white;
      const BF = BALLFX[trailNow().fx];
      if(BF){
        // a ball effect gets the flight as a path, ball first
        const path = []; let rr = 1;
        for(let k = 0; k <= 12; k++){
          const uu = u - k*0.028;
          if(uu < 0) break;
          // the ball itself is held level with him until it is out ahead
          const bd = k === 0 ? Math.max(this.camD, b.d0 + b.dist*uu) : b.d0 + b.dist*uu, lu = uu*uu*(3 - 2*uu);
          // The camera walks on while the ball is up, so the tee it left is
          // soon behind him, and the tail reached back past his feet as if the
          // shot came from behind him. Nothing is drawn nearer than he is.
          if(k > 0 && bd < this.camD + 0.05) break;
          const lt = this.ballLat(b, uu);
          const p = this.proj(bd, lt, Math.sin(uu*Math.PI)*2.6);
          if(p.y > this.clipAt(bd) + 1){ if(k === 0) break; continue; }
          if(k === 0) rr = Math.max(1, Math.round(B_BALL * p.s * US));
          path.push(p);
        }
        if(path.length) BF(c, b, path, rr, this.t, u);
        c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
        continue;
      }
      for(let k = 5; k >= 0; k--){
        const uu = u - k*0.055;
        if(uu < 0) continue;
        const bd = k === 0 ? Math.max(this.camD, b.d0 + b.dist*uu) : b.d0 + b.dist*uu;
        if(k > 0 && bd < this.camD + 0.05) continue;   // behind him now: see above
        // eased across, so it leaves the face on the line the club sent it
        const lu = uu*uu*(3 - 2*uu);
        const lt = this.ballLat(b, uu);
        const p = this.proj(bd, lt, Math.sin(uu*Math.PI)*2.6);
        if(p.y > this.clipAt(bd) + 1) continue;   // dropped behind a rise
        const r = Math.max(1, Math.round(B_BALL * p.s * US));
        if(k === 0){
          c.fillStyle = b.crit ? PX.brass : col;
          c.fillRect(p.x - r, p.y - r, r*2, r*2);
          if(r > 1){ c.fillStyle = PX.white; c.fillRect(p.x - r, p.y - r, 1, 1); }
        }else if(k % 2 === 0){
          // the trail is the one thing the player picks; the ball itself keeps
          // its affinity's colour, which is information
          const tc = trailNow().cols;
          c.fillStyle = trailNow().id === 'plain' ? col : tc[(k >> 1) % tc.length];
          c.fillRect(p.x, p.y, Math.max(1, r - 1), Math.max(1, r - 1));
        }
      }
    }
  },

  drawWeather(){
    if(!this.rain) return;
    const c = this.b;
    c.fillStyle = 'rgba(198,222,232,.36)';
    // driven the way the wind is blowing, and harder the harder it blows
    const w = this.wind || 0, run = (40 + Math.abs(w) * 300) * (w < 0 ? -1 : 1), lean = Math.abs(w) > 0.5 ? 1 : 0;
    for(let i = 0; i < 40; i++){
      const x = Math.round((((i*67 + this.t*run) % (VW + 40)) + VW + 40) % (VW + 40) - 20);
      const y = Math.round((i*41 + this.t*330) % VH);
      c.fillRect(x, y, 1, 2);
      if(lean) c.fillRect(x - (w < 0 ? -1 : 1), y + 2, 1, 2); else c.fillRect(x, y + 2, 1, 1);
    }
  },

  drawFx(dt){
    const c = this.b;
    const gp = this.proj(this.camD, -0.30);
    for(let i = this.sparks.length - 1; i >= 0; i--){
      const sp = this.sparks[i]; sp.t += dt;
      if(sp.t > .5){ this.sparks.splice(i, 1); continue; }
      const col = sp.k === 'crit' ? PX.brass : sp.k === 'skill' ? PX.aur : (PX[sp.k] || PX.aur);
      pxRing(c, gp.x + 3, gp.y - 10*US*gp.s, (4 + sp.t*42)*US, col);
    }
    for(let i = this.nums.length - 1; i >= 0; i--){
      const n = this.nums[i]; n.t += dt;
      if(n.t > .95){ this.nums.splice(i, 1); continue; }
      // above his head, not across his chest: the offset is measured from the
      // sprite height rather than guessed
      const gh = Math.max(6, Math.round(B_GOLFER * US * gp.s));
      drawTextS(c, (n.crit ? '*' : '') + fmt(n.v), gp.x + n.x*US,
                gp.y - gh - 5 + (n.y || 0) - Math.round(n.t*20*TSC),
                n.crit ? PX.brass : PX.bone, TSC, 'c');
    }
    for(let i = this.casts.length - 1; i >= 0; i--){
      const k = this.casts[i]; k.t += dt;
      if(k.t > 1.05){ this.casts.splice(i, 1); continue; }
      drawTextS(c, k.g, 6, VH - LH*4 - Math.round(k.t*14*TSC), PX.aur, TSC, 'l');
    }
    if(this.banner){
      const b = this.banner; b.t += dt;
      if(b.t > 1.2) this.banner = null;
      else{
        const col = b.d <= -3 ? PX.myth : b.d <= -2 ? PX.brass : b.d === -1 ? PX.aur
                  : b.d === 0 ? PX.bone : PX.flag;
        let sc = 3*TSC;
        while(sc > 1 && textW(b.n, sc) > VW - 10) sc--;
        drawTextS(c, b.n, CX, HORIZON - 6 - sc*4 - Math.round(b.t*6), col, sc, 'c');
      }
    }
    if(this.flash > 0){
      this.flash -= dt*2.2;
      const a = Math.max(0, this.flash);
      c.globalAlpha = a*0.42;
      c.fillStyle = this.flashCol;
      c.fillRect(0, 0, VW, VH);
      c.globalAlpha = 1;
    }
  },

  // Live perks, on the field. A buff you have to open a panel to see is a buff
  // you forget you paid for.
  drawPerks(){
    const live = [];
    for(const id in S.perkOn) if(S.perkOn[id] > 0) live.push(id);
    if(!live.length) return;
    // 12, and pixIcon asked for 12, so the sprite is rasterised at exactly the
    // size it is drawn at. It used to be baked at 16 -- which pixIcon rounds to
    // a whole 1x, so 12 -- and then squeezed into 9, which drops three rows and
    // three columns of a twelve pixel drawing wherever they happen to fall.
    const c = this.b, sz = 12;
    let x = 3;                          // the buttons moved right, so this side is free
    const y = Math.round(VH*0.24);
    for(const id of live.slice(0, 5)){
      const p = perkDef(id), f = clamp(S.perkOn[id] / p.dur, 0, 1);
      c.fillStyle = 'rgba(6,12,9,.72)';
      c.fillRect(x - 1, y - 1, sz + 2, sz + 4);
      blit(c, pixIcon(p.ic, sz, PX.brass), x, y, sz, sz);
      c.fillStyle = '#2A2418'; c.fillRect(x, y + sz + 1, sz, 1);
      c.fillStyle = PX.brass; c.fillRect(x, y + sz + 1, Math.max(1, Math.round(sz*f)), 1);
      x += sz + 4;
    }
    if((S.tickets || 0) > 0 && live.length < 5)
      drawTextS(c, 'x' + S.tickets, x + 1, y + 1, PX.grey, TSC);
  },

  /* ---- the shot book, on the field ---- */
  drawShots(){
    if(!S.carry || !S.carry.length) return;
    const c = this.b;
    // Snapped to a whole multiple of twelve rather than to whatever 5% of the
    // buffer comes to. It was baked at 20 -- which pixIcon rounds up to 2x, so
    // 24 -- and then drawn at 17, resampling a sprite that had already been
    // resampled. Asking pixIcon for the size it is drawn at makes it 1:1.
    const sz = Math.max(12, Math.round(VW*0.050/12)*12);
    // a sixth of the icon each side, so the drawing has air inside its frame
    // rather than touching the border; the same on all four sides, so an icon
    // drawn centred in its twelve pixels sits centred in the box
    const pad = Math.max(3, Math.round(sz / 6)), step = sz + pad*2 + 3;
    let x = 3;
    const y = VH - sz - pad - 2;
    for(const id of S.carry){
      const def = skillDef(id);
      if(!def || !S.skillLv[id]){ x += step; continue; }
      const cd = Math.max(0, S.cd[id] || 0);
      const frac = clamp(1 - cd/def.cd, 0, 1);
      const ready = frac >= 1;
      const blink = ready && (Math.floor(this.t*4) & 1);

      panel(c, x - pad, y - pad, sz + pad*2, sz + pad*2, 'rgba(8,14,10,.70)',
            ready ? (blink ? PX.aur : '#2E6B5E') : '#1C3A31');
      blit(c, pixIcon(def.ic, sz, PX.dim), x, y, sz, sz);
      // vertical wipe: pixel-exact where a wedge clip would fur the diagonal
      const fillH = Math.round(sz * frac);
      if(fillH > 0){
        c.save();
        c.beginPath(); c.rect(x, y + sz - fillH, sz, fillH); c.clip();
        blit(c, pixIcon(def.ic, sz, ready ? PX.aur : '#3FA890'), x, y, sz, sz);
        c.restore();
      }
      x += step;
    }
  },

  /* ---- the readouts, in the same font as everything else ---- */
  // Two-ended lines get measured before they are drawn. Candidates are tried
  // longest first and the first pair that fits wins; "ON THE CLOCK" against
  // "TIME 08.3S" simply does not fit a hundred pixel panel.
  pairLine(c, y, lefts, rights, lcol, rcol, pw, IN){
    for(const l of lefts) for(const r of rights){
      if(textW(l, 1) + textW(r, 1) + 4 <= IN){
        drawText(c, l, 5, y, lcol, 1);
        drawText(c, r, pw - 2, y, rcol, 1, 'r');
        return;
      }
    }
    drawText(c, lefts[lefts.length - 1], 5, y, lcol, 1);
  },

  // The panel lives in the DOM now. What stays on the canvas is the stuff that
  // belongs to the world rather than the interface.
  drawHud(D){
    const c = this.b;
    // The buffer is ceil(device/scale) wide, so up to one buffer column is
    // blitted past the right edge of the canvas and clipped. Anything aligned
    // hard right has to clear that column as well as its own drop shadow.
    const R = VW - 4*TSC - 1;
    // The pull tab sits in this corner, so the stack starts above it.
    let ly = VH - LH - 2 - Math.round(VH*0.045);
    if(S.armor > 0){
      drawTextS(c, isSunday(S.hole) ? 'CHAMPIONSHIP' : 'SIGNATURE', R, ly, PX.flag, TSC, 'r');
      ly -= LH;
    }
    if(S.courseEl){
      const e = B.ELEM.find(x => x.id === S.courseEl);
      drawTextS(c, e.n.toUpperCase() + (D.reson > 1 ? '+' : D.reson < 1 ? '-' : ''),
                R, ly, PX[S.courseEl] || PX.bone, TSC, 'r');
      ly -= LH;
    }
    drawTextS(c, (S.chaos ? S.chaos.n : 'FAIR'), R, ly, PX.grey, TSC, 'r');
    // the wind, pointing the way it blows
    const mph = this.windMph();
    if(mph > 0){
      ly -= LH;
      const arrow = mph >= 14 ? '>>>' : mph >= 7 ? '>>' : '>';
      drawTextS(c, this.wind < 0 ? arrow.replace(/>/g, '<') + ' ' + mph + ' MPH' : mph + ' MPH ' + arrow,
                R, ly, mph >= 14 ? PX.brass : PX.bone, TSC, 'r');
    }
  },

  /* ---- the wager stage ---- */
  drawDepthsHud(D, R, dg){
    const c = this.b;
    const pal = B.DGN_PAL[R.id] || {};
    const glow = pal.glow || PX.brass;
    if(R.evt && R.evtT > 0){
      const bad = R.evt.bad, w = textW(R.evt.n, TSC) + 8, y = Math.round(VH*0.34);
      panel(c, Math.round(CX - w/2), y, w, FH*TSC + 4, 'rgba(6,10,8,.88)',
            bad ? PX.flag : PX.verdant);
      drawText(c, R.evt.n, CX, y + 2, bad ? PX.flag : PX.verdant, TSC, 'c');
    }
    // All of this stacks up the RIGHT edge. Along the bottom left it ran under
    // the shot book icons, which are drawn from the same corner. The pull tab
    // sits in this corner too, and the name ran straight under it and then off
    // the edge of the buffer: the budget below is what is left beside the tab,
    // not the width of the stage.
    const RX = VW - 4*TSC - 1;
    let dy = VH - LH - 2 - Math.round(VH*0.045);
    const budget = Math.round(VW * 0.56);
    let nm = dg.n.toUpperCase();
    if(textW(nm, TSC) > budget && /^THE /.test(nm)) nm = nm.slice(4);
    while(textW(nm, TSC) > budget && nm.length > 4) nm = nm.slice(0, -1);
    drawTextS(c, nm, RX, dy, glow, TSC, 'r');
    dy -= LH;
    drawTextS(c, 'COURSE PAUSED', RX, dy, PX.dim, TSC, 'r');
    dy -= 7;
    let px2 = RX;
    for(let i = 0; i < Math.min(12, R.cleared); i++){
      c.fillStyle = PX.verdant;
      c.fillRect(px2, dy, 1, 5); c.fillRect(px2 - 2, dy, 3, 2);
      px2 -= 4;
    }
  },

  /* ---- the frame ---- */
  draw(dt, D){
    this.t += dt;
    if(!this.b) return;
    if(!isFinite(this.camD)) this.camD = 0;
    this.camH = this.hAt(this.camD);
    const c = this.b;

    if(this.swingT > 0){
      const before = this.swingT;
      this.swingT -= dt;
      if(before > this.swingDur*0.52 && this.swingT <= this.swingDur*0.52) this.launch();
      if(this.swingT < 0) this.swingT = 0;
    }

    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, VW, VH);

    if(S.dgnRun){
      this.walkOn = false;
      const R = S.dgnRun, dg = B.DGN.find(x => x.id === R.id);
      if(R.floor !== this.dFloor || this.themeId !== R.id){
        this.dFloor = R.floor; this.newDepthsHole(R);
      }
      // progress through this floor's work. Reading a field that no longer
      // exists made this NaN, which propagated into the camera and flattened
      // the entire scene into bare rough.
      // Each contest is framed from a different place on the hole: the tee for
      // the Long Drive, out by the water for the Island Green, right on top of
      // the green for the chipping.
      // The chipper stands SHORT of the green: at 0.90 he was standing on it,
      // which is not chipping. The island shot is played from across the water.
      const within = R.mode === 'drive' ? 0.03
                   : R.mode === 'island' ? 0.60
                   : R.mode === 'chip' ? 0.76
                   // the Scramble is played from the approach, the putts on the green
                   : R.mode === 'scramble' ? 0.70
                   : R.mode === 'twilight' ? 0.90
                   : clamp(1 - R.work/Math.max(1e-9, R.full), 0, 1);
      this.camD += (within*LEN - this.camD) * Math.min(1, dt*4.5);
      // The round is paused, so no swing ever reaches the renderer from the
      // simulation. Down here the animation is driven off tempo directly:
      // he is still hitting the ball, the ball is just not on the course.
      // Only the endurance floor swings continuously; the other three fire on
      // their own beat, from the simulation.
      if(!R.dead && R.mode === 'floor'){
        this.dSwing = (this.dSwing || 0) + dt * Math.min(D.spd, B.VIS_SWING_CAP);
        while(this.dSwing >= 1){
          this.dSwing -= 1;
          this.swing(D.pow * (1 + D.mst*B.MST_DMG), Math.random() < D.crit,
                     D.ball && D.ball.el);
        }
      }
      if(!isFinite(this.camD)) this.camD = 0;
      if(this.sky) c.drawImage(this.sky, 0, 0);
      this.drawRidge();
      this.drawGround();
      this.drawFarFade();
      this.drawProps();
      this.buildHaze();
      if(this.haze) c.drawImage(this.haze, 0, 0);
      this.drawTee();
      // No flag on the Long Drive. It is a measured range with no hole in it,
      // and a pin at the far end was the single thing that made it read as
      // another par four in a different colour.
      if(R.mode !== 'drive') this.drawFlagstick();
      this.drawWagerStage(R);
      this.drawGolfer(D);
      this.drawBalls(dt);
      if(this.themeId === 'cellar' && Math.sin(this.t*1.9) > 0.988){
        c.fillStyle = 'rgba(214,180,255,.18)'; c.fillRect(0, 0, VW, VH);
      }
      this.drawDepthsHud(D, R, dg);
      if(this.mapOn || this._mapTry){ this.mapOn = false; this._mapTry = null; $('holeMap').style.display = 'none'; }
      this.drawPerks();
      this.drawShots();
      this.drawFx(dt);
    }else{
      if(this.themeId === 'sand' || this.themeId === 'water'
         || this.themeId === 'cellar' || this.themeId === 'vault'){
        this.dFloor = -1; this.newHole(S.hole, S.tier);   // back up top
      }
      const prog = clamp(1 - S.yards / S.yardsMax, 0, 1);
      const cam0 = this.camD;
      this.camD += (prog*LEN - this.camD) * Math.min(1, dt*4.5);
      // walking: the camera is carrying him on and he is not mid-swing. A new
      // hole puts the camera back on the tee, which is not a walk.
      const v = dt > 0 ? (this.camD - cam0) / dt : 0;
      this.walkOn = this.swingT === 0 && v > 0.8 && v < 200;
      if(this.walkOn) this.walkPh = (this.walkPh || 0) + dt * clamp(1.4 + v * 0.08, 1.4, 2.6);
      // The fly-over borrows the camera: it rides down the hole to look at
      // the green and comes back, while the round carries on underneath. The
      // golfer and his shots are left out of the frames it has.
      let camKeep = null;
      if(this.fly){
        const f = this.fly; f.t += dt;
        if(f.t >= f.dur || document.hidden) this.fly = null;
        else{
          const u = f.t / f.dur, ss = x => x*x*(3 - 2*x);
          const out = u < 0.55 ? ss(u / 0.55) : u < 0.72 ? 1 : 1 - ss((u - 0.72) / 0.28);
          camKeep = this.camD;
          this.camD = camKeep + (f.to - camKeep) * out;
          this.camH = this.hAt(this.camD);
        }
      }
      if(this.sky) c.drawImage(this.sky, 0, 0);
      this.drawRidge();
      this.drawGround();
      this.drawFarFade();
      this.drawProps();
      this.buildHaze();
      if(this.haze) c.drawImage(this.haze, 0, 0);
      this.drawTee();
      this.drawFlagstick();
      if(camKeep === null){ this.drawGolfer(D); this.drawBalls(dt); }
      else for(const b of this.balls) b.t += dt;      // still flying, just not in this shot
      this.drawWeather();
      this.drawHud(D);
      this.drawPerks();
      this.drawShots();
      if(camKeep === null) this.drawFx(dt);
      if(camKeep !== null){
        // a strip across the top says what this is, and that a tap ends it
        drawTextS(c, 'HOLE ' + holeInRound(S.hole) + '  PAR ' + parOf(S.hole), CX, Math.round(VH*0.30), PX.bone, TSC, 'c');
        drawTextS(c, 'TAP TO SKIP', CX, Math.round(VH*0.30) + LH, PX.grey, TSC, 'c');
        this.camD = camKeep; this.camH = this.hAt(camKeep);
      }
      this.drawMap();
    }

    const g = this.ctx;
    g.imageSmoothingEnabled = false;
    g.clearRect(0, 0, this.cv.width, this.cv.height);
    g.drawImage(this.buf, 0, 0, VW, VH, 0, 0, VW*this.scale, VH*this.scale);
  },

  drawFlagstick(){
    const c = this.b;
    const p = this.proj(LEN, 0);
    if(p.s < 0.05) return;
    const cut = this.clipAt(LEN);
    if(p.y > cut + 1){
      // the green is over a rise: only the top of the pin shows
      c.save(); c.beginPath(); c.rect(0, 0, VW, Math.max(0, cut)); c.clip();
      this.pinBody(c, p);
      c.restore();
      return;
    }
    this.pinBody(c, p);
  },

  pinBody(c, p){
    const h = Math.max(4, Math.round(B_FLAG * US * p.s));
    const pw = Math.max(1, Math.round(h*0.05));
    const cr = Math.max(1, Math.round(1.6*p.s*US));
    c.fillStyle = '#132215';
    c.fillRect(p.x - cr, p.y - 1, cr*2, Math.max(1, Math.round(cr*0.8)));
    c.fillStyle = PX.bone;
    c.fillRect(p.x, p.y - h, pw, h);
    const spr = (Math.floor(this.t*3) & 1) ? SPRITE.flagA : SPRITE.flagB;
    const fh = Math.max(2, Math.round(h*0.30));
    blit(c, spr, p.x + pw, p.y - h, Math.max(2, Math.round(fh * spr.w / spr.h)), fh);
  }
});

const MULTS = [1, 10, 25, 'Max'];
// The in-world readouts moved onto the canvas in the pixel font, so these ids
// are gone from the DOM. A tolerant getter keeps the writers harmless rather
// than scattering null checks through them.
const NOEL = { textContent:'', innerHTML:'', style:{}, className:'', classList:{ toggle(){}, add(){}, remove(){} } };
const $$ = id => document.getElementById(id) || NOEL;
// Same path data the canvas uses, emitted as inline SVG for the panels.
// Same name and same call, so every place that asks for an icon is unchanged.
// What comes back is now a pixel sprite rather than a piece of line art.
function svgIcon(id, cls, color){
  const url = pixUrl(id, color);
  return url ? '<img class="ic ' + (cls||'') + '" alt="" src="' + url + '">' : '';
}
const elemOf = id => B.ELEM.find(e => e.id === id);
const elemColor = id => { const e = elemOf(id); return e
  ? getComputedStyle(document.documentElement).getPropertyValue(e.v).trim() : '#DFE9DC'; };
// Resolve a CSS custom property to the hex behind it. The pixel icons are
// rasterised on a canvas, and a canvas cannot read "var(--r4)": handed one it
// paints black, which is why every Gold trophy in the room had a black icon.
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim() || '#E3B457';
const RC = i => cssVar(B.RARITY[i].v);
let UPGREF = [], view = 'upg';

/* ---- scorecard ---- */
function buildCard(){
  const w = $('card'); w.innerHTML = '';
  for(let i=0;i<B.ROUND;i++){
    const d = document.createElement('div');
    d.className = 'cell'; d.innerHTML = '<i></i><b></b>';
    w.appendChild(d);
  }
}
function renderCard(){
  const cells = $('card').children;
  const now = holeInRound(S.hole) - 1;
  for(let i=0;i<B.ROUND;i++){
    const c = cells[i], s = S.scores[i];
    c.className = 'cell' + (i === now ? ' now' : '') + (s ? ' done s' + s.d : '');
    c.children[0].textContent = parOf(S.hole - now + i);
    c.children[1].textContent = s ? (s.d === 0 ? 'E' : s.d > 0 ? '+'+s.d : s.d) : (i === now ? '\u2022' : '');
  }
}

/* ---- the always-on numbers ---- */
function renderVitals(){
  const D = derive();
  $('vPower').textContent = fmt(D.pow);
  $('vSpeed').textContent = (D.spdRaw > B.SPEED_CAP ? B.SPEED_CAP.toFixed(0) + '+' : D.spd.toFixed(1)) + '/s';
  $('vDps').textContent = fmt(D.dps);

  $('vCrit').textContent = pct(D.crit);
  // The card, the par time, the hole number, the par, the weather, the course
  // affinity and the armour warning were all built here and written to elements
  // that went out with the old stage HUD. $$ hands back a stub for a missing
  // element so a frame cannot die on one, which is exactly what kept it quiet.
  // The canvas draws every one of them over the hole itself now.
  const t = tournamentOf(S.hole);
