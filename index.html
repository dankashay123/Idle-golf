  r.innerHTML = '<div><div class="nm">Respec attributes</div>'
    + '<div class="ds">Take them all back and start over.</div></div>'
    + '<div class="btnrow"><button class="mini">Reset</button></div>';
  r.querySelector('button').onclick = () => {
    let n = 0; B.STATS.forEach(s => { n += S.stat[s.id]||0; S.stat[s.id] = 0; });
    S.statPts += n; toast('Returned <b>' + n + '</b> attribute points'); renderCareer(); renderVitals();
  };
  w.appendChild(r);
}
// One row of tabs across the three trees. Stacked three-up you had to scroll
// past twenty rows before you knew a third tree existed.
let talSub = 'long';
function careerTalents(w){
  if(!B.TREES.some(t => t.id === talSub)) talSub = B.TREES[0].id;
  const nav = document.createElement('div');
  nav.id = 'talNav';
  nav.innerHTML = B.TREES.map(t =>
    '<button class="sub2' + (talSub === t.id ? ' on' : '') + '" data-t="' + t.id + '">'
    + svgIcon(t.ic, 'tic') + t.n.replace(/^The /, '')
    + '<span class="tcount">' + treeSpent(t) + '</span></button>').join('');
  w.appendChild(nav);
  nav.querySelectorAll('.sub2').forEach(b =>
    b.onclick = () => { talSub = b.dataset.t; renderCareer(); });

  const tree = B.TREES.find(t => t.id === talSub);
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.innerHTML = tree.d + ' You have <b style="color:var(--brass)">' + S.talPts
    + '</b> points spare and <b>' + treeSpent(tree) + '</b> in this tree. '
    + 'The lower rows want points in <i>this</i> tree, not just any tree.';
  w.appendChild(hint);
  careerTree(w, tree, true);
}
function careerTree(w, tree, bare){
  const spent = treeSpent(tree);
  // Stacked three-up on one page, so this appends. It used to set innerHTML,
  // which wiped the container and left only the last tree standing.
  if(!bare){
    const h = document.createElement('div');
    h.className = 'hint';
    h.innerHTML = tree.d;
    w.appendChild(h);
  }
  let lastReq = -1;
  for(const t of tree.t){
    if(t.req !== lastReq){
      lastReq = t.req;
      const h = document.createElement('div');
      h.className = 'tier' + (spent >= t.req ? ' open' : '');
      h.textContent = t.req === 0 ? 'Open' : t.req + ' points in ' + tree.n;
      w.appendChild(h);
    }
    const n = talLv(t.id), locked = spent < t.req, maxed = n >= t.max;
    const d = document.createElement('div');
    d.className = 'row' + (locked ? ' locked' : '');
    d.innerHTML = '<div><div class="nm">' + t.n + (t.max === 1 ? ' <span class="pill">capstone</span>' : '') + '</div>'
      + '<div class="ds">' + t.d + (t.max > 1 ? ' per rank' : '') + '</div>'
      + '<div class="mt">' + pipRow(n, t.max) + ' <i>' + n + '/' + t.max + '</i>'
      + (n ? ' \u00b7 <b>now ' + talDesc(t, n) + '</b>' : '') + '</div></div>'
      + '<div class="btnrow"><button class="mini' + (!locked && !maxed && S.talPts ? ' go' : ' dim') + '">'
      + (maxed ? 'Max' : locked ? 'Locked' : '+1') + '</button></div>';
    d.querySelector('button').onclick = () => {
      if(locked){ toast('Needs ' + t.req + ' points in ' + tree.n); return; }
      if(maxed || !S.talPts) return;
      S.talPts--; S.tal[t.id] = n + 1; renderCareer(); renderVitals();
    };
    w.appendChild(d);
  }
  const r = document.createElement('div');
  r.className = 'row';
  r.innerHTML = '<div><div class="nm">Reset ' + tree.n + '</div>'
    + '<div class="ds">Take back everything you put into this tree.</div></div>'
    + '<div class="btnrow"><button class="mini">Reset</button></div>';
  r.querySelector('button').onclick = () => {
    let n = 0; tree.t.forEach(t => { n += talLv(t.id); S.tal[t.id] = 0; });
    S.talPts += n; toast('Returned <b>' + n + '</b> talent points'); renderCareer(); renderVitals();
  };
  w.appendChild(r);
}
function talDesc(t, n){
  const v = t.v * n;
  if(t.max === 1) return 'active';
  if(t.k === 'crt' || t.k === 'prc' || t.k === 'drp' || t.k === 'mst') return '+' + (v*100).toFixed(1) + 'pp';
  if(t.k === 'cpw') return '+' + v.toFixed(2) + 'x';
  if(t.k === 'dfloor') return '+' + v + ' floors';
  if(t.k === 'reson') return '+' + v.toFixed(2);
  return '+' + Math.round(v*100) + '%';
}
function achReward(a){
  const r = a.r;
  if(r.k === 'tick') return '+' + r.v + ' tickets';
  if(r.k === 'grit') return '+' + r.v + ' grit';
  if(r.k === 'shard') return '+' + r.v + ' shards';
  if(r.k === 'scroll') return '+' + r.v + ' scrolls';
  if(r.k === 'legacy') return '+' + r.v + ' legacy';
  if(r.k === 'crt' || r.k === 'drp' || r.k === 'prc') return '+' + (r.v*100).toFixed(1) + 'pp';
  const nm = { pow:'swing power', gld:'purse', spd:'tempo', mst:'provisional chance',
               elm:'affinity power', dgn:'Depths haul' }[r.k] || r.k;
  return '+' + Math.round(r.v*100) + '% ' + nm;
}
function careerParagon(w){
  if(!atMax() && !(S.para > 0)){
    w.innerHTML = '<div class="empty">Paragon opens at career level ' + B.LV_MAX + '.<br>'
      + 'You are level ' + S.lv + '. After 60 the bar keeps filling and every paragon level '
      + 'hands you a point, forever.</div>';
    return;
  }
  w.innerHTML = '<div class="hint">Points come round in order: Core, Offense, Composure, Fortune. '
    + 'You cannot shift them between categories. Every line caps at 50 except the top two Core lines, '
    + 'which keep going forever. Next point goes to <b style="color:var(--brass)">'
    + B.PARAGON[(S.para) % B.PARAGON.length].n + '</b>.</div>';
  for(const cat of B.PARAGON){
    const pool = S.paraPts[cat.id] || 0;
    const col = 'var(' + cat.v + ')';
    const h = document.createElement('div');
    h.className = 'band';
    h.innerHTML = '<span class="eyebrow" style="color:' + col + '">' + cat.n + '</span>'
      + '<span class="note">' + fmt(pool, 0) + ' unspent</span>';
    w.appendChild(h);
    for(const a of cat.a){
      const n = paraLv(cat.id, a.id);
      const capped = a.cap > 0 && n >= a.cap;
      const val = a.v * n;
      const txt = a.s === 'pp' ? '+' + (val*100).toFixed(1) + 'pp'
                : a.s === 'x' ? '+' + val.toFixed(2) + 'x' : '+' + fmt(val*100) + '%';
      const d = document.createElement('div');
      d.className = 'row';
      d.innerHTML = '<div><div class="nm">' + a.n
        + (a.cap === 0 ? ' <span class="pill" style="border-color:' + col + ';color:' + col + '">no cap</span>' : '')
        + '</div><div class="ds">' + txt + ' at ' + fmt(n, 0)
        + (a.cap ? ' / ' + a.cap : '') + ' points</div></div>'
        + '<div class="btnrow"><button class="mini' + (pool && !capped ? ' go' : ' dim') + '">+1</button>'
        + '<button class="mini' + (pool >= 10 && !capped ? ' go' : ' dim') + '">+10</button></div>';
      const bs = d.querySelectorAll('button');
      bs[0].onclick = () => addPara(cat, a, 1);
      bs[1].onclick = () => addPara(cat, a, 10);
      w.appendChild(d);
    }
  }
  const r = document.createElement('div');
  r.className = 'row';
  r.innerHTML = '<div><div class="nm">Respec paragon</div>'
    + '<div class="ds">Each point goes back to the category it came from.</div></div>'
    + '<div class="btnrow"><button class="mini">Reset</button></div>';
  r.querySelector('button').onclick = () => {
    for(const cat of B.PARAGON) for(const a of cat.a){
      const k = cat.id + '.' + a.id;
      S.paraPts[cat.id] += S.paraSpent[k]; S.paraSpent[k] = 0;
    }
    toast('Paragon points returned'); renderCareer(); renderVitals();
  };
  w.appendChild(r);
}
function addStat(id, n){
  n = Math.min(n, S.statPts);
  if(n <= 0){ toast('No attribute points'); return; }
  S.stat[id] = (S.stat[id]||0) + n; S.statPts -= n;
  renderCareer(); renderVitals();
}
function addPara(cat, a, n){
  const k = cat.id + '.' + a.id;
  let room = a.cap > 0 ? a.cap - (S.paraSpent[k]||0) : Infinity;
  n = Math.min(n, S.paraPts[cat.id] || 0, room);
  if(n <= 0){ toast(room <= 0 ? 'Capped at ' + a.cap : 'No ' + cat.n + ' points'); return; }
  S.paraSpent[k] = (S.paraSpent[k]||0) + n; S.paraPts[cat.id] -= n;
  renderCareer(); renderVitals();
}

/* =========================================================================
   THE LOOP
   ========================================================================= */
function step(dt, D){
  // These run on wall time wherever you are: buff timers, perk timers, keys
  // coming back, the income meter.
  for(const k in S.buff){
    S.buff[k].t -= dt;
    if(S.buff[k].t <= 0) delete S.buff[k];
  }
  tickPerks(dt);
  regenKeys(dt);
  Meter.tick(dt);

  // You cannot be on the course and down a hole at the same time. While a run
  // is out the round stops dead: no swings, no clock, no purse. That is the
  // cost of going down there, and it is why the Depths pay what they pay.
  if(S.dgnRun){ tickDgn(dt, D); return; }

  S.elapsed += dt;
  autoCast(D, dt);

  if(S.burnT > 0){
    const d = Math.min(dt, S.burnT);
    damage(S.burn * d, D, true); S.burnT -= d;
  }

  S.swingT += D.spd * dt;
  const n = Math.floor(S.swingT);
  if(n > 0){ S.swingT -= n; doSwings(n, D); }

  if(S.yards <= 0 && S.elapsed >= (S.walkMin || B.WALK_MIN)) finishHole(D);
}

let last = 0, slowT = 0, saveT = 0;
let frameErr = 0;
function frame(now){
  try{ frameBody(now); }
  catch(e){
    // One bad frame used to kill the loop outright: no redraw, no input, black
    // screen. Now it reports once and keeps running.
    if(!frameErr){
      frameErr = 1;
      console.error(e);
      toast('Something went wrong in a frame. Tap the event name for the dev menu.');
    }
  }
  requestAnimationFrame(frame);
}
function frameBody(now){
  now /= 1000;
  if(!last) last = now;
  const dt = Math.min(B.TICK_MAX, Math.max(0, now - last));
  last = now;

  const D = derive();
  step(dt, D);
  Scene.draw(dt, D);
  renderLive();

  slowT += dt;
  if(slowT >= 0.22){
    slowT = 0;
    renderVitals();
    checkAch();
    if(view === 'upg') refreshUpg();
    else if(view === 'dgn') renderDgn();
    else if(view === 'skl' && S.carry.length) renderSkills();
  }
  saveT += dt;
  if(saveT >= 12){ saveT = 0; save(); }
}

/* =========================================================================
   BOOT
   ========================================================================= */
function wipe(){
  showSheet('<h3>Burn the card?</h3><p>This erases the save completely. Legacy, relics, the bag, all of it.</p>'
    + '<button class="act danger" onclick="reallyWipe()">Erase everything</button>'
    + '<button class="act ghost" onclick="hideSheet()">Cancel</button>');
}
function reallyWipe(){
  WIPED = true;
  try{ localStorage.removeItem(KEY); }catch(e){}
  // Rebuilt in place rather than reloaded: a reload in an embedded browser is
  // not guaranteed, and the old path relied on one.
  Object.keys(S).forEach(k => delete S[k]);
  Object.assign(S, defaultState());
  initState(); migrate();
  Scene.dFloor = -1; Scene.skyKey = null; Scene.dBgKey = null;
  S.dgnRun = null; S.perkOn = {}; S.buff = {};
  Meter.buf.length = 0; Meter.acc = 0;
  WIPED = false;
  startHole();
  buildCard(); buildUpg(); renderAll(); setView('upg');
  hideSheet();
  toast('Save erased. Back to the first tee.');
}
function intro(){
  showSheet('<h3>Mythic Mulligan</h3>'
    + '<p>Your golfer plays on his own. Your job is to make him better.</p>'
    + '<ul><li>Every shot pays a little. Holing out pays properly.</li>'
    + '<li>The clock is your scorecard. A par 3 gives you ten seconds, a par 4 fifteen, '
    + 'a par 5 twenty. Finish quicker and you card better.</li>'
    + '<li>Closing holes always drop a club. Whichever ball is in the bag decides '
    + 'what your shots actually do.</li>'
    + '<li>Each Tour Card stretches the holes faster than it fattens the purse. '
    + 'Gear, shots, the Depths and trophies are how you keep up.</li></ul>'
    + '<button class="act" onclick="hideSheet()">Play away</button>');
}
function boot(){
  const had = load();
  initState();
  migrate();
  if(S.mult === undefined) S.mult = 1;
  if(S.autoClimb === undefined) S.autoClimb = false;

  Scene.init();
  buildCard();
  buildUpg();

  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => setView(t.dataset.v);
    if(t.dataset.v === 'career') careerTab = t;
  });
  $('sortBtn').onclick = () => { S.bag.sort((a,b) => itemScore(b) - itemScore(a)); renderBag(); };
  $('scrapBtn').onclick = () => {
    const keep = {}, doomed = [];
    S.bag.slice().sort((a,b) => itemScore(b) - itemScore(a)).forEach(it => {
      keep[it.slot] = (keep[it.slot] || 0) + 1;
      if(keep[it.slot] > 2) doomed.push(it);
    });
    if(!doomed.length){ toast('Nothing spare to scrap'); return; }
    let sh = 0;
    doomed.forEach(it => { sh += Math.round((1 + it.rar*1.8)*(1 + it.enh*0.35)); });
    S.bag = S.bag.filter(it => !doomed.includes(it));
    S.shard += sh;
    toast('Scrapped ' + doomed.length + ' for <b>' + sh + '</b> shards');
    renderBag();
  };
  $('xpStrip').onclick = () => setView('career');
  $('veil').onclick = e => { if(e.target === $('veil')) hideSheet(); };
  $('eventLine').onclick = () => DEV.open();

  startNine();
  startHole();
  renderAll();
  setView('upg');

  if(had) offline(); else intro();

  document.addEventListener('visibilitychange', () => { if(document.hidden) save(); });
  window.addEventListener('pagehide', save);
  requestAnimationFrame(frame);
}
boot();
</script>
