   SPONSOR PERKS
   ========================================================================= */
/* =========================================================================
   HONOURS
   ========================================================================= */
const bump = (k, n) => { S.tally[k] = (S.tally[k] || 0) + (n || 1); };
function checkAch(){
  dailyTick();
  // Honours earned before they paid sovereigns are paid once, in one go. The
  // flag is not in defaultState on purpose: a save from before it has none,
  // and a fresh game has nothing done, so both land here and only one pays.
  if(!S.achSov){
    S.achSov = 1;
    const owed = B.ACH.reduce((t, a) => t + (achDone(a.id) ? a.sov || 0 : 0), 0);
    if(owed) grantSov(owed, 'honours already earned');
  }
  for(const a of B.ACH){
    if(S.achDone[a.id]) continue;
    if(achMetric(a.m) < a.v) continue;
    S.achDone[a.id] = 1;
    const r = a.r;
    let got;
    if(r.k === 'tick'){ grantTickets(r.v); got = '+' + r.v + ' ' + plural(r.v, 'tickets'); }
    else if(r.k === 'grit'){ S.grit += r.v; got = '+' + r.v + ' grit'; }
    else if(r.k === 'shard'){ S.shard += r.v; got = '+' + r.v + '\u00a0' + plural(r.v, 'shards'); }
    else if(r.k === 'scroll'){ S.scroll += r.v; got = '+' + r.v + ' ' + plural(r.v, 'scrolls'); }
    else if(r.k === 'legacy'){ S.legacy += r.v; got = '+' + r.v + ' legacy'; }
    else if(r.k === 'crt' || r.k === 'drp' || r.k === 'prc') got = '+' + (r.v*100).toFixed(1) + 'pp ' + r.k;
    else got = '+' + Math.round(r.v*100) + '% ' + ({ pow:'swing power', gld:'purse', spd:'tempo',
      mst:'provisional chance', elm:'affinity', dgn:'wager haul' }[r.k] || r.k);
    // "Unlocked" and not "Achievement unlocked". The eyebrow is its own line,
    // and at the width a toast is allowed on a 320 phone the longer one wrapped
    // to two -- five lines a toast, two toasts, and the stack ran down into the
    // honours button. The word above the name already says what it is.
    grantSov(a.sov || 0, null, true);
    // The coins ride on the eyebrow, which has room to spare: on the body line
    // they wrapped it, and a taller pair of toasts reached the honours button.
    // Tighter tracking and no middot, or at 320 wide "UNLOCKED · +100" wraps too.
    toast('<span class="achk">Unlocked' + (a.sov ? ' +' + a.sov + sovIc() : '') + '</span>'
      + a.n + ' \u00b7 <b>' + got + '</b>', 'ach');
    Sfx.play('ach');
    if(typeof renderCareer === 'function') renderCareer();
  }
  // The repeating ones. A save that predates them starts counting from where
  // it is rather than being paid for every hundred holes it ever played: the
  // one-offs above are back-paid because there are thirty-five of them, and
  // twenty-five thousand holes is two hundred and fifty of these.
  for(const a of B.ACH_REP){
    const have = achMetric(a.m), got = Math.floor(have / a.step);
    if(S.achRep[a.id] === undefined){ S.achRep[a.id] = got; continue; }
    const k = got - S.achRep[a.id];
    if(k <= 0) continue;
    S.achRep[a.id] = got;
    grantSov(k * a.sov, null, true);
    toast('<span class="achk">Honours +' + fmt(k * a.sov, 0) + sovIc() + '</span>'
      + a.n + (k > 1 ? ' \u00d7' + fmt(k, 0) : ''), 'ach');
    Sfx.play('coin');
  }
}

function grantTickets(n, why){
  n = Math.round(n * (1 + career().tick));
  if(n <= 0) return;
  S.tickets = Math.min(B.TICK_CAP, (S.tickets || 0) + n);
  if(why) toast('+' + n + ' sponsor ticket' + (n > 1 ? 's' : '') + ' \u00b7 ' + why);
}
function usePerk(id){
  const p = perkDef(id); if(!p) return;
  if((S.tickets || 0) < p.cost){ toast('You are short on tickets'); return; }
  if(p.dur && perkLeft(id) > 0){ toast(p.n + ' is already going'); return; }
  S.tickets -= p.cost; S.perkUsed = (S.perkUsed || 0) + 1;
  const D = derive();
  if(p.dur){
    S.perkOn[id] = p.dur;
    toast('<b>' + p.n + '</b> \u00b7 ' + hms(p.dur));
  }else if(p.k === 'bank'){
    const g2 = Math.max(Meter.rate(), S.purse / Math.max(0.6, S.parTime)) * p.v;
    S.gold += g2; Meter.add(g2);
    toast('<b>' + p.n + '</b> \u00b7 ' + fmt(g2) + ' banked');
  }else if(p.k === 'holeout'){
    // fixed at eagle pace, not min(): clamping toward zero would card an Ace,
    // which pays 3.4x and would make a two-ticket perk the best purse in the game
    S.yards = 0; S.elapsed = S.parTime * 0.40;
    toast('<b>' + p.n + '</b> \u00b7 driven to the green');
  }else if(p.k === 'keys'){
    B.DGN.forEach(d => S.dgnKeys[d.id] = entryCap(d));
    toast('<b>' + p.n + '</b> \u00b7 every entry refilled');
    renderDgn();
  }
  renderPerks(); renderVitals();
}
function tickPerks(dt){
  for(const id in S.perkOn){
    if(S.perkOn[id] <= 0){ delete S.perkOn[id]; continue; }
    S.perkOn[id] -= dt;
    if(S.perkOn[id] <= 0){ delete S.perkOn[id]; toast(perkDef(id).n + '  has worn off'); }
  }
}

/* =========================================================================
   GEAR
   ========================================================================= */
function rollRarity(luck, floorRar){
  const w = B.RARITY.map((r,i) => r.w * Math.pow(1 + luck, i));
  let tot = 0; for(let i=(floorRar||0);i<w.length;i++) tot += w[i];
  let x = Math.random() * tot;
  for(let i=(floorRar||0);i<w.length;i++){ x -= w[i]; if(x <= 0) return i; }
  return floorRar || 0;
}
function makeItem(ilvl, luck, floorRar, slotId){
  const sl = slotId ? B.SLOTS.find(s=>s.id===slotId)
                    : B.SLOTS[Math.floor(Math.random()*B.SLOTS.length)];
  const rar = rollRarity(luck, floorRar);
  const nAff = B.RARITY[rar].aff;
  const pool = B.AFFIX.slice();
  const aff = [];
  for(let i=0;i<nAff && pool.length;i++){
    const d = pool.splice(Math.floor(Math.random()*pool.length), 1)[0];
    aff.push({ k:d.id, roll: d.lo + Math.random()*(d.hi - d.lo) });
  }
  const it = {
    uid: S.uid++, slot: sl.id, rar,
    ilvl: Math.max(0, Math.round(ilvl + career().fit)), enh: 0, aff,
    el: sl.id === 'ball' ? B.ELEM[Math.floor(Math.random()*B.ELEM.length)].id : null
  };
  if(rar >= 2 && Math.random() < (B.SET_CHANCE[rar] || 0)){
    const named = B.SETS.filter(x => x.named);
    it.set = named[Math.floor(Math.random() * named.length)].id;
  }
  it.name = nameItem(it, sl);
  return it;
}
// A club that FALLS is rolled by this; a club you buy is not. Sponsor Eye
// rolls it a second time and keeps the better of the two, which is a different
// animal to a higher drop rate: it never hands you more clubs, only better
// ones, so it cannot move how fast the locker fills or what scrapping pays.
function dropItem(ilvl, luck, floorRar, slotId){
  const it = makeItem(ilvl, luck, floorRar, slotId);
  const look = career().look2;
  if(look > 0 && Math.random() < Math.min(1, look)){
    const b = makeItem(ilvl, luck, floorRar, slotId);
    if(itemScore(b) > itemScore(it)) return b;
  }
  return it;
}
function nameItem(it, sl){
  // a set piece carries its maker's name in place of the usual prefix
  const p = it.set && setDef(it.set) ? setDef(it.set).mk
    : B.PREFIX[clamp(Math.floor(it.rar*1.7 + Math.random()*2), 0, B.PREFIX.length-1)];
  let n = p + ' ' + sl.n;
  if(it.rar >= 2) n += ' ' + B.SUFFIX[hash32(it.uid*7919) % B.SUFFIX.length];
  return n;
}
let lockN = 0, lockSh = 0, lockT = -Infinity;
function bagAdd(it){
  if(it.rar >= 2) bump('rare');
  if(it.rar >= 4) bump('legend');
  if(it.rar >= 5) bump('myth');
  S.bag.push(it);
  // Swap first, trim second. The club the sweep pulls out of the locker may be
  // the very one the trim was about to scrap, and the club it puts back may be
  // the worst thing in there. The other order leaves the locker one over its
  // cap until the next drop lands.
  const took = autoEquipSweep();
  if(took.length){
    toast(took.length === 1 ? 'Auto equipped <b>' + took[0].name + '</b>'
                            : 'Auto equipped <b>' + took.length + '</b> clubs');
    renderVitals();
  }
  if(S.bag.length > bagCap()){
    S.bag.sort((a,b) => itemScore(b) - itemScore(a));
    const cut = S.bag.splice(bagCap());
    let sh = 0; cut.forEach(x => sh += scrapValue(x));
    S.shard += sh;
    // Late on a closing hole fills the locker every time it drops, and this
    // said so after nearly every one. Once a minute now, with the total since.
    lockN += cut.length; lockSh += sh;
    const now = performance.now();
    if(lockSh && now - lockT >= 60000){
      toast('Locker full \u00b7 scrapped ' + lockN + ' for <b>' + lockSh + '</b> ' + plural(lockSh, 'shards'));
      lockN = 0; lockSh = 0; lockT = now;
    }
  }
}
function equipItem(it){
  const cur = S.equip[it.slot];
  S.equip[it.slot] = it;
  S.bag = S.bag.filter(x => x.uid !== it.uid);
  if(cur) S.bag.push(cur);
  renderBag(); renderVitals();
}

// Auto-equip, measured rather than guessed. itemScore is a SORT KEY: it weighs
// the affixes it cannot price at a flat 0.35 and it knows nothing at all about
// sets, so the club at the top of the list can be the one that drops you off
// Tour Issue 4 and leaves you carrying less than you were. This asks derive()
// the way the item sheet's preview does, and takes a swap only when it is
// better on the carry or the purse and worse on NEITHER. That is deliberately
// timid: a club that buys carry with purse is a decision, and a toggle should
// not be quietly making your decisions. Those stay on the bench for you.
// Measured on a fresh Tour Card X locker fed a hundred and twenty drops, over
// several runs: this swaps on roughly half the drops the sort key would, and
// the ones it passes on are worth between sixteen and twenty two per cent of
// the purse multiplier. The greedy version ends ahead on carry for it, by
// anything from seventeen to sixty odd per cent. That is a real trade and it
// may well be the right one -- but it is a rebuild, not an upgrade, and the
// regret is not symmetric. Nobody minds a toggle that missed a better driver.
// Everybody minds one that quietly cut their prize money while they were out.
// The item sheet prices the same swap to two decimal places; take it there.
function autoPick(slot){
  const cands = S.bag.filter(it => it.slot === slot);
  if(!cands.length) return null;
  const had = S.equip[slot], base = derive();
  let best = null, bestGain = 0;
  for(const it of cands){
    if(had && had.uid === it.uid) continue;
    let after;
    S.equip[slot] = it;
    try { after = derive(); } finally { S.equip[slot] = had; }
    const dps = after.dps - base.dps, gold = after.gold - base.gold;
    if(dps < -1e-9 || gold < -1e-9) continue;
    if(dps <= 1e-9 && gold <= 1e-9) continue;
    const gain = dps/Math.max(1e-9, base.dps) + gold/Math.max(1e-9, base.gold);
    if(gain > bestGain){ bestGain = gain; best = it; }
  }
  return best;
}
// Over every slot, and again while anything still moves: taking the driver can
// complete a set that makes a bench wedge worth taking too, and the second club
// is invisible on the pass that took the first. Capped both ways, because a
// cycle in here hangs the frame rather than merely equipping the wrong wedge.
// Never during an away session: that loop drops thousands of clubs, and the
// sweep costs a derive() per candidate. offline() runs one at the end instead.
function autoEquipSweep(){
  const took = [];
  if(!S.autoEquip || OFFLINE) return took;
  for(let pass = 0; pass < B.SLOTS.length && took.length < 40; pass++){
    let moved = false;
    for(const sl of B.SLOTS){
      const pick = autoPick(sl.id);
      if(!pick) continue;
      const cur = S.equip[sl.id];
      S.equip[sl.id] = pick;
      S.bag = S.bag.filter(x => x.uid !== pick.uid);
      if(cur) S.bag.push(cur);
      took.push(pick); moved = true;
    }
    if(!moved) break;
  }
  return took;
}
// What a club is worth broken up. One function, because it is read from the
// locker, from the bulk scrap and from the overflow when the bag is full, and
// Scrap Value has to reach all three.
function scrapValue(it){
  return Math.max(1, Math.round((1 + it.rar*1.8) * (1 + it.enh*0.35)
    * (1 + career().scrap)));
}
function salvageItem(it){
  const v = scrapValue(it);
  S.shard += v;
  S.bag = S.bag.filter(x => x.uid !== it.uid);
  toast('Scrapped for <b>' + v + '</b> ' + plural(v, 'shards'));
  renderBag();
}
function enhCost(it){
  return Math.round(B.ENH_BASE * Math.pow(B.ENH_R, it.enh) * Math.pow(1.12, it.ilvl) * (1 + it.rar*0.5));
}
function enhChance(it){
  return it.enh < B.ENH_SAFE ? 1
       : clamp(1 - (it.enh - B.ENH_SAFE + 1)*0.072 + career().reforge, 0.22, 1);
}
function enhance(it){
  if(it.enh >= B.ENH_MAX) return;
  const c = enhCost(it);
  if(S.grit < c){ toast('Not enough grit for that'); return; }
  S.grit -= c;
  if(Math.random() < enhChance(it)){ it.enh++; if(it.enh >= B.ENH_MAX) bump('enh15');
    toast(it.name + ' \u2192 <b>+' + it.enh + '</b>'); }
  else toast('Reforge failed \u00b7 still +' + it.enh);
  renderBag(); renderVitals();
}
const lockCount = it => (it.aff || []).filter(a => a.lock).length;
function rerollCost(it){
  const n = lockCount(it);
  const base = 6 + it.rar*5 + it.ilvl;
  return Math.ceil(base * (n ? B.LOCK_MULT * Math.pow(B.LOCK_EACH, n - 1) : 1)
    * (1 - Math.min(0.60, career().attune)));
}
function toggleLock(it, i){
  const a = it.aff[i]; if(!a) return;
  if(!a.lock && lockCount(it) >= it.aff.length - 1){
    toast('Leave one roll unlocked'); return;
  }
  a.lock = !a.lock;
  renderBag();
}
function rerollItem(it){
  const c = rerollCost(it);
  if(S.shard < c){ toast('Not enough shards for that'); return; }
  S.shard -= c;
  const kept = it.aff.filter(a => a.lock);
  const pool = B.AFFIX.filter(d => !kept.some(a => a.k === d.id));
  const aff = kept.slice();
  const want = B.RARITY[it.rar].aff;
  while(aff.length < want && pool.length){
    const d = pool.splice(Math.floor(Math.random()*pool.length), 1)[0];
    aff.push({ k:d.id, roll: d.lo + Math.random()*(d.hi - d.lo) });
  }
  it.aff = aff;
  toast(kept.length ? 'Re-attuned around ' + kept.length + ' locked' : 'Re-attuned');
  renderBag(); renderVitals();
}
function ascendCost(it){ return Math.max(1, Math.round((26 + it.ilvl*3) * Math.pow(2.35, it.rar)
  * (1 - Math.min(0.60, career().attune)))); }
function ascendItem(it){
  if(it.rar >= B.RARITY.length-1){ toast('It is already Mythic'); return; }
  const c = ascendCost(it);
  if(S.shard < c){ toast('Not enough shards for that'); return; }
  S.shard -= c; it.rar++;
  const pool = B.AFFIX.filter(d => !it.aff.some(a => a.k === d.id));
  if(pool.length){ const d = pool[Math.floor(Math.random()*pool.length)];
    it.aff.push({ k:d.id, roll: d.lo + Math.random()*(d.hi - d.lo) }); }
  it.name = nameItem(it, B.SLOTS.find(s=>s.id===it.slot));
  toast('Ascended to <b>' + B.RARITY[it.rar].n + '</b>');
  renderBag(); renderVitals();
}

/* =========================================================================
   THE DEPTHS
   ========================================================================= */
function keyInterval(d){ const C = career();
  // floored, or a deep Riftkey means keys arrive instantly and the Depths stop
  // being a limited resource at all
  return d.regen * Math.max(B.RIFT_MIN_WAIT, Math.pow(B.RIFT_REGEN, relLv('rift')))
    * (C.sharp ? 0.6 : 1) * (1 - Math.min(0.60, permAdd('teetime'))); }
function regenKeys(dt){
  for(const d of B.DGN){
    if(S.dgnKeys[d.id] >= d.cap){ S.dgnKeyT[d.id] = 0; continue; }
    S.dgnKeyT[d.id] += dt;
    const iv = keyInterval(d);
    while(S.dgnKeyT[d.id] >= iv && S.dgnKeys[d.id] < entryCap(d)){
      S.dgnKeyT[d.id] -= iv; S.dgnKeys[d.id]++;
    }
  }
}
const dgnStartFloor = id => Math.max(0, Math.floor((S.dgnFloor[id] - 3) + relLv('rift')*B.RIFT_FLOOR + career().dfloor));
// Endurance takes work off the floor itself, so it is felt on every rung
// rather than only on the one you happen to die on.
const floorWork = f => B.DGN_WORK * Math.pow(B.DGN_WORK_STEP, f)
  * (1 - Math.min(0.60, career().wvault));
// turn any number into an equivalent depth, so a long drive and a deep floor
// can be paid on the same scale
const asFloor = v => Math.max(0, Math.log(Math.max(1, v / B.DGN_WORK)) / Math.log(B.DGN_WORK_STEP));

// Where a carry belongs down here, read off the carry itself rather than off
// how deep it has already been. The Vault earns its floor by chewing through
// floorWork and the Long Drive by the yardage it actually strikes, so those two
// were always anchored to the bag. The Island Green and the Floodlit Green were
// anchored to dgnStartFloor instead, which is the LAST floor they recorded
// minus three, so each run recorded a deeper floor than the one before and fed
// it straight back in. Both of their gates are capped - the make chance tops
// out at 94% and the drop chance at 88% - so past the caps the loop ran on
// nothing at all. Measured on Tour Card I with a full bag and no upgrades
// bought: the Floodlit Green gained nine floors a run forever, scrolls climbed
// twenty two orders of magnitude in forty runs, and one run paid for eight
// Sponsor Exemptions, which refill every key in the Depths. The Depths were an
// unlimited resource, and the Vault's purse rides on the same keys.
const carryFloor = D => asFloor(Math.max(1, D.dps) * B.CARRY_FLOOR_T)
  + relLv('rift')*B.RIFT_FLOOR + (D.C ? D.C.dfloor : career().dfloor);

// The floor a carry that is exactly keeping pace with its Tour Card reaches.
// Depth is paid from HERE, not from the raw floor number: the number climbs
// about two rungs a card all by itself, so a reward priced off it drifts
// against the ladder. Being deeper than your card expects is the thing worth
// paying for, and that is the same achievement on every card.
const dgnPace = tier => B.DGN_PACE_0
  + Math.log(B.TIER_Y) / Math.log(B.DGN_WORK_STEP) * tierProgress(tier);

// What one purchase in a currency's shop costs today. Every reward down here is
// priced in these, the way the Vault is priced in holes of purse, so a run buys
// the same amount of PROGRESS on card four hundred as on card four. Paying a
// flat number and letting the floor number multiply it was the drift: the shops
// price off item level, item level is the Tour Card, and the floor number runs
// ahead of both. Measured before this: grit went from one reforged item per two
// hundred hours on the first card to twenty seven an hour by card fifty.
function shopPrice(cur){
  const t = tierProgress();
  // a fresh Rare taken the whole way to +15
  if(cur === 'grit')  return B.ENH_BASE * Math.pow(1.12, t) * 2.5
    * (Math.pow(B.ENH_R, B.ENH_MAX) - 1) / (B.ENH_R - 1);
  if(cur === 'shard') return (26 + t*3) * Math.pow(2.35, 3);   // one ascension of a Rare
  return B.SKILL_LV_COST * Math.pow(B.SKILL_LV_R, 10);         // a level mid shot book
}
// what a given depth is worth, shared by every mode so rewards stay comparable
const pastPace = f => clamp(f - dgnPace(), 0, B.DGN_PACE_MAX);
const yieldAt = (f, D, d) => shopPrice(d.cur) * (d.pay || 1)
  * Math.pow(B.DGN_YIELD_STEP, pastPace(f)) * D.dgnY;

// The stake of the day, read off the wall clock and nothing in the save: put it
// in the save and a reload is a reroll, and the one thing a daily has to be is
// the same daily all day. A strict rotation rather than a hash, so the Vault
// comes round every fourth day whether or not you were there for the last one,
// and a contest you are saving entries for has a date on it.
let FEAT_FORCE = null;
const featDay  = () => Math.floor(Date.now() / 86400000);
const featOf   = day => B.DGN[((day % B.DGN.length) + B.DGN.length) % B.DGN.length];
const featWager = () => FEAT_FORCE
  ? (B.DGN.find(d => d.id === FEAT_FORCE) || B.DGN[0]) : featOf(featDay());
const isFeat   = d => featWager().id === d.id;
// seconds until it turns over, for the countdown on the card
const featLeft = () => 86400 - (Date.now()/1000) % 86400;

/* ---- daily challenges ---------------------------------------------------
   Three a day, off the same clock as the stake of the day so the two turn
   over together. Each pays DAILY_SOV sovereigns the moment it is done; all
   three pay DAILY_ALL, plus DAILY_STREAK for every day running you have
   finished all three, up to DAILY_STREAK_MAX days. Paid automatically, like
   the honours: an idle game should not make you come and collect. */
let DAY_FORCE = null;
const dayNow = () => DAY_FORCE !== null ? DAY_FORCE : featDay();
const dailyDef = id => B.DAILY_POOL.find(c => c.id === id);
function dailyStart(day){
  const pool = B.DAILY_POOL.filter(c => !c.lv || (S.lv || 1) >= c.lv);
  const rnd = seeded(hash32(day * 7919 + 17));
  const a = pool.slice();
  for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  const base = {};
  for(const c of B.DAILY_POOL) base[c.m] = achMetric(c.m);
  S.daily = { day, picks: a.slice(0, 3).map(c => c.id), base, done: [0, 0, 0], all: 0 };
}
// the streak as it stands today: one missed day and it is gone
const dailyStreak = () => (S.dailyLastAll !== undefined && S.dailyLastAll >= dayNow() - 1)
  ? (S.dailyStreak || 0) : 0;
const dailyHave = (c, i) => S.daily.done[i] ? c.v
  : Math.max(0, Math.min(c.v, achMetric(c.m) - (S.daily.base[c.m] || 0)));
function dailyTick(){
  const day = dayNow();
  if(!S.daily || S.daily.day !== day) dailyStart(day);
  const Dy = S.daily;
  Dy.picks.forEach((id, i) => {
    const c = dailyDef(id);
    if(Dy.done[i] || !c || dailyHave(c, i) < c.v) return;
    Dy.done[i] = 1;
    grantSov(B.DAILY_SOV, null, true);
    toast('<span class="achk">Daily +' + B.DAILY_SOV + sovIc() + '</span>' + c.d, 'ach');
    Sfx.play('coin');
  });
  if(!Dy.all && Dy.done.every(Boolean)){
    Dy.all = 1;
    S.dailyStreak = (S.dailyLastAll === day - 1 ? (S.dailyStreak || 0) : 0) + 1;
    S.dailyLastAll = day;
    const bonus = B.DAILY_ALL + B.DAILY_STREAK * Math.min(B.DAILY_STREAK_MAX, S.dailyStreak);
    grantSov(bonus, null, true);
    toast('<span class="achk">All three +' + bonus + sovIc() + '</span>'
      + (S.dailyStreak > 1 ? S.dailyStreak + ' days running' : 'Done for today'), 'ach');
    Sfx.play('ach');
  }
}

// A single swing resolved in full: crit, provisionals and an affinity roll.
// This is what the Long Drive measures.
function swingRoll(D){
  let dmg = D.pow;
  const crit = Math.random() < D.crit;
  if(crit) dmg *= D.cpw;
  let extra = Math.floor(D.mst) + (Math.random() < (D.mst % 1) ? 1 : 0);
  while(extra-- > 0){
    let e = D.pow * B.MST_DMG;
    if(crit && D.C.mstcrit > 0 && Math.random() < D.C.mstcrit) e *= D.cpw;
    else if(Math.random() < D.crit) e *= D.cpw;
    dmg += e;
  }
  const pr = crit && D.C.critproc > 0 ? Math.min(B.PROC_CAP, D.proc + D.C.critproc) : D.proc;
  if(D.ball && D.ball.el && Math.random() < pr)
    dmg *= 1 + Math.min(D.elemDmg, B.ELEM_CAP);
  return dmg;
}
const islandChance = (D, made) => clamp(
  B.ISLAND_BASE + D.crit*B.ISLAND_CRIT + (D.C ? D.C.wisland : 0) - made*B.ISLAND_DECAY,
  B.ISLAND_MIN, B.ISLAND_MAX);
const chipChance = D => clamp((D.procRaw !== undefined ? D.procRaw : D.proc) * B.CHIP_PROC
  + (D.C ? D.C.wchip : 0), 0.05, 0.88);
// The Scramble plays 1 + floor(provisional) balls a hole, and one more on the
// fractional part; a hole is won if any of them drops. This is the chance of
// winning a hole, averaged over whether that last ball turns up.
const scrambleBalls = D => { const m = clamp(D.mst || 0, 0, B.MST_CAP); return { fl: Math.floor(m), fr: m % 1 }; };
const scrambleChance = D => {
  const b = scrambleBalls(D), p = B.SCRAMBLE_P;
  return (1 - b.fr) * (1 - Math.pow(1 - p, 1 + b.fl)) + b.fr * (1 - Math.pow(1 - p, 2 + b.fl));
};
// The Twilight Putt: a putt every gap seconds, the gap shrinking with tempo.
const twilightGap = D => clamp(B.TWI_GAP / (0.5 + 0.5 * Math.max(0.1, D.spd)), B.TWI_GAP_MIN, B.TWI_GAP);
const twilightPutts = (D, dur) => Math.max(3, Math.floor((dur - B.TWI_LEAD) / twilightGap(D)));
// The pot a run of n tries at q each builds, when the i-th success pays at mark
// fc + i*step: a sum over a binomial, weighted by the chance of getting that far.
function binomPot(n, q, fc, step, per){
  let pmf = Math.pow(1 - q, n), tail = 1, sum = 0;
  for(let i = 1; i <= n; i++){
    tail -= pmf;
    pmf *= (q / (1 - q)) * (n - i + 1) / i;
    sum += Math.max(0, tail) * per(fc + i * step);
  }
  return sum;
}

// What one entry is actually worth, worked out the way the contest itself pays.
//
// Every reward down here is priced through yieldAt, which starts from
// shopPrice(currency) -- what ONE purchase in that currency's shop costs today
// -- and then multiplies it away into a raw number. Divide it back out and a
// run is worth "about two shot book levels" or "about one ascension", which is
// a thing you can weigh against the other three. Four contests reported in four
// different units, one in yards, one in per cent of greens, one in per cent of
// chips and one in carry a second, cannot be compared at all, and the entries
// are the scarce thing.
//
// The Vault is the exception and stays in its own unit: it pays the purse, so
// holes of purse is what it is worth, and holes of purse is already the scale
// the rest of the game is priced in.
const DGN_BUYS = { grit:'clubs to +15', shard:'ascensions',
                   scroll:'shot book levels', gold:'holes of purse' };
// What the rub of the green costs a Vault run, read off the event table itself
// rather than measured once and written down: weights change, this follows.
// A time event moves the clock directly; a work event scales the floor you are
// on; a mod event scales your rate for the next one, so it costs 1/v; a gust
// takes a floor back, which is a floor's time thrown away.
function dgnEventDrag(){
  let tot = 0; for(const e of B.DGN_EVENTS) tot += e.w;
  const p = B.DGN_EVENT_CHANCE;
  let addS = 0, wWork = 0, eWork = 0, wMod = 0, eMod = 0, wBack = 0;
  for(const e of B.DGN_EVENTS){
    const pe = p * e.w / tot;
    if(e.k === 'time'){ addS += pe * e.v; }
    else if(e.k === 'work'){ wWork += pe; eWork += pe * e.v; }
    else if(e.k === 'mod'){ wMod += pe; eMod += pe / e.v; }
    else if(e.k === 'back'){ wBack += pe; }
  }
  const mult = (1 + eWork - wWork) * (1 + eMod - wMod) / Math.max(0.5, 1 - wBack);
  return { mult, addS };
}
function dgnPayout(d, D){
  const featM = isFeat(d) ? B.DGN_FEAT_MULT * (1 + D.C.wfeat) : 1;
  const fc = carryFloor(D);
  // yieldAt in units of one purchase, which is what it was built out of
  const per = f => yieldAt(f, D, d) / Math.max(1e-9, shopPrice(d.cur));

  if(d.mode === 'drive'){
    // The payout rides the LONGEST of six, so the projection has to as well.
    // The wind is drawn per shot, and the expected largest of six draws from a
    // flat range is lo + (hi-lo) * 6/7. The swing itself is taken at its
    // expectation rather than at a best case, so this reads a little under
    // rather than a little over.
    const wind = B.DRIVE_WIND[0] + (B.DRIVE_WIND[1] - B.DRIVE_WIND[0]) * 6/7;
    const swing = D.pow * (1 + D.crit*(D.cpw-1)) * (1 + D.mst*B.MST_DMG)
                * (1 + D.proc*Math.min(D.elemDmg, B.ELEM_CAP));
    return { buys: per(asFloor(swing * wind * (1 + D.C.wdrive))) * featM,
             note: 'longest of ' + B.DRIVE_SHOTS };
  }
  if(d.mode === 'island'){
    // NOT what banking on your target pays. The make chance decays 3.5 points
    // a green and a miss costs three quarters of the pot, so "the pot at your
    // target" was promising five to six times what runs actually paid --
    // measured, which is the only reason I know. This walks the real tree: the
    // first green is a gimme, then each one either carries the pot on or ends
    // the run at a quarter of it.
    const target = B.BANK_OPTS.includes(S.islandBank) ? S.islandBank : 5;
    const pot0 = per(fc);
    let reach = 1, ev = 0;                       // reach = P(still dry after m)
    for(let m = 1; m < target; m++){
      const q = islandChance(D, m);
      ev += reach * (1 - q) * Math.pow(B.ISLAND_MULT, m) * B.ISLAND_SALVAGE;
      reach *= q;
    }
    ev += reach * Math.pow(B.ISLAND_MULT, target);
    return { buys: pot0 * ev * featM,
             note: target + '\u00a0greens ' + Math.round(reach*100) + '% of the time' };
  }
  if(d.mode === 'chip'){
    // Rounding the number of drops and summing to it read 14% under, because
    // the pot is a sum over a binomial rather than a sum to its mean. The
    // expectation is the same sum weighted by the chance of getting that far.
    const q = chipChance(D), n = B.CHIP_SHOTS;
    let pmf = Math.pow(1 - q, n), tail = 1, sum = 0;   // tail = P(M >= i)
    for(let i = 1; i <= n; i++){
      tail -= pmf;                                     // drop P(M == i-1)
      pmf *= (q / (1 - q)) * (n - i + 1) / i;
      sum += Math.max(0, tail) * per(fc + i*B.CHIP_STEP);
    }
    return { buys: sum * featM,
             note: Math.round(n*q) + ' of ' + n + ' dropping' };
  }
  if(d.mode === 'scramble'){
    const q = scrambleChance(D), n = B.SCRAMBLE_HOLES;
    return { buys: binomPot(n, q, fc, B.SCRAMBLE_STEP, per) * featM,
             note: Math.round(n*q) + ' of ' + n + ' holed' };
  }
  if(d.mode === 'twilight'){
    const n = twilightPutts(D, d.run * (D.C.sharp ? 1.4 : 1));
    return { buys: binomPot(n, B.TWI_Q, fc, B.TWI_STEP, per) * featM,
             note: n + ' putts before dark' };
  }
  // The Vault earns its floor by chewing through floorWork, so the projection
  // chews through it too: the same clock, the same carry, the same floor that
  // still takes a moment when you are far too strong for it -- and the same
  // rub of the green, which is not optional. An event fires on 38% of floors
  // and the table is weighted against you; ignoring them read 24% deep.
  const drag = dgnEventDrag();
  let f = dgnStartFloor(d.id), t = d.run * (D.C.sharp ? 1.4 : 1), cleared = 0;
  while(cleared < 500){
    const need = Math.max(B.DGN_MIN_FLOOR, floorWork(f) / Math.max(1e-9, D.dps))
               * drag.mult + drag.addS;
    if(need > t) break;
    t -= need; f++; cleared++;
  }
  const deepest = cleared > 0 ? f - 1 : 0;
  return { buys: (B.VAULT_HOLES + pastPace(deepest) * B.VAULT_PER_MARK) * featM,
           note: cleared + '\u00a0floor' + (cleared === 1 ? '' : 's') + ' deep', floors: cleared };
}

function startDgn(d){
  if(S.dgnRun){ toast('One wager at a time'); return; }
  if(S.dgnKeys[d.id] < 1){ toast('No entries left for ' + d.n); return; }
  S.dgnKeys[d.id]--; bump('runs');
  const D0 = derive();
  // The Vault has to earn its way back down, so it starts where it left off.
  // The other two are scored against the bag instead, or they feed themselves.
  const f0 = dgnStartFloor(d.id), fc = carryFloor(D0);
  const dur = d.run * (career().sharp ? 1.4 : 1);
  // Captured at the tee, not read at the till. A run started at 23:59 is paid
  // on the stake it was entered under, whatever the clock says when it lands.
  const R = { id:d.id, mode:d.mode, t:0, dur, dead:false, evt:null, evtT:0, next:0,
              feat: isFeat(d) };
  if(d.mode === 'drive'){ R.shots = 0; R.best = 0; R.last = 0; R.wind = 1; R.next = 1.2; }
  else if(d.mode === 'island'){
    R.made = 0; R.pot = yieldAt(fc, D0, d); R.chance = 0; R.banked = false;
    R.target = B.BANK_OPTS.includes(S.islandBank) ? S.islandBank : 5; R.next = 1.4;
  }
  else if(d.mode === 'chip'){ R.shot = 0; R.made = 0; R.pot = 0; R.f0 = fc; R.next = 1.2; }
  else if(d.mode === 'scramble'){ R.shot = 0; R.made = 0; R.pot = 0; R.f0 = fc; R.next = 1.2; R.log = []; }
  else if(d.mode === 'twilight'){
    // the tempo you walk on with sets the pace of the whole run
    R.shot = 0; R.made = 0; R.pot = 0; R.f0 = fc; R.next = B.TWI_LEAD; R.log = [];
    R.gap = twilightGap(D0); R.n = twilightPutts(D0, dur);
  }
  else { R.floor = f0; R.cleared = 0; R.work = floorWork(f0); R.full = R.work; R.fT = 0; R.mod = 1; }
  S.dgnRun = R;
  toast('Entered <b>' + d.n + '</b>');
  renderDgn();
}

function rollDgnEvent(R){
  if(Math.random() > B.DGN_EVENT_CHANCE) return;
  let tot = 0; for(const e of B.DGN_EVENTS) tot += e.w;
  let x = Math.random()*tot, pick = B.DGN_EVENTS[0];
  for(const e of B.DGN_EVENTS){ x -= e.w; if(x <= 0){ pick = e; break; } }
  R.evts = R.evts || []; R.evts.push(pick.n);
  if(pick.k === 'time') R.t += pick.v;
  else if(pick.k === 'mod') R.mod = pick.v;
  else if(pick.k === 'work') { R.work *= pick.v; R.full *= pick.v; }
  else if(pick.k === 'back' && R.cleared > 0){
    R.cleared--; R.floor--;
    R.work = floorWork(R.floor); R.full = R.work; R.fT = 0;
  }
  R.evt = pick; R.evtT = 2.4;
  // The stage already calls it out in the middle of the screen. A toast on top
  // of that made three copies of one event: two stacked in the corner and one
  // over the hole, all saying LOST BALL.
  R.evtT = 2.4;
}

function tickDgn(dt, D){
  const R = S.dgnRun; if(!R) return;
  const d = B.DGN.find(x => x.id === R.id);
  R.t += dt;
  if(R.evtT > 0) R.evtT -= dt;

  // A run that ends the instant a shot is struck never shows the shot. When a
  // contest reaches its end it waits here for the ball to come down first.
  if(R.settle > 0){
    R.settle -= dt;
    if(R.settle <= 0) endDgn(d, R, D);
    return;
  }
  R.next -= dt;

  if(R.mode === 'drive'){
    if(R.next <= 0){
      if(R.shots >= B.DRIVE_SHOTS){ R.settle = 1.2; return; }
      R.shots++;
      R.wind = B.DRIVE_WIND[0] + Math.random()*(B.DRIVE_WIND[1] - B.DRIVE_WIND[0]);
      R.last = swingRoll(D) * R.wind;
      if(R.last > R.best) R.best = R.last;
      R.next = B.DRIVE_GAP;
      R.log = R.log || []; R.log.push(R.last);
      Scene.swing(R.last, R.wind > 1.2, D.ball && D.ball.el);
    }
    if(R.t >= R.dur) R.settle = 1.2;

  }else if(R.mode === 'island'){
    if(R.next <= 0){
      R.chance = islandChance(D, R.made);
      R.startChance = R.startChance === undefined ? islandChance(D, 0) : R.startChance;
      // The first one is a gimme. Without it a run could end on the opening
      // shot inside two seconds, having paid nothing at all.
      const ok = R.made === 0 ? true : Math.random() < R.chance;
      Scene.aimed(R.pot, D.ball && D.ball.el, Scene.holeLen(),
                  ok ? (Math.random()-0.5)*1.1 : (Math.random()<0.5?-1:1)*(2.4 + Math.random()*1.4),
                  ok);
      Scene.holed({ n: ok ? 'ON THE GREEN' : 'IN THE WATER', d: ok ? -2 : 1 });
      if(ok){
        R.made++; R.pot *= B.ISLAND_MULT;
        Scene.spark('verdant');
        if(R.made >= R.target){ R.banked = true; R.settle = 1.3; return; }
        R.next = B.ISLAND_GAP;
      }else{
        R.dead = true; R.pot *= B.ISLAND_SALVAGE; R.settle = 1.3; return;
      }
    }
    if(R.t >= R.dur){ R.banked = true; R.settle = 1.2; }

  }else if(R.mode === 'chip'){
    if(R.next <= 0){
      if(R.shot >= B.CHIP_SHOTS){ R.settle = 1.2; return; }
      R.shot++;
      R.chance = chipChance(D);
      const inHole = Math.random() < R.chance;
      // every chip finishes on the green; the good ones finish in the hole
      Scene.aimed(D.pow, D.ball && D.ball.el, Scene.holeLen(),
                  inHole ? 0 : (Math.random()-0.5)*2.6, inHole);
      (R.drops = R.drops || [])[R.shot - 1] = inHole ? 1 : 0;
      if(inHole){
        R.made++;
        R.pot += yieldAt(R.f0 + R.made*B.CHIP_STEP, D, d);
        Scene.holed({ n:'DROPPED', d:-3 });
        Scene.spark('verdant');
      }
      R.next = B.CHIP_GAP;
    }
    if(R.t >= R.dur) R.settle = 1.2;

  }else if(R.mode === 'scramble'){
    if(R.next <= 0){
      if(R.shot >= B.SCRAMBLE_HOLES){ R.settle = 1.2; return; }
      R.shot++;
      const b = scrambleBalls(D), balls = 1 + b.fl + (Math.random() < b.fr ? 1 : 0);
      let won = false;
      for(let i = 0; i < balls; i++) if(Math.random() < B.SCRAMBLE_P){ won = true; break; }
      R.log.push({ balls, won });
      Scene.aimed(D.pow, D.ball && D.ball.el, Scene.holeLen(),
                  won ? 0 : (Math.random()-0.5)*2.4, won);
      if(won){
        R.made++;
        R.pot += yieldAt(R.f0 + R.made*B.SCRAMBLE_STEP, D, d);
        Scene.holed({ n: balls > 1 ? 'SCRAMBLED' : 'HOLED', d:-3 });
        Scene.spark('verdant');
      }
      R.next = B.SCRAMBLE_GAP;
    }
    if(R.t >= R.dur) R.settle = 1.2;

  }else if(R.mode === 'twilight'){
    if(R.next <= 0){
      if(R.shot >= R.n){ R.settle = 1.2; return; }
      R.shot++;
      const drop = Math.random() < B.TWI_Q;
      R.log.push(drop ? 1 : 0);
      Scene.aimed(D.pow * 0.25, D.ball && D.ball.el, Scene.holeLen(),
                  drop ? 0 : (Math.random()-0.5)*1.6, drop);
      if(drop){
        R.made++;
        R.pot += yieldAt(R.f0 + R.made*B.TWI_STEP, D, d);
        if(R.made % 5 === 0) Scene.holed({ n: R.made + ' DOWN', d:-2 });
      }
      R.next = R.gap;
    }
    if(R.t >= R.dur) R.settle = 1.2;

  }else{
    R.fT += dt;
    R.work -= D.dps * (R.mod || 1) * dt;
    if(R.work <= 0 && R.fT >= B.DGN_MIN_FLOOR){
      R.cleared++; R.floor++; R.mod = 1; R.fT = 0;
      R.work = floorWork(R.floor); R.full = R.work;
      rollDgnEvent(R);
    }
    if(R.t >= R.dur) endDgn(d, R, D);
  }
}

function endDgn(d, R, D){
  S.dgnRun = null;
  const stats = [];
  let fe = -1, head = '', pot = 0;

  if(R.mode === 'drive'){
    const log = R.log || [];
    const avg = log.length ? log.reduce((a,b) => a+b, 0)/log.length : 0;
    fe = R.best > 0 ? asFloor(R.best * (1 + D.C.wdrive)) : -1;
    head = R.best > 0 ? 'Longest drive of the day: ' + fmt(R.best) + ' yards.'
                      : 'Not one of them found the fairway.';
    stats.push(['Drives hit', log.length + ' of ' + B.DRIVE_SHOTS]);
    stats.push(['Longest', fmt(R.best) + ' yds']);
    stats.push(['Average', fmt(avg) + ' yds']);
    if(log.length) stats.push(['Shortest', fmt(Math.min.apply(null, log)) + ' yds']);

  }else if(R.mode === 'island'){
    if(R.made > 0){
      pot = R.pot; fe = carryFloor(D) + R.made*1.1;
      head = R.dead
        ? 'Wet on number ' + (R.made + 1) + '. You walked off with a quarter of the pot.'
        : 'Banked clean on ' + R.made + '. Nerve held.';
    }else head = 'Straight in the water off the first one.';
    stats.push(['Greens hit', R.made + ' of ' + R.target]);
    stats.push(['Finished', R.dead ? 'in the water' : 'banked']);
    stats.push(['Make chance at the start', Math.round((R.startChance||0)*100) + '%']);
    stats.push(['Make chance on the last one', Math.round((R.chance||0)*100) + '%']);
    stats.push(['Pot', fmt(R.pot) + (R.dead && R.made ? ' after salvage' : '')]);

  }else if(R.mode === 'chip'){
    if(R.made > 0){
      pot = R.pot; fe = R.f0 + R.made*B.CHIP_STEP;
      head = R.made + ' of ' + R.shot + ' chips found the bottom of the cup.';
    }else head = 'Twenty five chips and not one of them dropped.';
    stats.push(['Chips played', R.shot + ' of ' + B.CHIP_SHOTS]);
    stats.push(['Dropped', String(R.made)]);
    stats.push(['Strike rate', R.shot ? Math.round(R.made/R.shot*100) + '%' : '0%']);
    stats.push(['Drop chance', Math.round((R.chance||0)*100) + '%']);

  }else if(R.mode === 'scramble'){
    if(R.made > 0){
      pot = R.pot; fe = R.f0 + R.made*B.SCRAMBLE_STEP;
      head = R.made + ' of ' + R.shot + ' holes won.';
    }else head = 'Nine holes, every ball, and not one dropped.';
    const balls = (R.log || []).reduce((t, h) => t + h.balls, 0);
    stats.push(['Holes won', R.made + ' of ' + B.SCRAMBLE_HOLES]);
    stats.push(['Balls played', String(balls)]);
    stats.push(['Win chance a hole', Math.round(scrambleChance(D)*100) + '%']);

  }else if(R.mode === 'twilight'){
    if(R.made > 0){
      pot = R.pot; fe = R.f0 + R.made*B.TWI_STEP;
      head = R.made + ' of ' + R.shot + ' putts dropped before dark.';
    }else head = 'Not one dropped before the light went.';
    stats.push(['Putts', R.shot + ' of ' + R.n]);
    stats.push(['Dropped', String(R.made)]);
    stats.push(['A putt every', R.gap.toFixed(1) + 's']);

  }else{
    const deepest = R.floor - 1;
    if(R.cleared > 0){ fe = deepest; head = 'Down to floor ' + (deepest + 1) + ' before the clock went.'; }
    else head = 'The clock went on the very first floor.';
    stats.push(['Floors cleared', String(R.cleared)]);
    stats.push(['Deepest floor', String(R.floor + (R.cleared ? 0 : 1))]);
    stats.push(['Carry', fmt(D.dps) + ' /s']);
    if(R.evts && R.evts.length) stats.push(['What happened', R.evts.join(', ')]);
  }
  // the last step can land a fraction past the clock; "46.3s of 46s" read as a bug
  stats.push(['Time on the clock', Math.min(R.t, R.dur).toFixed(1) + 's of ' + Math.round(R.dur) + 's']);

  const rewards = [];
  if(fe >= 0){
    Scene.depthsFlash((B.DGN_PAL[d.id] || {}).glow || '#57E0BE');
    const mine = R.mode === 'drive' ? R.best
               : R.mode === 'island' ? R.made
               : R.mode === 'chip' || R.mode === 'scramble' || R.mode === 'twilight' ? R.made
               : Math.max(0, R.floor);
    if(mine > (S.dgnBest[d.id] || 0)) S.dgnBest[d.id] = mine;
    const deeper = fe > (S.dgnFloor[d.id] || 0);
    if(deeper){ S.dgnFloor[d.id] = Math.round(fe); rewards.push(['New best', 'yes']); }
    const xp = B.XP_FLOOR * Math.pow(1 + fe, B.XP_FLOOR_P) * (1 + fe*0.2);
    addXp(xp);
    // A ticket for a new personal best, never a rate. Any per-run faucet closes
    // a loop here: a Sponsor Exemption costs six and refills every key in the
    // Depths, which is twelve more runs, so anything over half a ticket a run
    // and the Depths buy their own keys forever. A best only moves when the bag
    // does, and a refill full of runs at a depth you have already been pays
    // nothing at all.
    if(deeper) grantTickets(B.TICK_DEPTH, 'a new best in the wager book');

    const featM = R.feat ? B.DGN_FEAT_MULT * (1 + D.C.wfeat) : 1;
    const yield_ = (pot > 0 ? pot : yieldAt(fe, D, d)) * featM;
    if(d.cur === 'gold'){
      // Priced in holes of purse so it tracks the course, and in floors past
      // what the card expects so it cannot outgrow it. Off the raw floor number
      // the Vault passed the entire course's income at card forty five and
      // reached eight times it by card four hundred, because that number climbs
      // two rungs a card on its own while the purse climbs one card's worth.
      const holes = (B.VAULT_HOLES + pastPace(fe) * B.VAULT_PER_MARK) * featM;
      const g2 = purseFor(S.hole, S.tier, D.gold) * holes;
      S.gold += g2;
      rewards.push(['Purse', fmt(g2) + ' (' + Math.round(holes) + ' holes worth)']);
    }else{
      const n = Math.max(1, Math.round(yield_));
      S[d.cur] += n; rewards.push([d.cn, '+' + fmt(n, 0)]);
    }
    if(R.feat) rewards.push(['Stake of the day', fmt(featM) + '\u00d7 on the payout']);
    rewards.push(['Experience', '+' + fmt(xp)]);
    if(deeper) rewards.push(['Sponsor tickets', '+' + B.TICK_DEPTH]);
    // a new personal best always comes home with something
    if(deeper || Math.random() < (d.gear !== undefined ? d.gear : B.DGN_GEAR_CHANCE) + relLv('rift')*0.05){
      const floorRar = Math.max(d.floorRar || 0, Math.min(2, Math.floor(fe/8)));
      const it = dropItem(S.tier + Math.min(3, Math.floor(fe/5)), D.drop + 0.35, floorRar);
      bagAdd(it);
      rewards.push(['Gear', B.RARITY[it.rar].n + ' ' + B.SLOTS.find(s => s.id === it.slot).n]);
    }
  }else{
    Scene.depthsFlash('#E4574A');
    rewards.push(['Nothing', 'walked away empty']);
  }

  const rowsHtml = a => a.map(([k, v]) =>
    '<div class="lb"><span class="p"></span><span>' + k + '</span><span class="s">' + v + '</span></div>').join('');
  showSheet('<h3>' + d.n + '</h3><p>' + head + '</p>'
    + '<div class="eyebrow" style="margin:10px 0 4px">Card</div>' + rowsHtml(stats)
    + '<div class="eyebrow" style="margin:12px 0 4px">Paid out</div>' + rowsHtml(rewards)
    + '<button class="act" onclick="hideSheet()">Back to the course</button>');
  renderDgn(); renderBag();
}

/* =========================================================================
   THE CARD
   ========================================================================= */
// The number to beat this week. Each cup already on the shelf makes it harder,
// so a cup is always the same distance away no matter how strong you are.
// Kept exact rather than rounded to whole shots. Rounded, the step falls under
// half a shot around the fiftieth cup and the number stops moving eighteen
// shots short of a perfect card, which is the flat floor again with more
// arithmetic in front of it: a card that beat it once would beat it forever.
// Exact, it only ever stops at a card of nothing but Aces, and the display
// rounds at the two places a player reads it.
const perfectCard = () => B.ROUND * B.DAYS * B.SCORE[0].d;   // an Ace on every hole
const eventTarget = () => perfectCard()
  + (B.TARGET_BASE - perfectCard()) * Math.pow(B.TARGET_CLOSE, S.cups || 0);
const targetShown = () => Math.round(eventTarget());
// How the purse follows the card: at target you take the base, and every shot
// under it pays more, to a ceiling.
const payShare = (score, target) =>
  clamp(1 + (target - score) / B.PAY_SPAN, B.PAY_MIN, B.PAY_MAX);
const cupPoints = (t, share) => Math.round(B.CUP_BASE[slotOfEvent(t)] * share);

/* =========================================================================
   THE NINE
   Something to play for that resolves inside a few minutes rather than at the
   end of seventy two holes.
   ========================================================================= */
const nineIndex = h => holeInRound(h) <= 9 ? 0 : 1;
// which band of goal you get asked for, from the standard you have been setting
function nineBand(){
  const per = (S.bestNine === undefined ? 0 : S.bestNine) / 9;
  return per <= B.NINE_BAND[1] ? 2 : per <= B.NINE_BAND[0] ? 1 : 0;
}
function nineGoalFor(h){
  const band = nineBand();
  const pool = B.NINE_GOALS.filter(g => g.t === band);
  return pool[hash32(roundIndex(h)*7919 + nineIndex(h)*104729 + band*31) % pool.length];
}
function startNine(){
  S.nine = { idx: nineIndex(S.hole), n: 0, total: 0, birdie:0, eagle:0, ace:0,
             bogey:0, allUnder:true, par5eagle:0, alb:0, goal: nineGoalFor(S.hole).id };
}
function nineProgress(){
  const N = S.nine; if(!N) return { have:0, need:1, goal:null };
  const goal = B.NINE_GOALS.find(g => g.id === N.goal) || B.NINE_GOALS[0];
  let have;
  if(goal.k === 'nobogey') have = N.bogey === 0 ? 1 : 0;
  else if(goal.k === 'allunder') have = (N.allUnder && N.n === 9) ? 1 : 0;
  else have = N[goal.k] || 0;
  return { have, need: goal.v, goal };
}
function resolveNine(){
  const N = S.nine; if(!N) return;
  const D = derive(), hole = purseFor(S.hole, S.tier, D.gold);
  const p = nineProgress();
  const won = p.have >= p.need;
  const best = S.bestNine === undefined || N.total < S.bestNine;
  const bits = [];
  if(won){
    const r = p.goal.r;
    const nine = 1 + D.C.nine;
    if(r.k === 'purse'){ const g = hole*r.v*nine; S.gold += g; Meter.add(g); bits.push(fmt(g) + ' purse'); }
    else if(r.k === 'tick'){ grantTickets(r.v); bits.push(r.v + ' ticket' + (r.v>1?'s':'')); }
    else { const v = Math.round(r.v*nine); S[r.k] += v;
           bits.push(v + '\u00a0' + (r.k === 'shard' ? 'shards' : r.k)); }
    S.ninesWon = (S.ninesWon || 0) + 1;
  }
  if(best){
    S.bestNine = N.total;
    const g = hole * B.NINE_BEST_PAY * (1 + D.C.nine); S.gold += g; Meter.add(g);
    bits.push('best nine, ' + fmt(g));
  }
  const fm = n => n === 0 ? 'E' : n > 0 ? '+' + n : String(n);
  const name = N.idx === 0 ? 'Front nine' : 'Back nine';
  if(bits.length) toast('<b>' + name + ' ' + fm(N.total) + '</b> \u00b7 ' + bits.join(' \u00b7 '));
  else toast(name + ' ' + fm(N.total) + ' \u00b7 ' + p.goal.n.toLowerCase() + ' missed');
  Scene.holed({ n: won || best ? name.toUpperCase() : fm(N.total), d: won || best ? -2 : 0 });
}

/* =========================================================================
   FINISHING A HOLE
   ========================================================================= */
const Meter = {
  buf: [], acc: 0,
  add(g){ this.acc += g; },
  tick(dt){
    this.buf.push({ g:this.acc, t:dt }); this.acc = 0;
    if(this.buf.length > 90) this.buf.shift();
  },
  rate(){
    let g = 0, t = 0;
    for(const b of this.buf){ g += b.g; t += b.t; }
    return t > 0 ? g/t : 0;
  }
};
// While catching up we replay thousands of holes. Every sheet and toast they
// would have raised is swallowed: the summary at the end says what happened.
let QUIET = false;
// Set while a catch-up is replaying holes, so anything that pays out can tell
// the difference between a round that was played and one that was fast-forwarded.
let OFFLINE = false;

/* ---- sound --------------------------------------------------------------
   Everything here is synthesised, so there is nothing to load and the game
   stays one file. The course sounds like a course: the whoosh and crack of a
   driver, the ball dropping into the cup and rattling round it, the gallery
   applauding a birdie and roaring an eagle, and birds in the trees on a fine
   day. The menus keep their chimes. Nothing plays while a catch-up replays
   holes, while the page is hidden, or with sound switched off in Settings,
   and on an iPhone it follows the silent switch. */
const Sfx = {
  ctx: null, master: null, lastSwing: 0, hold: 0,
  on(){ return S.sound !== 0 && !QUIET && !this.hold && !document.hidden; },
  init(){
    if(this.ctx) return this.ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    try{
      // mixes with whatever else is playing and follows an iPhone's silent switch
      if(navigator.audioSession) navigator.audioSession.type = 'ambient';
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.35;
      this.master.connect(this.ctx.destination);
    }catch(e){ this.ctx = null; }
    return this.ctx;
  },
  // browsers only start audio from a tap, so every tap offers it the chance
  unlock(){ const c = this.init(); if(c && c.state === 'suspended') c.resume().catch(() => {}); },
  tone(f, t0, dur, type, vol, f2){
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type || 'triangle';
    o.frequency.setValueAtTime(f, t0);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.1, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.03);
  },
  // one second of white noise, cut into by everything that needs air
  noise(){
    if(this._nz) return this._nz;
    const c = this.ctx, n = c.sampleRate, b = c.createBuffer(1, n, n), d = b.getChannelData(0);
    for(let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return this._nz = b;
  },
  // a burst of filtered noise: t0 start, dur length, f centre, q sharpness,
  // f2 where the filter ends up
  hiss(t0, dur, f, q, vol, f2, type){
    const c = this.ctx, src = c.createBufferSource(), bp = c.createBiquadFilter(), g = c.createGain();
    src.buffer = this.noise();
    bp.type = type || 'bandpass'; bp.Q.value = q || 1;
    bp.frequency.setValueAtTime(f, t0);
    if(f2) bp.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.012, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t0, Math.random() * 0.8); src.stop(t0 + dur + 0.02);
  },
  // The driver: the swoosh of the club coming down, then the crack of the face
  // -- a click of bright noise with a hard metallic ring in it and a thump
  // under it. A pure strike rings higher and louder.
  strike(t, pure){
    this.hiss(t, 0.16, 500, 0.9, 0.05, 2600);                  // the swoosh
    const hit = t + 0.15;
    this.hiss(hit, 0.035, 3800, 0.7, pure ? 0.55 : 0.4);       // the crack
    this.tone(pure ? 2650 : 2300, hit, 0.09, 'sine', pure ? 0.07 : 0.045);
    this.tone(pure ? 4100 : 3700, hit, 0.06, 'sine', 0.03);
    this.tone(160, hit, 0.07, 'sine', 0.12, 70);               // the thump
  },
  // In the cup: the ball drops, knocks against the plastic and rattles round.
  cup(t){
    this.tone(1050, t, 0.07, 'triangle', 0.09, 700);
    this.tone(640, t, 0.09, 'sine', 0.08, 420);
    [0.09, 0.15, 0.19, 0.22].forEach((dt, i) => this.hiss(t + dt, 0.025, 2200 + i * 300, 3, 0.10 / (i + 1)));
  },
  // The gallery: claps, each a short crack of noise at a pitch of its own,
  // thick at the start and thinning out. n people, over len seconds.
  applause(t, n, len, vol){
    for(let i = 0; i < n; i++){
      const u = Math.random(), at = t + Math.pow(u, 1.6) * len;
      const fade = 1 - (at - t) / (len + 0.2);
      this.hiss(at, 0.012 + Math.random() * 0.02, 900 + Math.random() * 1800, 1.4, vol * (0.4 + Math.random() * 0.6) * fade);
    }
  },
  // A cheer: a swell of voices, noise pushed through a band where voices sit.
  cheer(t, len, vol){
    this.hiss(t, len, 520, 2.2, vol, 780);
    this.hiss(t + 0.05, len * 0.9, 900, 3, vol * 0.6, 1200);
  },
  // Birds in the trees, now and then, on a fine day: a quick rising chirp, or
  // two falling ones.
  chirp(t){
    const f = 2800 + Math.random() * 1800;
    if(Math.random() < 0.5) this.tone(f, t, 0.07, 'sine', 0.018, f * 1.35);
    else { this.tone(f * 1.2, t, 0.05, 'sine', 0.016, f); this.tone(f * 1.2, t + 0.09, 0.05, 'sine', 0.014, f * 0.9); }
  },
  tick(dt){
    if(!this.on() || !this.ctx || this.ctx.state !== 'running') return;
    if(S.dgnRun || Scene.night || Scene.rain) return;
    this.birdT = (this.birdT || 3 + Math.random() * 6) - dt;
    if(this.birdT <= 0){
      this.birdT = 4 + Math.random() * 9;
      const t = this.ctx.currentTime + 0.02, k = 1 + (Math.random() * 3 | 0);
      for(let i = 0; i < k; i++) this.chirp(t + i * 0.22);
    }
  },
  notes(list, type, vol, gap){
    const t = this.ctx.currentTime + 0.01;
    list.forEach((f, i) => this.tone(f, t + i * gap, 0.24, type, vol));
  },
  play(k, arg){
    if(!this.on()) return;
    const c = this.init();
    if(!c || c.state !== 'running') return;
    const t = c.currentTime;
    if(k === 'strike'){
      // a fast bag swings several times a second: one strike every 0.2s at most
      if(t - this.lastSwing < 0.2) return;
      this.lastSwing = t;
      this.strike(t, !!arg);
    }else if(k === 'hole'){
      // Holed: the ball in the cup, then the gallery by the score -- polite
      // for a par, warm for a birdie, a roar for an eagle and better.
      const d = arg || 0;
      this.cup(t);
      const a = t + 0.3;
      if(d <= -3){ this.applause(a, 90, 2.6, 0.16); this.cheer(a, 2.0, 0.07); }
      else if(d === -2){ this.applause(a, 60, 2.0, 0.14); this.cheer(a, 1.3, 0.045); }
      else if(d === -1) this.applause(a, 34, 1.5, 0.12);
      else if(d === 0) this.applause(a, 10, 0.8, 0.08);
    }
    else if(k === 'ach')   this.notes([659.25, 783.99, 987.77, 1318.5], 'square', 0.05, 0.08);
    else if(k === 'coin')  this.notes([1318.5, 1760], 'square', 0.045, 0.06);
    else if(k === 'level') this.notes([587.33, 880], 'triangle', 0.11, 0.1);
    else if(k === 'cup'){  this.notes([523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5], 'triangle', 0.14, 0.11);
                           this.applause(t + 0.1, 120, 3.2, 0.15); this.cheer(t + 0.1, 2.6, 0.07); }
    else if(k === 'buy')   this.tone(880, t, 0.06, 'square', 0.045, 1320);
  }
};
function toggleSound(){
  S.sound = S.sound === 0 ? 1 : 0;
  if(S.sound){ Sfx.unlock(); setTimeout(() => Sfx.play('buy'), 60); }
  settingsSheet();
}
function toast(html, cls){
  if(QUIET) return;
  const el = document.createElement('div');
  el.className = 'toast' + (cls ? ' ' + cls : ''); el.innerHTML = html;
  $('toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 2300);
  setTimeout(() => el.remove(), 2700);
  const kids = $('toasts').children;
  while(kids.length > 2) kids[0].remove();
}

function finishHole(D){
  const ratio = S.elapsed / S.parTime;
  const sc = scoreFor(ratio);
  Sfx.play('hole', sc.d);
  const pay = S.purse * (1 - B.SWING_SHARE) * sc.pay * (1 + D.C.pay);
  S.gold += pay; Meter.add(pay);

  const idx = holeInRound(S.hole) - 1;
  S.scores[idx] = { d: sc.d, n: sc.n, par: parOf(S.hole) };
  S.tourScore += sc.d;
  S.totalHoles++;
  if(!S.nine || S.nine.idx !== nineIndex(S.hole)) startNine();
  const N = S.nine;
  N.n++; N.total += sc.d;
  if(sc.d <= -1) N.birdie++;
  if(sc.d <= -2){ N.eagle++; if(parOf(S.hole) === 5) N.par5eagle++; }
  if(sc.d === -4) N.ace++;
  if(sc.d <= -3) N.alb = (N.alb || 0) + 1;
  if(sc.d >= 1) N.bogey++;
  if(sc.d >= 0) N.allUnder = false;
  if(N.n >= 9) resolveNine();
  if(sc.d === -4) S.aces++;
  if(sc.d <= -1) bump('birdie');
  if(sc.d <= -2) bump('eagle');
  if(sc.d >= 4) bump('snow');
  if(sc.d < S.bestScore) S.bestScore = sc.d;
  addXp(B.XP_HOLE * Math.pow(1 + S.tier, B.XP_TIER) * sc.pay * (parOf(S.hole)/4));
  Scene.holed(sc);

  // gear drops: the closing hole always gives one up
  const luck = D.drop;
  if(isClosing(S.hole) && isSunday(S.hole)) grantTickets(B.TICK_SUNDAY, 'Sunday finish');
  if(isClosing(S.hole)){
    const it = dropItem(S.tier, luck + 0.15, isSunday(S.hole) ? 1 : 0);
    bagAdd(it);
    toast('<b>' + B.RARITY[it.rar].n + '</b> ' + it.name);
  }else if(Math.random() < luck){
    const it = dropItem(S.tier, luck, 0);
    bagAdd(it);
    if(it.rar >= 2) toast('<b>' + B.RARITY[it.rar].n + '</b> ' + it.name);
  }

  // auto-climb: five straight eagles means this Tour Card is finished
  // Climbs when the next card is open and your bag would still birdie it.
  // It used to climb on a run of good scores, which on fixed holes put a
  // golfer onto a card four times longer the moment they were ahead.
  S.streak = ratio <= 0.77 ? (S.streak||0) + 1 : 0;
  if(S.autoClimb && S.tier < B.TIER_MAX && cardUnlocked(S.tier + 1)
     && roundRatio(S.tier + 1) <= B.RETIRE_FIT) climb(1, true);

  advanceHole();
  startHole();
  // A round played into opens with a look down its first hole. Only here,
  // where one hole hands over to the next: not on a load, not on a climb.
  if(holeInRound(S.hole) === 1 && S.flyover !== 0 && !QUIET && !OFFLINE && !S.dgnRun) Scene.flyStart();
  renderCard(); renderTour();
}

function advanceHole(){
  const wasClosing = isClosing(S.hole);
  const wasSunday = isSunday(S.hole);
  S.hole++;
  if(holeInRound(S.hole) === 1 || holeInRound(S.hole) === 10) startNine();
  if(wasClosing){
    // A round at albatross pace on your highest card opens the next one at the
    // end of the day: a golfer that far ahead should not have to sit out a
    // whole event, carding albatrosses, to be let up. It was the source of a
    // quarter of all holes being albatross or better.
    const round = S.scores.reduce((t, x) => t + (x ? x.d : 0), 0);
    if(round <= B.ROUND * B.ROUND_OPEN && S.tier >= (S.tierMax || 0) && (S.tierMax || 0) < B.TIER_MAX){
      S.tierMax = (S.tierMax || 0) + 1;
      toast('Tour Card <b>' + roman(S.tierMax) + '</b> unlocked \u00b7 too good for this one');
      grantSov(B.FREE_CARD, 'Tour Card ' + roman(S.tierMax));
    }
    if(wasSunday) endTournament();
    S.scores = [];
  }
}
// This event's rival, made the first time anyone asks during it. Seeded by the
// event, so a reload is the same golfer on the same total. Form is the running
// average of your finished cards; before you have one, the event's target.
function rivalNow(){
  const t = tournamentOf(S.hole);
  if(S.rival && S.rival.t === t) return S.rival;
  const rnd = seeded(hash32(t * 6151 + 29));
  const form = S.form !== undefined ? S.form : eventTarget();
  const f = (1 + (rnd() * 2 - 1) * B.RIVAL_SPREAD) * (1 - B.RIVAL_EASE);
  return S.rival = { t, n: B.RIVALS[hash32(t * 131 + 7) % B.RIVALS.length],
                     total: Math.round(form * f) };
}
// where they stand after the same number of holes you have played
const rivalThru = (R, played) => Math.round(R.total * played / (B.ROUND * B.DAYS));
function endTournament(){
  const t = tournamentOf(S.hole - 1);
  const score = S.tourScore, target = eventTarget();
  // Cups are only up for grabs on your highest card: an easy card is a place
  // to earn, not a place to farm the ladder.
  const onTop = S.tier >= (S.tierMax || 0);
  const beat = score <= target && onTop;
  const share = payShare(score, target);
  const D = derive();
  // An event that resolves during a catch-up is paid at the same discount as
  // the holes that fed it. At full rate these were worth more than four times
  // the hole purse the away summary reported, so most of an offline session's
  // income was arriving off the books.
  const rate = OFFLINE ? B.OFFLINE_RATE * B.OFFLINE_PURSE : 1;
  const cash = purseFor(S.hole - 1, S.tier, D.gold) * B.PLACE_PURSE * share * rate
              * (1 + D.C.place);
  const pts = Math.round(cupPoints(t, share) * rate);
  S.points += pts; S.gold += cash; Meter.add(cash);
  grantTickets(Math.round((B.TICK_EVENT + (beat ? B.TICK_WIN : 0)) * rate), 'event finish');
  if(beat){ S.cups++; Sfx.play('cup'); }
  S.wins = (S.wins || 0) + (beat ? 1 : 0);
  // A catch-up never accumulates a score, so every event it resolves finishes on
  // level par. Posted as a card that reads as a personal best of E on a save
  // that has not yet finished a round in anger.
  if(!OFFLINE && score < (S.bestRound === undefined ? 1e9 : S.bestRound)) S.bestRound = score;

  // The rival. A catch-up posts level par for every event it resolves, so
  // there is no card to hold against them and no form to learn from.
  const Rv = S.rival && S.rival.t === t ? S.rival : null;
  const rivalBeat = !OFFLINE && Rv && score < Rv.total;
  if(!OFFLINE){
    if(rivalBeat){ bump('rivals'); grantSov(B.RIVAL_SOV, null, true); }
    S.form = S.form === undefined ? score : S.form * (1 - B.RIVAL_FORM) + score * B.RIVAL_FORM;
  }

  const fm = n => n === 0 ? 'E' : n > 0 ? '+' + n : String(n);
  showSheet('<h3>' + eventName(t) + '</h3>'
    + '<p>' + (beat ? 'You beat the number.' : 'Card posted.') + '</p>'
    + '<div class="big">' + fm(score) + '</div>'
    + '<ul><li>Target: ' + fm(Math.round(target)) + (beat ? ' \u2014 <b style="color:var(--brass)">beaten</b>'
        : ' \u2014 missed by ' + Math.ceil(score - target)) + '</li>'
    + (Rv && !OFFLINE ? '<li>' + Rv.n + ': ' + fm(Rv.total) + (rivalBeat
        ? ' \u2014 <b style="color:var(--brass)">beaten, +' + B.RIVAL_SOV + sovIc() + '</b>'
        : score === Rv.total ? ' \u2014 tied' : ' \u2014 lost by ' + (score - Rv.total)) + '</li>' : '')
    + '<li>Best card: ' + fm(S.bestRound) + '</li>'
    + '<li>Prize money: ' + fmt(cash) + ' (' + share.toFixed(2) + 'x)</li>'
    + '<li>Cup points: ' + fmt(pts) + '</li>'
    + '<li>Cups held: ' + S.cups + (beat ? ' <b style="color:var(--brass)">(new)</b>' : '')
    + ' \u00b7 next target ' + fm(targetShown()) + '</li></ul>'
    + '<button class="act" onclick="hideSheet()">Next event</button>');

  S.eventsPlayed = (S.eventsPlayed || 0) + 1;
  S.tierEvents[S.tier] = eventsOn(S.tier) + 1;
  // The next card opens after enough events on your highest, or at once when
  // you win its cup: a golfer who is well ahead of the card moves up at the
  // pace of their game, not of the calendar.
  if(S.tier >= (S.tierMax || 0) && (beat || eventsOn(S.tier) >= eventsToUnlock(S.tier))
     && (S.tierMax || 0) < B.TIER_MAX){
    S.tierMax = (S.tierMax || 0) + 1;
    toast('Tour Card <b>' + roman(S.tierMax) + '</b> unlocked');
    grantSov(B.FREE_CARD, 'Tour Card ' + roman(S.tierMax));
  }
  S.tourScore = 0;
}function ordinal(n){
  const s = ['th','st','nd','rd'], v = n % 100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}

/* =========================================================================
   THE TOUR CARD
   ========================================================================= */
const eventsOn = tier => S.tierEvents[tier] || 0;
const cardUnlocked = tier => tier <= (S.tierMax || 0);
// How many events on your highest card open the next one. Five, except on the
// first three cards: measured over three fresh careers, the first new card
// took 47-49 minutes to open and the one after that another 38, which is a
// long time to look at "0 of 5" in a player's first sitting. 2, 3 and 4 open
// them at 21-24, 45-50 and 74-82 minutes over the same three careers, with
// cups won and events played unchanged. From the fourth card on it is 5. A
// card is fixed once you are on it -- this is only the door.
const eventsToUnlock = tier => [2, 3, 4][tier] || B.EVENTS_PER_CARD;
const eventsToNext = () => Math.max(0, eventsToUnlock(S.tierMax || 0) - eventsOn(S.tierMax || 0));
// What this hole would take, as a share of par time, if it were on `tier`.
//
// Two things were wrong with it. chaosFor hashes on the tier, so asking about
// the next card drew the next card's weather and compared it against this
// one's -- a purse and yardage swing of its own, mixed into an answer that is
// supposed to be about the card. wx pins both sides to the weather overhead.
//
// The same, averaged over the eighteen holes of a round in still air: one hole
// carries its own par, close and Sunday, and auto-climb judged a card off hole
// two alone, then met closing holes 2.2x as long up there. And in still air,
// because the weather is drawn afresh every round and moves a round's average
// from 0.14 to 1.72 of par on the same card: judged in a calm round, a golfer
// climbed and then carded pars and bogeys for forty minutes of ordinary
// weather. One derive, eighteen yardages, cheap enough for every hole.
const STILL = { y:1, g:1, s:1, c:0, p:0, dl:0 };
function roundRatio(tier){
  const D = derive(), dps = Math.max(1e-9, D.dps), base = S.hole - holeInRound(S.hole) + 1;
  let sum = 0;
  for(let i = 0; i < B.ROUND; i++){
    const h = base + i;
    sum += yardageFor(h, tier, STILL) / dps / parTimeFor(h);
  }
  return sum / B.ROUND;
}
function projectedRatio(tier, wx){
  const D = derive();
  const ch = chaosFor(S.hole, wx === undefined ? tier : wx);
  const y = yardageFor(S.hole, tier, ch);
  return (y / Math.max(1e-9, D.dps)) / parTimeFor(S.hole);
}
function climb(n, quiet, force){
  let to = clamp(S.tier + n, 0, B.TIER_MAX);
  if(!force && to > (S.tierMax || 0)){
    if(!quiet) toast('Tour Card ' + roman((S.tierMax||0) + 1) + ' needs '
      + eventsToNext() + '\u00a0more event' + (eventsToNext() === 1 ? '' : 's'));
    return;
  }
  if(to === S.tier) return;
  S.tier = to;
  if(S.tier > S.bestTier) S.bestTier = S.tier;
  if(!quiet) toast('Tour Card <b>' + roman(S.tier) + '</b>');
  else toast('Card <b>' + roman(S.tier) + '</b> earned on form');
  startHole(); renderTour(); renderVitals();
}

/* =========================================================================
   THE PRO SHOP
   Nothing here is charged. Every pack grants on the press: there is no card
   entry, no receipt and no payment path, and the shop says so at the top of
   itself rather than in a comment nobody reads.
   ========================================================================= */
const permLv  = id => clamp(Math.round(S.perm && S.perm[id] || 0), 0, B.PERM_MAX);
const permDef = id => B.PERM.find(u => u.id === id);
// Flat lines add v a level; the two multiplying lines compound, so they read
// the way the trophy room reads rather than the way the Range reads.
const permAdd  = id => { const u = permDef(id); return u ? u.v * permLv(id) : 0; };
const permMult = id => { const u = permDef(id); return u ? Math.pow(u.v, permLv(id)) : 1; };
// The last PERM_SOFT levels stop compounding: each is PERM_EASE of the price
// before them more, not r times it. Compounding all ten, Signature Irons ran
// 5.1K, 7.7K and 11.5K sovereigns for its last three -- $50 to $120 of packs
// for 5% swing power each.
const permCost = u => {
  const lv = permLv(u.id), soft = B.PERM_MAX - B.PERM_SOFT;
  if(lv < soft) return Math.round(u.base * Math.pow(u.r, lv));
  return Math.round(u.base * Math.pow(u.r, soft - 1) * (1 + B.PERM_EASE * (lv - soft + 1)));
};
// Read in three places, so it is a function and not a constant plus two bugs.
const bagCap = () => B.BAG_CAP + permAdd('locker');
// A member holds one more entry for every wager in the book.
const entryCap = d => d.cap + (isMember() ? B.MEMBER_KEYS : 0);
// What the Tour Van takes off a Range price.
const vanOff = () => 1 - Math.min(0.60, permAdd('van'));
const isMember = () => !!S.member;
// Sovereign counts top out in the tens of thousands and are a price you are
// comparing against another price, so they are written out in full rather
// than run through the K/M shortener the purse uses.
const sovFmt = n => Math.round(n || 0).toLocaleString('en-US');
const sovIc = () => '<img class="tsov" src="' + pixUrl('sov2', '#E3B457') + '" alt="' + B.SOV + '">';
const boostOn  = () => (S.boostT || 0) > 0;
const freeReady = () => (S.freeT || 0) >= B.FREE_EVERY;

function grantSov(n, why, quiet){
  n = Math.round(n);
  if(n <= 0) return;
  S.sov = (S.sov || 0) + n;
  if(!quiet) toast('+' + sovFmt(n) + ' ' + B.SOV + (why ? ' \u00b7 ' + why : ''));
  renderVitals();
}
function spendSov(n){
  if((S.sov || 0) < n){ toast('Not enough ' + B.SOV.toLowerCase()); return false; }
  S.sov -= n; S.sovSpent = (S.sovSpent || 0) + n;
  return true;
}

// A pack. In a shipping build this is where the store call would go; here the
// press IS the purchase, which is the whole of the difference.
function buyPack(pk){
  S.packsTaken[pk.id] = (S.packsTaken[pk.id] || 0) + 1;
  grantSov(pk.c, pk.n + ' \u00b7 nothing charged');
  renderShop();
}

// A bag of clubs. The floor is what the worst one can be and top what the best
// one is guaranteed to reach, so a bag is never a bag of nothing.
function openBag(bg, free){
  if(!free && !spendSov(bg.c)) return;
  S.bagsOpened = (S.bagsOpened || 0) + 1;
  S.pity = (S.pity || 0) + 1;
  const D = derive();
  const top = B.RARITY.length - 1;
  const duePity = S.pity >= B.BAG_PITY;
  const got = [];
  for(let i = 0; i < bg.num; i++){
    // the last club in the bag is the one carrying the guarantee
    const last = i === bg.num - 1;
    let floor = bg.floor;
    if(last) floor = Math.max(floor, duePity ? top : bg.top);
    const it = makeItem(S.tier + B.BAG_ILVL, D.drop + 0.5, floor);
    if(it.rar >= top) S.pity = 0;
    bagAdd(it);
    got.push(it);
  }
  got.sort((a, b) => b.rar - a.rar || itemScore(b) - itemScore(a));
  const line = it => '<li><span style="color:' + RC(it.rar) + '">'
    + B.RARITY[it.rar].n + '</span> \u00b7 ' + it.name + '</li>';
  showSheet('<h3>' + bg.n + '</h3>'
    + '<p>' + bg.num + ' clubs, straight into the locker.</p>'
    + '<ul>' + got.map(line).join('') + '</ul>'
    + (S.pity === 0 ? '<p style="color:var(--r5)">A Mythic. The counter resets.</p>'
       : '<p>' + (B.BAG_PITY - S.pity) + '\u00a0more bags and the next one is a guaranteed Mythic.</p>')
    + '<button class="act" onclick="hideSheet();openShop(\'bags\')">Back to the shop</button>'
    + '<button class="act ghost" onclick="hideSheet()">Done</button>');
  renderBag(); renderVitals();
}

function buyPerm(u){
  if(permLv(u.id) >= B.PERM_MAX){ toast(u.n + ' is at ten'); return; }
  if(!spendSov(permCost(u))) return;
  S.perm[u.id] = permLv(u.id) + 1;
  toast('<b>' + u.n + '</b> \u00b7 level ' + S.perm[u.id]);
  renderShop(); renderVitals(); renderAll();
}

function buyStarter(){

  S.starter = 1;

  S.boostT = Math.max(S.boostT || 0, B.BOOST_HOURS * 3600);
  renderShop();
}
function buyMember(){
  if(isMember()){ toast('You are already a member'); return; }
  S.member = 1; S.memberT = 0;
  grantSov(B.MEMBER_DAILY, 'first day of membership');
  toast('<b>Club Membership</b> active');

}
function claimFree(){
  if(!freeReady()){ toast('Not ready yet'); return; }
  S.freeT = 0;
  grantSov(B.FREE_GIFT, 'for turning up');
  renderShop();
}
function buyBoost(){
  if(!spendSov(B.BOOST_C)) return;
  S.boostT = (S.boostT || 0) + B.BOOST_HOURS * 3600;
  toast('<b>Double Purse</b> \u00b7 ' + hms(S.boostT));
  renderShop(); renderVitals();
}

// Membership pays a daily allowance and the boost burns down, both on the same
// clock the rest of the game runs on.
function tickShop(dt){
  if(!freeReady()) S.freeT = (S.freeT || 0) + dt;
  if(S.boostT > 0){
    S.boostT -= dt;
    if(S.boostT <= 0){ S.boostT = 0; toast('Double Purse has run out'); }
  }
  if(!isMember()) return;
  S.memberT = (S.memberT || 0) + dt;
  while(S.memberT >= 86400){
    S.memberT -= 86400;
    grantSov(B.MEMBER_DAILY, 'members\u2019 allowance');
  }
}

  return !!d && (d.cost === 0 || !!(S.styleOwn && S.styleOwn[k + ':' + id])); };

const outfitNow = () => previewOf('o') || styleDef('o', S.outfit) || B.OUTFITS[0];
const trailNow  = () => previewOf('t') || styleDef('t', S.trail) || B.TRAILS[0];

// The shop's picture of an outfit: its cap over its shirt, on the same 12x12

const OUTFIT_ICON = ['...cccc.....',

const SKIN_ACCENT = { divine:['#FFD66B', '#FFFFFF'], inferno:['#FFB43A', '#F0612A'], frostborn:['#FFFFFF', '#9FD6F2'],
  stormcaller:['#8FD0FF', '#FFFFFF'], void:['#C68BFF', '#6E44A0'], glitch:['#FF2A6D', '#2AE0FF'],
  midas:['#FFFFFF', '#FFD86B'], disco:['#FF4FB8', '#3FE0FF'], ghost:['#EEF2FF', '#A5B0D6'] };
function outfitUrl(o){

  if(DOMSPR[key] !== undefined) return DOMSPR[key];
  try{
    const sp = patterned(makeSprite(OUTFIT_ICON, golferMap(o)), o);
    const acc = SKIN_ACCENT[o.fx];

      [[0, 3], [11, 3], [10, 0], [1, 0], [0, 9], [11, 9], [1, 11], [10, 11]].forEach(([x, y], i) => {

// and of a trail: a ball arcing up out of the bottom left, its trail behind it
function trailUrl(t){
  const key = 'trail|' + t.id;
  if(DOMSPR[key] !== undefined) return DOMSPR[key];
  if(BALL_ICON[t.fx]){
    try{ return DOMSPR[key] = makeSprite(BALL_ICON[t.fx].rows, BALL_ICON[t.fx].map).cv.toDataURL(); }
    catch(e){ return DOMSPR[key] = ''; }
  }
  // A ribbon two pixels thick, or one band per colour stacked like the trail
  // itself. It was a one-pixel dotted line, as hard to see as the trail was.
  try{
    const cv = document.createElement('canvas'); cv.width = cv.height = 12;
    const g = cv.getContext('2d'), n = t.cols.length;
    if(n > 2){
      const path = [[0,7],[1,6],[2,6],[3,5],[4,5],[5,4],[6,4],[7,3],[8,3]];
      path.forEach(([x, y]) => t.cols.forEach((col, k) => { g.fillStyle = col; g.fillRect(x, y + k, 1, 1); }));
      g.fillStyle = '#F4F6EF'; g.fillRect(9, 4, 2, 2);
    }else{
      const path = [[0,10],[1,9],[2,8],[3,7],[4,6],[5,5],[6,4],[7,4],[8,3]];
      path.forEach(([x, y]) => { g.fillStyle = t.cols[0]; g.fillRect(x, y, 2, 2); });
      g.fillStyle = '#F4F6EF'; g.fillRect(9, 2, 2, 2);
    }
    return DOMSPR[key] = cv.toDataURL();
  }catch(e){ return DOMSPR[key] = ''; }
}

            : sovFmt(B.STARTER_C) + ' ' + B.SOV.toLowerCase() + ', a Tour Bag, a day of '

      + shopCard({ ic:'member', col:'#E3B457', on: !isMember(), badge: isMember() ? 'MEMBER' : '',
          head:'Club Membership',

              + ' entry, ' + B.MEMBER_DAILY + ' a day.<br><b>Next in ' + hms(86400 - (S.memberT||0)) + '</b>'
            : '+' + Math.round(B.MEMBER_GOLD*100) + '% purse, +' + B.MEMBER_KEYS
              + ' wager entry, ' + B.MEMBER_DAILY + ' a day. For good.',
          price: isMember() ? 'ACTIVE' : '$' + B.MEMBER_USD.toFixed(2),
          note: isMember() ? 'joined' : 'free', cls: isMember() ? 'max' : '', act:'member:1' })
      + '</div>'

            : 'Everything doubled for ' + B.BOOST_HOURS + ' hours.',

      + shopCard({ ic:'freegift', col:'#7ADB86', head:'Free ' + B.SOV,
          sub:'A handful every ' + Math.round(B.FREE_EVERY/3600) + ' hours.',
          price: freeReady() ? 'CLAIM' : hms(B.FREE_EVERY - (S.freeT || 0)),
          note: freeReady() ? '+' + B.FREE_GIFT : 'wait',
          cls: freeReady() ? '' : 'no', act:'free:1' })
      + '</div>'
      + '<div class="shopnote" style="margin-top:10px">Spent so far: ' + sovFmt(S.sovSpent)
      + ' ' + B.SOV.toLowerCase() + '.</div>';

  h += '<button class="act ghost" onclick="hideSheet()">Back to the round</button>';
  showSheet(h);

  const sheet = $('sheet');
  sheet.querySelectorAll('.shopnav button').forEach(b =>
    b.onclick = () => { shopSub = b.dataset.sub; renderShop(); });
  sheet.querySelectorAll('.try[data-try]').forEach(b => {

  sheet.querySelectorAll('.price[data-do]').forEach(b => {

    b.onclick = () => {

      else if(kind === 'bag') openBag(B.BAGS.find(x => x.id === id));
      else if(kind === 'perm') buyPerm(B.PERM.find(x => x.id === id));
      else if(kind === 'starter') buyStarter();
      else if(kind === 'member') buyMember();
      else if(kind === 'boost') buyBoost();

      else if(kind === 'style'){ const [k, sid] = id.split('.'); styleBuy(k, sid); }
