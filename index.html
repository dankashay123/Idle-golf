/* ---- pixel-perfect icons from the existing vector library ----
   The paths are rasterised once at a small size and their alpha thresholded to
   fully on or fully off, which turns a smooth vector glyph into a real pixel
   sprite instead of a blurry miniature. */
const P2D = {}, ICO = {};
function iconPaths(id){
  if(P2D[id]) return P2D[id];
  const ic = B.ICON[id] || {};
  return P2D[id] = { f:(ic.f||[]).map(d => new Path2D(d)), s:(ic.s||[]).map(d => new Path2D(d)) };
}
function pixIcon(id, size, col){
  const key = id + ':' + size + ':' + col;
  if(ICO[key]) return ICO[key];
  const o = document.createElement('canvas');
  o.width = size; o.height = size;
  const g = o.getContext('2d');
  const p = iconPaths(id), k = size / 24;
  g.save(); g.scale(k, k);
  g.fillStyle = '#fff'; g.strokeStyle = '#fff';
  g.lineWidth = 2.4; g.lineCap = 'round'; g.lineJoin = 'round';
  for(const q of p.f) g.fill(q, 'evenodd');
  for(const q of p.s) g.stroke(q);
  g.restore();
  try{
    const im = g.getImageData(0, 0, size, size);
    const d = im.data;
    for(let i = 0; i < d.length; i += 4) d[i+3] = d[i+3] > 108 ? 255 : 0;
    g.putImageData(im, 0, 0);
  }catch(e){}
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = col;
  g.fillRect(0, 0, size, size);
  return ICO[key] = { cv:o, w:size, h:size };
}

/* ---- viewport ----
   VW is the buffer width in real pixels, so the sprite and lateral scales are
   tied to it; only the vertical terms follow height. A taller stage buys more
   sky and more foreground, never a bigger golfer. */
// Each art pixel should measure about this many CSS pixels. Sizing the buffer
// against DEVICE pixels instead lands one art pixel on one CSS pixel, which is
// not pixel art at all, just a small picture. 2.2 is the point where a 5x7
// font is still legible on a phone and a diagonal still reads as a staircase.
const PX_CSS = 1.1, K_PROJ = 22.4, LEN = 60, B_GOLFER = 12;
// How far behind the golfer the camera sits, in world units. Small numbers put
// you over his shoulder with the hole falling away hard; large numbers flatten
// it into a diagram. GROUND is derived from it below, so his feet stay put.
const CAM_BACK = 3.2;
// The camera sits ON the line of play, so the centre of the fairway projects to
// a vertical line down the middle of the frame and the hole runs dead away from
// you. Offset laterally the centreline sweeps sideways as it comes toward the
// camera, which reads as standing off to one side of the hole squinting across
// it rather than playing down it.
const CAM_LAT = 0;
// Where the golfer's feet sit, as a fraction of frame height. Everything about
// the camera is solved back from this so the two cannot drift apart.
const FEET_AT = 0.86, HORIZON_AT = 0.40;
// Half-width of the lane the golfer walks, in world lateral units. He is about
// 0.6 wide, so this leaves him clearance on both sides.
const B_LANE = 0.85;
// A golf ball is about 1:42 against a golfer. It was drawn at 3.08 world units
// against his 12, which is nearer 1:4 - a beach ball.
const B_BALL = 0.9;
// A flagstick is seven feet against a six foot golfer. Drawn at 34 against his
// 12 it came out nearly three times his height, which is only ever obvious once
// you walk up on it: at the far end of the hole the scale factor hides it, and
// on the approach the pin filled half the frame.
const B_FLAG = 14;
let VW = 344, VH = 200, HORIZON = 80, CX = 172, GROUND = 36, LAT = 8.8, US = 0.63;
// Stage text is authored on a 5x7 grid, so its size is set in whole buffer
// pixels. Raising the buffer resolution therefore HALVES how big a line of HUD
// text looks, which is the one thing that gets worse when you add detail. TSC
// tracks the buffer so a caption keeps the same apparent size on the glass
// however finely the world behind it is drawn.
let TSC = 1, LH = 8;
function setViewport(bw, bh){
  VW = bw; VH = bh; CX = Math.round(bw / 2);
  const k = VW / 344;
  US = 0.63 * k;
  LAT = 8.8 * k;
  HORIZON = Math.round(VH * HORIZON_AT);
  // Solved, not tuned by hand. The golfer stands at rel = CAM_BACK, so his
  // scale is K_PROJ/CAM_BACK, and his feet land at HORIZON + GROUND*scale.
  // Pinning that to FEET_AT gives GROUND directly, which means CAM_BACK can be
  // moved to taste and the framing follows it instead of sliding off the bottom.
  GROUND = VH * (FEET_AT - HORIZON_AT) * CAM_BACK / K_PROJ;
  // Tuned so one character advance stays a constant fraction of frame width.
  // The divisor tracks the font's own advance, so it has to move with it: the
  // 6x9 set steps eight buffer pixels a character where the 5x7 stepped six.
  TSC = clamp(Math.round(VW / 300), 1, 4);
  LH = (FH + 2) * TSC;
}

const Scene = {
  cv:null, ctx:null, buf:null, b:null, scale:3,
  camD:0, dCam:0, hole:1, tier:0, t:0,
  trees:[], bunkers:[], water:null, hills:[], seed:1,
  swingT:0, swingDur:0.42, balls:[], nums:[], sparks:[], casts:[], banner:null,
  night:false, aurora:false, rain:false, wind:0,
  motes:[], flash:0, flashCol:'#fff', sky:null, pendingBall:null,

  init(){
    this.cv = $('hole');
    this.ctx = this.cv.getContext('2d');
    buildSprites();
    this.resize();
    window.addEventListener('resize', () => this.resize());
    window.addEventListener('orientationchange', () => setTimeout(() => this.resize(), 120));
    if(window.ResizeObserver){
      let last = 0;
      new ResizeObserver(() => {
        const k = this.cv.clientWidth * 10000 + this.cv.clientHeight;
        if(k !== last){ last = k; this.resize(); }
      }).observe(this.cv);
    }
  },
  resize(){
    const w = this.cv.clientWidth || 360;
    const h = this.cv.clientHeight || Math.round(w * 0.58);
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    const dw = Math.max(120, Math.round(w * dpr)), dh = Math.max(80, Math.round(h * dpr));
    // integer upscale only: fractional scaling makes some pixels wider than
    // others, which is the fastest way to make pixel art look cheap
    const sc = clamp(Math.round(dpr * PX_CSS), 2, 8);
    const bw = Math.ceil(dw / sc), bh = Math.ceil(dh / sc);
    this.cv.width = dw; this.cv.height = dh;
    this.scale = sc;
    if(!this.buf) this.buf = document.createElement('canvas');
    this.buf.width = bw; this.buf.height = bh;
    this.b = this.buf.getContext('2d');
    this.b.imageSmoothingEnabled = false;
    this.ctx.imageSmoothingEnabled = false;
    this.ctx.imageSmoothingQuality = 'low';
    setViewport(bw, bh);
    this.buildSky();
  },

  // World-space overlap test. Hazards were placed by pure rejection-free random
  // draw, so bunkers sat inside water and trees grew out of both.
  hitsHazard(d, x, pad){
    pad = pad || 0;
    if(this.water){
      const w = this.water;
      if(Math.abs(d - w.d) < w.rd + pad && Math.abs(x - w.x) < w.rx + pad) return true;
    }
    for(const b of this.bunkers)
      if(Math.abs(d - b.d) < b.rd + pad && Math.abs(x - b.x) < b.rx + pad) return true;
    return false;
  },
  onPlay(d, x, pad){          // on the fairway or the green
    if(Math.abs(x) < this.fwWidth(d) + (pad || 0)) return true;
    if(Math.abs(d - LEN) < 8 && Math.abs(x) < 2.6 + (pad || 0)) return true;
    return false;
  },
  // Hazards laid down one at a time, each rejected if it lands on one already
  // placed. Water goes first because it is the biggest.
  layHazards(rnd, cfg){
    this.water = null; this.bunkers = [];
    if(cfg.water){
      for(let a = 0; a < 20; a++){
        const w = { d: cfg.wd(rnd), x: cfg.wx(rnd), rd: cfg.wrd(rnd), rx: cfg.wrx(rnd),
                    shape: this.blob(rnd, .24), shape2: this.blob(rnd, .24) };
        if(Math.abs(w.x) - w.rx < B_LANE) continue;     // keep it off the lane he walks
        this.water = w; break;
      }
    }
    for(let i = 0; i < cfg.nb; i++){
      for(let a = 0; a < 24; a++){
        const b = { d: cfg.bd(rnd), x: cfg.bx(rnd), rd: cfg.brd(rnd), rx: cfg.brx(rnd),
                    shape: this.blob(rnd, .26), shape2: this.blob(rnd, .26) };
        // Bunkers only checked each other before, so one could sit straight on
        // the middle of the hole and he would walk through it every time.
        if(Math.abs(b.x) - b.rx < B_LANE) continue;
        if(this.hitsHazard(b.d, b.x, Math.max(b.rd, b.rx)*0.65)) continue;
        this.bunkers.push(b); break;
      }
    }
  },
  // Trees and spectators go where nothing else is: off the short grass, clear
  // of every hazard, and clear of each other.
  layProps(rnd, cfg){
    const put = [];
    const clash = (d, x, r) => put.some(p => Math.abs(p.d - d) < r && Math.abs(p.x - x) < r);
    const nTree = Math.round(cfg.trees);
    for(let i = 0; i < nTree; i++){
      for(let a = 0; a < 18; a++){
        const d = rnd()*LEN*1.2, x = (rnd() < .5 ? -1 : 1) * (3.9 + rnd()*3.4);
        if(this.hitsHazard(d, x, 0.7) || this.onPlay(d, x, 0.5) || clash(d, x, 1.6)) continue;
        put.push({ kind:0, d, x, s:.78 + rnd()*.55,
                   k: cfg.kind === 2 ? (rnd() < .42 ? 1 : 0) : cfg.kind });
        break;
      }
    }
    // gallery down both sides, just off the fairway, inside the treeline
    const nSide = Math.round(cfg.crowd);
    for(let i = 0; i < nSide; i++){
      for(let a = 0; a < 20; a++){
        const d = rnd()*LEN*0.98;
        const side = rnd() < .5 ? -1 : 1;
        const x = side * (this.fwWidth(d) + 0.35 + rnd()*1.5);
        if(Math.abs(x) > 6.6) continue;
        if(this.hitsHazard(d, x, 0.45) || this.onPlay(d, x, 0.18) || clash(d, x, 0.9)) continue;
        put.push({ kind:1, d, x, c: Math.floor(rnd()*6), p: rnd()*6.28 });
        break;
      }
    }
    // and a bank of them behind the green
    const nBack = Math.round(cfg.crowd*0.55);
    for(let i = 0; i < nBack; i++){
      for(let a = 0; a < 20; a++){
        const d = LEN + 8.5 + rnd()*9, x = (rnd()*2 - 1) * 4.6;
        if(this.hitsHazard(d, x, 0.45) || clash(d, x, 0.85)) continue;
        put.push({ kind:1, d, x, c: Math.floor(rnd()*6), p: rnd()*6.28 });
        break;
      }
    }
    put.sort((a, b) => b.d - a.d);
    this.props = put;
  },

  // A closed outline, smoothed so neighbouring control points cannot differ
  // enough to show as a facet once shapeAt runs between them.
  blob(rnd, amp){
    const n = 22, raw = [];
    for(let i = 0; i < n; i++) raw.push(1 + (rnd()*2 - 1)*amp);
    const out = [];
    for(let i = 0; i < n; i++)
      out.push((raw[(i-1+n)%n] + raw[i]*2 + raw[(i+1)%n]) / 4);
    out[n-1] = out[n-1]*0.5 + out[0]*0.5;
    return out;
  },
  hAt(){ return 0; },
  holeLen(){ return LEN; },
  proj(d, lat, lift){
    if(!isFinite(this.camD)) this.camD = 0;
    const rel = Math.max(0.6, d - this.camD + CAM_BACK);
    const s = K_PROJ / rel;
    return { x: Math.round(CX + (lat - CAM_LAT) * LAT * s),
             y: Math.round(HORIZON + GROUND*s - (lift||0) * LAT * s * 0.55),
             s };
  },

  newHole(h, tier){
    this.hole = h; this.tier = tier;
    const rnd = seeded(h*7919 + tier*104729);
    this.seed = rnd() * 1000;
    const ch = S.chaos ? S.chaos.n : 'Fair';
    this.night  = /Night/.test(ch);
    this.aurora = /Aurora|Ley|Mythic/.test(ch);
    this.rain   = /Crosswind|Marshal/.test(ch);
    this.wind   = (rnd()*2 - 1) * 0.7;
    const cs = courseFor(tournamentOf(h));
    const mode = this.night ? 'night' : this.rain ? 'rain' : 'day';
    this.course = cs;
    this.land = cs.land;
    this.themeId = cs.id + '|' + mode;
    this.theme = buildTheme(cs, mode);
    this.treeSpr = courseTrees(cs, mode);

    const L = cs.land;
    this.layHazards(rnd, {
      water: rnd() < L.water,
      wd: r => LEN*0.26 + r()*LEN*0.48, wx: r => (r()<.5?-1:1)*(2.6 + r()*1.3),
      wrd: r => (LEN*0.09 + r()*LEN*0.10) * L.wsize, wrx: r => (1.0 + r()*0.8) * L.wsize,
      nb: Math.max(1, Math.round(L.nb * (0.7 + rnd()*0.6))),
      bd: r => LEN*0.18 + r()*LEN*0.74, bx: r => (r()<.5?-1:1)*(1.6 + r()*1.6),
      brd: r => (LEN*0.035 + r()*LEN*0.045) * L.bsize, brx: r => (.5 + r()*.55) * L.bsize
    });
    this.layProps(rnd, { trees: (30 + rnd()*14) * L.trees, kind: L.kind,
                         crowd: (26 + rnd()*14) * L.crowd });

    this.hills = [[], []];
    for(let L = 0; L < 2; L++)
      for(let i = 0; i <= 40; i++) this.hills[L].push(rnd());

    this.camD = 0;
    this.balls.length = 0; this.nums.length = 0; this.sparks.length = 0;
    this.buildSky();
  },

  // A floor of the Depths is a hole. Same renderer, same camera, same walk to
  // the flag; only the ground you are walking on changes. An abstract shaft
  // was never going to read as golf, because it was not golf.
  newDepthsHole(R){
    const dg = R.id;
    this.themeId = dg;
    this.theme = THEMES[dg] || THEMES.day;
    this.treeSpr = null;
    this.land = { fw: dg === 'water' ? 1.55 : dg === 'sand' ? 2.30 : dg === 'cellar' ? 2.60 : 3.10,
                  taper: 0.85 };
    this.night = dg === 'cellar';
    this.aurora = false;
    this.rain = false;
    const rnd = seeded(hash32(R.floor*7919 + dg.length*104729 + 13));
    this.seed = rnd() * 1000;
    this.hole = R.floor + 1;

    this.layHazards(rnd, {
      water: dg === 'water' || (dg === 'cellar' && rnd() < .5),
      wd: r => dg === 'water' ? LEN*0.50 : LEN*0.3 + r()*LEN*0.4,
      wx: r => (r()<.5?-1:1)*(dg === 'water' ? 2.9 : 2.6),
      wrd: r => dg === 'water' ? LEN*0.40 : LEN*0.12,
      wrx: r => dg === 'water' ? 2.0 : 1.1,
      nb: dg === 'sand' ? 6 + Math.floor(rnd()*3) : dg === 'vault' ? 1 + Math.floor(rnd()*2)
          : 2 + Math.floor(rnd()*2),
      bd: r => LEN*0.12 + r()*LEN*0.82,
      bx: r => (r()<.5?-1:1)*(1.4 + r()*(dg === 'sand' ? 2.2 : 1.6)),
      brd: r => LEN*(dg === 'sand' ? 0.055 : 0.035) + r()*LEN*0.045,
      brx: r => (dg === 'sand' ? 0.8 : 0.5) + r()*0.55
    });
    // The Island Green earns the name: a moat centred on the green itself,
    // wide enough that the fairway runs out and the putting surface sits alone
    // in the middle of it.
    if(R.mode === 'island')
      this.water = { d: LEN, x: 0, rd: LEN*0.26, rx: 5.6, shape: this.blob(rnd, 0.16) };
    this.layProps(rnd, { trees: (30 + rnd()*12) * this.theme.trees,
                         kind: this.theme.kind, crowd: dg === 'vault' ? 18 : 6 });

    this.hills = [[], []];
    for(let L = 0; L < 2; L++) for(let i = 0; i <= 40; i++) this.hills[L].push(rnd());
    this.camD = 0;
    this.balls.length = 0; this.nums.length = 0; this.sparks.length = 0;
    this.buildSky();
  },

  /* ---- sky: dithered bands, never a gradient ---- */
  buildSky(){
    // Dithering a sky is thousands of single-pixel writes. It only depends on
    // the conditions and the frame size, so it is cached against those and not
    // rebuilt for every hole, which at a high Tour Card is several a second.
    const key = [this.themeId, this.night, this.aurora, this.rain, VW, HORIZON].join('|');
    if(key === this.skyKey && this.sky) return;
    this.skyKey = key;
    const H = Math.max(2, HORIZON + 2);
    const c = document.createElement('canvas');
    c.width = Math.max(2, VW); c.height = H;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    const ramp = (this.theme || THEMES.day).sky;
    smoothRamp(g, 0, 0, VW, H, ramp);

    const rnd = seeded(hash32(key.length*7919 + VW*31 + (this.night?3:0) + (this.aurora?7:0)));
    if(this.night){
      for(let i = 0; i < 60; i++){
        const x = Math.floor(rnd()*VW), y = Math.floor(rnd()*H*0.85);
        g.fillStyle = rnd() < .3 ? '#8FA6C4' : '#DDE6F2';
        g.fillRect(x, y, 1, 1);
      }
      const mx = Math.floor(VW*0.78), my = Math.floor(H*0.24), mr = Math.max(4, Math.round(VW*0.030));
      pxCircle(g, mx, my, mr, '#EEF2E2');
      pxCircle(g, mx + Math.round(mr*0.5), my - Math.round(mr*0.3), mr, ramp[1]);
      pxCircle(g, mx - Math.round(mr*0.35), my + Math.round(mr*0.25), 1, '#C9D2C0');
    }
    if(this.aurora){
      // Two thin ribbons with a bright core and a short dithered falloff.
      // The previous version drew three seven-pixel bands of heavy dither
      // across a sky only seventy pixels tall, which filled it with noise.
      for(let i = 0; i < 2; i++){
        const base = Math.round(H*(0.20 + i*0.17));
        const col = i ? PX.myth : PX.aur;
        for(let x = 0; x < VW; x++){
          const yy = Math.round(base + Math.sin(x*0.045 + i*2.2)*H*0.055);
          g.fillStyle = col;
          g.globalAlpha = 0.55;
          g.fillRect(x, yy, 1, 1);
          g.globalAlpha = 0.22;
          for(let k = 1; k <= 3; k++)
            if(BAYER[(yy+k) & 3][x & 3] < 6 - k) g.fillRect(x, yy + k, 1, 1);
          g.globalAlpha = 1;
        }
      }
    }
    if(!this.night && !this.rain){
      // Opaque, in three flat tones. Stacked translucent circles darkened
      // wherever two overlapped, so a cloud read as a clump of discs rather
      // than one body, and whatever was behind it showed through every seam.
      const body = lite(ramp[0], 0.80), lit = lite(ramp[0], 0.96),
            shade = lite(ramp[0], 0.56);
      for(let i = 0; i < 5; i++){
        const cx = Math.floor(rnd()*VW), cy = Math.floor(H*0.12 + rnd()*H*0.38);
        const w = Math.round(VW*(0.10 + rnd()*0.11));
        const lobes = [];
        const n = 4 + Math.floor(rnd()*3);
        for(let k = 0; k < n; k++){
          const t = n === 1 ? 0.5 : k/(n-1);
          // fattest in the middle, tapering to each end, and a flat base
          const hump = Math.sin(t*Math.PI);
          lobes.push({ ox: Math.round((t - 0.5)*w*1.5),
                       oy: -Math.round(hump*w*0.16) + Math.round((rnd()-0.5)*2),
                       r: Math.max(2, Math.round(w*(0.17 + hump*0.20))) });
        }
        // shadowed underside first, then the body lifted off it, then a rim
        for(const L of lobes) pxCircle(g, cx + L.ox, cy + L.oy + Math.max(1, w*0.05|0), L.r, shade);
        for(const L of lobes) pxCircle(g, cx + L.ox, cy + L.oy, L.r, body);
        for(const L of lobes)
          if(L.r > 3) pxCircle(g, cx + L.ox, cy + L.oy - Math.max(1, L.r*0.30|0),
                               Math.max(2, Math.round(L.r*0.62)), lit);
      }
    }
    this.sky = c;
  },

  /* ---- events from the sim ---- */
  swing(dmg, crit, el){
    // A visual swing takes swingDur to play, and launch() only fires as it
    // crosses its halfway point. Restarting it before then means that crossing
    // never happens, so past about five swings a second the ball, the damage
    // number and the crit spark all stopped appearing while the sim carried on
    // hitting. Above that rate the eye cannot follow individual swings anyway.
    if(this.swingT > this.swingDur*0.5) return;
    this.swingT = this.swingDur; this.pendingBall = { crit, el, dmg };
  },
  // A shot at something in particular: the pin, or the water beside it.
  aimed(dmg, el, targetD, lat, crit){
    this.swingT = this.swingDur;
    this.pendingBall = { crit, el, dmg, target:targetD, lat };
  },
  launch(){
    const p = this.pendingBall || { crit:false, el:null, dmg:0 };
    this.pendingBall = null;
    this.balls.push({ d0:this.camD,
                      // an aimed shot flies to the point it was aimed at
                      dist: p.target !== undefined ? Math.max(3, p.target - this.camD)
                                                   : 14 + Math.random()*9,
                      t:0, dur:.55 + Math.random()*.14, el:p.el, crit:p.crit,
                      lat: p.lat !== undefined ? p.lat : -0.15 + (Math.random()-.5)*0.30 });
    if(this.nums.length < 12 && p.dmg > 0)
      this.nums.push({ t:0, v:p.dmg, crit:p.crit, x:(Math.random()-.5)*14 });
    if(p.crit && this.sparks.length < 20) this.sparks.push({ t:0, k:'crit' });
  },
  spark(el){ if(this.sparks.length < 20) this.sparks.push({ t:0, k:el }); },
  burst(id){ if(this.sparks.length < 20) this.sparks.push({ t:0, k:'skill', id }); },
  cast(g){ this.casts.push({ t:0, g }); if(this.casts.length > 4) this.casts.shift(); },
  holed(sc){ this.banner = { t:0, n:sc.n, d:sc.d }; },
  depthsFlash(col){ this.flash = 1; this.flashCol = col; }
};

function pxRing(c, cx, cy, r, col){
  c.fillStyle = col;
  const n = Math.max(10, Math.round(r*4.2));
  for(let i = 0; i < n; i++){
    const a = i/n * 6.28318;
    c.fillRect(Math.round(cx + Math.cos(a)*r), Math.round(cy + Math.sin(a)*r), 1, 1);
  }
}
// A flat panel with a one-pixel border and the corner pixels knocked out, which
// is how a box gets rounded when a box is nine pixels tall.
function panel(c, x, y, w, h, fill, border){
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  c.fillStyle = fill;
  c.fillRect(x+1, y, w-2, h);
  c.fillRect(x, y+1, w, h-2);
  if(border){
    c.fillStyle = border;
    c.fillRect(x+1, y, w-2, 1); c.fillRect(x+1, y+h-1, w-2, 1);
    c.fillRect(x, y+1, 1, h-2); c.fillRect(x+w-1, y+1, 1, h-2);
  }
}

Object.assign(Scene, {
  fwWidth(d){
    const t = clamp(d/LEN, 0, 1);
    const L = this.land || { fw:3.10, taper:0.85 };
    return L.fw - (L.taper || 0.85)*t*(L.fw/3.10) + Math.sin(d*0.05 + this.seed)*0.22;
  },
  // Left and right extent of a blob hazard at world distance d. Two outlines
  // rather than one mirrored half: a bunker with the same silhouette either
  // side of its own centre line reads as a stamped shape, not as dug ground.
  hazSpan(hz, d){
    const t = (d - hz.d) / hz.rd;
    if(t <= -1 || t >= 1) return null;
    const u = Math.acos(clamp(t, -1, 1)) / Math.PI;
    const base = hz.rx * Math.sqrt(1 - t*t);
    return { l: base * shapeAt(hz.shape, u),
             r: base * shapeAt(hz.shape2 || hz.shape, u) };
  },

  /* ---- terrain, one scanline at a time ---- */
  // Distance haze. Ground and props are drawn crisp, then this one blit lifts
  // everything far away toward the horizon colour, which is what actually makes
  // a flat scanline field read as depth. Cached per theme and size, so it costs
  // a single drawImage a frame rather than a hundred alpha fills.
  buildHaze(){
    const key = this.themeId + '|' + VW + 'x' + VH;
    if(this.hazeKey === key && this.haze) return;
    const T = this.theme || THEMES.day;
    const cv = document.createElement('canvas');
    cv.width = VW; cv.height = VH;
    const g = cv.getContext('2d');
    g.clearRect(0, 0, VW, VH);
    g.fillStyle = T.sky[4];
    for(let y = HORIZON; y < VH; y++){
      const sc = (y - HORIZON) / GROUND;
      const rel = K_PROJ / Math.max(0.0001, sc);
      const a = clamp((rel - 16) / 90, 0, 1) * 0.62;
      if(a <= 0.004) continue;
      g.globalAlpha = a;
      g.fillRect(0, y, VW, 1);
    }
    g.globalAlpha = 1;
    this.haze = cv; this.hazeKey = key;
  },

  drawGround(){
    const c = this.b, cam = this.camD, T = this.theme || THEMES.day;
    // Rim ramps, built once per theme. The green feathers by tone rather than
    // by scattering pixels of the neighbouring colour, which read as grit.
    if(!T._rim){
      T._rim = [mixC(T.gr[3], T.apron, 0.30), mixC(T.gr[3], T.apron, 0.60),
                mixC(T.gr[3], T.apron, 0.84)];
      T._arim = [mixC(T.apron, T.fw[5], 0.45), mixC(T.apron, T.fw[5], 0.78)];
      // The authored ramps are short enough to read, but a short ramp across a
      // whole field is a handful of visible steps. Resampled once to something
      // finer than the eye resolves, distance shading becomes continuous: no
      // bands to see, and nothing that needs dithering to hide them.
      T._fw = expandC(T.fw, 48); T._rg = expandC(T.rg, 48);
      T._gr = expandC(T.gr, 40); T._sd = expandC(T.sd, 40); T._wt = expandC(T.wt, 40);
    }
    for(let y = HORIZON + 1; y < VH; y++){
      const s = (y - HORIZON) / GROUND;
      const rel = K_PROJ / s;
      const d = cam + rel - CAM_BACK;
      const near = clamp(1 - rel/110, 0, 1);

      c.fillStyle = pickC(T._rg, near);
      c.fillRect(0, y, VW, 1);
      if(rel < 1.2) continue;

      const C0 = Math.round(CX - CAM_LAT * LAT * s);

      if(d > -3.2 && d < 2.4){
        const tw = Math.round(1.75 * LAT * s);
        if(tw > 0){
          c.fillStyle = pickC(T._gr, d > -3.0 && d < 2.2 ? 0.75 : 0.45);
          c.fillRect(C0 - tw, y, tw*2, 1);
          c.fillStyle = T.edge;
          c.fillRect(C0 - tw - 1, y, 1, 1); c.fillRect(C0 + tw, y, 1, 1);
        }
      }

      if(d < LEN + 7){
        const hw = Math.round(this.fwWidth(d) * LAT * s);
        if(hw > 0){
          // No mowing stripes. Their period is set in world units, so close to
          // the camera a single stripe covered a large band of the screen and
          // slid up it as he walked: a dark shape moving with the player rather
          // than ground he was moving over.
          const ft = near*0.60;
          c.fillStyle = pickC(T._fw, ft);
          c.fillRect(C0 - hw, y, hw*2, 1);
          if(hw > 5){
            const iw = Math.round(hw*0.55);
            c.fillStyle = pickC(T._fw, ft + 0.12);
            c.fillRect(C0 - iw, y, iw*2, 1);
          }
          if(hw > 9){
            const ew = Math.round(hw*0.86);
            c.fillStyle = pickC(T._fw, ft - 0.12);
            c.fillRect(C0 - hw, y, hw - ew, 1);
            c.fillRect(C0 + ew, y, hw - ew, 1);
          }
          // a cut collar either side, two solid steps rather than a ragged
          // scatter of pixels into the rough
          const cw = hw > 14 ? 2 : 1;
          c.fillStyle = T.apron;
          c.fillRect(C0 - hw - cw, y, cw, 1); c.fillRect(C0 + hw, y, cw, 1);
          c.fillStyle = T._arim[1];
          c.fillRect(C0 - hw - cw - 1, y, 1, 1); c.fillRect(C0 + hw + cw, y, 1, 1);
        }
      }

      for(const bk of this.bunkers){
        const sp = this.hazSpan(bk, d);
        if(!sp) continue;
        const xl = Math.round(C0 + (bk.x) * LAT * s - sp.l * LAT * s);
        const xr = Math.round(C0 + (bk.x) * LAT * s + sp.r * LAT * s);
        const w = xr - xl;
        if(w <= 0) continue;
        // Flat sand, shaded only by how far down the hole it is, the same way
        // the fairway and the rough are. Shading it by position WITHIN the
        // bunker stepped the far quarter of every one of them down by nearly
        // sixty levels, and because that band is fixed in world space it slid
        // across the sand as he walked up on it.
        c.fillStyle = pickC(T._sd, 0.52 + near*0.30);
        c.fillRect(xl, y, w, 1);
        // the lip that overhangs it
        c.fillStyle = pickC(T._sd, 0.06);
        c.fillRect(xl, y, 1, 1); c.fillRect(xr - 1, y, 1, 1);
      }

      if(this.water){
        const sp = this.hazSpan(this.water, d);
        if(sp){
          const xl = Math.round(C0 + this.water.x * LAT * s - sp.l * LAT * s);
          const xr = Math.round(C0 + this.water.x * LAT * s + sp.r * LAT * s);
          const w = xr - xl;
          if(w > 0){
            const t = clamp((d - (this.water.d - this.water.rd)) / (this.water.rd*2), 0, 1);
            // deep through the middle, shelving up to both banks
            const depth = Math.min(t, 1 - t) * 2;
            c.fillStyle = pickC(T._wt, 0.86 - depth*0.60 + near*0.10);
            c.fillRect(xl, y, w, 1);
            // Ripples as clean lines across part of the span. Scattered pixels
            // of a lighter blue read as grit on the surface rather than water.
            if(w > 6 && ((y + Math.floor(this.t*5)) % 7) === 0){
              const rw = Math.round(w * (0.30 + 0.30*Math.abs(Math.sin(y*0.7 + this.t))));
              c.fillStyle = pickC(T.wt, 0.92);
              c.fillRect(xl + Math.round((w - rw)/2), y, rw, 1);
            }
            c.fillStyle = pickC(T.wt, 0.04);
            c.fillRect(xl, y, 1, 1); c.fillRect(xr - 1, y, 1, 1);
          }
        }
      }

      const gd = d - LEN;
      const lobe = 1 + 0.085*Math.sin(gd*0.85 + this.seed);
      if(gd > -8.6 && gd < 8.6){
        const ga = Math.round(3.05*lobe * Math.sqrt(Math.max(0, 1 - (gd/8.6)*(gd/8.6))) * LAT * s);
        if(ga > 0){
          c.fillStyle = T.apron;
          c.fillRect(C0 - ga, y, ga*2, 1);
          c.fillStyle = T._arim[0];
          c.fillRect(C0 - ga - 1, y, 1, 1); c.fillRect(C0 + ga, y, 1, 1);
          c.fillStyle = T._arim[1];
          c.fillRect(C0 - ga - 2, y, 1, 1); c.fillRect(C0 + ga + 1, y, 1, 1);
        }
        if(gd > -7.5 && gd < 7.5){
          const gh = Math.round(2.35*lobe * Math.sqrt(Math.max(0, 1 - (gd/7.5)*(gd/7.5))) * LAT * s);
          if(gh > 0){
            const gt = 0.40 + near*0.36;
            c.fillStyle = pickC(T._gr, gt);
            c.fillRect(C0 - gh, y, gh*2, 1);
            if(gh > 7){
              c.fillStyle = pickC(T._gr, gt + 0.18);
              const iw = Math.round(gh*0.46);
              c.fillRect(C0 - iw, y, iw*2, 1);
            }
            // three graded pixels into the apron, so the rim is a gradient
            for(let k = 0; k < 3 && gh > k + 1; k++){
              c.fillStyle = T._rim[k];
              c.fillRect(C0 - gh + (2 - k), y, 1, 1);
              c.fillRect(C0 + gh - 3 + k, y, 1, 1);
            }
          }
        }
      }
    }
    const hz = this.night ? 'rgba(40,70,90,.40)' : 'rgba(190,215,215,.30)';
    for(let i = 0; i < 3; i++){ c.fillStyle = hz; c.fillRect(0, HORIZON + 1 + i*2, VW, 1); }
  },

  // The ranges do not move with the camera and do not animate, so they are
  // rasterised once per hole and blitted. That buys enough budget to shade
  // every column by which way its face turns, instead of stamping flat
  // silhouettes and a row of random two pixel columns for the trees.
  buildRidge(){
    const key = [this.themeId, this.hole, VW, VH, HORIZON].join('|');
    if(this.ridgeKey === key && this.ridge) return;
    this.ridgeKey = key;
    const T = this.theme || THEMES.day;
    const H = Math.max(4, HORIZON + 6);
    const cv = document.createElement('canvas');
    cv.width = Math.max(2, VW); cv.height = H;
    const g = cv.getContext('2d');
    const rnd = seeded(hash32(this.hole*7919 + 17));

    for(let L = 2; L >= 0; L--){
      const amp  = (0.050 + L*0.040) * VH;
      const base = HORIZON - Math.round(VH*(0.050 - L*0.021));
      // farther ranges sit closer to the sky colour, which is what reads as air
      const haze = (2 - L) * 0.24;
      const body  = mixC(T.rk[L === 2 ? 1 : L === 1 ? 2 : 3], T.sky[4], haze);
      const lit   = mixC(T.rk[4], T.sky[4], haze);
      const shade = mixC(T.rk[0], T.sky[4], haze);
      const snow  = mixC(T.snow,  T.sky[4], haze * 0.6);
      const p1 = 22 + L*15, p2 = 8.5 + L*3.5, p3 = 3.6 + L*1.4;
      const a1 = rnd()*99, a2 = rnd()*99, a3 = rnd()*99;
      // three octaves, so a peak has shoulders and scree rather than being a sine
      const topAt = x => base - amp*(0.42
        + 0.36*Math.sin(x/p1 + a1)
        + 0.15*Math.sin(x/p2 + a2)
        + 0.07*Math.sin(x/p3 + a3));
      const snowY = base - amp*0.62;
      let prev = topAt(-1);
      for(let x = 0; x < VW; x++){
        const top = Math.round(topAt(x));
        g.fillStyle = body;
        g.fillRect(x, top, 1, H - top);
        const slope = top - prev;
        if(slope !== 0){
          // rising toward the light is a lit face, falling away is in shadow
          g.fillStyle = slope < 0 ? lit : shade;
          g.fillRect(x, top, 1, Math.min(4, Math.abs(slope) + 1));
        }
        if(L > 0 && top < snowY){
          const capH = Math.min(5, Math.round((snowY - top) * 0.6));
          if(capH > 0){ g.fillStyle = snow; g.fillRect(x, top, 1, capH); }
        }
        prev = top;
      }
    }

    // Treeline: clumped canopies with a second tone behind them. Keyed to the
    // hole, not to camD -- tied to the camera the whole distant wood crawled
    // sideways every time he took a step.
    let x = -6;
    while(x < VW + 6){
      const w = 5 + Math.floor(rnd()*10), h = 3 + Math.floor(rnd()*6);
      const back = rnd() < 0.45;
      g.fillStyle = back ? T.tl2 : T.tl;
      g.fillRect(x, HORIZON - h, w, h + 4);
      const cw = Math.max(2, w - 2 - Math.floor(rnd()*2));
      g.fillRect(x + 1 + Math.floor(rnd()*2), HORIZON - h - 1 - Math.floor(rnd()*3), cw, 4);
      x += Math.max(2, w - 2 - Math.floor(rnd()*2));
    }
    this.ridge = cv;
  },

  drawRidge(){
    this.buildRidge();
    if(this.ridge) this.b.drawImage(this.ridge, 0, 0);
  },

  // One back-to-front pass over everything standing beside the hole.
  drawProps(){
    const c = this.b, T = this.theme || THEMES.day, night = this.night;
    for(const p of (this.props || [])){
      if(p.d < this.camD - 5) continue;
      const pr = this.proj(p.d, p.x);
      if(pr.s < 0.05) continue;
      if(p.kind === 0){
        const TS = this.treeSpr || SPRITE;
        const spr = p.k ? TS.oak : TS.pine;
        const h = Math.round(p.s * 46 * pr.s * US);
        if(h < 3) continue;
        const w = Math.round(h * spr.w / spr.h);
        if(pr.x + w < -4 || pr.x - w > VW + 4) continue;
        c.fillStyle = 'rgba(8,16,10,.30)';
        c.fillRect(pr.x - Math.round(w*0.34), pr.y - 1,
                   Math.round(w*0.68), Math.max(1, Math.round(h*0.035)));
        blit(c, spr, pr.x - w/2, pr.y - h, w, h);
      }else{
        const h = Math.max(3, Math.round(12 * pr.s * US));
        if(pr.x < -6 || pr.x > VW + 6) continue;
        const spr = spectSpr(p.c, Math.sin(this.t*0.9 + p.p) > 0 ? 0 : 1, night);
        const w = Math.max(1, Math.round(h * spr.w / spr.h));
        c.fillStyle = 'rgba(8,16,10,.26)';
        c.fillRect(pr.x - Math.round(w/2), pr.y - 1, w, 1);
        blit(c, spr, pr.x - w/2, pr.y - h, w, h);
      }
    }
  },

  drawGolfer(D, atCam){
    const c = this.b;
    const p = this.proj(atCam === undefined ? this.camD : atCam, 0);
    const ph = this.swingT > 0 ? 1 - this.swingT/this.swingDur : 0;
    // Past the ball he comes up out of the posture, so the silhouette changes
    // rather than the same bent figure sliding around.
    const spr = ph > 0.60 ? SPRITE.gFinish : SPRITE.gAddr;
    // He stood 1:2.9 against the fairway. Real golf is nearer 1:17; a figure
    // that small is unreadable in pixel art, so 1:7 is the compromise. The
    // number is his world height in the same units the lateral scale uses.
    const h = Math.max(6, Math.round(B_GOLFER * US * p.s));
    const w = Math.max(4, Math.round(h * spr.w / spr.h));
    const x = p.x - Math.round(w*0.42), y = p.y - h;

    c.fillStyle = 'rgba(8,16,10,.34)';
    c.fillRect(x + Math.round(w*0.05), p.y - 1, Math.round(w*0.62), Math.max(1, Math.round(h*0.045)));

    // Club angle: 0 is straight down, positive swings toward the target.
    // Address, up and behind the head, back down through the ball, and up
    // over the lead shoulder.
    const ADDR = 0.50, TOP = -2.50, FIN = 2.60;
    let arm, coil = 0;
    if(ph === 0) arm = ADDR;
    else if(ph < 0.36){ const t = ph/0.36; arm = ADDR + (TOP - ADDR)*t; coil = -t*0.5; }
    else if(ph < 0.55){ const t = (ph - 0.36)/0.19; arm = TOP + (ADDR - TOP)*t; coil = -(1-t)*0.5; }
    else { const t = (ph - 0.55)/0.45; arm = ADDR + (FIN - ADDR)*t; coil = t*0.7; }

    blitShear(c, spr, x, y, w, h, f => coil * (1 - f) * w * 0.16);

    const sx = x + w*(spr.ax || 0.66), sy = y + h*(spr.ay || 0.30);
    const al = h*0.30, cl = h*0.60;
    const armH = arm * 0.55;
    const hx = sx + Math.sin(armH)*al, hy = sy + Math.cos(armH)*al*0.85;
    const tx = hx + Math.sin(arm)*cl, ty = hy + Math.cos(arm)*cl*0.90;
    const th = h > 34 ? 2 : 1;
    pxLine(c, sx, sy, hx, hy, PX.skin, th);
    pxLine(c, sx - w*0.10, sy + 1, hx, hy, PX.skin2, th);
    if(h > 22){ c.fillStyle = PX.shirt; c.fillRect(Math.round(hx) - 1, Math.round(hy) - 1, th + 1, th + 1); }
    pxLine(c, hx, hy, tx, ty, h > 26 ? PX.club : PX.club2, th);
    c.fillStyle = PX.club3;
    c.fillRect(Math.round(tx) - th, Math.round(ty) - 1, th*2 + 1, th + 1);

    // the ball waits out in front, on the ground, where he is looking
    if(this.swingT === 0 || ph < 0.5){
      const bs = h > 30 ? 2 : 1;
      c.fillStyle = PX.white;
      c.fillRect(Math.round(x + w*1.19), Math.round(p.y - bs), bs, bs);
    }
  },

  // Two markers on the tee. Skipped once the camera has walked past them,
  // or the projection clamp blows them up across the bottom of the screen.
  drawTee(){
    if(0.2 - this.camD + CAM_BACK < 1.2) return;
    const c = this.b;
    for(const sx of [-1, 1]){
      const p = this.proj(0.2, sx*1.55);
      if(p.y < HORIZON + 2 || p.y > VH + 4) continue;
      const h = Math.max(2, Math.round(2.4 * US * p.s));
      const w = Math.max(1, Math.round(h*0.75));
      c.fillStyle = sx < 0 ? PX.flag : PX.bone;
      c.fillRect(p.x - (w >> 1), p.y - h, w, h);
      c.fillStyle = PX.white;
      c.fillRect(p.x - (w >> 1), p.y - h, w, Math.max(1, Math.round(h*0.3)));
    }
  },

  drawBalls(dt){
    const c = this.b;
    for(let i = this.balls.length - 1; i >= 0; i--){
      const b = this.balls[i];
      b.t += dt;
      const u = b.t / b.dur;
      if(u >= 1){ this.balls.splice(i, 1); continue; }
      const col = b.el ? (PX[b.el] || PX.white) : PX.white;
      for(let k = 5; k >= 0; k--){
        const uu = u - k*0.055;
        if(uu < 0) continue;
        const p = this.proj(b.d0 + b.dist*uu, b.lat, Math.sin(uu*Math.PI)*2.6);
        const r = Math.max(1, Math.round(B_BALL * p.s * US));
        if(k === 0){
          c.fillStyle = b.crit ? PX.brass : col;
          c.fillRect(p.x - r, p.y - r, r*2, r*2);
          if(r > 1){ c.fillStyle = PX.white; c.fillRect(p.x - r, p.y - r, 1, 1); }
        }else if(k % 2 === 0){
          c.fillStyle = col;
          c.fillRect(p.x, p.y, Math.max(1, r - 1), Math.max(1, r - 1));
        }
      }
    }
  },

  drawWeather(){
    if(!this.rain) return;
    const c = this.b;
    c.fillStyle = 'rgba(198,222,232,.36)';
    for(let i = 0; i < 40; i++){
      const x = Math.round(((i*67 + this.t*260) % (VW + 40)) - 20);
      const y = Math.round((i*41 + this.t*330) % VH);
      c.fillRect(x, y, 1, 3);
    }
  },

  drawFx(dt){
    const c = this.b;
    const gp = this.proj(this.camD, -0.30);
    for(let i = this.sparks.length - 1; i >= 0; i--){
      const sp = this.sparks[i]; sp.t += dt;
      if(sp.t > .5){ this.sparks.splice(i, 1); continue; }
      const col = sp.k === 'crit' ? PX.brass : sp.k === 'skill' ? PX.aur : (PX[sp.k] || PX.aur);
      pxRing(c, gp.x + 3, gp.y - 10*US*gp.s, (4 + sp.t*42)*US, col);
    }
    for(let i = this.nums.length - 1; i >= 0; i--){
      const n = this.nums[i]; n.t += dt;
      if(n.t > .95){ this.nums.splice(i, 1); continue; }
      // above his head, not across his chest: the offset is measured from the
      // sprite height rather than guessed
      const gh = Math.max(6, Math.round(B_GOLFER * US * gp.s));
      drawTextS(c, (n.crit ? '*' : '') + fmt(n.v), gp.x + n.x*US,
                gp.y - gh - 5 - Math.round(n.t*20*TSC),
                n.crit ? PX.brass : PX.bone, TSC, 'c');
    }
    for(let i = this.casts.length - 1; i >= 0; i--){
      const k = this.casts[i]; k.t += dt;
      if(k.t > 1.05){ this.casts.splice(i, 1); continue; }
      drawTextS(c, k.g, 6, VH - LH*4 - Math.round(k.t*14*TSC), PX.aur, TSC, 'l');
    }
    if(this.banner){
      const b = this.banner; b.t += dt;
      if(b.t > 1.2) this.banner = null;
      else{
        const col = b.d <= -3 ? PX.myth : b.d <= -2 ? PX.brass : b.d === -1 ? PX.aur
                  : b.d === 0 ? PX.bone : PX.flag;
        let sc = 3*TSC;
        while(sc > 1 && textW(b.n, sc) > VW - 10) sc--;
        drawTextS(c, b.n, CX, HORIZON - 6 - sc*4 - Math.round(b.t*6), col, sc, 'c');
      }
    }
    if(this.flash > 0){
      this.flash -= dt*2.2;
      const a = Math.max(0, this.flash);
      c.globalAlpha = a*0.42;
      c.fillStyle = this.flashCol;
      c.fillRect(0, 0, VW, VH);
      c.globalAlpha = 1;
    }
  },

  // Live perks, on the field. A buff you have to open a panel to see is a buff
  // you forget you paid for.
  drawPerks(){
    const live = [];
    for(const id in S.perkOn) if(S.perkOn[id] > 0) live.push(id);
    if(!live.length) return;
    const c = this.b, sz = 9;
    let x = 3;                          // the buttons moved right, so this side is free
    const y = Math.round(VH*0.24);
    for(const id of live.slice(0, 5)){
      const p = perkDef(id), f = clamp(S.perkOn[id] / p.dur, 0, 1);
      c.fillStyle = 'rgba(6,12,9,.72)';
      c.fillRect(x - 1, y - 1, sz + 2, sz + 4);
      blit(c, pixIcon(p.ic, 16, PX.brass), x, y, sz, sz);
      c.fillStyle = '#2A2418'; c.fillRect(x, y + sz + 1, sz, 1);
      c.fillStyle = PX.brass; c.fillRect(x, y + sz + 1, Math.max(1, Math.round(sz*f)), 1);
      x += sz + 4;
    }
    if((S.tickets || 0) > 0 && live.length < 5)
      drawTextS(c, 'x' + S.tickets, x + 1, y + 1, PX.grey, TSC);
  },

  /* ---- the shot book, on the field ---- */
  drawShots(){
    if(!S.carry || !S.carry.length) return;
    const c = this.b;
    const sz = Math.max(8, Math.round(VW*0.050));
    const pad = 2, step = sz + pad*2 + 3;
    let x = 3;
    const y = VH - sz - pad - 2;
    for(const id of S.carry){
      const def = skillDef(id);
      if(!def || !S.skillLv[id]){ x += step; continue; }
      const cd = Math.max(0, S.cd[id] || 0);
      const frac = clamp(1 - cd/def.cd, 0, 1);
      const ready = frac >= 1;
      const blink = ready && (Math.floor(this.t*4) & 1);

      panel(c, x - pad, y - pad, sz + pad*2, sz + pad*2, 'rgba(8,14,10,.70)',
            ready ? (blink ? PX.aur : '#2E6B5E') : '#1C3A31');
      blit(c, pixIcon(def.ic, 20, PX.dim), x, y, sz, sz);
      // vertical wipe: pixel-exact where a wedge clip would fur the diagonal
      const fillH = Math.round(sz * frac);
      if(fillH > 0){
        c.save();
        c.beginPath(); c.rect(x, y + sz - fillH, sz, fillH); c.clip();
        blit(c, pixIcon(def.ic, 20, ready ? PX.aur : '#3FA890'), x, y, sz, sz);
        c.restore();
      }
      x += step;
    }
  },

  /* ---- the readouts, in the same font as everything else ---- */
  // Two-ended lines get measured before they are drawn. Candidates are tried
  // longest first and the first pair that fits wins; "ON THE CLOCK" against
  // "TIME 08.3S" simply does not fit a hundred pixel panel.
  pairLine(c, y, lefts, rights, lcol, rcol, pw, IN){
    for(const l of lefts) for(const r of rights){
      if(textW(l, 1) + textW(r, 1) + 4 <= IN){
        drawText(c, l, 5, y, lcol, 1);
        drawText(c, r, pw - 2, y, rcol, 1, 'r');
        return;
      }
    }
    drawText(c, lefts[lefts.length - 1], 5, y, lcol, 1);
  },

  // The panel lives in the DOM now. What stays on the canvas is the stuff that
  // belongs to the world rather than the interface.
  drawHud(D){
    const c = this.b;
    // The buffer is ceil(device/scale) wide, so up to one buffer column is
    // blitted past the right edge of the canvas and clipped. Anything aligned
    // hard right has to clear that column as well as its own drop shadow.
    const R = VW - 4*TSC - 1;
    let ly = VH - LH - 2;
    if(S.armor > 0){
      drawTextS(c, isSunday(S.hole) ? 'CHAMPIONSHIP' : 'SIGNATURE', R, ly, PX.flag, TSC, 'r');
      ly -= LH;
    }
    if(S.courseEl){
      const e = B.ELEM.find(x => x.id === S.courseEl);
      drawTextS(c, e.n.toUpperCase() + (D.reson > 1 ? '+' : D.reson < 1 ? '-' : ''),
                R, ly, PX[S.courseEl] || PX.bone, TSC, 'r');
      ly -= LH;
    }
    drawTextS(c, (S.chaos ? S.chaos.n : 'FAIR'), R, ly, PX.grey, TSC, 'r');
  },

  /* ---- the Depths ---- */
  drawDepthsHud(D, R, dg){
    const c = this.b;
    const pal = B.DGN_PAL[R.id] || {};
    const glow = pal.glow || PX.brass;
    if(R.evt && R.evtT > 0){
      const bad = R.evt.bad, w = textW(R.evt.n, TSC) + 8, y = Math.round(VH*0.34);
      panel(c, Math.round(CX - w/2), y, w, FH*TSC + 4, 'rgba(6,10,8,.88)',
            bad ? PX.flag : PX.verdant);
      drawText(c, R.evt.n, CX, y + 2, bad ? PX.flag : PX.verdant, TSC, 'c');
    }
    // All of this stacks up the RIGHT edge. Along the bottom left it ran under
    // the shot book icons, which are drawn from the same corner.
    const RX = VW - 4*TSC - 1;
    let dy = VH - LH - 2;
    let nm = dg.n.toUpperCase();
    while(textW(nm, TSC) > VW - 8 && nm.length > 4) nm = nm.slice(0, -1);
    drawTextS(c, nm, RX, dy, glow, TSC, 'r');
    dy -= LH;
    drawTextS(c, 'COURSE PAUSED', RX, dy, PX.dim, TSC, 'r');
    dy -= 7;
    let px2 = RX;
    for(let i = 0; i < Math.min(12, R.cleared); i++){
      c.fillStyle = PX.verdant;
      c.fillRect(px2, dy, 1, 5); c.fillRect(px2 - 2, dy, 3, 2);
      px2 -= 4;
    }
  },

  /* ---- the frame ---- */
  draw(dt, D){
    this.t += dt;
    if(!this.b) return;
    const c = this.b;

    if(this.swingT > 0){
      const before = this.swingT;
      this.swingT -= dt;
      if(before > this.swingDur*0.52 && this.swingT <= this.swingDur*0.52) this.launch();
      if(this.swingT < 0) this.swingT = 0;
    }

    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, VW, VH);

    if(S.dgnRun){
      const R = S.dgnRun, dg = B.DGN.find(x => x.id === R.id);
      if(R.floor !== this.dFloor || this.themeId !== R.id){
        this.dFloor = R.floor; this.newDepthsHole(R);
      }
      // progress through this floor's work. Reading a field that no longer
      // exists made this NaN, which propagated into the camera and flattened
      // the entire scene into bare rough.
      // Each contest is framed from a different place on the hole: the tee for
      // the Long Drive, out by the water for the Island Green, right on top of
      // the green for the chipping.
      // The chipper stands SHORT of the green: at 0.90 he was standing on it,
      // which is not chipping. The island shot is played from across the water.
      const within = R.mode === 'drive' ? 0.03
                   : R.mode === 'island' ? 0.56
                   : R.mode === 'chip' ? 0.76
                   : clamp(1 - R.work/Math.max(1e-9, R.full), 0, 1);
      this.camD += (within*LEN - this.camD) * Math.min(1, dt*4.5);
      // The round is paused, so no swing ever reaches the renderer from the
      // simulation. Down here the animation is driven off tempo directly:
      // he is still hitting the ball, the ball is just not on the course.
      // Only the endurance floor swings continuously; the other three fire on
      // their own beat, from the simulation.
      if(!R.dead && R.mode === 'floor'){
        this.dSwing = (this.dSwing || 0) + dt * Math.min(D.spd, B.VIS_SWING_CAP);
        while(this.dSwing >= 1){
          this.dSwing -= 1;
          this.swing(D.pow * (1 + D.mst*B.MST_DMG), Math.random() < D.crit,
                     D.ball && D.ball.el);
        }
      }
      if(!isFinite(this.camD)) this.camD = 0;
      if(this.sky) c.drawImage(this.sky, 0, 0);
      this.drawRidge();
      this.drawGround();
      this.drawProps();
      this.buildHaze();
      if(this.haze) c.drawImage(this.haze, 0, 0);
      this.drawTee();
      this.drawFlagstick();
      this.drawGolfer(D);
      this.drawBalls(dt);
      if(this.themeId === 'cellar' && Math.sin(this.t*1.9) > 0.988){
        c.fillStyle = 'rgba(214,180,255,.18)'; c.fillRect(0, 0, VW, VH);
      }
      this.drawDepthsHud(D, R, dg);
      this.drawPerks();
      this.drawShots();
      this.drawFx(dt);
    }else{
      if(this.themeId === 'sand' || this.themeId === 'water'
         || this.themeId === 'cellar' || this.themeId === 'vault'){
        this.dFloor = -1; this.newHole(S.hole, S.tier);   // back up top
      }
      const prog = clamp(1 - S.yards / S.yardsMax, 0, 1);
      this.camD += (prog*LEN - this.camD) * Math.min(1, dt*4.5);
      if(this.sky) c.drawImage(this.sky, 0, 0);
      this.drawRidge();
      this.drawGround();
      this.drawProps();
      this.buildHaze();
      if(this.haze) c.drawImage(this.haze, 0, 0);
      this.drawTee();
      this.drawFlagstick();
      this.drawGolfer(D);
      this.drawBalls(dt);
      this.drawWeather();
      this.drawHud(D);
      this.drawPerks();
      this.drawShots();
      this.drawFx(dt);
    }

    const g = this.ctx;
    g.imageSmoothingEnabled = false;
    g.clearRect(0, 0, this.cv.width, this.cv.height);
    g.drawImage(this.buf, 0, 0, VW, VH, 0, 0, VW*this.scale, VH*this.scale);
  },

  drawFlagstick(){
    const c = this.b;
    const p = this.proj(LEN, 0);
    if(p.s < 0.05) return;
    const h = Math.max(4, Math.round(B_FLAG * US * p.s));
    const pw = Math.max(1, Math.round(h*0.05));
    const cr = Math.max(1, Math.round(1.6*p.s*US));
    c.fillStyle = '#132215';
    c.fillRect(p.x - cr, p.y - 1, cr*2, Math.max(1, Math.round(cr*0.8)));
    c.fillStyle = PX.bone;
    c.fillRect(p.x, p.y - h, pw, h);
    const spr = (Math.floor(this.t*3) & 1) ? SPRITE.flagA : SPRITE.flagB;
    const fh = Math.max(2, Math.round(h*0.30));
    blit(c, spr, p.x + pw, p.y - h, Math.max(2, Math.round(fh * spr.w / spr.h)), fh);
  }
});

// Same path data the canvas uses, emitted as inline SVG for the panels.
function svgIcon(id, cls, color){
  const ic = B.ICON[id]; if(!ic) return '';
  let p = '';
  for(const d of (ic.f||[])) p += '<path d="' + d + '" fill="currentColor" fill-rule="evenodd"/>';
  for(const d of (ic.s||[])) p += '<path d="' + d + '" fill="none" stroke="currentColor" '
    + 'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>';
  return '<svg class="ic ' + (cls||'') + '" viewBox="0 0 24 24"'
    + (color ? ' style="color:' + color + '"' : '') + '>' + p + '</svg>';
}

// Drawn on the same grid as everything else, then blitted as an image with
// pixelated rendering. A smooth vector icon sitting on pixel art reads as a
// sticker; this does not.
const DOMSPR = {};
function domSprite(key, rows, map){
  if(DOMSPR[key]) return DOMSPR[key];
  try{ return DOMSPR[key] = makeSprite(rows, map).cv.toDataURL(); }
  catch(e){ return DOMSPR[key] = ''; }
}

function honRows(w){
  const done = achCount(), tot = B.ACH.length;
  const A = achBonus();
  const live = Object.keys(A).map(k => achReward({ r:{ k, v:A[k] } })).join(' \u00b7 ');
  let h = '<div class="hint">' + done + ' of ' + tot + ' done. They tick over by themselves, so there is nothing to come and claim. Right now you are getting: '
    + (live ? '<b style="color:var(--aurora)">' + live + '</b>' : 'none yet') + '.</div>';
  const rows = B.ACH.slice().sort((a,b) => (achDone(b.id)?1:0) - (achDone(a.id)?1:0));
  for(const a of rows){
    const got = achDone(a.id), have = achMetric(a.m), need = a.v;
    h += '<div class="row' + (got ? '' : ' locked') + '"><div>'
      + '<div class="nm">' + (got ? '\u2713 ' : '') + a.n + '</div>'
      + '<div class="ds">' + a.d + '</div>'
      + '<div class="mt">' + (got ? '<b>' + achReward(a) + '</b>'
          : '<i>' + fmt(Math.min(have, need), 0) + '</i> / ' + fmt(need, 0)
            + ' \u00b7 ' + achReward(a)) + '</div></div>'
      + (got ? '' : '<div class="hbar"><i style="width:' + clamp(have/need,0,1)*100 + '%"></i></div>')
      + '</div>';
  }
  w.innerHTML = h;
}
function honoursSheet(){

    + '<button class="act ghost" onclick="hideSheet()">Close</button>');

function renderHonBtn(){

function renderXp(){
  const max = atMax();
  const need = max ? paraNeed(S.para) : xpNeed(S.lv);
  const have = max ? S.paraXp : S.xp;
  const unspent = (S.talPts||0) + (S.statPts||0)
    + B.PARAGON.reduce((n,c) => n + (S.paraPts[c.id]||0), 0);
  const strip = $('xpStrip');
  strip.className = (max ? 'para' : '') + (unspent ? ' ready' : '');
  $('xpLv').textContent = max ? 'PARAGON ' + fmt(S.para, 0) : 'LV ' + S.lv;
  $('xpFill').style.width = clamp(have/need, 0, 1)*100 + '%';
  const bits = [];
  if(S.talPts) bits.push(S.talPts + ' talent');
  if(S.statPts) bits.push(S.statPts + ' attribute');
  const pp2 = B.PARAGON.reduce((n,c) => n + (S.paraPts[c.id]||0), 0);
  if(pp2) bits.push(pp2 + ' paragon');
  $('xpNum').textContent = unspent
    ? bits.join(', ') + ' to spend'
    : fmt(have) + ' / ' + fmt(need) + ' xp';
  if(careerTab) careerTab.classList.toggle('alert', unspent > 0);
}
// One readout for both the course and the Depths, so they read the same way.
function renderReadout(D){
  const R = S.dgnRun;
  let top, topR, big, unit, tag, tagCol, frac, barCol = 'var(--brass)';
  if(R){
    const left = Math.max(0, R.dur - R.t);
    topR = left.toFixed(1) + 's';
    tagCol = 'var(--dim)';
    if(R.mode === 'drive'){
      top = 'Drive ' + R.shots + ' of ' + B.DRIVE_SHOTS;
      big = fmt(R.best); unit = 'best'; frac = R.shots / B.DRIVE_SHOTS;
      tag = 'Wind ' + R.wind.toFixed(2) + 'x';
      tagCol = R.wind >= 1 ? 'var(--verdant)' : 'var(--flag)';
    }else if(R.mode === 'island'){
      top = 'Green ' + R.made + ' of ' + R.target;
      const ch = R.chance || islandChance(D, R.made);
      big = fmt(R.pot); unit = 'pot'; frac = ch;
      tag = Math.round(ch*100) + '% make';
      tagCol = ch > 0.6 ? 'var(--aurora)' : ch > 0.35 ? 'var(--brass)' : 'var(--flag)';
      barCol = tagCol;
    }else if(R.mode === 'chip'){
      top = 'Chip ' + R.shot + ' of ' + B.CHIP_SHOTS;
      big = fmt(R.pot); unit = 'pot'; frac = R.shot / B.CHIP_SHOTS;
      tag = R.made + ' dropped'; tagCol = 'var(--verdant)';
    }else{
      top = 'Floor ' + (R.floor + 1) + ' \u00b7 ' + R.cleared + ' banked';
      big = fmt(Math.max(0, R.work)); unit = 'left';
      frac = clamp(1 - R.work/Math.max(1e-9, R.full), 0, 1);
      tag = R.dead ? 'Turned back' : R.mod < 1 ? 'Slowed' : R.mod > 1 ? 'Running hot' : 'Digging';
      tagCol = R.dead || R.mod < 1 ? 'var(--flag)' : R.mod > 1 ? 'var(--verdant)' : 'var(--dim)';
    }
    if(left < 8) topR = '<span style="color:var(--flag)">' + topR + '</span>';
  }else{
    const ratio = S.elapsed / S.parTime, sc = scoreFor(ratio);
    top = 'Hole ' + holeInRound(S.hole) + ' \u00b7 Par ' + parOf(S.hole);
    topR = S.elapsed.toFixed(1) + ' / ' + Math.round(S.parTime) + 's';
    big = S.yards <= 0 ? '\u2014' : fmt(Math.max(0, S.yards));
    unit = S.yards <= 0 ? 'walking in' : 'yds';
    frac = clamp(S.yards/S.yardsMax, 0, 1);
    tag = sc.n;
    tagCol = sc.d <= -3 ? 'var(--myth)' : sc.d <= -2 ? 'var(--brass)' : sc.d === -1 ? 'var(--aurora)'
           : sc.d === 0 ? 'var(--chalk)' : 'var(--flag)';
  }
  $$('rTop').innerHTML = top;
  $$('rTopR').innerHTML = topR;
  $$('rBig').textContent = big;
  $$('rUnit').textContent = unit;
  const tg = $$('rTag');
  tg.textContent = tag; tg.style.color = tagCol;
  const fl = $$('rFill');
  fl.style.width = clamp(frac, 0, 1)*100 + '%';
  fl.style.background = barCol;
}

/* ---- practice range ---- */

function buildUpg(){

function bulkFor(base, r, owned, cap){
  let k = S.mult === 'Max' ? maxAffordable(base, r, owned, S.gold) : S.mult;
  if(isFinite(cap)) k = Math.min(k, Math.max(0, cap - owned));
  return Math.max(S.mult === 'Max' ? 0 : 1, k);
}
function effectLabel(u){
  const lv = upgLv(u.id);
  if(u.k === 'crt') return '+' + (lv*B.CRIT_ADD[u.id]*100).toFixed(1) + 'pp';
  if(u.k === 'cpw') return '+' + (lv*B.CPW_ADD).toFixed(2) + 'x';
  if(u.k === 'drp') return '+' + (lv*B.DROP_ADD*100).toFixed(1) + 'pp';
  if(u.k === 'prc') return '+' + (lv*B.PROC_ADD*100).toFixed(1) + 'pp';
  if(u.k === 'dgn') return '+' + Math.round(lv*B.DGN_ADD*100) + '%';
  if(u.k === 'mst') return '+' + (lv*B.MST_ADD[u.id]*100).toFixed(1) + 'pp';
  return '\u00d7' + Math.pow(u.g, lv).toFixed(2);
}
function refreshUpg(){
  // Every rung is on show from the first minute. Hiding them made the ladder
  // look shorter than it is, and rows that came and went with your balance
  // looked like the game losing your upgrades.
  let owned = 0;
  for(const r of UPGREF) if(upgLv(r.u.id) > 0) owned++;
  const stretch = (S.carded > 0 && S.yardsMax > S.carded) ? S.yardsMax/S.carded : 1;
  const band = $('upgCount');
  if(band) band.textContent = owned + ' of ' + B.UPG.length + ' started';
  const note = $('upgTax');
  if(note) note.innerHTML = stretch > 1.05
    ? 'Your bag has outgrown Tour Card ' + roman(S.tier) + ', so the course is playing you off a '
      + 'handicap and stretching every hole <b>' + fmt(stretch) + 'x</b>. The extra yards pay, '
      + 'so power still earns, but climbing a card pays better than out-hitting one.'
    : 'You are playing the card as it lies. Out-hit it and the course will stretch to meet you.';

  for(const r of UPGREF){
    const u = r.u, lv = upgLv(u.id), cap = capOf(u);
    const maxed = lv >= cap;
    const k = maxed ? 0 : bulkFor(u.base, u.r, lv, cap);
    const c = maxed ? 0 : costBulk(u.base, u.r, lv, k);
    r.mt.innerHTML = 'Lv <i>' + lv + (isFinite(cap) ? '/' + cap : '') + '</i> \u00b7 <b>'
      + effectLabel(u) + '</b>';
    if(maxed){
      r.btn.className = 'buy max'; r.lbl.textContent = 'Capped'; r.amt.textContent = '\u2014';
    }else{
      const ok = S.gold >= c && k > 0;
      r.btn.className = 'buy' + (ok ? ' ok' : ' no');
      r.lbl.textContent = '\u00d7' + k;
      r.amt.textContent = fmt(c);
    }
  }
}
function buyUpg(u){
  const lv = upgLv(u.id), cap = capOf(u);
  if(lv >= cap) return;
  const k = bulkFor(u.base, u.r, lv, cap);
  const c = costBulk(u.base, u.r, lv, k);
  if(k <= 0 || S.gold < c) return;
  S.gold -= c; S.upg[u.id] = lv + k;
  refreshUpg(); renderVitals();
}
/* ---- the bag ---- */

            : '+' + (v*100 >= 1000 ? fmt(v*100) : (v*100).toFixed(0)) + '%';
    return d.n + ' ' + s;
  }).join(' \u00b7 ');
}
function itemHead(it){

function itemSheet(it, equipped){
  const el = it.el ? B.ELEM.find(e => e.id === it.el) : null;
  const canEnh = it.enh < B.ENH_MAX;
  let h = '<div class="sheethead">' + svgIcon(B.SLOTS.find(s=>s.id===it.slot).ic, 'bic', RC(it.rar))
    + '<h3 style="color:' + RC(it.rar) + ';margin:0">' + it.name + (it.enh ? ' +' + it.enh : '') + '</h3></div>';
  h += '<p>' + B.RARITY[it.rar].n + ' ' + B.SLOTS.find(s=>s.id===it.slot).n + ' \u00b7 item level ' + it.ilvl + '</p>';
  h += '<ul><li>Primary: +' + fmt(itemPrimary(it)*100) + '% '
     + (it.slot === 'ball' ? 'affinity power' : 'swing power') + '</li>';
  it.aff.forEach((a, i) => {
    const d = B.AFFIX.find(x => x.id === a.k); if(!d) return;
    const v = affixValue(it, a);
    h += '<li>' + (a.lock ? '<b style="color:var(--brass)">[locked]</b> ' : '') + d.n + ': '
      + (d.sfx === 'pp' ? '+' + (v*100).toFixed(1) + 'pp'
        : d.sfx === 'x' ? '+' + v.toFixed(2) + 'x' : '+' + fmt(v*100) + '%')
      + ' <button class="mini" style="padding:1px 6px;margin-left:6px" onclick="doLock('
      + it.uid + ',' + i + ')">' + (a.lock ? 'Unlock' : 'Lock') + '</button></li>';
  });
  if(el) h += '<li style="color:' + elemColor(el.id) + '">' + el.n + ': ' + el.d + '</li>';
  h += '</ul>';
  if(canEnh) h += '<button class="act" onclick="doEnh(' + it.uid + ')">Reforge to +' + (it.enh+1)
    + ' \u2014 ' + fmt(enhCost(it)) + ' grit, ' + Math.round(enhChance(it)*100) + '%</button>';
  const lk = lockCount(it);
  h += '<button class="act ghost" onclick="doReroll(' + it.uid + ')">Re-attune '
    + (lk ? 'the other ' + (it.aff.length - lk) : 'affixes') + ' \u2014 '
    + fmt(rerollCost(it), 0) + ' shards</button>'
    + (it.aff.length > 1 ? '<p style="font-size:11px;margin-top:6px">Locking a roll keeps it through '
      + 'the re-attune. Each lock makes the next one dearer.</p>' : '');
  if(it.rar < B.RARITY.length-1)
    h += '<button class="act ghost" onclick="doAscend(' + it.uid + ')">Ascend to '
      + B.RARITY[it.rar+1].n + ' \u2014 ' + ascendCost(it) + ' shards</button>';
  if(!equipped){
    h += '<button class="act" onclick="doEquip(' + it.uid + ')">Put in the bag</button>';
    h += '<button class="act danger" onclick="doSalvage(' + it.uid + ')">Scrap for shards</button>';
  }
  h += '<button class="act ghost" onclick="hideSheet()">Close</button>';
  showSheet(h);
}
const findItem = uid => S.bag.find(x => x.uid === uid)
  || B.SLOTS.map(s => S.equip[s.id]).filter(Boolean).find(x => x.uid === uid);
function doEnh(uid){ const it = findItem(uid); if(it){ enhance(it); itemSheet(it, !S.bag.includes(it)); } }
function doLock(uid, i){ const it = findItem(uid); if(it){ toggleLock(it, i); itemSheet(it, !S.bag.includes(it)); } }
function doReroll(uid){ const it = findItem(uid); if(it){ rerollItem(it); itemSheet(it, !S.bag.includes(it)); } }
function doAscend(uid){ const it = findItem(uid); if(it){ ascendItem(it); itemSheet(it, !S.bag.includes(it)); } }
function doEquip(uid){ const it = findItem(uid); if(it){ equipItem(it); hideSheet(); } }
function doSalvage(uid){ const it = findItem(uid); if(it){ salvageItem(it); hideSheet(); } }

/* ---- shot book ---- */
function renderSkills(){
  const w = $('sklRows'); w.innerHTML = '';
  $('sklNote').textContent = S.carry.length + ' / ' + B.SKILL_SLOTS + ' carried \u00b7 ' + fmt(S.scroll) + ' scrolls';
  for(const k of B.SKILL){
    const lv = S.skillLv[k.id] || 0;
    const owned = lv > 0;
    const carried = S.carry.includes(k.id);
    const cd = S.cd[k.id] || 0;
    const d = document.createElement('div');
    d.className = 'sk-row';
    const up = Math.ceil(B.SKILL_LV_COST * Math.pow(B.SKILL_LV_R, Math.max(0, lv-1)));
    const frac = carried && owned ? clamp(1 - cd/k.cd, 0, 1) : (owned ? 1 : 0);
    d.innerHTML = '<div class="glyph' + (carried ? ' eq' : '') + (owned ? '' : ' lock') + '">'
      + svgIcon(k.ic, 'kic') + '<div class="cd" style="height:' + (1-frac)*100 + '%"></div></div>'
      + '<div><div class="nm">' + k.n + '</div>'
      + '<div class="ds">' + skillLabel(k, owned ? lv : 1) + '</div>'
      + '<div class="mt">' + (owned ? 'Lv <i>' + lv + '</i> \u00b7 ' + k.cd + 's cooldown'
                                    : 'Not learned yet \u00b7 costs ' + k.cost + ' scrolls') + '</div></div>'
      + '<div class="btnrow"></div>';
    const br = d.querySelector('.btnrow');
    if(!owned){
      const b = document.createElement('button');
      b.className = 'mini' + (S.scroll >= k.cost ? ' go' : ' dim');
      b.textContent = 'Learn';
      b.onclick = () => {
        if(S.scroll < k.cost){ toast('Not enough scrolls'); return; }
        S.scroll -= k.cost; S.skillLv[k.id] = 1; toast('Learned <b>' + k.n + '</b>'); renderSkills();
      };
      br.appendChild(b);
    }else{
      const c = document.createElement('button');
      c.className = 'mini' + (carried ? ' go' : '');
      c.textContent = carried ? 'Carried' : 'Carry';
      c.onclick = () => {
        if(carried) S.carry = S.carry.filter(x => x !== k.id);
        else if(S.carry.length >= B.SKILL_SLOTS) toast('Only ' + B.SKILL_SLOTS + ' shots fit in the book');
        else { S.carry.push(k.id); S.cd[k.id] = k.cd; }
        renderSkills();
      };
      br.appendChild(c);
      if(lv < B.SKILL_LV_MAX){
        const b = document.createElement('button');
        b.className = 'mini' + (S.scroll >= up ? ' go' : ' dim');
        b.textContent = up + ' \u25b2';
        b.onclick = () => {
          if(S.scroll < up){ toast('Not enough scrolls'); return; }
          S.scroll -= up; S.skillLv[k.id]++; renderSkills();
        };
        br.appendChild(b);
      }
    }
    w.appendChild(d);
  }
}

/* ---- the Depths ---- */
function renderDgn(){
  const w = $('dgnRows'); w.innerHTML = '';
  const D = derive();
  $('dgnNote').textContent = S.dgnRun ? 'Run is on the stage \u00b7 the round is paused'
    : 'Four contests, four different tests';
  for(const d of B.DGN){
    const run = S.dgnRun && S.dgnRun.id === d.id ? S.dgnRun : null;
    const keys = S.dgnKeys[d.id] || 0;
    const el = document.createElement('div');
    el.className = 'dgn';
    let keyHtml = '';
    for(let i=0;i<d.cap;i++) keyHtml += '<span class="key' + (i < keys ? ' on' : '') + '"></span>';
    const nextIn = keys >= d.cap ? 'full' : hms(keyInterval(d) - (S.dgnKeyT[d.id]||0));

    // what your bag is actually bringing to this particular contest
    let reads;
    if(d.mode === 'drive') reads = 'Your best case swing lands around ' + fmt(D.pow * D.cpw * (1 + D.mst*B.MST_DMG));
    else if(d.mode === 'island') reads = 'First green ' + Math.round(islandChance(D, 0)*100)
      + '% (56 base + ' + Math.round(D.crit*B.ISLAND_CRIT*100) + ' from pure strike), then '
      + Math.round(islandChance(D, 4)*100) + '% by the fifth and '
      + Math.round(islandChance(D, 9)*100) + '% by the tenth';
    else if(d.mode === 'chip') reads = 'About ' + Math.round(chipChance(D)*100) + '% of your chips would drop';
    else reads = 'Carry ' + fmt(D.dps) + ' a second against floors that keep growing';

    el.innerHTML = '<div class="dh"><span class="dn">' + d.n + '</span><span class="keys">' + keyHtml + '</span></div>'
      + '<div class="dd">' + d.d + '</div>'
      + '<div class="dd" style="color:var(--faint);margin-top:4px">' + d.how + '</div>'
      + '<div class="dm">' + reads + '</div>'
      + '<div class="dm">Pays ' + d.cn + ' \u00b7 best ' + ((S.dgnFloor[d.id]||0)+1)
      + ' \u00b7 ' + Math.round(d.run) + 's \u00b7 key in ' + nextIn + '</div>'
      + '<div class="bar"><i style="width:' + (run ? clamp(run.t/run.dur,0,1)*100 : 0) + '%"></i></div>'
      + '<div class="btnrow" style="margin-top:8px"></div>';
    const br = el.querySelector('.btnrow');

    // the Island Green is the one with a decision in it, so it gets a dial
    if(d.mode === 'island'){
      const cur = B.BANK_OPTS.includes(S.islandBank) ? S.islandBank : 5;
      const bb = document.createElement('button');
      bb.className = 'mini';
      bb.textContent = 'Bank at ' + cur;
      bb.onclick = () => {
        const i = B.BANK_OPTS.indexOf(cur);
        S.islandBank = B.BANK_OPTS[(i + 1) % B.BANK_OPTS.length];
        renderDgn();
      };
      br.appendChild(bb);
    }
    const b = document.createElement('button');
    if(run){
      b.className = 'mini go';
      b.textContent = run.mode === 'drive' ? 'On the tee \u00b7 drive ' + run.shots + '/' + B.DRIVE_SHOTS
        : run.mode === 'island' ? 'On the stage \u00b7 ' + run.made + ' greens'
        : run.mode === 'chip' ? 'On the stage \u00b7 ' + run.made + ' dropped'
        : 'On the stage \u00b7 floor ' + (run.floor+1);
    }else{
      b.className = 'mini' + (keys > 0 && !S.dgnRun ? ' go' : ' dim');
      b.textContent = S.dgnRun ? 'Caddie is out' : keys > 0 ? 'Play it' : 'No keys';
      b.onclick = () => startDgn(d);
    }
    br.appendChild(b);
    w.appendChild(el);
  }
}

    ['Aces', fmt(S.aces, 0)],

/* ---- legacy ---- */
function renderLegacy(){
  const gain = legacyGain();
  $('legNote').textContent = fmt(S.legacy) + ' legacy held';
  $('legBox').innerHTML = gain > 0
    ? '<div class="hint">Retiring clears out your purse and all your range work. '
      + 'Your bag, your shot book, everything you have found in the Depths and all your currencies '
      + 'come with you.</div>'
      + '<div class="row"><div><div class="nm">Sign the card</div>'
      + '<div class="ds">Tour Card ' + roman(S.tier) + ' with ' + S.cups + ' cups banked.</div></div>'
      + '<button class="buy ok" id="retireBtn"><span class="lbl">Retire</span><span class="amt">+'
      + fmt(gain) + '</span></button></div>'
    : '<div class="empty">Play one full event and retirement opens up.<br>'
      + 'Through ' + holesPlayed(S.hole) + ' of ' + (B.ROUND*B.DAYS) + ' holes.</div>';
  if(gain > 0) $('retireBtn').onclick = () => showSheet(
    '<h3>Sign the card?</h3><p>You bank ' + fmt(gain) + ' legacy and start again from Tour Card '
    + roman(relLv('chrono')) + '.</p><p>Every capped upgrade ladder gains ' + B.CAP_PER_LEGACY
    + ' more levels, permanently.</p>'
    + '<button class="act" onclick="hideSheet();retire()">Retire</button>'
    + '<button class="act ghost" onclick="hideSheet()">Keep playing</button>');

  // The Trophy Room
  const dc = discoverCost(), n = trophiesFound(), tot = B.TROPHY.length;
  $('relicNote').textContent = n + ' / ' + tot + ' found';
  const rows = $('relicRows');
  rows.innerHTML = '<div class="row"><div><div class="nm">Discover a trophy</div>'
    + '<div class="ds">' + (n >= tot ? 'That is the lot. Every trophy is on the shelf.'
        : (tot - n) + ' still out there somewhere. The gold ones turn up least often.') + '</div>'
    + '<div class="mt">Found <i>' + n + '</i> of ' + tot + '</div></div>'
    + '<button class="buy' + (S.legacy >= dc && n < tot ? ' ok' : ' no') + '" id="discBtn">'
    + '<span class="lbl">Discover</span><span class="amt">' + (n >= tot ? '\u2014' : fmt(dc)) + '</span></button></div>';
  if(n < tot) $('discBtn').onclick = () => discover();

  const order = { S:0, A:1, B:2 };
  const mine = B.TROPHY.filter(t => found(t.id))
    .sort((a,b) => order[a.t] - order[b.t] || a.n.localeCompare(b.n));
  if(!mine.length){
    rows.insertAdjacentHTML('beforeend',
      '<div class="empty">Nothing on the shelves yet. Retire, bank some legacy, '
      + 'and go and find the first one.</div>');
  }
  for(const t of mine){
    const lv = S.relic[t.id] || 0, c2 = upgradeCost(t), tier = B.TR_TIER[t.t];
    const col = 'var(' + tier.v + ')';
    // every figure goes through fmt, and anything the game clamps is shown
    // clamped: a trophy that reads +5.05 into a stat that stops at 1.00 is a lie
    const M = { '*pow':1.45, '*mst':1.30, '*gld':1.50, '*elm':1.40 }[t.k];
    let eff;
    if(M) eff = '\u00d7' + fmt(Math.pow(M, lv));
    else if(t.k === '@sun') eff = '+' + fmt(lv*B.SUN_ADD*100) + 'pp';
    else if(t.k === '@ember') eff = '+' + fmt(lv*B.EMBER_ADD*100) + 'pp';
    else if(t.k === '@chrono') eff = 'retire onto Tour Card ' + roman(Math.min(B.TIER_MAX, lv));
    else if(t.k === '@vault'){ const kp = Math.min(500, lv*B.VAULT_UPG);
      eff = fmt(kp, 0) + ' levels kept' + (kp >= 500 ? ' (all)' : ''); }
    else if(t.k === '@rift'){ const w = Math.max(B.RIFT_MIN_WAIT, Math.pow(B.RIFT_REGEN, lv));
      eff = '\u2212' + Math.round((1-w)*100) + '% wait' + (w <= B.RIFT_MIN_WAIT ? ' (max)' : ''); }
    else if(t.k === '@seed') eff = 'start with ' + Math.min(6, lv) + ' cards of purse'
      + (lv >= 6 ? ' (max)' : '');
    else if(t.k === 'reson') eff = 'damped affinity ' + Math.min(1, B.DAMPEN + t.v*lv).toFixed(2)
      + (B.DAMPEN + t.v*lv >= 1 ? ' (full)' : '');
    else if(t.k === 'pierce') eff = Math.round(Math.min(1, t.v*lv)*100) + '% of armour'
      + (t.v*lv >= 1 ? ' (all)' : '');
    else if(t.k === 'walk') eff = '\u2212' + Math.round(Math.min(0.45, t.v*lv)*100) + '% walk'
      + (t.v*lv >= 0.45 ? ' (max)' : '');
    else if(t.k === 'cdr') eff = '\u2212' + Math.round(Math.min(0.75, t.v*lv)*100) + '% cooldown'
      + (t.v*lv >= 0.75 ? ' (max)' : '');
    else if(t.k === 'mst') eff = '+' + fmt(t.v*lv*100) + 'pp';
    else if(t.k === 'crt' || t.k === 'prc' || t.k === 'drp') eff = '+' + fmt(t.v*lv*100) + 'pp';
    else if(t.k === 'cpw') eff = '+' + fmt(t.v*lv) + 'x';
    else eff = '+' + fmt(t.v*lv*100) + '%';
    const capped = lv >= B.TR_MAX;

    const d = rowShell();
    d.style.borderLeft = '2px solid ' + col;
    d.children[0].children[0].innerHTML = t.n
      + ' <span class="pill" style="border-color:' + col + ';color:' + col + '">' + tier.n + '</span>';
    d.children[0].children[1].textContent = t.d;
    d.children[0].children[2].innerHTML = 'Lv <i>' + lv + '</i>'
      + (capped ? '/' + B.TR_MAX : '') + ' \u00b7 <b>' + eff + '</b>';
    const btn = d.children[1];
    btn.className = 'buy' + (capped ? ' max' : S.legacy >= c2 ? ' ok' : ' no');
    btn.children[0].textContent = capped ? 'Capped' : 'Raise';
    btn.children[1].textContent = capped ? '\u2014' : fmt(c2);
    btn.onclick = () => upgradeTrophy(t.id);
    rows.appendChild(d);
  }
}

/* ---- tabs + full render ---- */
function setView(v){
  view = v;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.v === v));
  document.querySelectorAll('.view').forEach(e => e.classList.toggle('on', e.id === 'v-' + v));
  if(v === 'bag') renderBag();
  if(v === 'skl') renderSkillsTab();
  if(v === 'dgn') renderDgn();
  if(v === 'tour') renderTour();
  if(v === 'leg') renderLegacy();
  if(v === 'career') renderCareer();
  $('panel').scrollTop = 0;
}
function renderAll(){
  renderCard(); renderVitals(); refreshUpg(); renderBag(); renderSkills();
  renderDgn(); renderTour(); renderLegacy(); renderCareer(); renderSkillsTab();
}

  floors(n){ B.DGN.forEach(d => S.dgnFloor[d.id] = (S.dgnFloor[d.id]||0) + n); this.re(); },
  tier(n){ S.tier = clamp(S.tier + n, 0, B.TIER_MAX);
           S.tierMax = Math.max(S.tierMax || 0, S.tier);
           if(S.tier > S.bestTier) S.bestTier = S.tier; startHole(); this.re(); },
  tierSet(n){ S.tier = clamp(n, 0, B.TIER_MAX); S.tierMax = Math.max(S.tierMax||0, S.tier);
              startHole(); this.re(); },
  event(n){ QUIET = true;
    for(let i=0;i<n;i++){ S.hole = tournamentOf(S.hole)*B.ROUND*B.DAYS + 1; endTournament(); }
    QUIET = false; hideSheet(); startHole(); this.re(); },
  cards(n){ S.tierMax = clamp((S.tierMax||0) + n, 0, B.TIER_MAX); this.re(); },
  course(i){ const cs = B.COURSE[i]; if(!cs) return;
    // walk the schedule forward to the next event on that course
    for(let t = tournamentOf(S.hole); t < tournamentOf(S.hole) + 40; t++)
      if(courseFor(t).id === cs.id){ S.hole = (t-1)*B.ROUND*B.DAYS + 1; break; }
    S.scores = []; S.tourScore = 0; Scene.dFloor = -1; startHole(); this.re(); },
  weather(i){ S.chaosBump = (S.chaosBump||0); 
    for(let k=0;k<60;k++){ S.chaosBump++; if(chaosFor(S.hole,S.tier).n === B.CHAOS[i].n) break; }
    startHole(); this.re(); },
  depth(id){ const d = B.DGN.find(x=>x.id===id); if(!d) return;
    S.dgnRun = null; S.dgnKeys[id] = Math.max(1, S.dgnKeys[id]); startDgn(d); hideSheet(); },
  away(sec){ S.t = Date.now()/1000 - sec; offline(); },
  upg(n){ B.UPG.forEach(u => S.upg[u.id] = Math.min(capOf(u), (S.upg[u.id]||0) + n)); this.re(); },
  maxCapped(){ B.UPG.forEach(u => { if(u.cap) S.upg[u.id] = capOf(u); }); this.re(); },
  clearUpg(){ B.UPG.forEach(u => S.upg[u.id] = 0); this.re(); },
  gear(rar){ bagAdd(makeItem(S.tier, derive().drop, rar)); this.re(); },
  gearN(n){ for(let i=0;i<n;i++) bagAdd(makeItem(S.tier, derive().drop + 0.4, 1)); this.re(); },
  set(rar){ B.SLOTS.forEach(sl => { S.equip[sl.id] = makeItem(S.tier, 0, rar, sl.id); }); this.re(); },
  enhAll(){ B.SLOTS.forEach(sl => { const it = S.equip[sl.id]; if(it) it.enh = B.ENH_MAX; }); this.re(); },
  clearBag(){ S.bag = []; this.re(); },
  ball(el){ const it = S.equip.ball || makeItem(S.tier, 0, 3, 'ball');
            it.el = el; S.equip.ball = it; this.re(); },
  skills(){ B.SKILL.forEach(k => { if(!S.skillLv[k.id]) S.skillLv[k.id] = 1; }); this.re(); },
  skillMax(){ B.SKILL.forEach(k => S.skillLv[k.id] = B.SKILL_LV_MAX); this.re(); },
  nocd(){ B.SKILL.forEach(k => S.cd[k.id] = 0); this.re(); },
  fire(){ const D = derive(); S.carry.forEach(id => { const d = skillDef(id); if(d && S.skillLv[id]) fireSkill(d, D); });
          hideSheet(); },
  lv(n){ for(let i=0;i<n && !atMax();i++) addXp(xpNeed(S.lv) - S.xp + 1); this.re(); },
  para(n){ if(!atMax()) this.lv(60); for(let i=0;i<n;i++) addXp(paraNeed(S.para) - S.paraXp + 1); this.re(); },
  career0(){ S.lv=1; S.xp=0; S.para=0; S.paraXp=0; S.talPts=0; S.statPts=0;
    B.STATS.forEach(s=>S.stat[s.id]=0); B.TREES.forEach(t=>t.t.forEach(x=>S.tal[x.id]=0));
    B.PARAGON.forEach(c=>{ S.paraPts[c.id]=0; c.a.forEach(a=>S.paraSpent[c.id+'.'+a.id]=0); });
    this.re(); },
  tick(n){ S.tickets = Math.min(B.TICK_CAP, (S.tickets||0) + n); this.re(); },
  perks(){ B.PERKS.forEach(p => { if(p.dur) S.perkOn[p.id] = p.dur; }); this.re(); },
  perks0(){ S.perkOn = {}; this.re(); },
  ach(){ B.ACH.forEach(a => S.achDone[a.id] = 1); this.re(); },
  legacy(n){ S.legacy += n; this.re(); },
  relics(n){ B.TROPHY.forEach(r => { if((S.relic[r.id]||0) > 0)
    S.relic[r.id] = Math.min(B.TR_MAX, S.relic[r.id] + n); }); this.re(); },
  disc(n){ const pool = B.TROPHY.filter(t => !found(t.id));
    for(let i = 0; i < n && i < pool.length; i++) S.relic[pool[i].id] = 1; this.re(); },
  cups(n){ S.cups += n; this.re(); },
  retire(){ S.eventsPlayed = Math.max(S.eventsPlayed||0, B.RETIRE_EVENTS); hideSheet(); retire(); },
  skip(){ S.scores[holeInRound(S.hole)-1] = { d:0, n:'Par', par:parOf(S.hole) };
          advanceHole(); startHole(); this.re(); },
  skipN(n){ for(let i=0;i<n;i++){ advanceHole(); } startHole(); this.re(); },
  chaos(){ S.chaosBump = (S.chaosBump||0) + 1; startHole(); this.re(); },
  god(){ S.godmode = !S.godmode; this.re(); }
};

function renderCareer(){
