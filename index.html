const bump = (k, n) => { S.tally[k] = (S.tally[k] || 0) + (n || 1); };
function checkAch(){
  for(const a of B.ACH){
    if(S.achDone[a.id]) continue;
    if(achMetric(a.m) < a.v) continue;
    S.achDone[a.id] = 1;
    const r = a.r;
    let got;
    if(r.k === 'tick'){ grantTickets(r.v); got = '+' + r.v + ' tickets'; }
    else if(r.k === 'grit'){ S.grit += r.v; got = '+' + r.v + ' grit'; }
    else if(r.k === 'shard'){ S.shard += r.v; got = '+' + r.v + ' shards'; }
    else if(r.k === 'scroll'){ S.scroll += r.v; got = '+' + r.v + ' scrolls'; }
    else if(r.k === 'legacy'){ S.legacy += r.v; got = '+' + r.v + ' legacy'; }
    else if(r.k === 'crt' || r.k === 'drp' || r.k === 'prc') got = '+' + (r.v*100).toFixed(1) + 'pp ' + r.k;
    else got = '+' + Math.round(r.v*100) + '% ' + ({ pow:'swing power', gld:'purse', spd:'tempo',
      mst:'provisional chance', elm:'affinity', dgn:'Depths haul' }[r.k] || r.k);
    toast('<span class="achk">Achievement unlocked</span>' + a.n + ' \u00b7 <b>' + got + '</b>', 'ach');
    if(typeof renderCareer === 'function') renderCareer();
  }
}

function grantTickets(n, why){
  if(n <= 0) return;
  S.tickets = Math.min(B.TICK_CAP, (S.tickets || 0) + n);
  if(why) toast('+' + n + ' sponsor ticket' + (n > 1 ? 's' : '') + ' \u00b7 ' + why);
}
function usePerk(id){
  const p = perkDef(id); if(!p) return;
  if((S.tickets || 0) < p.cost){ toast('You are short on tickets'); return; }
  if(p.dur && perkLeft(id) > 0){ toast(p.n + ' is already going'); return; }
  S.tickets -= p.cost; S.perkUsed = (S.perkUsed || 0) + 1;
  const D = derive();
  if(p.dur){
    S.perkOn[id] = p.dur;
    toast('<b>' + p.n + '</b> \u00b7 ' + hms(p.dur));
  }else if(p.k === 'bank'){
    const g2 = Math.max(Meter.rate(), S.purse / Math.max(0.6, S.parTime)) * p.v;
    S.gold += g2; Meter.add(g2);
    toast('<b>' + p.n + '</b> \u00b7 ' + fmt(g2) + ' banked');
  }else if(p.k === 'holeout'){
    // fixed at eagle pace, not min(): clamping toward zero would card an Ace,
    // which pays 3.4x and would make a two-ticket perk the best purse in the game
    S.yards = 0; S.elapsed = S.parTime * 0.40;
    toast('<b>' + p.n + '</b> \u00b7 driven to the green');
  }else if(p.k === 'keys'){
    B.DGN.forEach(d => S.dgnKeys[d.id] = d.cap);
    toast('<b>' + p.n + '</b> \u00b7 every key refilled');
    renderDgn();
  }
  renderPerks(); renderVitals();
}
function tickPerks(dt){
  for(const id in S.perkOn){
    if(S.perkOn[id] <= 0){ delete S.perkOn[id]; continue; }
    S.perkOn[id] -= dt;
    if(S.perkOn[id] <= 0){ delete S.perkOn[id]; toast(perkDef(id).n + '  has worn off'); }
  }
}

/* =========================================================================
   GEAR
   ========================================================================= */
function rollRarity(luck, floorRar){
  const w = B.RARITY.map((r,i) => r.w * Math.pow(1 + luck, i));
  let tot = 0; for(let i=(floorRar||0);i<w.length;i++) tot += w[i];
  let x = Math.random() * tot;
  for(let i=(floorRar||0);i<w.length;i++){ x -= w[i]; if(x <= 0) return i; }
  return floorRar || 0;
}
function makeItem(ilvl, luck, floorRar, slotId){
  const sl = slotId ? B.SLOTS.find(s=>s.id===slotId)
                    : B.SLOTS[Math.floor(Math.random()*B.SLOTS.length)];
  const rar = rollRarity(luck, floorRar);
  const nAff = B.RARITY[rar].aff;
  const pool = B.AFFIX.slice();
  const aff = [];
  for(let i=0;i<nAff && pool.length;i++){
    const d = pool.splice(Math.floor(Math.random()*pool.length), 1)[0];
    aff.push({ k:d.id, roll: d.lo + Math.random()*(d.hi - d.lo) });
  }
  const it = {
    uid: S.uid++, slot: sl.id, rar, ilvl: Math.max(0, Math.round(ilvl)), enh: 0, aff,
    el: sl.id === 'ball' ? B.ELEM[Math.floor(Math.random()*B.ELEM.length)].id : null
  };
  it.name = nameItem(it, sl);
  return it;
}
function nameItem(it, sl){
  const p = B.PREFIX[clamp(Math.floor(it.rar*1.7 + Math.random()*2), 0, B.PREFIX.length-1)];
  let n = p + ' ' + sl.n;
  if(it.rar >= 2) n += ' ' + B.SUFFIX[hash32(it.uid*7919) % B.SUFFIX.length];
  return n;
}
function bagAdd(it){
  if(it.rar >= 4) bump('legend');
  if(it.rar >= 5) bump('myth');
  S.bag.push(it);
  if(S.bag.length > B.BAG_CAP){
    S.bag.sort((a,b) => itemScore(b) - itemScore(a));
    const cut = S.bag.splice(B.BAG_CAP);
    let sh = 0; cut.forEach(x => sh += 1 + x.rar);
    S.shard += sh;
    if(sh) toast('Locker was full, so I scrapped ' + cut.length + ' for <b>' + sh + '</b> shards');
  }
}
function equipItem(it){
  const cur = S.equip[it.slot];
  S.equip[it.slot] = it;
  S.bag = S.bag.filter(x => x.uid !== it.uid);
  if(cur) S.bag.push(cur);
  renderBag(); renderVitals();
}
function salvageItem(it){
  const v = Math.round((1 + it.rar*1.8) * (1 + it.enh*0.35));
  S.shard += v;
  S.bag = S.bag.filter(x => x.uid !== it.uid);
  toast('Scrapped for <b>' + v + '</b> shards');
  renderBag();
}
function enhCost(it){
  return Math.round(B.ENH_BASE * Math.pow(B.ENH_R, it.enh) * Math.pow(1.12, it.ilvl) * (1 + it.rar*0.5));
}
function enhChance(it){
  return it.enh < B.ENH_SAFE ? 1 : clamp(1 - (it.enh - B.ENH_SAFE + 1)*0.072, 0.22, 1);
}
function enhance(it){
  if(it.enh >= B.ENH_MAX) return;
  const c = enhCost(it);
  if(S.grit < c){ toast('Not enough grit for that'); return; }
  S.grit -= c;
  if(Math.random() < enhChance(it)){ it.enh++; if(it.enh >= B.ENH_MAX) bump('enh15');
    toast(it.name + ' \u2192 <b>+' + it.enh + '</b>'); }
  else toast('It did not take. Still +' + it.enh + ' and the grit is gone.');
  renderBag(); renderVitals();
}
const lockCount = it => (it.aff || []).filter(a => a.lock).length;
function rerollCost(it){
  const n = lockCount(it);
  const base = 6 + it.rar*5 + it.ilvl;
  return Math.ceil(base * (n ? B.LOCK_MULT * Math.pow(B.LOCK_EACH, n - 1) : 1));
}
function toggleLock(it, i){
  const a = it.aff[i]; if(!a) return;
  if(!a.lock && lockCount(it) >= it.aff.length - 1){
    toast('Leave at least one roll for the re-attune to change'); return;
  }
  a.lock = !a.lock;
  renderBag();
}
function rerollItem(it){
  const c = rerollCost(it);
  if(S.shard < c){ toast('Not enough shards for that'); return; }
  S.shard -= c;
  const kept = it.aff.filter(a => a.lock);
  const pool = B.AFFIX.filter(d => !kept.some(a => a.k === d.id));
  const aff = kept.slice();
  const want = B.RARITY[it.rar].aff;
  while(aff.length < want && pool.length){
    const d = pool.splice(Math.floor(Math.random()*pool.length), 1)[0];
    aff.push({ k:d.id, roll: d.lo + Math.random()*(d.hi - d.lo) });
  }
  it.aff = aff;
  toast(kept.length ? 'Re-attuned around ' + kept.length + ' locked' : 'Re-attuned');
  renderBag(); renderVitals();
}
function ascendCost(it){ return Math.round((26 + it.ilvl*3) * Math.pow(2.35, it.rar)); }
function ascendItem(it){
  if(it.rar >= B.RARITY.length-1){ toast('It is already Mythic'); return; }
  const c = ascendCost(it);
  if(S.shard < c){ toast('Not enough shards for that'); return; }
  S.shard -= c; it.rar++;
  const pool = B.AFFIX.filter(d => !it.aff.some(a => a.k === d.id));
  if(pool.length){ const d = pool[Math.floor(Math.random()*pool.length)];
    it.aff.push({ k:d.id, roll: d.lo + Math.random()*(d.hi - d.lo) }); }
  it.name = nameItem(it, B.SLOTS.find(s=>s.id===it.slot));
  toast('Ascended to <b>' + B.RARITY[it.rar].n + '</b>');
  renderBag(); renderVitals();
}

/* =========================================================================
   THE DEPTHS
   ========================================================================= */
function keyInterval(d){ const C = career();
  // floored, or a deep Riftkey means keys arrive instantly and the Depths stop
  // being a limited resource at all
  return d.regen * Math.max(B.RIFT_MIN_WAIT, Math.pow(B.RIFT_REGEN, relLv('rift')))
    * (C.sharp ? 0.6 : 1); }
function regenKeys(dt){
  for(const d of B.DGN){
    if(S.dgnKeys[d.id] >= d.cap){ S.dgnKeyT[d.id] = 0; continue; }
    S.dgnKeyT[d.id] += dt;
    const iv = keyInterval(d);
    while(S.dgnKeyT[d.id] >= iv && S.dgnKeys[d.id] < d.cap){
      S.dgnKeyT[d.id] -= iv; S.dgnKeys[d.id]++;
    }
  }
}
const dgnStartFloor = id => Math.max(0, Math.floor((S.dgnFloor[id] - 3) + relLv('rift')*B.RIFT_FLOOR + career().dfloor));
const floorWork = f => B.DGN_WORK * Math.pow(B.DGN_WORK_STEP, f);
// what a given depth is worth, shared by every mode so rewards stay comparable
const yieldAt = (f, D, d) => B.DGN_YIELD * Math.pow(B.DGN_YIELD_STEP, Math.max(0, f))
  * D.dgnY * (d.ym || 1);
// turn any number into an equivalent depth, so a long drive and a deep floor
// can be paid on the same scale
const asFloor = v => Math.max(0, Math.log(Math.max(1, v / B.DGN_WORK)) / Math.log(B.DGN_WORK_STEP));

// A single swing resolved in full: crit, provisionals and an affinity roll.
// This is what the Long Drive measures.
function swingRoll(D){
  let dmg = D.pow;
  if(Math.random() < D.crit) dmg *= D.cpw;
  let extra = Math.floor(D.mst) + (Math.random() < (D.mst % 1) ? 1 : 0);
  while(extra-- > 0) dmg += D.pow * B.MST_DMG * (Math.random() < D.crit ? D.cpw : 1);
  if(D.ball && D.ball.el && Math.random() < D.proc)
    dmg *= 1 + Math.min(D.elemDmg, B.ELEM_CAP);
  return dmg;
}
const islandChance = (D, made) => clamp(
  B.ISLAND_BASE + D.crit*B.ISLAND_CRIT - made*B.ISLAND_DECAY, B.ISLAND_MIN, B.ISLAND_MAX);
const chipChance = D => clamp((D.procRaw !== undefined ? D.procRaw : D.proc) * B.CHIP_PROC, 0.05, 0.88);

function startDgn(d){
  if(S.dgnRun){ toast('There is already a caddie down there'); return; }
  if(S.dgnKeys[d.id] < 1){ toast('No keys left for ' + d.n); return; }
  S.dgnKeys[d.id]--; bump('runs');
  const f0 = dgnStartFloor(d.id);
  const dur = d.run * (career().sharp ? 1.4 : 1);
  const R = { id:d.id, mode:d.mode, t:0, dur, dead:false, evt:null, evtT:0, next:0 };
  if(d.mode === 'drive'){ R.shots = 0; R.best = 0; R.last = 0; R.wind = 1; R.next = 1.2; }
  else if(d.mode === 'island'){
    R.made = 0; R.pot = yieldAt(f0, derive(), d); R.chance = 0; R.banked = false;
    R.target = B.BANK_OPTS.includes(S.islandBank) ? S.islandBank : 5; R.next = 1.4;
  }
  else if(d.mode === 'chip'){ R.shot = 0; R.made = 0; R.pot = 0; R.f0 = f0; R.next = 1.2; }
  else { R.floor = f0; R.cleared = 0; R.work = floorWork(f0); R.full = R.work; R.fT = 0; R.mod = 1; }
  S.dgnRun = R;
  toast('Entered <b>' + d.n + '</b>');
  renderDgn();
}

function rollDgnEvent(R){
  if(Math.random() > B.DGN_EVENT_CHANCE) return;
  let tot = 0; for(const e of B.DGN_EVENTS) tot += e.w;
  let x = Math.random()*tot, pick = B.DGN_EVENTS[0];
  for(const e of B.DGN_EVENTS){ x -= e.w; if(x <= 0){ pick = e; break; } }
  R.evts = R.evts || []; R.evts.push(pick.n);
  if(pick.k === 'time') R.t += pick.v;
  else if(pick.k === 'mod') R.mod = pick.v;
  else if(pick.k === 'work') { R.work *= pick.v; R.full *= pick.v; }
  else if(pick.k === 'back' && R.cleared > 0){
    R.cleared--; R.floor--;
    R.work = floorWork(R.floor); R.full = R.work; R.fT = 0;
  }
  R.evt = pick; R.evtT = 2.4;
  toast((pick.bad ? '' : '<b>') + pick.n + (pick.bad ? '' : '</b>'));
}

function tickDgn(dt, D){
  const R = S.dgnRun; if(!R) return;
  const d = B.DGN.find(x => x.id === R.id);
  R.t += dt;
  if(R.evtT > 0) R.evtT -= dt;

  // A run that ends the instant a shot is struck never shows the shot. When a
  // contest reaches its end it waits here for the ball to come down first.
  if(R.settle > 0){
    R.settle -= dt;
    if(R.settle <= 0) endDgn(d, R, D);
    return;
  }
  R.next -= dt;

  if(R.mode === 'drive'){
    if(R.next <= 0){
      if(R.shots >= B.DRIVE_SHOTS){ R.settle = 1.2; return; }
      R.shots++;
      R.wind = B.DRIVE_WIND[0] + Math.random()*(B.DRIVE_WIND[1] - B.DRIVE_WIND[0]);
      R.last = swingRoll(D) * R.wind;
      if(R.last > R.best) R.best = R.last;
      R.next = B.DRIVE_GAP;
      R.log = R.log || []; R.log.push(R.last);
      Scene.swing(R.last, R.wind > 1.2, D.ball && D.ball.el);
    }
    if(R.t >= R.dur) R.settle = 1.2;

  }else if(R.mode === 'island'){
    if(R.next <= 0){
      R.chance = islandChance(D, R.made);
      R.startChance = R.startChance === undefined ? islandChance(D, 0) : R.startChance;
      // The first one is a gimme. Without it a run could end on the opening
      // shot inside two seconds, having paid nothing at all.
      const ok = R.made === 0 ? true : Math.random() < R.chance;
      Scene.aimed(R.pot, D.ball && D.ball.el, Scene.holeLen(),
                  ok ? (Math.random()-0.5)*1.1 : (Math.random()<0.5?-1:1)*(2.4 + Math.random()*1.4),
                  ok);
      Scene.holed({ n: ok ? 'ON THE GREEN' : 'IN THE WATER', d: ok ? -2 : 1 });
      if(ok){
        R.made++; R.pot *= B.ISLAND_MULT;
        Scene.spark('verdant');
        if(R.made >= R.target){ R.banked = true; R.settle = 1.3; return; }
        R.next = B.ISLAND_GAP;
      }else{
        R.dead = true; R.pot *= B.ISLAND_SALVAGE; R.settle = 1.3; return;
      }
    }
    if(R.t >= R.dur){ R.banked = true; R.settle = 1.2; }

  }else if(R.mode === 'chip'){
    if(R.next <= 0){
      if(R.shot >= B.CHIP_SHOTS){ R.settle = 1.2; return; }
      R.shot++;
      R.chance = chipChance(D);
      const inHole = Math.random() < R.chance;
      // every chip finishes on the green; the good ones finish in the hole
      Scene.aimed(D.pow, D.ball && D.ball.el, Scene.holeLen(),
                  inHole ? 0 : (Math.random()-0.5)*2.6, inHole);
      if(inHole){
        R.made++;
        R.pot += yieldAt(R.f0 + R.made*B.CHIP_STEP, D, d);
        Scene.holed({ n:'DROPPED', d:-3 });
        Scene.spark('verdant');
      }
      R.next = B.CHIP_GAP;
    }
    if(R.t >= R.dur) R.settle = 1.2;

  }else{
    R.fT += dt;
    R.work -= D.dps * (R.mod || 1) * dt;
    if(R.work <= 0 && R.fT >= B.DGN_MIN_FLOOR){
      R.cleared++; R.floor++; R.mod = 1; R.fT = 0;
      R.work = floorWork(R.floor); R.full = R.work;
      rollDgnEvent(R);
    }
    if(R.t >= R.dur) endDgn(d, R, D);
  }
}

function endDgn(d, R, D){
  S.dgnRun = null;
  const stats = [];
  let fe = -1, head = '', pot = 0;

  if(R.mode === 'drive'){
    const log = R.log || [];
    const avg = log.length ? log.reduce((a,b) => a+b, 0)/log.length : 0;
    fe = R.best > 0 ? asFloor(R.best) : -1;
    head = R.best > 0 ? 'Longest drive of the day: ' + fmt(R.best) + ' yards.'
                      : 'Not one of them found the fairway.';
    stats.push(['Drives hit', log.length + ' of ' + B.DRIVE_SHOTS]);
    stats.push(['Longest', fmt(R.best) + ' yds']);
    stats.push(['Average', fmt(avg) + ' yds']);
    if(log.length) stats.push(['Shortest', fmt(Math.min.apply(null, log)) + ' yds']);

  }else if(R.mode === 'island'){
    if(R.made > 0){
      pot = R.pot; fe = dgnStartFloor(d.id) + R.made*1.1;
      head = R.dead
        ? 'Wet on number ' + (R.made + 1) + '. You walked off with a quarter of the pot.'
        : 'Banked clean on ' + R.made + '. Nerve held.';
    }else head = 'Straight in the water off the first one.';
    stats.push(['Greens hit', R.made + ' of ' + R.target]);
    stats.push(['Finished', R.dead ? 'in the water' : 'banked']);
    stats.push(['Make chance at the start', Math.round((R.startChance||0)*100) + '%']);
    stats.push(['Make chance on the last one', Math.round((R.chance||0)*100) + '%']);
    stats.push(['Why', '56 base + ' + Math.round(D.crit*B.ISLAND_CRIT*100)
      + ' pure strike, minus ' + Math.round(B.ISLAND_DECAY*100*R.made) + ' for greens hit']);
    stats.push(['Pot', fmt(R.pot) + (R.dead && R.made ? ' after salvage' : '')]);

  }else if(R.mode === 'chip'){
    if(R.made > 0){
      pot = R.pot; fe = R.f0 + R.made*B.CHIP_STEP;
      head = R.made + ' of ' + R.shot + ' chips found the bottom of the cup.';
    }else head = 'Twenty five chips and not one of them dropped.';
    stats.push(['Chips played', R.shot + ' of ' + B.CHIP_SHOTS]);
    stats.push(['Dropped', String(R.made)]);
    stats.push(['Strike rate', R.shot ? Math.round(R.made/R.shot*100) + '%' : '0%']);
    stats.push(['Drop chance', Math.round((R.chance||0)*100) + '%']);

  }else{
    const deepest = R.floor - 1;
    if(R.cleared > 0){ fe = deepest; head = 'Down to floor ' + (deepest + 1) + ' before the clock went.'; }
    else head = 'The clock went on the very first floor.';
    stats.push(['Floors cleared', String(R.cleared)]);
    stats.push(['Deepest floor', String(R.floor + (R.cleared ? 0 : 1))]);
    stats.push(['Carry', fmt(D.dps) + ' /s']);
    if(R.evts && R.evts.length) stats.push(['What happened', R.evts.join(', ')]);
  }
  stats.push(['Time on the clock', R.t.toFixed(1) + 's of ' + Math.round(R.dur) + 's']);

  const rewards = [];
  if(fe >= 0){
    Scene.depthsFlash((B.DGN_PAL[d.id] || {}).glow || '#57E0BE');
    if(fe > (S.dgnFloor[d.id] || 0)){ S.dgnFloor[d.id] = Math.round(fe); rewards.push(['New best', 'yes']); }
    const xp = B.XP_FLOOR * Math.pow(1 + fe, B.XP_FLOOR_P) * (1 + fe*0.2);
    addXp(xp);
    const tk = Math.floor(fe / B.TICK_DEPTH_EVERY);
    if(tk > 0) grantTickets(tk);

    const yield_ = pot > 0 ? pot : yieldAt(fe, D, d);
    if(d.cur === 'gold'){
      // priced in holes of purse, so it never falls behind the course
      const holes = B.VAULT_HOLES + fe * B.VAULT_PER_MARK;
      const g2 = purseFor(S.hole, S.tier, D.gold) * holes;
      S.gold += g2;
      rewards.push(['Purse', fmt(g2) + ' (' + Math.round(holes) + ' holes worth)']);
    }else{
      const n = Math.max(1, Math.round(yield_));
      S[d.cur] += n; rewards.push([d.cn, '+' + fmt(n, 0)]);
    }
    rewards.push(['Experience', '+' + fmt(xp)]);
    if(tk > 0) rewards.push(['Sponsor tickets', '+' + tk]);
    // a new personal best always comes home with something
    const newBest = rewards.some(r => r[0] === 'New best');
    if(newBest || Math.random() < (d.gear !== undefined ? d.gear : B.DGN_GEAR_CHANCE) + relLv('rift')*0.05){
      const floorRar = Math.max(d.floorRar || 0, Math.min(2, Math.floor(fe/8)));
      const it = makeItem(S.tier + Math.min(3, Math.floor(fe/5)), D.drop + 0.35, floorRar);
      bagAdd(it);
      rewards.push(['Gear', B.RARITY[it.rar].n + ' ' + B.SLOTS.find(s => s.id === it.slot).n]);
    }
  }else{
    Scene.depthsFlash('#E4574A');
    rewards.push(['Nothing', 'walked away empty']);
  }

  const rowsHtml = a => a.map(([k, v]) =>
    '<div class="lb"><span class="p"></span><span>' + k + '</span><span class="s">' + v + '</span></div>').join('');
  showSheet('<h3>' + d.n + '</h3><p>' + head + '</p>'
    + '<div class="eyebrow" style="margin:10px 0 4px">Card</div>' + rowsHtml(stats)
    + '<div class="eyebrow" style="margin:12px 0 4px">Paid out</div>' + rowsHtml(rewards)
    + '<button class="act" onclick="hideSheet()">Back to the course</button>');
  renderDgn(); renderBag();
}

/* =========================================================================
   THE CARD
   ========================================================================= */
// The number to beat this week. Each cup already on the shelf makes it harder,
// so a cup is always the same distance away no matter how strong you are.
const eventTarget = () => Math.max(B.TARGET_FLOOR,
  B.TARGET_BASE + B.TARGET_PER_CUP * (S.cups || 0));
// How the purse follows the card: at target you take the base, and every shot
// under it pays more, to a ceiling.
const payShare = (score, target) =>
  clamp(1 + (target - score) / B.PAY_SPAN, B.PAY_MIN, B.PAY_MAX);
const cupPoints = (t, share) => Math.round(B.CUP_BASE[slotOfEvent(t)] * share);

/* =========================================================================
   THE NINE
   Something to play for that resolves inside a few minutes rather than at the
   end of seventy two holes.
   ========================================================================= */
const nineIndex = h => holeInRound(h) <= 9 ? 0 : 1;
// which band of goal you get asked for, from the standard you have been setting
function nineBand(){
  const per = (S.bestNine === undefined ? 0 : S.bestNine) / 9;
  return per <= B.NINE_BAND[1] ? 2 : per <= B.NINE_BAND[0] ? 1 : 0;
}
function nineGoalFor(h){
  const band = nineBand();
  const pool = B.NINE_GOALS.filter(g => g.t === band);
  return pool[hash32(roundIndex(h)*7919 + nineIndex(h)*104729 + band*31) % pool.length];
}
function startNine(){
  S.nine = { idx: nineIndex(S.hole), n: 0, total: 0, birdie:0, eagle:0, ace:0,
             bogey:0, allUnder:true, par5eagle:0, goal: nineGoalFor(S.hole).id };
}
function nineProgress(){
  const N = S.nine; if(!N) return { have:0, need:1, goal:null };
  const goal = B.NINE_GOALS.find(g => g.id === N.goal) || B.NINE_GOALS[0];
  let have;
  if(goal.k === 'nobogey') have = N.bogey === 0 ? 1 : 0;
  else if(goal.k === 'allunder') have = (N.allUnder && N.n === 9) ? 1 : 0;
  else have = N[goal.k] || 0;
  return { have, need: goal.v, goal };
}
function resolveNine(){
  const N = S.nine; if(!N) return;
  const D = derive(), hole = purseFor(S.hole, S.tier, D.gold);
  const p = nineProgress();
  const won = p.have >= p.need;
  const best = S.bestNine === undefined || N.total < S.bestNine;
  const bits = [];
  if(won){
    const r = p.goal.r;
    if(r.k === 'purse'){ const g = hole*r.v; S.gold += g; Meter.add(g); bits.push(fmt(g) + ' purse'); }
    else if(r.k === 'tick'){ grantTickets(r.v); bits.push(r.v + ' ticket' + (r.v>1?'s':'')); }
    else { S[r.k] += r.v; bits.push(r.v + ' ' + (r.k === 'shard' ? 'shards' : r.k)); }
    S.ninesWon = (S.ninesWon || 0) + 1;
  }
  if(best){
    S.bestNine = N.total;
    const g = hole * B.NINE_BEST_PAY; S.gold += g; Meter.add(g);
    bits.push('best nine, ' + fmt(g));
  }
  const fm = n => n === 0 ? 'E' : n > 0 ? '+' + n : String(n);
  const name = N.idx === 0 ? 'Front nine' : 'Back nine';
  if(bits.length) toast('<b>' + name + ' ' + fm(N.total) + '</b> \u00b7 ' + bits.join(' \u00b7 '));
  else toast(name + ' ' + fm(N.total) + ' \u00b7 ' + p.goal.n.toLowerCase() + ' missed');
  Scene.holed({ n: won || best ? name.toUpperCase() : fm(N.total), d: won || best ? -2 : 0 });
}

/* =========================================================================
   FINISHING A HOLE
   ========================================================================= */
const Meter = {
  buf: [], acc: 0,
  add(g){ this.acc += g; },
  tick(dt){
    this.buf.push({ g:this.acc, t:dt }); this.acc = 0;
    if(this.buf.length > 90) this.buf.shift();
  },
  rate(){
    let g = 0, t = 0;
    for(const b of this.buf){ g += b.g; t += b.t; }
    return t > 0 ? g/t : 0;
  }
};
// While catching up we replay thousands of holes. Every sheet and toast they
// would have raised is swallowed: the summary at the end says what happened.
let QUIET = false;
// Set while a catch-up is replaying holes, so anything that pays out can tell
// the difference between a round that was played and one that was fast-forwarded.
let OFFLINE = false;
function toast(html, cls){
  if(QUIET) return;
  const el = document.createElement('div');
  el.className = 'toast' + (cls ? ' ' + cls : ''); el.innerHTML = html;
  $('toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 2300);
  setTimeout(() => el.remove(), 2700);
  const kids = $('toasts').children;
  while(kids.length > 2) kids[0].remove();
}

function finishHole(D){
  const ratio = S.elapsed / S.parTime;
  const sc = scoreFor(ratio);
  const pay = S.purse * (1 - B.SWING_SHARE) * sc.pay;
  S.gold += pay; Meter.add(pay);

  const idx = holeInRound(S.hole) - 1;
  S.scores[idx] = { d: sc.d, n: sc.n, par: parOf(S.hole) };
  S.tourScore += sc.d;
  S.totalHoles++;
  if(!S.nine || S.nine.idx !== nineIndex(S.hole)) startNine();
  const N = S.nine;
  N.n++; N.total += sc.d;
  if(sc.d <= -1) N.birdie++;
  if(sc.d <= -2){ N.eagle++; if(parOf(S.hole) === 5) N.par5eagle++; }
  if(sc.d === -4) N.ace++;
  if(sc.d >= 1) N.bogey++;
  if(sc.d >= 0) N.allUnder = false;
  if(N.n >= 9) resolveNine();
  if(sc.d === -4) S.aces++;
  if(sc.d <= -1) bump('birdie');
  if(sc.d <= -2) bump('eagle');
  if(sc.d >= 4) bump('snow');
  if(sc.d < S.bestScore) S.bestScore = sc.d;
  addXp(B.XP_HOLE * Math.pow(1 + S.tier, B.XP_TIER) * sc.pay * (parOf(S.hole)/4));
  Scene.holed(sc);

  // gear drops: the closing hole always gives one up
  const luck = D.drop;
  if(isClosing(S.hole) && isSunday(S.hole)) grantTickets(B.TICK_SUNDAY, 'Sunday finish');
  if(isClosing(S.hole)){
    const it = makeItem(S.tier, luck + 0.15, isSunday(S.hole) ? 1 : 0);
    bagAdd(it);
    toast('<b>' + B.RARITY[it.rar].n + '</b> ' + it.name);
  }else if(Math.random() < luck){
    const it = makeItem(S.tier, luck, 0);
    bagAdd(it);
    if(it.rar >= 2) toast('<b>' + B.RARITY[it.rar].n + '</b> ' + it.name);
  }

  // auto-climb: five straight eagles means this Tour Card is finished
  S.streak = ratio <= 0.47 ? (S.streak||0) + 1 : 0;
  if(S.autoClimb && S.streak >= 5 && S.tier < B.TIER_MAX){ S.streak = 0; climb(1, true); }

  advanceHole();
  startHole();
  renderCard(); renderTour();
}

function advanceHole(){
  const wasClosing = isClosing(S.hole);
  const wasSunday = isSunday(S.hole);
  S.hole++;
  if(holeInRound(S.hole) === 1 || holeInRound(S.hole) === 10) startNine();
  if(wasClosing){
    if(wasSunday) endTournament();
    S.scores = [];
  }
}
function endTournament(){
  const t = tournamentOf(S.hole - 1);
  const score = S.tourScore, target = eventTarget();
  const beat = score <= target;
  const share = payShare(score, target);
  const D = derive();
  // An event that resolves during a catch-up is paid at the same discount as
  // the holes that fed it. At full rate these were worth more than four times
  // the hole purse the away summary reported, so most of an offline session's
  // income was arriving off the books.
  const rate = OFFLINE ? B.OFFLINE_RATE * B.OFFLINE_PURSE : 1;
  const cash = purseFor(S.hole - 1, S.tier, D.gold) * B.PLACE_PURSE * share * rate;
  const pts = Math.round(cupPoints(t, share) * rate);
  S.points += pts; S.gold += cash; Meter.add(cash);
  grantTickets(Math.round((B.TICK_EVENT + (beat ? B.TICK_WIN : 0)) * rate), 'event finish');
  if(beat) S.cups++;
  S.wins = (S.wins || 0) + (beat ? 1 : 0);
  // A catch-up never accumulates a score, so every event it resolves finishes on
  // level par. Posted as a card that reads as a personal best of E on a save
  // that has not yet finished a round in anger.
  if(!OFFLINE && score < (S.bestRound === undefined ? 1e9 : S.bestRound)) S.bestRound = score;

  const fm = n => n === 0 ? 'E' : n > 0 ? '+' + n : String(n);
  showSheet('<h3>' + eventName(t) + '</h3>'
    + '<p>' + (beat ? 'You beat the number.' : 'Card signed and posted.')
    + ' Four rounds, seventy two holes.</p>'
    + '<div class="big">' + fm(score) + '</div>'
    + '<ul><li>Target: ' + fm(target) + (beat ? ' \u2014 <b style="color:var(--brass)">beaten</b>'
        : ' \u2014 missed by ' + (score - target)) + '</li>'
    + '<li>Best card: ' + fm(S.bestRound) + '</li>'
    + '<li>Prize money: ' + fmt(cash) + ' (' + share.toFixed(2) + 'x)</li>'
    + '<li>Cup points: ' + fmt(pts) + '</li>'
    + '<li>Cups held: ' + S.cups + (beat ? ' <b style="color:var(--brass)">(new)</b>' : '')
    + ' \u00b7 next target ' + fm(eventTarget()) + '</li></ul>'
    + '<button class="act" onclick="hideSheet()">Next event</button>');

  S.eventsPlayed = (S.eventsPlayed || 0) + 1;
  S.tierEvents[S.tier] = eventsOn(S.tier) + 1;
  if(S.tier >= (S.tierMax || 0) && eventsOn(S.tier) >= B.EVENTS_PER_CARD
     && (S.tierMax || 0) < B.TIER_MAX){
    S.tierMax = (S.tierMax || 0) + 1;
    toast('Tour Card <b>' + roman(S.tierMax) + '</b> unlocked');
  }
  S.tourScore = 0;
}function ordinal(n){
  const s = ['th','st','nd','rd'], v = n % 100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}

/* =========================================================================
   THE TOUR CARD
   ========================================================================= */
const eventsOn = tier => S.tierEvents[tier] || 0;
const cardUnlocked = tier => tier <= (S.tierMax || 0);
const eventsToNext = () => Math.max(0, B.EVENTS_PER_CARD - eventsOn(S.tierMax || 0));
function projectedRatio(tier){
  const D = derive();
  const ch = chaosFor(S.hole, tier);
  const y = yardageFor(S.hole, tier, ch);
  return (y / Math.max(1e-9, D.dps)) / parTimeFor(S.hole);
}
function climb(n, quiet, force){
  let to = clamp(S.tier + n, 0, B.TIER_MAX);
  if(!force && to > (S.tierMax || 0)){
    if(!quiet) toast('Tour Card ' + roman((S.tierMax||0) + 1) + ' needs '
      + eventsToNext() + ' more event' + (eventsToNext() === 1 ? '' : 's') + ' on this card');
    return;
  }
  if(to === S.tier) return;
  S.tier = to;
  if(S.tier > S.bestTier) S.bestTier = S.tier;
  if(!quiet) toast('Tour Card <b>' + roman(S.tier) + '</b>');
  else toast('Card <b>' + roman(S.tier) + '</b> earned on form');
  startHole(); renderTour(); renderVitals();
}

/* =========================================================================
   RETIREMENT
   ========================================================================= */
function legacyGain(){
  if((S.eventsPlayed || 0) < B.RETIRE_EVENTS) return 0;
  return Math.floor(B.LEGACY_K * Math.pow(S.tier + 1, B.LEGACY_EXP) * Math.pow(B.CUP_MULT, S.cups));
}
const discoverCost = () => Math.ceil(B.DISC_COST * Math.pow(B.DISC_R, trophiesFound()));
const trophyMult = t => t.k && t.k[0] === '*';
const trophyRatio = t => trophyMult(t) ? B.TR_R_MULT : B.TR_R;
const upgradeCost = t => Math.ceil(B.TR_COST * B.TR_TIER[t.t].m
  * Math.pow(trophyRatio(t), S.relic[t.id] || 0));
function discover(){
  const pool = B.TROPHY.filter(t => !found(t.id));
  if(!pool.length){ toast('Every trophy is in the room'); return; }
  const c = discoverCost();
  if(S.legacy < c){ toast('Not enough legacy'); return; }
  S.legacy -= c;
  let tot = 0; for(const t of pool) tot += B.TR_TIER[t.t].w;
  let x = Math.random()*tot, pick = pool[0];
  for(const t of pool){ x -= B.TR_TIER[t.t].w; if(x <= 0){ pick = t; break; } }
  S.relic[pick.id] = 1;
  showSheet('<h3>' + pick.n + '</h3>'
    + '<p style="color:var(' + B.TR_TIER[pick.t].v + ')">' + B.TR_TIER[pick.t].n + ' trophy</p>'
    + '<p>' + pick.d.charAt(0).toUpperCase() + pick.d.slice(1) + '.</p>'
    + '<div class="big">' + trophiesFound() + ' / ' + B.TROPHY.length + '</div>'
    + '<button class="act" onclick="hideSheet()">To the room</button>');
  renderLegacy(); renderVitals();
}
function upgradeTrophy(id){
  const t = trophyDef(id); if(!t || !found(id)) return;
  if((S.relic[id] || 0) >= B.TR_MAX){ toast('That one is as high as it goes'); return; }
  const c = upgradeCost(t);
  if(S.legacy < c){ toast('Not enough legacy'); return; }
  S.legacy -= c; S.relic[id]++;
  renderLegacy(); renderVitals();
}
function retire(){
  const gain = legacyGain();
  if(gain <= 0) return;
  S.legacy += gain; S.retires++;

  // The bag is yours. Clubs you found do not evaporate because you signed a
  // card; what resets is the money, the range work and the ladder.
  S.gold = Math.pow(B.SEED_MULT, relLv('seed')) > 1
    ? B.G0 * Math.pow(B.TIER_G, Math.min(6, relLv('seed'))) * 40 : 0;
  S.tier = Math.min(B.TIER_MAX, relLv('chrono'));
  S.hole = 1; S.scores = []; S.tourScore = 0; S.streak = 0;
  const keepUpg = relLv('vault') * B.VAULT_UPG;
  B.UPG.forEach(u => S.upg[u.id] = Math.min(capOf(u), keepUpg));
  S.tierEvents = {}; S.tierMax = Math.min(B.TIER_MAX, relLv('chrono'));
  S.buff = {}; B.SKILL.forEach(k => S.cd[k.id] = 0); S.swCount = 0;
  // level, attributes, talents and paragon are the golfer, not the run: untouched.

  startHole();
  showSheet('<h3>Retired</h3><p>Card signed. The money and the range work are gone, but the bag came with you.</p>'
    + '<div class="big">+' + fmt(gain) + ' legacy</div>'
    + '<p>Every capped upgrade ladder opens ' + B.CAP_PER_LEGACY + ' further levels. Retirements: '
    + S.retires + '.</p><button class="act" onclick="hideSheet()">Back to the tee</button>');
  renderAll();
}

/* =========================================================================
   OFFLINE
   ========================================================================= */
function offline(){
  const dt = clamp(Date.now()/1000 - (S.t || Date.now()/1000), 0, B.OFFLINE_CAP);
  if(dt < 60){ regenKeys(dt); return; }
  regenKeys(dt);
  const D = derive();
  const ch = chaosFor(S.hole, S.tier);
  const y = yardageFor(S.hole, S.tier, ch);
  const secs = Math.max(S.walkMin || B.WALK_MIN, y / Math.max(1e-9, D.dps));
  const purse = purseFor(S.hole, S.tier, D.gold);

  // Play the holes out rather than estimating a rate: the round advances, the
  // card fills, events finish and the schedule moves on, all at a discount.
  const holes = Math.min(20000, Math.floor(dt * B.OFFLINE_RATE / secs));

  // Measured rather than assumed: the loop below resolves events as it goes,
  // and those pay too. Reporting only the hole purse had the summary claiming
  // 31K on a twelve hour return that actually banked 174K.
  const goldBefore = S.gold;
  S.gold += purse * holes * B.OFFLINE_PURSE;

  const startEvents = S.eventsPlayed || 0, startLv = S.lv;
  const startCard = S.tierMax || 0, startCups = S.cups || 0;
  let gear = 0;
  QUIET = true; OFFLINE = true;
  for(let i = 0; i < holes; i++){
    S.totalHoles++;
    addXp(B.XP_HOLE * Math.pow(1 + S.tier, B.XP_TIER) * 1.2 * (parOf(S.hole)/4) * 0.6);
    if(isClosing(S.hole) && S.bag.length < B.BAG_CAP && Math.random() < 0.5){
      bagAdd(makeItem(S.tier, D.drop, 0)); gear++;
    }
    advanceHole();
  }
  OFFLINE = false; QUIET = false;
  startHole();

  const g = S.gold - goldBefore;
  const rows = [
    ['Away for', hms(dt)],
    ['Holes played', fmt(holes, 0)],
    ['Purse earned', fmt(g)],
    ['Events finished', String((S.eventsPlayed || 0) - startEvents)],
    ['Career levels', String(S.lv - startLv)],
    ['Cups won', String((S.cups || 0) - startCups)],
    ['Gear found', String(gear)]
  ];
  if((S.tierMax || 0) > startCard) rows.push(['Tour Card unlocked', roman(S.tierMax)]);
  rows.push(['Now playing', eventName(tournamentOf(S.hole)) + ', ' + dayName(S.hole)]);

  showSheet('<h3>While you were away</h3>'
    + '<p>The caddie kept the group moving. Everything below happened at '
    + Math.round(B.OFFLINE_RATE*100) + ' per cent of your live pace.</p>'
    + rows.map(([k, v]) => '<div class="lb"><span class="p"></span><span>' + k
        + '</span><span class="s">' + v + '</span></div>').join('')
    + '<button class="act" onclick="hideSheet()">Play on</button>');
}

/* ---- modal ---- */
function showSheet(html){ if(QUIET) return; $('sheet').innerHTML = html; $('veil').classList.add('on'); }
function hideSheet(){ $('veil').classList.remove('on'); }

/* =========================================================================
   THE STAGE, IN PIXELS

   Everything is drawn into a low-resolution offscreen buffer (~340 across) and
   blitted up with smoothing off, at an integer scale. That is the only honest
   way to do this: draw small, scale hard. Anything drawn directly at device
   resolution is a vector shape wearing a pixel-art costume, and it shows the
   moment it meets a diagonal.

   Terrain is rendered per SCANLINE rather than as polygons. For each row of
   the buffer we invert the projection to find the world distance that row
   represents, then fill a single horizontal run. This is the pseudo-3D road
   technique, and it is exactly right here: perspective comes out pixel-exact
   with no seams, hazards integrate into the ground pass for free, and mowing
   stripes fall out of the maths instead of being faked.
   ========================================================================= */

   readable, and no amount of redrawing saves a letterform magnified that far:
   the staircase on a diagonal is as wide as the stem. Six by nine carries the

const FW = 6, FH = 9, FGAP = 2;
const textW = (s, sc) => s.length * (FW + FGAP) * (sc || 1) - FGAP * (sc || 1);
// Drawing a glyph as rectangles costs about fourteen fills; a screen of HUD
// text was most of the frame budget. Each glyph is baked once per colour and
// scale into a tiny canvas, so a character costs one blit.
const GCACHE = {};
function glyphCv(ch, col, sc){
  const k = ch + col + sc;
  if(GCACHE[k]) return GCACHE[k];
  const rows = GLYPH[ch] || GLYPH['?'];
  const cv = document.createElement('canvas');
  cv.width = FW*sc; cv.height = FH*sc;
  const g = cv.getContext('2d');
  g.fillStyle = col;
  for(let r = 0; r < FH; r++){
    const row = rows[r];
    let run = -1;
    for(let q = 0; q <= FW; q++){
      const on = q < FW && row[q] === '#';
      if(on && run < 0) run = q;
      if(!on && run >= 0){ g.fillRect(run*sc, r*sc, (q - run)*sc, sc); run = -1; }
    }
  }
  return GCACHE[k] = cv;
}
function drawText(c, str, x, y, col, sc, align){
  sc = sc || 1;
  str = String(str).toUpperCase();
  if(align === 'c') x -= Math.floor(textW(str, sc) / 2);
  else if(align === 'r') x -= textW(str, sc);
  x = Math.round(x); y = Math.round(y);
  for(let i = 0; i < str.length; i++){
    if(str[i] === ' ') continue;
    c.drawImage(glyphCv(str[i], col, sc), x + i*(FW + FGAP)*sc, y);
  }
}
// a shadowed variant, for text sitting over busy terrain
function drawTextS(c, str, x, y, col, sc, align){
  drawText(c, str, x + (sc||1), y + (sc||1), 'rgba(8,13,10,.75)', sc, align);
  drawText(c, str, x, y, col, sc, align);
}

/* ---- ordered dithering ----
   Ramps between two flat colours with a Bayer matrix instead of a gradient.
   This is the signature of the era and the reason skies read as 16-bit rather
   than as a smooth fill someone posterised. */
const BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
function ditherRow(c, x, y, w, colA, colB, t){
  // t = 0 all A, 1 all B. Speckles are two pixels wide: half the work, and at
  // this buffer size a 2px dither reads chunkier and more of the era anyway.
  const lvl = Math.round(t * 16);
  c.fillStyle = lvl >= 16 ? colB : colA;
  c.fillRect(x, y, w, 1);
  if(lvl <= 0 || lvl >= 16) return;
  c.fillStyle = colB;
  // The matrix column has to advance once per CELL, not once per pixel. Indexing
  // it by the pixel while stepping two at a time only ever reached the even
  // columns, so a row's thresholds came from {0,2} or {12,14} depending on its
  // parity: alternate rows filled almost never and almost always, and every
  // ramp in the game came out as hard horizontal stripes instead of a dither.
  for(let i = 0; i < w; i += 2)
    if(BAYER[y & 3][((x + i) >> 1) & 3] < lvl) c.fillRect(x + i, y, 2, 1);
}
function ditherBand(c, x, y, w, h, colA, colB){
  for(let i = 0; i < h; i++) ditherRow(c, x, y + i, w, colA, colB, (i + 0.5) / h);
}
// A vertical ramp: solid bands with a dithered seam between each pair, rather
// than dithering every row. Cheaper by more than half, and it is how the era
// actually did skies — flat colour with a speckled join, not a smooth blend.
// Solid bands, enough of them that the joins disappear at this buffer size.
// The ordered dither this replaced put a speckled seam across every sky.
function smoothRamp(c, x, y, w, h, cols){
  const steps = clamp(Math.round(h/3), 8, 64);
  for(let i = 0; i < steps; i++){
    const y0 = Math.round(y + h*i/steps), y1 = Math.round(y + h*(i+1)/steps);
    c.fillStyle = lerpCols(cols, (i + 0.5)/steps);
    c.fillRect(x, y0, w, Math.max(1, y1 - y0));
  }
}
function ditherRamp(c, x, y, w, h, cols){
  const n = cols.length - 1, seg = h / n;
  for(let k = 0; k < n; k++){
    const y0 = Math.round(y + k*seg), y1 = Math.round(y + (k+1)*seg);
    const band = Math.max(1, y1 - y0);
    const trans = Math.min(band, Math.max(3, Math.round(band*0.42)));
    c.fillStyle = cols[k];
    c.fillRect(x, y0, w, band - trans);
    for(let i = 0; i < trans; i++)
      ditherRow(c, x, y0 + band - trans + i, w, cols[k], cols[k+1], (i + 0.5)/trans);
  }
}

/* ---- sprites from ascii ----
   Authored on a grid, baked once into an offscreen canvas, then blitted with
   nearest-neighbour at whatever size perspective calls for. */
function makeSprite(rows, map){
  const h = rows.length, w = rows[0].length;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  for(let r = 0; r < h; r++){
    let run = -1, cur = null;
    for(let q = 0; q <= w; q++){
      const ch = q < w ? rows[r][q] : null;
      const col = ch && ch !== '.' ? map[ch] : null;
      if(col !== cur){
        if(cur && run >= 0){ g.fillStyle = cur; g.fillRect(run, r, q - run, 1); }
        cur = col; run = col ? q : -1;
      }
    }
  }
  return { cv, w, h, rows };
}
function blit(c, spr, x, y, w, h){
  if(!spr || w < 1 || h < 1) return;
  c.drawImage(spr.cv, 0, 0, spr.w, spr.h, Math.round(x), Math.round(y),
              Math.max(1, Math.round(w)), Math.max(1, Math.round(h)));
}
// Blit row by row with a horizontal offset per row: how the golfer leans
// through a swing without needing a separate sprite for every frame.
function blitShear(c, spr, x, y, w, h, shear){
  if(!spr || w < 1 || h < 1) return;
  const rh = h / spr.h;
  for(let r = 0; r < spr.h; r++){
    const dx = shear(r / (spr.h - 1));
    c.drawImage(spr.cv, 0, r, spr.w, 1,
      Math.round(x + dx), Math.round(y + r*rh), Math.max(1, Math.round(w)),
      Math.max(1, Math.ceil(rh)));
  }
}
// A pixel line, Bresenham, for club shafts and arms.
function pxLine(c, x0, y0, x1, y1, col, thick){
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1-x0), dy = Math.abs(y1-y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy, n = 0;
  c.fillStyle = col;
  const t = thick || 1;
  while(n++ < 400){
    c.fillRect(x0, y0, t, t);
    if(x0 === x1 && y0 === y1) break;
    const e2 = 2*err;
    if(e2 > -dy){ err -= dy; x0 += sx; }
    if(e2 < dx){ err += dx; y0 += sy; }
  }
}
function pxCircle(c, cx, cy, r, col){
  cx = Math.round(cx); cy = Math.round(cy); r = Math.round(r);
  c.fillStyle = col;
  if(r <= 0){ c.fillRect(cx, cy, 1, 1); return; }
  for(let y = -r; y <= r; y++){
    const w = Math.round(Math.sqrt(r*r - y*y));
    if(w > 0) c.fillRect(cx - w, cy + y, w*2, 1);
  }
}

/* ---- colour ----
   Palettes are generated, not typed. A course gives nine anchor colours and
   the ramps come out of these, which keeps every course internally in key and
   lets weather tint the whole set instead of needing a palette per condition.
   ---- */
function hxToRgb(c){ const n = parseInt(c.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function rgbToHx(r, g, b){
  const q = v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0');
  return '#' + q(r) + q(g) + q(b);
}
function mixC(a, b, t){
  const A = hxToRgb(a), B2 = hxToRgb(b);
  return rgbToHx(A[0] + (B2[0]-A[0])*t, A[1] + (B2[1]-A[1])*t, A[2] + (B2[2]-A[2])*t);
}
const lite = (c, t) => mixC(c, '#FFFFFF', t);
// Sample a colour list as a continuous ramp, and resample one to a new length.
// Terrain tones are indexed by a 0..1 depth rather than by a hand-written
// integer, so a ramp can be made finer without rewriting every call site.
function lerpCols(cols, t){
  const u = clamp(t, 0, 1) * (cols.length - 1);
  const i = Math.min(cols.length - 2, Math.floor(u));
  return mixC(cols[i], cols[i+1], u - i);
}
const pickC = (cols, t) => cols[clamp(Math.round(clamp(t,0,1)*(cols.length-1)), 0, cols.length-1)];
function expandC(cols, n){
  if(cols.length >= n) return cols;
  const out = [];
  for(let i = 0; i < n; i++) out.push(lerpCols(cols, i/(n-1)));
  return out;
}
// Smooth between shape control points instead of snapping to the nearest one.
// Flooring to an index is what made every hazard outline step in and out in
// hard blocks: fourteen samples became fourteen visible facets.
function shapeAt(sh, u){
  const n = sh.length, x = clamp(u, 0, 1) * (n - 1);
  const i = Math.floor(x), f = x - i;
  const a = sh[i], b = sh[Math.min(n - 1, i + 1)];
  return a + (b - a) * (f*f*(3 - 2*f));
}
const dark = (c, t) => mixC(c, '#000000', t);
function ramp(c, n, lo, hi){
  const out = [];
  for(let i = 0; i < n; i++){
    const t = lo + (hi - lo) * (n === 1 ? 0 : i/(n-1));
    out.push(t < 0 ? dark(c, -t) : lite(c, t));
  }
  return out;
}
function skyRamp(a, b, n){
  const out = [];
  for(let i = 0; i < n; i++) out.push(mixC(a, b, i/(n-1)));
  return out;
}
const THEME_CACHE = {}, TREE_CACHE = {};
function buildTheme(cs, mode){
  const key = cs.id + '|' + mode;
  if(THEME_CACHE[key]) return THEME_CACHE[key];
  const tint = mode === 'night' ? ['#0A1424', 0.66] : mode === 'rain' ? ['#54626A', 0.40] : null;
  const t = c => tint ? mixC(c, tint[0], tint[1]) : c;
  return THEME_CACHE[key] = {
    id: cs.id,
    sky: skyRamp(t(cs.sky[0]), t(cs.sky[1]), 5),
    // Long ramps rather than dithered short ones. Enough steps that the bands
    // are invisible, which is what the speckle was there to hide.
    fw:  ramp(t(cs.turf),  9, -0.30, 0.16),
    rg:  ramp(t(cs.rough), 7, -0.25, 0.07),
    gr:  ramp(t(lite(cs.turf, 0.14)), 6, -0.10, 0.14),
    sd:  ramp(t(cs.sand),  7, -0.30, 0.12),
    wt:  ramp(t(cs.water), 8, -0.40, 0.22),
    // Five rock steps, not three: a ridge shaded by which way its face turns
    // needs a lit tone and a shadow tone either side of the body colour.
    rk:  ramp(t(cs.rock),  5, -0.30, 0.20),
    snow: lite(t(cs.rock), 0.60),
    edge: dark(t(cs.rough), 0.28),
    // The collar the fairway and the green sit in, so neither meets what is
    // around it on a single hard pixel.
    apron: mixC(t(cs.turf), t(cs.rough), 0.42),
    tl:   dark(t(cs.tree[1]), 0.12),
    tl2:  dark(t(cs.tree[1]), 0.34)
  };
}
// Trees are rebuilt in the course's own colours, so the Autumn Classic is
// actually orange and the Azalea is actually in flower.
function courseTrees(cs, mode){
  const key = cs.id + '|' + mode;
  if(TREE_CACHE[key]) return TREE_CACHE[key];
  const tint = mode === 'night' ? ['#0A1424', 0.66] : mode === 'rain' ? ['#54626A', 0.40] : null;
  const t = c => tint ? mixC(c, tint[0], tint[1]) : c;
  const a = t(cs.tree[0]), b = t(cs.tree[1]);
  // Five steps, not three. Foliage generated with gaps in it needs a deep tone
  // for what sits behind the gap and a highlight for what catches the sun, or
  // the holes read as damage rather than depth.
  const map = { 0: dark(b, 0.46), 1: dark(b, 0.20), 2: b, 3: a, 4: lite(a, 0.24),
                t: t('#4A3A24'), T: t('#2E2416') };
  return TREE_CACHE[key] = { pine: makeSprite(PINE_ROWS, map), oak: makeSprite(OAK_ROWS, map) };
}

// buildTheme derives a course palette, but the Depths and the fallbacks are
// authored as literal tables, so they only carry what the renderer needed on
// the day they were written. Anything added since has to be filled in for them
// too: the shaded ridge asks for five rock tones and a snow colour, and reading
// past the end of a three entry array took the Depths down on the first frame.
for(const k in THEMES){
  const T = THEMES[k];
  if(!T.rk || T.rk.length < 5){
    const r = T.rk || ['#31434F','#425A66','#587280'];
    T.rk = [dark(r[0], 0.32), r[0], r[1], r[2], lite(r[2], 0.26)];
  }
  T.fw = expandC(T.fw, 9); T.rg = expandC(T.rg, 7);
  T.gr = expandC(T.gr, 6); T.sd = expandC(T.sd, 7); T.wt = expandC(T.wt, 8);
  if(!T.snow)  T.snow  = lite(T.rk[4], 0.55);
  if(!T.apron) T.apron = mixC(T.fw[3], T.rg[5], 0.42);
  if(!T.tl2)   T.tl2   = dark(T.tl, 0.26);
}
