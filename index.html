}

/* =========================================================================
   RETIREMENT
   ========================================================================= */
// Every term in the legacy formula is something you actively control, so the
// only question that matters -- is one more Tour Card worth more than retiring
// now -- needs the slope as well as the figure. legacyFor answers for any card
// and any cup count, which is what lets the screen show both.
//
// Measured rather than asserted, three ways. The rewrite returns what the
// inline formula returned over all 162,004 combinations of card, cup count and
// Legacy paragon level -- every card from 0 to TIER_MAX, not a sample. The
// slopes and the trophy count are checked by DOING them: climb the card, win
// the cup, retire and spend the legacy through discover() until it runs out,
// over thirty two states including both caps, and every prediction came back
// exact. And this screen was claimed to change no economy, which is a claim
// worth a sweep rather than a sentence: forty eight configurations of card,
// gear and bag strength played out live across the commit before and the commit
// itself, three talent allocations by three metrics, 432 comparisons, every one
// bit-identical.
const legacyFor = (tier, cups) => Math.floor(B.LEGACY_K * Math.pow(tier + 1, B.LEGACY_EXP)
  * Math.pow(B.CUP_MULT, cups) * (1 + career().plegacy));
function legacyGain(){
  if((S.eventsPlayed || 0) < B.RETIRE_EVENTS) return 0;
  return legacyFor(S.tier, S.cups);
}
const discoverCostAt = n => Math.max(1, Math.ceil(B.DISC_COST * Math.pow(B.DISC_R, n)
  * (1 - Math.min(0.60, career().pdisc))));
const discoverCost = () => discoverCostAt(trophiesFound());
// What a purse of legacy is actually FOR. The discovery price is exponential in
// how full the room already is, so "buys two trophies" is a figure you can
// weigh against one more card in a way that a bare legacy total is not.
function discoveriesFor(legacy){
  let n = trophiesFound(), k = 0;
  while(n < B.TROPHY.length && legacy >= discoverCostAt(n)){ legacy -= discoverCostAt(n); n++; k++; }
  return k;
}
// and how far short of the next one it leaves you, so a retirement that buys
// nothing still says what it would take.
function discoveryGap(legacy){
  let n = trophiesFound();
  while(n < B.TROPHY.length && legacy >= discoverCostAt(n)){ legacy -= discoverCostAt(n); n++; }
  return n >= B.TROPHY.length ? 0 : discoverCostAt(n) - legacy;
}
// The whole retirement decision on one object: what the card is worth now, what
// each of the two things that move it would add, and what the result buys.
function legacyPreview(){
  const now = legacyFor(S.tier, S.cups);
  return {
    now,
    ready: (S.eventsPlayed || 0) >= B.RETIRE_EVENTS,
    card: legacyFor(Math.min(B.TIER_MAX, S.tier + 1), S.cups) - now,
    cup:  legacyFor(S.tier, S.cups + 1) - now,
    held: discoveriesFor(S.legacy),
    after: discoveriesFor(S.legacy + now),
    left: B.TROPHY.length - trophiesFound()
  };
}
// Each multiplying trophy pays its own ladder, priced off its own gain, so the
// invariant that cost has to outrun gain holds for all thirty at once instead
// of resting on two constants staying in the right order.
const trophyRatio = t => t.g ? Math.pow(t.g, B.TR_POW) : B.TR_R;
const upgradeCost = t => Math.max(1, Math.ceil(B.TR_COST * B.TR_TIER[t.t].m
  * Math.pow(trophyRatio(t), S.relic[t.id] || 0)
  * (1 - Math.min(0.50, career().pcurate))));
function discover(){
  const pool = B.TROPHY.filter(t => !found(t.id));
  if(!pool.length){ toast('Every trophy is in the room'); return; }
  const c = discoverCost();
  if(S.legacy < c){ toast('Not enough legacy'); return; }
  S.legacy -= c;
  let tot = 0; for(const t of pool) tot += B.TR_TIER[t.t].w;
  let x = Math.random()*tot, pick = pool[0];
  for(const t of pool){ x -= B.TR_TIER[t.t].w; if(x <= 0){ pick = t; break; } }
  S.relic[pick.id] = 1;
  showSheet('<h3>' + pick.n + '</h3>'
    + '<p style="color:var(' + B.TR_TIER[pick.t].v + ')">' + B.TR_TIER[pick.t].n + ' trophy</p>'
    + '<p>' + pick.d.charAt(0).toUpperCase() + pick.d.slice(1) + '.</p>'
    + '<div class="big">' + trophiesFound() + ' / ' + B.TROPHY.length + '</div>'
    + '<button class="act" onclick="hideSheet()">To the room</button>');
  renderLegacy(); renderVitals();
}
function upgradeTrophy(id){
  const t = trophyDef(id); if(!t || !found(id)) return;
  if((S.relic[id] || 0) >= B.TR_MAX){ toast('That one is as high as it goes'); return; }
  const c = upgradeCost(t);
  if(S.legacy < c){ toast('Not enough legacy'); return; }
  S.legacy -= c; S.relic[id]++;
  renderLegacy(); renderVitals();
}
// The highest card where a fresh par four comes in at RETIRE_FIT of par time.
function matchedCard(D){
  const c = Math.floor(Math.log(Math.max(1e-9, B.RETIRE_FIT * D.dps * B.PAR_TIME[4] / B.Y0)) / Math.log(B.TIER_Y));
  return clamp(c, 0, B.TIER_MAX);
}
// Where a retirement puts you, worked out on the golfer you will be once the
// range resets, not the one signing the card. The Chronoglass is a floor under
// it, and the best card you have reached is a ceiling over it.
function retireCard(){
  const keep = relLv('vault') * B.VAULT_UPG, saved = Object.assign({}, S.upg), buff = S.buff;
  B.UPG.forEach(u => S.upg[u.id] = Math.min(capOf(u), keep)); S.buff = {};
  let c = 0;
  try{ c = matchedCard(derive()); } finally { Object.assign(S.upg, saved); S.buff = buff; }
  const best = Math.max(S.bestTier || 0, S.tierMax || 0, S.tier || 0);
  return Math.min(B.TIER_MAX, Math.max(relLv('chrono'), Math.min(c, best)));
}
// A save from before holes were fixed to their card sits on a card number from
// the old ladder, where each card was 2.35x the last rather than 4x and every
// hole was stretched to the golfer anyway: Card 8 was 930x Card I, and is
// 65,000x now. Loaded as it stood, such a golfer would meet holes seventy
// times longer than yesterday. Once, on load, they are put on the card that
// matches them, the same rule a retirement uses, with that card open. Cups,
// legacy and everything else stay as they were.
// Read off the save as it came in, not off S: S starts from the defaults,
// which mark a game as fixed, and a wipe or reset lays those back down.
function fixHoles(o){
  if(!o || typeof o !== 'object' || o.holesFixed) return;
  S.holesFixed = 1;
  const c = matchedCard(derive());
  S.tier = c; S.tierMax = c; S.tierEvents = {};
  S.bestTier = Math.max(S.bestTier || 0, c);
  S.scores = []; S.tourScore = 0;
  S.hole = (tournamentOf(S.hole) - 1) * B.ROUND * B.DAYS + 1;
}
function retire(){
  const gain = legacyGain();
  if(gain <= 0) return;
  S.legacy += gain; S.retires++;

  // The bag is yours. Clubs you found do not evaporate because you signed a
  // card; what resets is the money, the range work and the ladder.
  const land = retireCard();
  S.gold = Math.pow(B.SEED_MULT, relLv('seed')) > 1
    ? B.G0 * Math.pow(B.TIER_G, Math.min(6, relLv('seed'))) * 40 : 0;
  S.tier = land;
  S.hole = 1; S.scores = []; S.tourScore = 0; S.streak = 0;
  const keepUpg = relLv('vault') * B.VAULT_UPG;
  B.UPG.forEach(u => S.upg[u.id] = Math.min(capOf(u), keepUpg));
  S.tierEvents = {}; S.tierMax = land;
  S.buff = {}; B.SKILL.forEach(k => S.cd[k.id] = 0); S.swCount = 0;
  // level, attributes, talents and paragon are the golfer, not the run: untouched.

  startHole();
  showSheet('<h3>Retired</h3>'
    + '<div class="big">+' + fmt(gain) + ' legacy</div>'
    + '<p>Capped upgrades gain ' + B.CAP_PER_LEGACY + '\u00a0levels \u00b7 retirement '
    + S.retires + '</p><button class="act" onclick="hideSheet()">Back to the tee</button>');
  renderAll();
}

/* =========================================================================
   OFFLINE
   ========================================================================= */
// What the next seventy two holes are worth and how long they take, walked one
// at a time and averaged, rather than read off the hole you happened to park on.
//
// Every figure the away model needs carries the same three multipliers -- the
// par, the closing hole and Sunday -- and the weather on top of them. Read off
// one hole they are all whatever that hole happened to be: a closing Sunday
// hole pays 3.2x for the close and 1.4x for the Sunday before a talent touches
// it, and the weather swings the purse from 0.8x to 2.3x on its own. Park there
// and every away hole for twelve hours is paid as one.
//
// The window is the tournament you are standing in: seventy two holes, every
// hole-in-round position once and every day once, so each multiplier appears
// exactly as often as it really does. The mean purse over the total time is the
// rate the session would actually run at, which is what "the away model is the
// live model" has to mean. Anchoring it to the tournament rather than to "the
// next seventy two from here" is what makes it parking-proof: every hole of an
// event gives the identical rate, so there is no hole worth walking to before
// you close the tab.
//
// Reading the CARDED yardage here rather than the handicapped one was the older
// bug in the same function: a bag ten times ahead of its card played away holes
// in the 0.9s walk minimum, five and a half times the live rate, and took the
// schedule, the card and the experience with it. The floor is applied per hole
// below, the way startHole applies it.
const awayFirstHole = h => (tournamentOf(h) - 1) * B.ROUND * B.DAYS + 1;
// Walks the tournament you are standing in and reports what a hole of it is
// worth and how long it takes, for ANY Tour Card rather than only the one you
// are on. The away model asks for the card you are on; the Tour screen asks for
// the next one too, which is the only honest way to answer "what does climbing
// do to my money" -- both sides priced by the same functions the course uses.
// wx is the card the WEATHER is drawn off, which is not always the card being
// priced. chaosFor and courseElFor both hash on the tier, so asking what the
// next card pays with its own weather compares this card's four draws against
// four different ones -- and the purse multiplier alone runs from 0.8 to 2.3.
// The climb question is "what does the CARD do", so both sides are walked under
// the weather you are standing in.
function roundRate(tier, wx){
  if(tier === undefined) tier = S.tier;
  if(wx === undefined) wx = tier;
  const n = B.ROUND * B.DAYS, first = awayFirstHole(S.hole);
  const h0 = S.hole, chaos0 = S.chaos, el0 = S.courseEl, str0 = S.stretched;
  const carded0 = S.carded, yards0 = S.yardsMax;
  let secs = 0, purse = 0, drop = 0, card = 0, yards = 0, par = 0;
  // It walks the golfer over seventy two holes to measure them, so it puts him
  // back whichever way it leaves: a throw in derive() that stranded him on hole
  // forty of an event he is not playing would be silent and permanent.
  try{
    for(let i = 0; i < n; i++){
      const h = first + i;
      S.hole = h;
      S.chaos = chaosFor(h, wx);
      S.stretched = S.chaos.y > 1;
      S.courseEl = courseElFor(h, wx);
      const D = derive();
      const carded = yardageFor(h, tier, S.chaos);
      const y = carded;
      // priced as the hole in the globals, by the game's own pricing function
      S.carded = carded; S.yardsMax = y;
      secs  += Math.max(S.walkMin || B.WALK_MIN, y / Math.max(1e-9, D.dps));
      par   += parTimeFor(h);
      purse += purseFor(h, tier, D.gold);
      drop  += D.drop;
      card  += carded; yards += y;
    }
  }finally{
    S.hole = h0; S.chaos = chaos0; S.courseEl = el0; S.stretched = str0;
    S.carded = carded0; S.yardsMax = yards0;
  }
  return { secs: secs/n, purse: purse/n, drop: drop/n,
           carded: card/n, yardsMax: yards/n,
           rate: purse/Math.max(1e-9, secs),   // what a second on this card pays
           ratio: secs / Math.max(1e-9, par) };   // average share of par time a hole takes
}

// What climbing actually does. The fold on this screen has always said a card
// makes holes x2.35 longer and pays x2.16 more, which reads as a flat loss and
// is not one: the hole is never shorter than what your bag clears in HCP of par
// time, so while you are ahead of your card the length does not move at all and
// the purse does. And a card grows across its five events, so climbing one you
// have finished is free -- tierProgress is already tier+1 by then.
function climbPreview(){
  const here = roundRate(S.tier, S.tier);
  const next = roundRate(Math.min(B.TIER_MAX, S.tier + 1), S.tier);
  const nextT = Math.min(B.TIER_MAX, S.tier + 1);
  return { here, next,
    pay:  next.rate / Math.max(1e-9, here.rate),
    len:  next.yardsMax / Math.max(1e-9, here.yardsMax),
    secs: next.secs / Math.max(1e-9, here.secs),
    ratio: next.ratio };
}

// hms stops at hours, which reads badly once a return is measured in days:
// "168h 0m" is a week.
const spanTxt = s => s >= 172800 ? Math.floor(s/86400) + ' days' : hms(s);
function offline(){
  // What the clock says, and what the caddie is good for. They are not the same
  // number past the cap, and the card used only the second one: come back from
  // a week away and it said "12h away", which is not where the week went.
  const away = Math.max(0, Date.now()/1000 - (S.t || Date.now()/1000));
  const dt = Math.min(away, B.OFFLINE_CAP + permAdd('contract')*3600);
  // Stamped the moment the time is claimed. Otherwise it stays at the last
  // save until the next one, and a second catch-up inside that window -- a
  // reload, or a return from another tab -- pays the same absence twice.
  S.t = Date.now()/1000;
  if(dt < 60){ regenKeys(dt); tickShop(away); return; }
  regenKeys(dt);

  // Anything with a timer pays for as long as it lasts, not for the whole
  // absence. derive() reads whatever is live, so a Sponsor Windfall fired on
  // the way out -- +150% purse for twelve seconds -- paid 2.5x on twelve hours
  // away, an eight-minute Hot Streak paid 5x on all of it, and an hour of
  // Double Purse doubled the lot. Skill buffs have long run out by the time you
  // are back. Perks are for playing: they sit out the absence and pick up
  // where they left off. Double Purse runs on the clock -- it is sold as 24
  // hours -- and pays for the part of the session it actually covered.
  S.buff = {};
  const perkHold = S.perkOn; S.perkOn = {};
  const boostLeft = S.boostT || 0;
  const boostAll = boostLeft >= dt;
  if(!boostAll) S.boostT = 0;

  const D = derive();
  const A = roundRate(S.tier);
  const secs = A.secs, purse = A.purse;

  // Play the holes out rather than estimating a rate: the round advances, the
  // card fills, events finish and the schedule moves on, all at a discount.
  const holes = Math.min(20000, Math.floor(dt * B.OFFLINE_RATE * (1 + Math.min(1, D.C.paway)) / secs));

  // Measured rather than assumed: the loop below resolves events as it goes,
  // and those pay too. Reporting only the hole purse had the summary claiming
  // 31K on a twelve hour return that actually banked 174K.
  const goldBefore = S.gold;
  S.gold += purse * holes * B.OFFLINE_PURSE;

  const startEvents = S.eventsPlayed || 0, startLv = S.lv;
  const startCard = S.tierMax || 0, startCups = S.cups || 0;
  const startPara = S.para || 0, startSov = S.sov || 0;
  const startEntries = {};
  B.DGN.forEach(dg => startEntries[dg.id] = S.dgnKeys[dg.id] || 0);
  // Worth keeping rather than counting: the best thing the caddie found is the
  // only one of these you will actually go and look at.
  let gear = 0, best = null;
  // Straight into the bag: the equip sweep and the overflow trim run once at
  // the end rather than once a drop. bagAdd did both every time, which is what
  // the comment by the sweep below said it was avoiding.
  const bagAddOff = it => {
    if(!best || itemScore(it) > itemScore(best)) best = it;
    if(it.rar >= 4) bump('legend');
    if(it.rar >= 5) bump('myth');
    S.bag.push(it); gear++;
  };
  QUIET = true; OFFLINE = true;
  // The events this loop resolves are paid through purseFor as well, and it
  // reads the live hole's yardage for the stretch it pays on the handicap.
  // Left at whatever was under you when you closed the tab, every cheque in the
  // session was stretched by that one hole. The averages stand in until
  // startHole below puts the real ones back.
  S.carded = A.carded; S.yardsMax = A.yardsMax;
  try{
    for(let i = 0; i < holes; i++){
      // The weather moves with the schedule too. Frozen, every event cheque was
      // paid at one hole's gold multiplier -- and endTournament calls derive()
      // itself, so there was no other way for it to find out.
      S.chaos = chaosFor(S.hole, S.tier);
      S.stretched = S.chaos.y > 1;
      S.courseEl = courseElFor(S.hole, S.tier);
      S.totalHoles++;
      addXp(B.XP_HOLE * Math.pow(1 + S.tier, B.XP_TIER) * 1.2 * (parOf(S.hole)/4) * 0.6);
      // No "while there is room": live play scraps the worst club for shards
      // when the locker overflows, and the away session gated drops on the
      // locker instead -- so once it filled, a twelve hour absence found no
      // clubs and paid no shards for any of them.
      if(isClosing(S.hole) && Math.random() < 0.5)
        bagAddOff(dropItem(S.tier, A.drop, 0));
      advanceHole();
    }
  }finally{
    // A throw in here used to leave the game muted and paying event cheques at
    // the away discount for the rest of the session, because nothing reset
    // these on the way out.
    OFFLINE = false; QUIET = false;
    S.perkOn = perkHold; S.boostT = boostLeft;
  }
  // Double Purse that ran out part way pays on its share of everything the
  // session earned, event cheques included, not only on the hole purse
  if(!boostAll && boostLeft > 0)
    S.gold += (S.gold - goldBefore) * (B.BOOST_MULT - 1) * boostLeft / dt;
  // The calendar kept running while the caddie played. The free gift every
  // eight hours and the members' daily only ever counted time with the game
  // open, so a member dropping in for twenty minutes a day was paid their
  // "daily" about once a season. They read the whole absence, not the capped
  // part the caddie plays -- a week away is seven dailies.
  QUIET = true;
  try{ tickShop(away); }finally{ QUIET = false; }
  // One sweep for the whole session rather than one per drop: the loop above
  // can land a thousand clubs and the sweep costs a derive() per candidate.
  const swapped = autoEquipSweep().length;
  let scrapped = 0, scrapSh = 0;
  if(S.bag.length > bagCap()){
    S.bag.sort((a,b) => itemScore(b) - itemScore(a));
    const cut = S.bag.splice(bagCap());
    cut.forEach(x => scrapSh += scrapValue(x));
    S.shard += scrapSh; scrapped = cut.length;
    // the pick of the drops can still be worse than sixty clubs already kept
    if(cut.includes(best)) best = null;
  }
  startHole();

  const g = S.gold - goldBefore;
  const events = (S.eventsPlayed || 0) - startEvents;
  const levels = S.lv - startLv, cups = (S.cups || 0) - startCups;
  const paras = (S.para || 0) - startPara, sov = (S.sov || 0) - startSov;
  const cards = (S.tierMax || 0) - startCard;
  let entries = 0;
  B.DGN.forEach(dg => entries += Math.max(0, (S.dgnKeys[dg.id] || 0) - startEntries[dg.id]));

  // The card, not the number. A return used to read "away 6h, purse 4.1M" and
  // the rest as a flat list of zeroes; what earns the next session is seeing
  // what the caddie actually did with the time, and only the lines that have
  // something on them.
  const stat = (k, v, cls) => '<div class="awst' + (cls ? ' ' + cls : '') + '">'
    + '<div class="awv">' + v + '</div><div class="awk">' + k + '</div></div>';
  const line = (k, v) => '<div class="lb"><span class="p"></span><span>' + k
    + '</span><span class="s">' + v + '</span></div>';

  let h = '<h3>While You Were Away</h3>'
    + '<p>' + (away > dt + 60
        ? spanTxt(away) + ' away \u00b7 the caddie played the last ' + hms(dt)
        : hms(dt) + ' away') + ' at '
    + Math.round(B.OFFLINE_RATE * (1 + Math.min(1, D.C.paway)) * 100)
    + '% pace.</p>'
    + '<div class="awgrid">'
      + stat('purse', fmt(g), 'big')
      + stat('holes', fmt(holes, 0))
      + stat('clubs', String(gear))
    + '</div>';

  const marks = [];
  if(cards > 0) marks.push(['Tour Card', roman(S.tierMax) + (cards > 1 ? ' (+' + cards + ')' : '')]);
  if(events > 0) marks.push(['Events finished', String(events)]);
  if(cups > 0) marks.push(['Cups won', String(cups)]);
  if(levels > 0) marks.push(['Career levels', '+' + levels]);
  if(paras > 0) marks.push(['Paragon', '+' + paras]);
  if(sov > 0) marks.push([B.SOV, '+' + sovFmt(sov)]);
  if(swapped > 0) marks.push(['Auto equipped', swapped + ' club' + (swapped > 1 ? 's' : '')]);
  if(scrapped > 0) marks.push(['Locker full \u00b7 scrapped ' + scrapped, '+' + fmt(scrapSh, 0) + '\u00a0' + plural(scrapSh, 'shards')]);
  if(entries > 0) marks.push(['Wager entries back', '+' + entries]);
  if(marks.length) h += '<div class="awband">What came of it</div>'
    + marks.map(([k, v]) => line(k, v)).join('');

  if(best){
    const sl = B.SLOTS.find(x => x.id === best.slot);
    const cur = S.equip[best.slot];
    const up = !cur || itemScore(best) > itemScore(cur);
    h += '<div class="awband">Best thing in the bag</div>'
      + '<div class="awbest" style="border-color:' + RC(best.rar) + '">'
      + '<img src="' + pixUrl(sl.ic, RC(best.rar)) + '" alt="">'
      + '<div><div class="awbn" style="color:' + RC(best.rar) + '">' + best.name + '</div>'
      + '<div class="awbs">' + B.RARITY[best.rar].n + ' ' + sl.n + ' \u00b7 item level ' + best.ilvl
      + (up ? ' \u00b7 <span style="color:var(--aurora)">beats what you are carrying</span>' : '')
      + '</div></div></div>';
  }

  h += '<div class="awband">Back on the tee</div>'
    + line('Now playing', eventName(tournamentOf(S.hole)) + ', ' + dayName(S.hole))
    + '<button class="act" onclick="hideSheet()">Play on</button>';
  showSheet(h);
}

/* =========================================================================
   THE STAGE, IN PIXELS

   Everything is drawn into a low-resolution offscreen buffer (~340 across) and
   blitted up with smoothing off, at an integer scale. That is the only honest
   way to do this: draw small, scale hard. Anything drawn directly at device
   resolution is a vector shape wearing a pixel-art costume, and it shows the
   moment it meets a diagonal.

   Terrain is rendered per SCANLINE rather than as polygons. For each row of
   the buffer we invert the projection to find the world distance that row
   represents, then fill a single horizontal run. This is the pseudo-3D road
   technique, and it is exactly right here: perspective comes out pixel-exact
   with no seams, hazards integrate into the ground pass for free, and mowing
   stripes fall out of the maths instead of being faked.
   ========================================================================= */

const FW = 6, FH = 9, FGAP = 2;
const textW = (s, sc) => s.length * (FW + FGAP) * (sc || 1) - FGAP * (sc || 1);
// Drawing a glyph as rectangles costs about fourteen fills; a screen of HUD
// text was most of the frame budget. Each glyph is baked once per colour and
// scale into a tiny canvas, so a character costs one blit.
const GCACHE = {};
function glyphCv(ch, col, sc){
  const k = ch + col + sc;
  if(GCACHE[k]) return GCACHE[k];
  const rows = GLYPH[ch] || GLYPH['?'];
  const cv = document.createElement('canvas');
  cv.width = FW*sc; cv.height = FH*sc;
  const g = cv.getContext('2d');
  g.fillStyle = col;
  for(let r = 0; r < FH; r++){
    const row = rows[r];
    let run = -1;
    for(let q = 0; q <= FW; q++){
      const on = q < FW && row[q] === '#';
      if(on && run < 0) run = q;
      if(!on && run >= 0){ g.fillRect(run*sc, r*sc, (q - run)*sc, sc); run = -1; }
    }
  }
  return GCACHE[k] = cv;
}
function drawText(c, str, x, y, col, sc, align){
  sc = sc || 1;
  str = String(str).toUpperCase();
  if(align === 'c') x -= Math.floor(textW(str, sc) / 2);
  else if(align === 'r') x -= textW(str, sc);
  x = Math.round(x); y = Math.round(y);
  for(let i = 0; i < str.length; i++){
    if(str[i] === ' ') continue;
    c.drawImage(glyphCv(str[i], col, sc), x + i*(FW + FGAP)*sc, y);
  }
}
// a shadowed variant, for text sitting over busy terrain
function drawTextS(c, str, x, y, col, sc, align){
  drawText(c, str, x + (sc||1), y + (sc||1), 'rgba(8,13,10,.75)', sc, align);
  drawText(c, str, x, y, col, sc, align);
}

/* ---- ordered dithering ----
   Ramps between two flat colours with a Bayer matrix instead of a gradient.
   This is the signature of the era and the reason skies read as 16-bit rather
   than as a smooth fill someone posterised. */
const BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
function ditherRow(c, x, y, w, colA, colB, t){
  // t = 0 all A, 1 all B. Speckles are two pixels wide: half the work, and at
  // this buffer size a 2px dither reads chunkier and more of the era anyway.
  const lvl = Math.round(t * 16);
  c.fillStyle = lvl >= 16 ? colB : colA;
  c.fillRect(x, y, w, 1);
  if(lvl <= 0 || lvl >= 16) return;
  c.fillStyle = colB;
  // The matrix column has to advance once per CELL, not once per pixel. Indexing
  // it by the pixel while stepping two at a time only ever reached the even
  // columns, so a row's thresholds came from {0,2} or {12,14} depending on its
  // parity: alternate rows filled almost never and almost always, and every
  // ramp in the game came out as hard horizontal stripes instead of a dither.
  for(let i = 0; i < w; i += 2)
    if(BAYER[y & 3][((x + i) >> 1) & 3] < lvl) c.fillRect(x + i, y, 2, 1);
}
function ditherBand(c, x, y, w, h, colA, colB){
  for(let i = 0; i < h; i++) ditherRow(c, x, y + i, w, colA, colB, (i + 0.5) / h);
}
// A vertical ramp: solid bands with a dithered seam between each pair, rather
// than dithering every row. Cheaper by more than half, and it is how the era
// actually did skies — flat colour with a speckled join, not a smooth blend.
// Solid bands, enough of them that the joins disappear at this buffer size.
// The ordered dither this replaced put a speckled seam across every sky.
function smoothRamp(c, x, y, w, h, cols){
  // One step per row. Three rows to a step put a visible stair every dozen
  // units of colour across a sky that is mostly one slow gradient, and this
  // is rasterised once and cached, so the finer ramp costs nothing per frame.
  const steps = clamp(Math.round(h), 8, 400);
  for(let i = 0; i < steps; i++){
    const y0 = Math.round(y + h*i/steps), y1 = Math.round(y + h*(i+1)/steps);
    c.fillStyle = lerpCols(cols, (i + 0.5)/steps);
    c.fillRect(x, y0, w, Math.max(1, y1 - y0));
  }
}
function ditherRamp(c, x, y, w, h, cols){
  const n = cols.length - 1, seg = h / n;
  for(let k = 0; k < n; k++){
    const y0 = Math.round(y + k*seg), y1 = Math.round(y + (k+1)*seg);
    const band = Math.max(1, y1 - y0);
    const trans = Math.min(band, Math.max(3, Math.round(band*0.42)));
    c.fillStyle = cols[k];
    c.fillRect(x, y0, w, band - trans);
    for(let i = 0; i < trans; i++)
      ditherRow(c, x, y0 + band - trans + i, w, cols[k], cols[k+1], (i + 0.5)/trans);
  }
}

/* ---- sprites from ascii ----
   Authored on a grid, baked once into an offscreen canvas, then blitted with
   nearest-neighbour at whatever size perspective calls for. */
function makeSprite(rows, map){
  const h = rows.length, w = rows[0].length;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  for(let r = 0; r < h; r++){
    let run = -1, cur = null;
    for(let q = 0; q <= w; q++){
      const ch = q < w ? rows[r][q] : null;
      const col = ch && ch !== '.' ? map[ch] : null;
      if(col !== cur){
        if(cur && run >= 0){ g.fillStyle = cur; g.fillRect(run, r, q - run, 1); }
        cur = col; run = col ? q : -1;
      }
    }
  }
  return { cv, w, h, rows };
}
function blit(c, spr, x, y, w, h){
  if(!spr || w < 1 || h < 1) return;
  c.drawImage(spr.cv, 0, 0, spr.w, spr.h, Math.round(x), Math.round(y),
              Math.max(1, Math.round(w)), Math.max(1, Math.round(h)));
}
// Blit row by row with a horizontal offset per row: how the golfer leans
// through a swing without needing a separate sprite for every frame.
function blitShear(c, spr, x, y, w, h, shear){
  if(!spr || w < 1 || h < 1) return;
  const rh = h / spr.h;
  for(let r = 0; r < spr.h; r++){
    const dx = shear(r / (spr.h - 1));
    c.drawImage(spr.cv, 0, r, spr.w, 1,
      Math.round(x + dx), Math.round(y + r*rh), Math.max(1, Math.round(w)),
      Math.max(1, Math.ceil(rh)));
  }
}
// A pixel line, Bresenham, for club shafts and arms.
function pxLine(c, x0, y0, x1, y1, col, thick){
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1-x0), dy = Math.abs(y1-y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy, n = 0;
  c.fillStyle = col;
  const t = thick || 1;
  while(n++ < 400){
    c.fillRect(x0, y0, t, t);
    if(x0 === x1 && y0 === y1) break;
    const e2 = 2*err;
    if(e2 > -dy){ err -= dy; x0 += sx; }
    if(e2 < dx){ err += dx; y0 += sy; }
  }
}
function pxCircle(c, cx, cy, r, col){
  cx = Math.round(cx); cy = Math.round(cy); r = Math.round(r);
  c.fillStyle = col;
  if(r <= 0){ c.fillRect(cx, cy, 1, 1); return; }
  for(let y = -r; y <= r; y++){
    const w = Math.round(Math.sqrt(r*r - y*y));
    if(w > 0) c.fillRect(cx - w, cy + y, w*2, 1);
  }
}

/* ---- colour ----
   Palettes are generated, not typed. A course gives nine anchor colours and
   the ramps come out of these, which keeps every course internally in key and
   lets weather tint the whole set instead of needing a palette per condition.
   ---- */
function hxToRgb(c){ const n = parseInt(c.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function rgbToHx(r, g, b){
  const q = v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0');
  return '#' + q(r) + q(g) + q(b);
}
function mixC(a, b, t){
  const A = hxToRgb(a), B2 = hxToRgb(b);
  return rgbToHx(A[0] + (B2[0]-A[0])*t, A[1] + (B2[1]-A[1])*t, A[2] + (B2[2]-A[2])*t);
}
const lite = (c, t) => mixC(c, '#FFFFFF', t);
// Sample a colour list as a continuous ramp, and resample one to a new length.
// Terrain tones are indexed by a 0..1 depth rather than by a hand-written
// integer, so a ramp can be made finer without rewriting every call site.
function lerpCols(cols, t){
  const u = clamp(t, 0, 1) * (cols.length - 1);
  const i = Math.min(cols.length - 2, Math.floor(u));
  return mixC(cols[i], cols[i+1], u - i);
}
const pickC = (cols, t) => cols[clamp(Math.round(clamp(t,0,1)*(cols.length-1)), 0, cols.length-1)];
function expandC(cols, n){
  if(cols.length >= n) return cols;
  const out = [];
  for(let i = 0; i < n; i++) out.push(lerpCols(cols, i/(n-1)));
  return out;
}
// Smooth between shape control points instead of snapping to the nearest one.
// Flooring to an index is what made every hazard outline step in and out in
// hard blocks: fourteen samples became fourteen visible facets.
function shapeAt(sh, u){
  const n = sh.length, x = clamp(u, 0, 1) * (n - 1);
  const i = Math.floor(x), f = x - i;
  const a = sh[i], b = sh[Math.min(n - 1, i + 1)];
  return a + (b - a) * (f*f*(3 - 2*f));
}
const dark = (c, t) => mixC(c, '#000000', t);
function ramp(c, n, lo, hi){
  const out = [];
  for(let i = 0; i < n; i++){
    const t = lo + (hi - lo) * (n === 1 ? 0 : i/(n-1));
    out.push(t < 0 ? dark(c, -t) : lite(c, t));
  }
  return out;
}
function skyRamp(a, b, n){
  const out = [];
  for(let i = 0; i < n; i++) out.push(mixC(a, b, i/(n-1)));
  return out;
}
const THEME_CACHE = {}, TREE_CACHE = {};
function buildTheme(cs, mode){
  const key = cs.id + '|' + mode;
  if(THEME_CACHE[key]) return THEME_CACHE[key];
  const tint = mode === 'night' ? ['#0A1424', 0.66] : mode === 'rain' ? ['#54626A', 0.40] : null;
  const t = c => tint ? mixC(c, tint[0], tint[1]) : c;
  return THEME_CACHE[key] = {
    id: cs.id,
    sky: skyRamp(t(cs.sky[0]), t(cs.sky[1]), 5),
    // Long ramps rather than dithered short ones. Enough steps that the bands
    // are invisible, which is what the speckle was there to hide.
    fw:  ramp(t(cs.turf),  9, -0.30, 0.16),
    rg:  ramp(t(cs.rough), 7, -0.25, 0.07),
    gr:  ramp(t(lite(cs.turf, 0.14)), 6, -0.10, 0.14),
    sd:  ramp(t(cs.sand),  7, -0.30, 0.12),
    wt:  ramp(t(cs.water), 8, -0.40, 0.22),
    // Five rock steps, not three: a ridge shaded by which way its face turns
    // needs a lit tone and a shadow tone either side of the body colour.
    rk:  ramp(t(cs.rock),  5, -0.30, 0.20),
    snow: lite(t(cs.rock), 0.60),
    edge: dark(t(cs.rough), 0.28),
    // The collar the fairway and the green sit in, so neither meets what is
    // around it on a single hard pixel.
    apron: mixC(t(cs.turf), t(cs.rough), 0.42),
    // The ground a hazard is cut into. A bunker and a pond both sit BELOW the
    // fairway, and without a band of bare earth around the rim they read as
    // coloured paint on a flat field rather than as something dug out.
    lip:  mixC(dark(t(cs.sand), 0.62), t(cs.rough), 0.26),
    bank: mixC(dark(t(cs.rough), 0.34), t(cs.water), 0.22),
    tl:   dark(t(cs.tree[1]), 0.12),
    tl2:  dark(t(cs.tree[1]), 0.34)
  };
}
// Trees are rebuilt in the course's own colours, so the Autumn Classic is
// actually orange and the Azalea is actually in flower.
function courseTrees(cs, mode){
  const key = cs.id + '|' + mode;
  if(TREE_CACHE[key]) return TREE_CACHE[key];
  const tint = mode === 'night' ? ['#0A1424', 0.66] : mode === 'rain' ? ['#54626A', 0.40] : null;
  const t = c => tint ? mixC(c, tint[0], tint[1]) : c;
  const a = t(cs.tree[0]), b = t(cs.tree[1]);
  // Five steps, not three. Foliage generated with gaps in it needs a deep tone
  // for what sits behind the gap and a highlight for what catches the sun, or
  // the holes read as damage rather than depth.
  const map = { 0: dark(b, 0.46), 1: dark(b, 0.20), 2: b, 3: a, 4: lite(a, 0.24),
                t: t('#4A3A24'), T: t('#2E2416') };
  return TREE_CACHE[key] = { pine: makeSprite(PINE_ROWS, map), oak: makeSprite(OAK_ROWS, map) };
}

// buildTheme derives a course palette, but the Depths and the fallbacks are
// authored as literal tables, so they only carry what the renderer needed on
// the day they were written. Anything added since has to be filled in for them
// too: the shaded ridge asks for five rock tones and a snow colour, and reading
// past the end of a three entry array took the Depths down on the first frame.
for(const k in THEMES){
  const T = THEMES[k];
  if(!T.rk || T.rk.length < 5){
    const r = T.rk || ['#31434F','#425A66','#587280'];
    T.rk = [dark(r[0], 0.32), r[0], r[1], r[2], lite(r[2], 0.26)];
  }
  T.fw = expandC(T.fw, 9); T.rg = expandC(T.rg, 7);
  T.gr = expandC(T.gr, 6); T.sd = expandC(T.sd, 7); T.wt = expandC(T.wt, 8);
  if(!T.snow)  T.snow  = lite(T.rk[4], 0.55);
  if(!T.apron) T.apron = mixC(T.fw[3], T.rg[5], 0.42);
  if(!T.tl2)   T.tl2   = dark(T.tl, 0.26);
  if(!T.lip)   T.lip   = mixC(dark(T.sd[1], 0.56), T.rg[3], 0.26);
  if(!T.bank)  T.bank  = mixC(dark(T.rg[3], 0.30), T.wt[2], 0.22);
}

// The trails. They were three one-pixel dots a few frames behind the ball --
// the Rainbow put one of its five colours on each, and nobody could tell it
// was on. Each is a ribbon now, the ball's width or more, drawn through the
// same path as the balls below, with something of its own on top. The ball
// keeps its affinity's colour: that is information, the trail is taste.
function trailBall(c, b, p, r){
  c.globalAlpha = 1;
  c.fillStyle = b.crit ? PX.brass : b.el ? (PX[b.el] || PX.white) : PX.white;
  c.fillRect(Math.round(p.x - r), Math.round(p.y - r), r * 2, r * 2);
  if(r > 1){ c.fillStyle = PX.white; c.fillRect(Math.round(p.x - r), Math.round(p.y - r), 1, 1); }
}
// Across the flight, not down the screen: a ball goes away from the camera,
// so its path runs up the screen, and bands stacked vertically all landed on
// the same line -- the Rainbow's six read as one.
function trailNormal(path){
  const a = path[0], z = path[path.length - 1];
  const dx = a.x - z.x, dy = a.y - z.y, L = Math.hypot(dx, dy);
  return L < 0.5 ? { x: 0, y: 1 } : { x: -dy / L, y: dx / L };
}
// tail to head, fading toward the tail; col and off (a distance across the
// flight) may be functions of the point's index
function trailRibbon(c, path, w, col, a, off){
  const n = path.length, half = w >> 1, N = off ? trailNormal(path) : null;
  for(let i = n - 1; i >= 1; i--){
    const p0 = path[i], p1 = path[i - 1], f = i / n;
    const o0 = off ? off(i) : 0, o1 = off ? off(i - 1) : 0;
    c.globalAlpha = a * (1 - f * 0.8);
    pxLine(c, p0.x + (N ? N.x * o0 : 0) - half, p0.y + (N ? N.y * o0 : 0) - half,
              p1.x + (N ? N.x * o1 : 0) - half, p1.y + (N ? N.y * o1 : 0) - half,
           typeof col === 'function' ? col(i, f) : col, w);
  }
}
// a four-point twinkle
function trailStar(c, x, y, core, arm, a){
  fxDot(c, x, y, 1, core, a);
  if(a > 0.6) for(const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) fxDot(c, x + dx, y + dy, 1, arm, a * 0.8);
}
const WING = [['....X', '...XX', '..XXw', 'XXXw.'], ['.....', 'XXXww', '.XXXw', '..XX.']];

// A ball effect is drawn instead of the plain trail: path is the ball's last
// few positions (0 is the ball itself), r its size, t the scene clock.
const BALLFX = {
  /* ---- Gold: a gilded ribbon that glints ---- */
  tGold(c, b, path, r, t){
    const w = Math.max(2, r + 1);
    trailRibbon(c, path, w, i => i < 3 ? '#FFE7A3' : i < 8 ? '#E3B457' : '#A8812F', 1);
    trailRibbon(c, path.slice(0, 5), 1, '#FFF6D8', 0.9);
    for(let i = 2; i < path.length; i += 2){
      const tw = Math.sin(t * 10 + i * 1.7 + b.seed);
      const N = trailNormal(path), side = (i & 2 ? 1 : -1) * (w + 1);
      if(tw > 0.45) trailStar(c, path[i].x + N.x * side, path[i].y + N.y * side, '#FFFFFF', '#FFE7A3', tw);
    }
    trailBall(c, b, path[0], r);
  },
  /* ---- Aurora: bands of northern light, rippling ---- */
  tAurora(c, b, path, r, t){
    const w = Math.max(3, r + 1), wave = i => Math.round(Math.sin(t * 7 - i * 0.8) * 2);
    trailRibbon(c, path, 1, '#C68BFF', 0.55, i => wave(i) - w);
    trailRibbon(c, path, w, i => (i + Math.floor(t * 6)) % 4 < 2 ? '#57E0BE' : '#9FF5DD', 1, wave);
    trailRibbon(c, path, 1, '#7ADB86', 0.8, i => wave(i) + w);
    trailBall(c, b, path[0], r);
  },
  /* ---- Ember: burning from white to cinder, sparks lifting off it ---- */
  tEmber(c, b, path, r, t){
    const cols = ['#FFF3B0', '#FFD06A', '#FFB43A', '#F07A3A', '#C8401E', '#6A2A1E'];
    trailRibbon(c, path, Math.max(2, r + 1), (i, f) => cols[Math.min(cols.length - 1, Math.floor(f * cols.length))], 1);
    for(let i = 2; i < path.length; i++){
      const rise = (t * 2.5 + hr(i, b.seed)) % 1, p = path[i];
      fxDot(c, p.x + (hr(b.seed, i) - 0.5) * 6 + Math.sin(t * 9 + i) * 1.5, p.y - 2 - rise * 11, 1,
            rise < 0.4 ? '#FFE08A' : '#F07A3A', 1 - rise);
    }
    // smoke off the cold end
    for(let i = path.length - 3; i < path.length; i++){
      if(i < 1) continue;
      const p = path[i], rise = (t * 1.2 + i * 0.3) % 1;
      fxDot(c, p.x, p.y - 2 - rise * 6, 2, '#5A5250', 0.35 * (1 - rise));
    }
    trailBall(c, b, path[0], r);
  },
  /* ---- Mythic: a violet ribbon scattering stars ---- */
  tMythic(c, b, path, r, t){
    const w = Math.max(3, r + 1);
    trailRibbon(c, path, w, i => i < 4 ? '#E3C8FF' : '#C68BFF', 1);
    trailRibbon(c, path.slice(0, 6), 1, '#FFFFFF', 0.7);
    for(let i = 1; i < path.length; i++){
      const tw = Math.sin(t * 8 + i * 2.1 + b.seed);
      if(tw < 0.3) continue;
      const p = path[i], ox = (hr(i, b.seed) - 0.5) * (w * 6 + 6), oy = (hr(b.seed, i) - 0.5) * (w * 5 + 5);

  },
  /* ---- Rainbow: every colour, stacked, with a bounce in it ---- */
  tRainbow(c, b, path, r, t){
    const cols = ['#E4574A', '#F0A03C', '#E3D457', '#7ADB86', '#57A5C2', '#C68BFF'];
    const bt = Math.max(1, r), top = -Math.round(cols.length * bt / 2), N = trailNormal(path);
    const hop = i => ((i + Math.floor(t * 10)) & 2) ? 1 : 0;
    cols.forEach((col, k) => trailRibbon(c, path, bt, col, 1, i => top + k * bt + hop(i) + (bt >> 1)));

    trailBall(c, b, path[0], r);
  },
  /* ---- Seraph Wake: a river of light, feathers falling from it, and the
     ball carried on wings under a halo ---- */
  tSeraph(c, b, path, r, t, u){

    trailRibbon(c, path, w + 3, '#FFD66B', 0.30);
    trailRibbon(c, path, w + 1, i => i < 5 ? '#FFFFFF' : '#FFF6D8', 0.9);
    trailRibbon(c, path.slice(0, 7), 1, '#FFFFFF', 1);
    // feathers, swaying down off the trail
    for(let i = 2; i < path.length; i += 2){
      const fall = (t * 0.8 + hr(i, b.seed)) % 1, p = path[i];
      const x = p.x + Math.sin(t * 3 + i) * 4, y = p.y + 2 + fall * 14, a = 1 - fall;
      const flip = (Math.floor(t * 4 + i) & 1) ? 1 : -1;
      fxDot(c, x, y, 1, '#FFFFFF', a); fxDot(c, x + flip, y, 1, '#FFFFFF', a);
      fxDot(c, x + flip * 2, y + 1, 1, '#E8DCC0', a);
    }
    // motes of gold rising off it
    for(let i = 1; i < path.length; i += 2){
      const rise = (t * 1.6 + hr(b.seed, i)) % 1, p = path[i];
      fxDot(c, p.x + (hr(i, b.seed + 3) - 0.5) * 8, p.y - 2 - rise * 9, 1, '#FFD66B', 1 - rise);
    }
    const h0 = path[0], pulse = 0.5 + 0.5 * Math.sin(t * 6 + b.seed);

    // wings, beating

        fxDot(c, h0.x + Math.cos(a) * (2 + q * 12), h0.y + Math.sin(a) * (1 + q * 5), 1, i & 1 ? '#FFFFFF' : '#FFD66B', 1 - q);

  },
  /* ---- Comet: a blazing head and a long burning tail ---- */
  comet(c, b, path, r, t, u){
    const cols = ['#FFFFFF', '#FFF3B0', '#FFB43A', '#F0612A', '#B8341C', '#5A2A20'];

  /* ---- Black Hole: a dark core with a disc of light turning round it ---- */
  blackhole(c, b, path, r, t, u){

      const p0 = path[i], p1 = path[i - 1];

  /* ---- Confetti: it is a party ---- */
  confetti(c, b, path, r, t, u){
    const cols = ['#FF4FB8', '#3FE0FF', '#FFE14A', '#7CFF6A', '#FF7A3A', '#B08BFF'];
    trailRibbon(c, path, 2, '#FF4FB8', 1, i => Math.round(Math.sin(t * 9 - i * 0.9) * 3) - 2);
    trailRibbon(c, path, 2, '#3FE0FF', 1, i => Math.round(Math.sin(t * 9 - i * 0.9 + Math.PI) * 3) + 2);

    }
    fxDot(c, path[0].x - r - 1, path[0].y - r - 1, r * 2 + 2, '#FFFFFF', 1);
    c.globalAlpha = 1;
  },
  /* ---- Bubbles: it leaves a trail of them, rising and popping ---- */
  bubbles(c, b, path, r, t, u){
    trailRibbon(c, path, Math.max(2, r + 1), i => i & 1 ? '#BFE6FA' : '#E6D8FF', 0.55);
    for(let q = 0; q < path.length * 2 - 2; q++){
      const i = 1 + (q >> 1), side = q & 1 ? 1 : -1;
      const p = path[i], rise = i * 1.8, R = 2 + ((q + (b.seed | 0)) % 3);

      c.globalAlpha = 0.95; pxRing(c, Math.round(x), Math.round(y), R, (q & 3) === 1 ? '#E6D8FF' : '#BFE6FA');

    }

    const h0 = path[0], BR = r + 3;
    c.globalAlpha = 0.9; pxRing(c, Math.round(h0.x), Math.round(h0.y), BR, '#BFE6FA');
    fxDot(c, h0.x - BR + 1, h0.y - BR + 1, 2, '#FFFFFF', 1);
    fxDot(c, path[0].x - r, path[0].y - r, r * 2, '#FFFFFF', 1);
    c.globalAlpha = 1;
  },
  /* ---- Hearts: a little love for every shot ---- */
  hearts(c, b, path, r, t, u){
    const HEART = ['.X.X.', 'XXXXX', '.XXX.', '..X..'];
    trailRibbon(c, path, Math.max(2, r + 1), i => i & 2 ? '#FF9AB8' : '#FF4F7A', 0.7);
    for(let i = 1; i < path.length; i++){
      const p = path[i], sc = i < 8 ? 2 : 1;
      const x = Math.round(p.x - 2.5 * sc + Math.sin(t * 3 + i) * 3), y = Math.round(p.y - 2 * sc - i * 1.5);
      c.globalAlpha = 1 - i / path.length * 0.6; c.fillStyle = i % 3 === 1 ? '#FF4F7A' : i % 3 ? '#FF9AB8' : '#FFFFFF';
      HEART.forEach((row, yy) => [...row].forEach((ch, xx) => { if(ch === 'X') c.fillRect(x + xx * sc, y + yy * sc, sc, sc); }));
    }
    // the ball is a heart, beating
    const h0 = path[0], hs = Math.max(2, r) + (Math.sin(t * 14) > 0.3 ? 1 : 0);
    const hx = Math.round(h0.x - 2.5 * hs), hy = Math.round(h0.y - 2 * hs);
    c.globalAlpha = 1;
    HEART.forEach((row, yy) => [...row].forEach((ch, xx) => { if(ch !== 'X') return;

    c.globalAlpha = 1;
  },
  /* ---- Rubber Duck: the ball is a duck ---- */
  duck(c, b, path, r, t, u){
    // a wake: water behind it, foam on the water, drops flicked off it
    trailRibbon(c, path, Math.max(3, r + 2), i => i & 1 ? '#7FC8F0' : '#5AAEE0', 0.8);
    trailRibbon(c, path, 1, '#FFFFFF', 0.9, i => (i & 1 ? 1 : -1) * 2);
    for(let i = 2; i < path.length; i += 2){
      const fall = (t * 2 + hr(i, b.seed)) % 1;
      fxDot(c, path[i].x + (hr(b.seed, i) - 0.5) * 8, path[i].y - 2 + fall * 7, 1, '#DFF4FF', 1 - fall);
    }
    const DUCK = ['..YY..', '.YYYO.', 'YYYYY.', '.YYY..'];
    const s = Math.max(3, r + 1), h0 = path[0], bob = Math.round(Math.sin(t * 20) * 0.6);

    c.globalAlpha = 1;
    DUCK.forEach((row, yy) => [...row].forEach((ch, xx) => {

      c.fillStyle = ch === 'O' ? '#FF8A2A' : yy === 0 && xx === 3 ? '#1A1A1A' : '#FFD84A';
      c.fillRect(x + xx * s, y + yy * s, s, s);
    }));
    c.fillStyle = '#1A1A1A'; c.fillRect(x + 3 * s, y + s, 1, 1);

    if(hr(n, 7) > 0.4 && ((t + b.seed) / 2.5) % 1 < 0.35)

    c.globalAlpha = 1;
  },
  /* ---- Godlight: a haloed ball on a ribbon of light, shedding stars ---- */
  godlight(c, b, path, r, t, u){
    // the ribbon: a continuous stroke through the path, gold fading to warm
    // white at the ball, with a white spine
    trailRibbon(c, path, r + 5, '#FFD66B', 0.25);
    trailRibbon(c, path, Math.max(2, r + 1), i => i < 4 ? '#FFE7A3' : '#E3B457', 1);

    drawGlow(c, h0.x, h0.y, hr0, hr0, [[0.7, '#E3B457', 1], [0.35, '#FFE39A', 2], [0, '#FFF6D8', 3]], Math.floor(t * 8) & 3);

        fxDot(c, h0.x + Math.cos(a) * R, h0.y + Math.sin(a) * R * 0.45, 1, i & 1 ? '#FFFFFF' : '#FFD66B', 1 - q);

    fxDot(c, h0.x - r, h0.y - r, r * 2, b.crit ? '#FFD66B' : '#FFFFFF', 1);
    c.globalAlpha = 1;
  }
};

const Scene = {
  cv:null, ctx:null, buf:null, b:null, scale:3,
  camD:0, dCam:0, hole:1, tier:0, t:0,
  trees:[], bunkers:[], water:null, hills:[], seed:1,
  swingT:0, swingDur:0.42, balls:[], nums:[], sparks:[], casts:[], banner:null,
  night:false, aurora:false, rain:false, wind:0,
  motes:[], flash:0, flashCol:'#fff', sky:null, pendingBall:null,

  init(){
    this.cv = $('hole');
    // a tap anywhere on the field ends a fly-over
    $('stage').addEventListener('pointerdown', () => { if(this.fly) this.fly = null; });
    this.ctx = this.cv.getContext('2d');
    buildSprites();
    this.resize();
    window.addEventListener('resize', () => this.resize());
    window.addEventListener('orientationchange', () => setTimeout(() => this.resize(), 120));
    if(window.ResizeObserver){
      let last = 0;
      new ResizeObserver(() => {
        const k = this.cv.clientWidth * 10000 + this.cv.clientHeight;
        if(k !== last){ last = k; this.resize(); }
      }).observe(this.cv);
    }
  },
  resize(){
    // With the menu pulled up the stage is display:none, so the canvas reports
    // nothing. Rebuilding against a guess would throw away a good buffer and
    // rebuild it wrong; better to keep what we have until it is back.
    if(this.buf && (!this.cv.clientWidth || !this.cv.clientHeight)) return;
    const w = this.cv.clientWidth || 360;
    const h = this.cv.clientHeight || Math.round(w * 0.58);
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    const dw = Math.max(120, Math.round(w * dpr)), dh = Math.max(80, Math.round(h * dpr));
    // integer upscale only: fractional scaling makes some pixels wider than
    // others, which is the fastest way to make pixel art look cheap
    const sc = clamp(Math.round(dpr * PX_CSS), 2, 8);
    const bw = Math.ceil(dw / sc), bh = Math.ceil(dh / sc);
    this.cv.width = dw; this.cv.height = dh;
    this.scale = sc;
    if(!this.buf) this.buf = document.createElement('canvas');
    this.buf.width = bw; this.buf.height = bh;
    this.b = this.buf.getContext('2d');
    this.b.imageSmoothingEnabled = false;
    this.ctx.imageSmoothingEnabled = false;
    this.ctx.imageSmoothingQuality = 'low';
    setViewport(bw, bh);
    this.buildSky();
    this.mapOn = false; this._mapTry = null;   // the hole map is placed again
  },

  // World-space overlap test. Hazards were placed by pure rejection-free random
  // draw, so bunkers sat inside water and trees grew out of both.
  hitsHazard(d, x, pad){
    pad = pad || 0;
    if(this.water){
      const w = this.water;
      if(Math.abs(d - w.d) < w.rd + pad && Math.abs(x - w.x) < w.rx + pad) return true;
    }
    for(const b of this.bunkers)
      if(Math.abs(d - b.d) < b.rd + pad && Math.abs(x - b.x) < b.rx + pad) return true;
    return false;
  },
  onPlay(d, x, pad){          // on the fairway or the green
    if(Math.abs(x) < this.fwWidth(d) + (pad || 0)) return true;
    if(Math.abs(d - LEN) < 8 && Math.abs(x) < 2.6 + (pad || 0)) return true;
    return false;
  },
  // The putting surface is not a place for a hazard. Bunkers are drawn out to
  // 0.92 of the hole and ponds to three quarters of it, both with radii big
  // enough to reach the green from there, and one that does is not a hazard,
  // it is a hole in the green.
  hitsGreen(h){
    return Math.abs(h.d - LEN) < h.rd + 10.4 && Math.abs(h.x) < h.rx + 4.4;
  },
  // Hazards laid down one at a time, each rejected if it lands on one already
  // placed. Water goes first because it is the biggest.
  layHazards(rnd, cfg){
    this.water = null; this.bunkers = [];
    const cn = cfg.corners || [];
    if(cfg.water){
      for(let a = 0; a < 40; a++){
        // the first tries go on the outside of the biggest corner, just past
        // the elbow, where the straight shot runs out
        const k = a < 20 && cn[0];
        const w = { d: k ? k.d + (rnd() - 0.2) * k.w : cfg.wd(rnd),
                    x: k ? k.out * (2.7 + rnd()*1.2) : cfg.wx(rnd), rd: cfg.wrd(rnd), rx: cfg.wrx(rnd),
                    shape: this.blob(rnd, .24), shape2: this.blob(rnd, .24) };
        if(Math.abs(w.x) - w.rx < B_LANE) continue;     // keep it off the lane he walks
        if(this.hitsGreen(w)) continue;
        this.water = w; break;
      }
    }
    // one bunker on the outside of every corner, then one tucked into the
    // inside of the first, then wherever they fall
    const plan = cn.map(k => ({ k, side: k.out })).concat(cn.length ? [{ k: cn[0], side: -cn[0].out, pull: 1 }] : []);
    for(let i = 0; i < Math.max(cfg.nb, Math.min(plan.length, cfg.nb + 1)); i++){
      for(let a = 0; a < 40; a++){
        const pl = a < 20 && plan[i];
        const b = { d: pl ? pl.k.d + (rnd() - 0.5) * pl.k.w * (pl.pull ? 0.6 : 0.9) - (pl.pull ? pl.k.w * 0.4 : 0) : cfg.bd(rnd),
                    x: pl ? pl.side * (1.7 + rnd()*1.3) : cfg.bx(rnd), rd: cfg.brd(rnd), rx: cfg.brx(rnd),
                    shape: this.blob(rnd, .26), shape2: this.blob(rnd, .26) };
        // Bunkers only checked each other before, so one could sit straight on

  layProps(rnd, cfg){

    const nTree = Math.round(cfg.trees);
    for(let i = 0; i < nTree; i++){
      for(let a = 0; a < 18; a++){

        put.push({ kind:0, d, x, s:.78 + rnd()*.55,

      }

    // flies over them.
    for(const k of (cfg.corners || [])){
      const n = Math.round((7 + rnd()*5) * Math.max(0.6, cfg.trees / 36));
      for(let i = 0; i < n; i++){
        for(let a = 0; a < 18; a++){
          const d = k.d + (rnd() - 0.5) * k.w * 1.8, x = -k.out * (3.7 + rnd()*2.6);

        if(this.hitsHazard(d, x, 0.45) || this.onPlay(d, x, 0.18) || clash(d, x, 0.9)) continue;
        put.push({ kind:1, d, x, c: Math.floor(rnd()*6), p: rnd()*6.28 });

    // used to be painted on after the prop pass at a distance measured from the
    // CAMERA, which is two bugs in one: anchored to the camera they slide along
    // with you instead of being passed, and drawn after the props they cut
    // straight through the spectators standing in front of them. They are props
    // now, so they sit still and take their turn in the sort like everything
    // else on the hole.
    if(cfg.ropes){

          const post = { kind:2, d, x };

    for(const py of (cfg.pylons || [])) put.push({ kind:3, d: py.d, x: py.x });

        if(this.hitsHazard(d, x, 0.45) || clash(d, x, 0.85)) continue;
        put.push({ kind:1, d, x, c: Math.floor(rnd()*6), p: rnd()*6.28 });
        break;
      }
    }

  // A closed outline, smoothed so neighbouring control points cannot differ
  // enough to show as a facet once shapeAt runs between them.
  blob(rnd, amp){
    const n = 22, raw = [];
    for(let i = 0; i < n; i++) raw.push(1 + (rnd()*2 - 1)*amp);
    const out = [];
    for(let i = 0; i < n; i++)
      out.push((raw[(i-1+n)%n] + raw[i]*2 + raw[(i+1)%n]) / 4);
    out[n-1] = out[n-1]*0.5 + out[0]*0.5;

  // ---- the ground is not a plane ----
  // Height along the hole, in the same units the lateral scale uses. One screen
  // row maps to one world distance in this renderer, so the ground can rise and
  // fall ALONG the hole but cannot tilt across it. That is the trade the
  // scanline technique makes in exchange for seam-free, pixel-exact
  // perspective, and it is why a bunker still gets its depth from its rim
  // rather than from the terrain.
  hAt(d){
    const A = this.roll === undefined ? 1 : this.roll;
    if(A <= 0) return 0;
    const k = this.seed || 0;
    // Periods are set against the length of a HOLE, not against some arbitrary
    // world scale: at a wavelength of three hundred units a sixty unit hole
    // only ever sees part of one cycle, which is a ramp rather than rolling
    // ground. These give roughly one long rise and a couple of lesser ones
    // between the tee and the green.
    let h = Math.sin(d*0.085 + k)*4.60
          + Math.sin(d*0.170 + k*1.7)*2.00
          + Math.sin(d*0.310 + k*0.6)*0.70;
    h *= clamp(d/7, 0, 1);                       // the tee is cut level
    const g = clamp(1 - Math.abs(d - LEN)/10, 0, 1);
    return (h*(1 - g) + (this.greenH || 0)*g) * A;   // the green on its own shelf
  },
  // Ground height relative to what the camera is standing on, eased in over
  // the first few units ahead of him. The camera sits very close, so s is huge
  // in the near field: a gradient steep enough to read out at the green is far
  // too steep at his feet, and the ground drops clean out of frame leaving him
  // standing on terrain a hole away. Easing it in keeps the ground he is on
  // level and lets the shape develop with distance, where it is legible.
  groundH(d){
    const t = clamp((d - this.camD) / 11, 0, 1);
    return (this.hAt(d) - (this.camH || 0)) * (t*t*(3 - 2*t));

  clipAt(d){

    if(d <= cd[0]) return cy[0];
    if(d >= cd[n-1]) return cy[n-1];
    let lo = 0, hi = n - 1;
    while(hi - lo > 1){ const m = (lo + hi) >> 1; if(cd[m] <= d) lo = m; else hi = m; }
    return cy[lo];

  // One slice of one hazard, drawn as sunken ground rather than as a coloured
  // patch with a dark ring round it.
  //
  // Depth cannot come from the displacement alone, and that was the mistake in
  // every version of this before. The camera stands 2.8 world units up, so a
  // pit deep enough to shift its floor a useful number of pixels down the
  // screen is also deep enough for its own near rim to hide nearly all of that
  // floor: at the depth this used to run at, six of a bunker's eight units
  // were behind the lip and the reward was five pixels. Every bit of the depth
  // budget went into hiding the pit and none into showing it, which is why it
  // kept collapsing back into an outline however the outline was drawn.
  //
  // So the footprint carries a depth FIELD, and every column across it is both
  // pushed down the screen by its own depth and shaded by its own surface
  // normal. One inner wall catches the light, the opposite one falls into
  // shadow, the far wall turns away from it, the floor sits below the turf it
  // was cut out of, and the near lip hides just the near sliver of it the way
  // a real one does. The displacement is what makes it sit down in the ground;
  // the shading is what makes you see that it has.
  hazSlice(c, T, hz, P, d, s, y, hgt, near, C0){
    const sp = this.hazSpan(hz, d);
    if(!sp) return;
    const cx = C0 + hz.x * LAT * s;
    const xl = Math.round(cx - sp.l * LAT * s), xr = Math.round(cx + sp.r * LAT * s);
    const w = xr - xl;
    if(w <= 0) return;
    // Per COLUMN, not per scanline. One clip for the whole width meant the
    // moment the lip stopped hiding the floor it let go across the entire
    // shape at once, and the slice that did it came out as a solid slab of
    // one colour laid over the end of the hazard.
    const py = hz._py || (hz._py = new Float32Array(HZ_N));
    if(!hz._on){ hz._on = 1; py.fill(y + hgt); }
    hazCols(P);
    const tt  = clamp((d - (hz.d - hz.rd)) / (hz.rd*2), 0, 1);
    const gv  = hazProf(tt, P.e0, P.e1);
    const gs  = hazSlope(tt, P.e0, P.e1);
    const hw  = Math.max(0.25, (sp.l + sp.r) * 0.5);
    const kz  = LAT * s * 0.55;                    // world height -> screen rows
    const gyk = P.D * gs / (hz.rd * 2);            // d(depth)/d(distance)
    const gxk = P.D * gv / (hw * 2);               // d(depth)/d(lateral), per unit t
    let rx0 = 0, rx1 = 0, rt = 0, rb = 0, rc = '', run = false;
    const dk = P.D * gv * kz;
    for(let i = 0; i < HZ_N; i++){
      const fu  = P._fu[i];
      const top = y + fu * dk;
      const bot = py[i];
      if(top >= bot - 0.2) continue;               // this column is behind the lip
      py[i] = top;
      // Start at the SHALLOWER of the two neighbours, and a row above that
      // again. The floor slopes sideways, so adjacent columns land on
      // different rows, and the step between them belongs to neither -- which
      // came out as turf speckled up the wall of the pit in a diagonal line,
      // one dot per column. The overlap only ever runs into the neighbouring
      // column's own sand, never out into the turf: the shallowest column of
      // all is the one at the rim, and it has no shallower neighbour to
      // borrow from.
      const t0 = Math.round(y + P._fm[i] * dk) - (P._fm[i] < fu ? 1 : 0);
      // and always at least one row, so a band thinner than a pixel still
      // covers the ground it is cut into
      const t1 = Math.max(t0 + 1, Math.round(bot));
      const x0 = xl + ((w*i / HZ_N) | 0), x1 = xl + ((w*(i+1) / HZ_N) | 0);
      if(x1 <= x0) continue;
      const gx = gxk * P._fs[i], gy = gyk * fu;
      const len = Math.sqrt(gx*gx + gy*gy + 1);
      const ndl = (gx*HZ_LX + gy*HZ_LY + HZ_LZ) / len;
      // how steeply this column is tilted at all, whichever way it faces: the
      // inside of a bowl is shaded away from the sky on both sides, not only
      // on the one turned away from the sun
      const col = P.tone(T, fu*gv, ndl, near, Math.sqrt(gx*gx + gy*gy));
      if(run && rc === col && rt === t0 && rb === t1 && rx1 === x0){ rx1 = x1; continue; }
      if(run){ c.fillStyle = rc; c.fillRect(rx0, rt, rx1 - rx0, rb - rt); }
      run = true; rx0 = x0; rx1 = x1; rt = t0; rb = t1; rc = col;
    }
    if(run){ c.fillStyle = rc; c.fillRect(rx0, rt, rx1 - rx0, rb - rt); }
    // one broken glint on open water, so the surface is not a dead sheet
    if(P.rip && w > 10 && gv > 0.9){
      const yy = Math.round(y + P.D * gv * kz);
      if(((yy + Math.floor(this.t*4)) % 9) === 0){
        const rw = Math.round(w * (0.16 + 0.15*Math.abs(Math.sin(yy*0.6 + this.t))));
        c.fillStyle = pickC(T._wt, 0.88);
        c.fillRect(xl + ((w - rw) >> 1) + Math.round(Math.sin(yy*0.31)*w*0.14), yy, rw, 1);
      }
    }
  },

  holeLen(){ return LEN; },
  flyStart(){ this.fly = { t: 0, dur: 3.4, to: LEN - 13 }; },
  drawCaddie(c, gh, walking){
    const p = this.proj(this.camD + 0.25, -1.45);
    const h = Math.max(6, Math.round(gh * 0.93)), spr = SPRITE.caddie;
    const w = Math.max(4, Math.round(h * spr.w / spr.h));
    const x = p.x - Math.round(w*0.42);

    const y = p.y - h - up;

    c.fillRect(x + Math.round(w*0.25), p.y - 1, Math.round(w*0.45), Math.max(1, Math.round(h*0.045)));

  // Where a ball is across the hole a fraction u of the way through its
  // flight: off the face, eased onto its line, and carried downwind while it
  // is up. The wind's push is a bow, nothing at either end, so the ball
  // still leaves the club and comes down where it was going -- a ball aimed
  // off into the breeze and brought back by it.
  ballLat(b, u){

  },
  windMph(){ return Math.round(Math.abs(this.wind || 0) * 18); },
  // ---- the hole bends ----
  // Every hole used to run dead straight from tee to green. It has a centre
  // line now -- a dogleg on most par fours, an S on a par five, a drift on a
  // par three -- and everything on the hole is laid out ACROSS that line: the
  // fairway, the hazards, the trees, the gallery, the green, and the ball. A
  // ball's lateral position is measured from the centre line, so a shot aimed
  // down the fairway follows the fairway round the corner and lands on it,
  // wherever the corner is.
  curveAt(d){

    let x = C.sway * Math.sin(d * 0.06 + C.ph) * clamp(d / 10, 0, 1);

    const h = this.groundH(d) + (lift || 0);

  },

  newHole(h, tier){
    this.hole = h; this.tier = tier;
    const rnd = seeded(h*7919 + tier*104729);
    this.seed = rnd() * 1000;
    this.roll = 1;
    this.greenH = (rnd()*2 - 1) * 3.4;   // uphill or downhill to the green
    const ch = S.chaos ? S.chaos.n : 'Fair';
    this.night  = /Night/.test(ch);
    this.aurora = /Aurora|Ley|Mythic/.test(ch);
    this.rain   = /Crosswind|Marshal/.test(ch);
    this.wind   = (rnd()*2 - 1) * 0.7;
    if(/Crosswind/.test(ch)) this.wind = (this.wind < 0 ? -1 : 1) * (1.0 + Math.abs(this.wind) * 0.5);
    const cs = courseFor(tournamentOf(h));
    const mode = this.night ? 'night' : this.rain ? 'rain' : 'day';
    this.course = cs;
    this.land = cs.land;
    this.themeId = cs.id + '|' + mode;
    this.theme = buildTheme(cs, mode);
    this.treeSpr = courseTrees(cs, mode);

    // The bend, off its own stream. a: how far the line moves across, c:
    // where the corner is, w: half the length of the turn. Laid down before
    // the hazards, which are placed by it.
    {
      const cr = seeded(h*7919 + tier*104729 + 31337), par = parOf(h);
      const side = cr() < 0.5 ? -1 : 1, segs = [];
      if(par === 4 && cr() < 0.8)
        segs.push({ a: side*(11 + cr()*8), c: LEN*(0.40 + cr()*0.20), w: LEN*(0.14 + cr()*0.08) });
      else if(par === 5){
        segs.push({ a: side*(8 + cr()*6), c: LEN*(0.28 + cr()*0.10), w: LEN*(0.11 + cr()*0.05) });
        segs.push({ a: (cr() < 0.6 ? -side : side)*(9 + cr()*7), c: LEN*(0.64 + cr()*0.10), w: LEN*(0.11 + cr()*0.05) });
      }else if(par === 3 && cr() < 0.5)
        segs.push({ a: side*(2 + cr()*3), c: LEN*0.5, w: LEN*0.3 });
      this.curve = { segs, sway: 0.6 + cr()*1.2, ph: cr()*6.28 };
      this._bcD = null;
    }
    // Each corner, and which side of it is the outside: the side a shot
    // hit straight on would run out through. That is where a designer puts
    // the water and the sand; the trees crowd the inside, so cutting the
    // corner is the gamble it is on a real course.
    const corners = this.curve.segs.filter(g => Math.abs(g.a) >= 6)
      .map(g => ({ d: g.c, w: g.w, out: g.a > 0 ? -1 : 1 }))
      .sort((p, q) => q.w - p.w);

    this.layHazards(rnd, {
      corners,
      water: rnd() < L.water,
      wd: r => LEN*0.26 + r()*LEN*0.48, wx: r => (r()<.5?-1:1)*(2.6 + r()*1.3),
      wrd: r => (LEN*0.09 + r()*LEN*0.10) * L.wsize, wrx: r => (1.0 + r()*0.8) * L.wsize,
      nb: Math.max(1, Math.round(L.nb * (0.7 + rnd()*0.6))),
      bd: r => LEN*0.18 + r()*LEN*0.74, bx: r => (r()<.5?-1:1)*(1.6 + r()*1.6),
      brd: r => (LEN*0.035 + r()*LEN*0.045) * L.bsize, brx: r => (.5 + r()*.55) * L.bsize
    });
    this.layProps(rnd, { trees: (30 + rnd()*14) * L.trees, kind: L.kind, corners,
                         crowd: (26 + rnd()*14) * L.crowd });

    this.hills = [[], []];
    for(let L = 0; L < 2; L++)
      for(let i = 0; i <= 40; i++) this.hills[L].push(rnd());


    this.camD = 0;
    this.balls.length = 0; this.nums.length = 0; this.sparks.length = 0;
    this.buildSky();
  },

  // A floor of the Depths is a hole. Same renderer, same camera, same walk to
  // the flag; only the ground you are walking on changes. An abstract shaft
  // was never going to read as golf, because it was not golf.
  newDepthsHole(R){
    const dg = R.id;
    this.curve = null; this._bcD = null;      // a wager is played dead straight
    this.wind = 0;                            // and in still air
    this.themeId = dg;
    this.theme = THEMES[dg] || THEMES.day;
    this.treeSpr = null;
    this.land = { fw: dg === 'water' ? 1.55 : dg === 'sand' ? 2.30 : dg === 'cellar' ? 2.60
                    : dg === 'scramble' ? 3.30 : dg === 'twilight' ? 2.80 : 3.10,
                  taper: 0.85 };
    this.night = dg === 'cellar';
    this.aurora = false;
    this.rain = false;
    const rnd = seeded(hash32(R.floor*7919 + dg.length*104729 + 13));
    this.seed = rnd() * 1000;
    this.roll = 0.42;                    // a cellar floor does not roll like links
    this.greenH = (rnd()*2 - 1) * 1.4;
    this.hole = R.floor + 1;

    this.layHazards(rnd, {
      water: dg === 'water' || (dg === 'cellar' && rnd() < .5),
      wd: r => dg === 'water' ? LEN*0.50 : LEN*0.3 + r()*LEN*0.4,
      wx: r => (r()<.5?-1:1)*(dg === 'water' ? 2.9 : 2.6),
      wrd: r => dg === 'water' ? LEN*0.40 : LEN*0.12,
      wrx: r => dg === 'water' ? 2.0 : 1.1,
      nb: dg === 'sand' ? 6 + Math.floor(rnd()*3) : dg === 'vault' ? 1 + Math.floor(rnd()*2)
          : 2 + Math.floor(rnd()*2),
      bd: r => LEN*0.12 + r()*LEN*0.82,
      bx: r => (r()<.5?-1:1)*(1.4 + r()*(dg === 'sand' ? 2.2 : 1.6)),
      brd: r => LEN*(dg === 'sand' ? 0.055 : 0.035) + r()*LEN*0.045,
      brx: r => (dg === 'sand' ? 0.8 : 0.5) + r()*0.55
    });
    // The Island Green earns the name: a moat centred on the green itself,
    // wide enough that the fairway runs out and the putting surface sits alone
    // in the middle of it.
    // The green has to sit ALONE in the water or the name is a lie. At a
    // radius of a quarter the hole the moat started well past the camera and
    // there was a fairway running all the way to it, which is a par three
    // over a pond. It now opens at the golfer's feet and runs past the green.
    if(R.mode === 'island')
      this.water = { d: LEN, x: 0, rd: LEN*0.30, rx: 6.0, shape: this.blob(rnd, 0.14) };
