<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06100C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mythic Mulligan</title>
<style>
:root{
  --ink:#06100C; --pine:#0C1A13; --panel:#112318; --raise:#17301F; --raise2:#1D3B28;
  --line:#22462F; --line-soft:#1A3524;
  --chalk:#DFE9DC; --dim:#82A08B; --faint:#5B7864;
  --brass:#E3B457; --brass-dk:#8A6A26;
  --flag:#E4574A; --aurora:#57E0BE; --myth:#C68BFF;

  --r0:#93A69A; --r1:#64D07A; --r2:#4FA3F0; --r3:#B36BF5; --r4:#F0A03C; --r5:#FF5F86;
  --ember:#FF7A3D; --frost:#6FD9F2; --storm:#F2D75E; --verdant:#7ADB86; --void:#A86BF5;

  --disp:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --hair:1px solid var(--line-soft);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--ink);color:var(--chalk);font-family:var(--sans);
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:manipulation;
  display:flex;justify-content:center;
}
button{font:inherit;color:inherit;background:none;border:0;touch-action:manipulation;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
#app{width:100%;max-width:660px;height:100%;display:flex;flex-direction:column;
  background:var(--pine);border-left:var(--hair);border-right:var(--hair);position:relative}
#crest,#vitals,#tabs,#card,#xpStrip{flex:0 0 auto}
#stage{flex:0 0 50%;min-height:0}
#panel{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

.eyebrow{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);font-weight:700}
.mono{font-family:var(--mono)}

/* ---------- crest bar ---------- */
#crest{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;border-bottom:var(--hair);
  background:linear-gradient(180deg,#0B1811,#0C1A13)}
#crest{padding:calc(env(safe-area-inset-top) + 6px) 12px 6px}
#eventLine{font-family:var(--disp);font-size:14px;letter-spacing:.02em;line-height:1.1;color:var(--chalk)}
#sub{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-top:2px}
#gold{font-size:17px}
#purse{text-align:right}
#gold{font-family:var(--mono);font-size:19px;font-weight:600;color:var(--brass);line-height:1}
#rate{font-size:10px;color:var(--dim);margin-top:2px;font-family:var(--mono)}

/* ---------- experience strip ---------- */
#xpStrip{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;
  width:100%;padding:6px 12px 7px;background:#0A170F;border-bottom:var(--hair);text-align:left}
#xpLv{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.06em;
  color:var(--brass);white-space:nowrap}
#xpStrip.para #xpLv{color:var(--myth)}
#xpTrack{height:4px;border-radius:2px;background:#0D1D14;overflow:hidden;position:relative}
#xpFill{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brass),#F3DFA6);
  transition:width .25s ease-out}
#xpStrip.para #xpFill{background:linear-gradient(90deg,#8E4FD0,var(--myth))}
#xpNum{font-family:var(--mono);font-size:9.5px;color:var(--faint);white-space:nowrap}
#xpStrip.ready #xpNum{color:var(--aurora)}

/* ---------- scorecard strip ---------- */
#card{display:grid;grid-template-columns:repeat(18,1fr);border-bottom:var(--hair);background:#0A170F}
.cell{aspect-ratio:1/0.94;border-right:1px solid #14291C;display:flex;align-items:center;
  justify-content:center;position:relative;font-family:var(--mono);font-size:10px;color:var(--faint)}
.cell:last-child{border-right:0}
.cell.now{background:#17301F;color:var(--chalk)}
.cell.now::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--brass)}
.cell b{font-weight:600}
.cell.s-3,.cell.s-4{color:var(--myth)} .cell.s-2{color:var(--brass)}
.cell.s-1{color:var(--aurora)} .cell.s0{color:var(--chalk)}
.cell.s1{color:var(--dim)} .cell.s2,.cell.s3,.cell.s4{color:var(--flag)}
.cell i{position:absolute;top:2px;left:3px;font-size:7px;font-style:normal;color:var(--faint)}

/* the nine: a goal and a running total, so the round has a shape you can see */
#nineBar{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;
  padding:4px 12px 5px;background:#0A170F;border-bottom:var(--hair);
  font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
#nineWhich{color:var(--faint);white-space:nowrap}
#nineGoal{color:var(--dim);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  letter-spacing:.06em;text-transform:none;font-weight:400;font-size:10px}
#nineGoal b{color:var(--aurora);font-weight:600}
#nineGoal.done{color:var(--aurora)}
#nineScore{font-family:var(--mono);color:var(--brass);white-space:nowrap}

/* ---------- stage ---------- */
/* the field takes half the app, and the canvas fills whatever shape that is */
#stage{position:relative;background:#080D0A;border-bottom:var(--hair);overflow:hidden}
#hole{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#hud{position:absolute;inset:0;pointer-events:none;padding:7px 9px;display:flex;
  flex-direction:column;justify-content:space-between}
.hudrow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.plate{background:rgba(6,16,12,.72);border:1px solid rgba(87,224,190,.16);border-radius:3px;
  padding:4px 7px;backdrop-filter:blur(3px)}
.plate .k{font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.plate .v{font-family:var(--mono);font-size:13px;font-weight:600;line-height:1.15}
#chaosTag{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--myth)}
#yardBar{height:3px;background:#0D1D14;border-radius:2px;overflow:hidden;margin-top:5px}
#yardFill{height:100%;width:100%;background:linear-gradient(90deg,var(--brass),#F3DFA6);
  transition:width .12s linear}

/* ---------- vitals ---------- */
#vitals{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:var(--hair);background:#0A170F}
.vital{padding:6px 4px;text-align:center;border-right:1px solid #14291C}
.vital:last-child{border-right:0}
.vital .k{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.vital .v{font-family:var(--mono);font-size:12.5px;font-weight:600;margin-top:2px}

/* ---------- tabs ---------- */
#tabs{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:var(--hair);background:#0A170F}
.tab{padding:9px 1px 8px;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);font-weight:700;border-right:1px solid #14291C;position:relative}
.tab:last-child{border-right:0}
.tab.on{color:var(--brass);background:var(--panel)}
.tab.on::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--brass)}
.tab .dot{position:absolute;top:5px;right:8px;width:5px;height:5px;border-radius:50%;
  background:var(--aurora);display:none}
.tab.alert .dot{display:block}

/* ---------- panel ---------- */
.view{display:none;padding:0 0 calc(env(safe-area-inset-bottom) + 22px)}
.view.on{display:block}
.band{display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:9px 12px 7px;background:#0A170F;border-top:var(--hair);border-bottom:var(--hair);
  position:sticky;top:0;z-index:3}
.band .eyebrow{color:var(--dim)}
.band .note{font-size:10px;color:var(--faint);font-family:var(--mono)}

.row{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center;
  padding:9px 12px;border-bottom:1px solid #12261A}
/* Not scoped to .row: the Skills and Perks rows use .sk-row, so scoping these
   left their text completely unstyled and falling back to browser defaults. */
.nm{font-size:13px;font-weight:600;letter-spacing:-.01em}
.ds{font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.35}
.mt{font-size:10.5px;color:var(--faint);margin-top:3px;font-family:var(--mono)}
.mt b{color:var(--aurora);font-weight:600}
.mt i{color:var(--chalk);font-style:normal}

.buy{min-width:96px;background:var(--raise);border:1px solid var(--line);border-radius:4px;
  padding:7px 8px;text-align:center;line-height:1.2}
.buy .lbl{display:block;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.buy .amt{display:block;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--brass);margin-top:2px}
.buy.ok{background:var(--raise2);border-color:var(--brass-dk)}
.buy.ok .amt{color:#FFD98A}
.buy:disabled,.buy.no{opacity:.34}
.buy.max{background:#12241A;border-color:var(--line-soft)}
.buy.max .amt{color:var(--faint)}

.pill{display:inline-block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 6px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}

/* ---------- multiplier switch ---------- */
#multBar{display:flex;gap:6px}
.mbtn{font-family:var(--mono);font-size:11px;padding:3px 9px;border:1px solid var(--line);
  border-radius:3px;color:var(--dim)}
.mbtn.on{background:var(--raise2);border-color:var(--brass-dk);color:var(--brass)}

/* ---------- currency strip ---------- */
#purseStrip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#12261A}
.cur{background:#0A170F;padding:7px 6px;text-align:center}
.cur .k{font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.cur .v{font-family:var(--mono);font-size:12px;font-weight:600;margin-top:2px}

/* ---------- gear ---------- */
#bagGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#12261A;padding:1px 0}
.slot{background:var(--panel);padding:8px 7px;min-height:74px;display:flex;flex-direction:column;
  justify-content:space-between;border-left:2px solid transparent}
.slot .sk{font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.slot .sn{font-size:11px;font-weight:600;margin-top:4px;line-height:1.25}
.slot .sv{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:3px}
.slot.empty .sn{color:var(--faint);font-weight:400;font-style:italic}

.item{padding:9px 12px;border-bottom:1px solid #12261A;display:grid;
  grid-template-columns:1fr auto;gap:9px;align-items:center;border-left:2px solid transparent}
.item .in{font-size:12.5px;font-weight:600}
.item .ia{font-size:10px;color:var(--dim);margin-top:3px;line-height:1.45;font-family:var(--mono)}
.item .ib{font-size:9px;color:var(--faint);margin-top:2px}
.tag{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.mini{border:1px solid var(--line);border-radius:3px;padding:5px 9px;font-size:10px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--dim);background:var(--raise)}
.mini.go{border-color:var(--brass-dk);color:var(--brass)}
.mini.dim{opacity:.35}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- skills ---------- */
.sk-row.live{background:#16301F}
.sk-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
  padding:9px 12px;border-bottom:1px solid #12261A}
.glyph{width:34px;height:34px;border-radius:5px;background:var(--raise);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:16px;
  color:var(--aurora);position:relative;overflow:hidden}
.glyph .cd{position:absolute;left:0;bottom:0;width:100%;background:rgba(87,224,190,.18)}
.glyph.eq{border-color:var(--aurora)}
.glyph.lock{color:var(--faint);border-style:dashed}

/* ---------- dungeons ---------- */
.dgn{padding:10px 12px;border-bottom:1px solid #12261A}
.dgn .dh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dgn .dn{font-family:var(--disp);font-size:15px;letter-spacing:.01em}
.dgn .dd{font-size:10.5px;color:var(--dim);margin-top:3px;line-height:1.4}
.dgn .dm{font-size:10px;color:var(--faint);margin-top:5px;font-family:var(--mono)}
.bar{height:4px;background:#0D1D14;border-radius:2px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--aurora);width:0}
.keys{display:flex;gap:3px;align-items:center}
.key{width:7px;height:7px;border-radius:50%;border:1px solid var(--line)}
.key.on{background:var(--aurora);border-color:var(--aurora)}

/* ---------- leaderboard ---------- */
.lb{display:grid;grid-template-columns:26px 1fr auto;gap:8px;padding:6px 12px;font-size:11.5px;
  border-bottom:1px solid #12261A}
.lb.me{background:var(--raise);color:var(--brass)}
.lb .p{font-family:var(--mono);color:var(--faint);font-size:10px}
.lb .s{font-family:var(--mono);font-weight:600}

/* ---------- career ---------- */
#lvBox{padding:11px 12px 12px;background:#0A170F;border-bottom:var(--hair)}
.lvhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lvno{font-family:var(--disp);font-size:19px;letter-spacing:.01em}
.lvsub{font-size:10px;color:var(--dim);margin-top:2px}
.lvxp{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
#lvBox .bar{margin-top:8px;height:5px}
#sklNav,#careerNav{display:flex;overflow-x:auto;gap:0;background:var(--panel);border-bottom:var(--hair);
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
#sklNav::-webkit-scrollbar,#careerNav::-webkit-scrollbar{display:none}
.sub{flex:0 0 auto;padding:9px 13px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);font-weight:700;white-space:nowrap;border-bottom:2px solid transparent}
.sub.on{color:var(--brass);border-bottom-color:var(--brass)}
#talNav{display:grid;grid-template-columns:repeat(3,1fr);background:#0A170F;
  border-bottom:var(--hair)}
.sub2{padding:9px 4px 8px;font-size:9.5px;letter-spacing:.04em;color:var(--faint);
  font-weight:700;border-right:1px solid #12261A;border-bottom:2px solid transparent;
  display:flex;align-items:center;justify-content:center;gap:4px}
.sub2:last-child{border-right:0}
.sub2.on{color:var(--brass);border-bottom-color:var(--brass);background:var(--panel)}
.sub2 .tic{width:12px;height:12px;margin:0}
.tcount{font-family:var(--mono);font-size:9px;color:var(--dim)}
.sub2.on .tcount{color:var(--brass)}
.tier{padding:7px 12px;font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);background:#0A170F;border-top:1px solid #12261A;border-bottom:1px solid #12261A}
.tier.open{color:var(--aurora)}
.row.locked{opacity:.55}
.hbar{width:44px;height:3px;background:#12261C;border-radius:2px;overflow:hidden}
.hbar i{display:block;height:100%;background:var(--brass)}
.pips{display:inline-flex;gap:3px;vertical-align:-1px;margin-right:5px}
.pip{width:7px;height:7px;border-radius:2px;border:1px solid var(--line);display:block}
.pip.on{background:var(--brass);border-color:var(--brass)}

/* ---------- modal ---------- */
#veil{position:absolute;inset:0;background:rgba(4,10,7,.82);display:none;align-items:center;
  justify-content:center;padding:18px;z-index:40;backdrop-filter:blur(2px)}
#veil.on{display:flex}
#sheet{width:100%;max-width:400px;max-height:82%;overflow-y:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:6px;padding:16px}
#sheet h3{font-family:var(--disp);font-size:19px;font-weight:600;margin-bottom:8px;letter-spacing:.01em}
#sheet p{font-size:12.5px;color:var(--dim);line-height:1.55;margin-bottom:9px}
#sheet .big{font-family:var(--mono);font-size:26px;color:var(--brass);font-weight:600;margin:6px 0}
#sheet ul{margin:0 0 10px 15px;font-size:12px;color:var(--dim);line-height:1.6}
.act{width:100%;padding:11px;border-radius:4px;border:1px solid var(--brass-dk);background:var(--raise2);
  color:var(--brass);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-top:6px}
.act.ghost{border-color:var(--line);color:var(--dim);background:transparent}
.act.danger{border-color:#7A2C25;color:var(--flag)}

/* ---------- icons ---------- */
.ic{display:block;flex:0 0 auto}
.sic{width:15px;height:15px;color:var(--faint)}
.eic{width:14px;height:14px;margin-left:auto}
.skhead{display:flex;align-items:center;gap:5px}
.slot .sk{margin:0}
.lic{width:26px;height:26px}
.lel{width:13px;height:13px;margin-top:3px}
.iwrap{display:flex;flex-direction:column;align-items:center;gap:1px;width:28px}
.item.hasic{grid-template-columns:28px 1fr auto}
.cic{width:14px;height:14px;margin:0 auto 3px;color:var(--faint)}
.kic{width:20px;height:20px;position:relative;z-index:2}
.bic{width:30px;height:30px;flex:0 0 auto}
.tic{width:14px;height:14px;display:inline-block;vertical-align:-2px;margin-right:5px;color:var(--faint)}
#setBox .row{grid-template-columns:1fr auto}
.sheethead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.glyph .cd{background:rgba(6,16,12,.74);z-index:3;transition:height .2s linear}

/* ---------- developer ---------- */
.devread{font-family:var(--mono);font-size:10px;line-height:1.75;color:var(--dim);
  background:#0A170F;border:1px solid var(--line);border-radius:4px;padding:8px 9px;margin-bottom:12px}
.devrow{margin-bottom:11px}
.devlbl{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:700}
.devgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:5px}
.devbtn{border:1px solid var(--line);background:var(--raise);border-radius:3px;padding:7px 3px;
  font-size:10px;color:var(--chalk);line-height:1.2}
.devbtn:active{background:var(--raise2);border-color:var(--brass-dk);color:var(--brass)}

/* ---------- toast ---------- */
/* Pinned over the sky inside the stage. Anchored to the bottom of the app they
   sat on top of the upgrade rows, which is where you are actually tapping. */
/* The readout, in the same type as the rest of the chrome. Drawn on the canvas
   in the pixel font it was legible but bulky, and it could not match anything
   else on screen. */
#readout{position:absolute;left:2.2%;top:2.5%;min-width:36%;max-width:56%;z-index:29;
  background:rgba(6,12,9,.74);border:1px solid #1B3A2E;border-radius:4px;
  padding:4px 7px 5px;backdrop-filter:blur(2px);pointer-events:none}
.rline{display:flex;justify-content:space-between;gap:12px;font-size:8px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);font-weight:700;white-space:nowrap}
.rmain{display:flex;align-items:baseline;gap:3px;margin-top:2px}
#rBig{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--brass);line-height:1}
.ru{font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.rsp{flex:1 1 auto;min-width:8px}
#rTag{font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;white-space:nowrap}
.rbar{height:2px;background:#12251C;border-radius:1px;margin-top:5px;overflow:hidden}
.rbar i{display:block;height:100%;width:0;background:var(--brass);transition:width .12s linear}

/* the honours shelf, on the stage under the hole readout */
/* two stage buttons, drawn from the same pixel grid as the game */
#honBtn,#perkBtn{position:absolute;right:2.5%;width:6.2%;aspect-ratio:1/1;z-index:31;
  background:none;border:0;padding:0;display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.9))}
#honBtn{top:24%}
#perkBtn{top:35.5%}
#honIcon,#perkIcon{display:block;width:100%;height:100%;object-fit:contain;
  image-rendering:pixelated;image-rendering:crisp-edges}
#honBtn:active,#perkBtn:active{transform:translateY(1px)}
@keyframes hpulse{0%,100%{opacity:1}50%{opacity:.4}}
#honBtn.new,#perkBtn.ready{animation:hpulse 1.1s ease-in-out infinite}
#perkDot{position:absolute;top:-6%;right:-6%;width:34%;height:34%;border-radius:50%;
  background:var(--aurora);display:none}
#perkBtn.live #perkDot{display:block}
/* Top right corner, clear of the readout on the left and the two stage
   buttons below. Two at a time: any more and they became the view. */
#toasts{position:absolute;right:2%;top:2%;display:flex;flex-direction:column;
  align-items:flex-end;gap:3px;pointer-events:none;z-index:30;max-width:52%}
.toast{background:rgba(8,18,12,.9);border:1px solid var(--line);border-radius:5px;
  padding:3px 8px;font-size:9.5px;line-height:1.3;text-align:right;
  animation:tin .22s ease-out;backdrop-filter:blur(2px)}
.toast b{color:var(--brass)}
.toast.ach{border-color:var(--brass-dk);background:rgba(28,20,6,.94);white-space:normal}
.toast.ach .achk{font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);
  display:block;margin-bottom:1px}
@keyframes tin{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

.empty{padding:26px 16px;text-align:center;color:var(--faint);font-size:12px;line-height:1.6}
.hint{padding:9px 12px;font-size:10.5px;color:var(--faint);line-height:1.5;border-bottom:1px solid #12261A}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<script>
"use strict";
/* =========================================================================
   MYTHIC MULLIGAN
   An idle auto-battler. The golfer swings on his own; you build the golfer.

   THE THREE CURVES, and why they are set where they are:
     TIER_Y  yardage per Tour Card step        2.35
     TIER_G  purse per Tour Card step          2.16
     gear    ILVL_STEP per item level          1.27
   Purse sits deliberately BELOW yardage. Gold upgrades alone therefore lose
   ground every tier, and the deficit is what gear, skills, the Depths and
   relics are for. Set TIER_G at or above TIER_Y and the run never walls,
   which means retirement never has anything to push against.

   Par is an ABSOLUTE clock: par 3 is ten seconds, par 4 fifteen, par 5 twenty,
   at every tier forever. A Tour Card step multiplies yardage but not the
   clock, so climbing always drops you back to bogey golf and the whole ladder
   has to be re-earned. Climbing is a choice, never automatic.
   ========================================================================= */
const B = {
  /* ---- the ladder ---- */
  TIER_Y: 2.35, TIER_G: 2.16, Y0: 60, G0: 14, TIER_MAX: 400,
  PAR_TIME: { 3: 10, 4: 15, 5: 20 },
  TIER_ROMAN: ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV',
               'XVI','XVII','XVIII','XIX','XX','XXI','XXII','XXIII','XXIV','XXV'],

  /* ---- the round ---- */
  ROUND: 18, DAYS: 4,
  DAY_NAMES: ['Thursday','Friday','Saturday','Sunday'],
  PAR_LAYOUTS: [
    [4,5,4,3,4,4,5,3,4, 4,4,3,5,4,4,3,4,5],
    [4,4,3,5,4,3,4,5,4, 4,3,5,4,4,3,4,4,5],
    [5,4,3,4,4,4,3,5,4, 3,4,5,4,4,3,4,5,4]
  ],

  /* ---- scoring, read off the clock ---- */
  SCORE: [
    { r:0.10, d:-4, n:'Ace',       pay:3.4 },
    { r:0.27, d:-3, n:'Albatross', pay:2.4 },
    { r:0.47, d:-2, n:'Eagle',     pay:1.9 },
    { r:0.77, d:-1, n:'Birdie',    pay:1.45 },
    { r:1.16, d: 0, n:'Par',       pay:1.0 },
    { r:1.85, d: 1, n:'Bogey',     pay:0.82 },
    { r:2.95, d: 2, n:'Double',    pay:0.68 },
    { r:4.70, d: 3, n:'Triple',    pay:0.58 },
    { r:1e18, d: 4, n:'Snowman',   pay:0.50 }
  ],
  // A hole pays this fraction of its purse out swing by swing, credited in
  // proportion to damage dealt. Tying the trickle to damage rather than to a
  // flat per-swing figure makes it immune to swing-speed inflation: the hole
  // is worth what it is worth however many swings you take to erase it.
  SWING_SHARE: 0.34,
  // You cannot finish a hole faster than you can walk up and putt out. Without
  // this floor, purse per second goes as 1/holeTime and runs away with no
  // ceiling: overshoot a Tour Card and every hole is an instant Ace, so income
  // outruns the cost of the next card forever and the ladder never walls.
  // Nine tenths of a second is also the shortest a hole can be and still be
  // worth watching, and it is what makes an Ace the genuine ceiling it should be.
  WALK_MIN: 0.9,

  /* ---- the swing ---- */
  BASE_POWER: 6, BASE_SPEED: 0.85,
  // Tempo is capped in the simulation because an uncapped attack rate is just
  // a second damage multiplier wearing a hat. Everything past the cap converts
  // to power at half rate, so tempo gear never becomes dead weight.
  SPEED_CAP: 14, SPEED_OVERFLOW: 0.5,
  CRIT_BASE: 0.03, CRIT_CAP: 0.80, CRIT_MULT: 4.0,
  PROC_BASE: 0.08, PROC_CAP: 0.55,
  VIS_SWING_CAP: 4.2,      // visual swings per second; the math runs uncapped


  /* =======================================================================
     ICONS
     One set of path data on a 24x24 grid, drawn as SVG in the panels and as
     Path2D on the canvas, so a skill looks identical in the shot book and on
     the HUD. 'f' paths fill (even-odd, so a hole in a shape is just a second
     subpath), 's' paths stroke.
     ======================================================================= */
  ICON: {
    bolt:    { f:['M13.5 1.8 L6.2 13.4 H10.6 L9.4 22.2 L17.8 10.2 H13.2 Z'] },
    bounce:  { s:['M2.5 20 Q7 6 11.5 14 Q14.4 19.4 19.4 8.6'],
               f:['M19.8 6.4 a2.1 2.1 0 1 0 .01 0'] },
    gale:    { s:['M2.5 8 H13.4 a2.6 2.6 0 1 0 -2.6 -2.9',
                  'M2.5 13 H17.4 a3 3 0 1 1 -3 3.2','M2.5 18 H10.4'] },
    target:  { s:['M12 2.2 V6','M12 18 V21.8','M2.2 12 H6','M18 12 H21.8',
                  'M12 5.6 a6.4 6.4 0 1 0 .01 0'],
               f:['M12 10.2 a1.8 1.8 0 1 0 .01 0'] },
    bag:     { s:['M9.6 3 V10','M12.6 4.2 V10','M15.6 5.4 V10'],
               f:['M7.2 9.4 h9.6 a1.6 1.6 0 0 1 1.6 1.6 v8.4 a2.6 2.6 0 0 1 -2.6 2.6 h-7.6 a2.6 2.6 0 0 1 -2.6 -2.6 v-8.4 a1.6 1.6 0 0 1 1.6 -1.6 z'] },
    rewind:  { s:['M20.4 12.8 A8.4 8.4 0 1 1 17.4 6.2'],
               f:['M19.6 2 L18.4 8.6 L12.4 6.2 Z'] },
    eclipse: { f:['M12 2.4 a9.6 9.6 0 1 0 .01 0 M16.6 4.2 a8.4 8.4 0 1 0 .01 0'] },
    coins:   { s:['M4 7.2 v5.2 a8 3.2 0 0 0 16 0 V7.2','M4 13.4 v4.2 a8 3.2 0 0 0 16 0 v-4.2'],
               f:['M12 4 a8 3.2 0 1 0 .01 0'] },
    driver:  { s:['M7.4 2.6 L13.4 13.6'],
               f:['M12.4 12.8 q5.6 .4 6.6 4.6 q-4.4 3.4 -7.8 .2 z'] },
    irons:   { s:['M8.6 2.6 L13.2 13.2'], f:['M11.4 12.6 h7.2 l-1.4 5.4 h-7.2 z'] },
    wedge:   { s:['M9.4 2.6 L13 12.6','M13.2 15 h3.4','M12.6 16.8 h3.2'],
               f:['M11 12 h7.4 l-2 6.4 h-6.4 z'] },
    putter:  { s:['M9.6 2.6 L12 13.2'], f:['M6.6 13 h11 v4.2 h-11 z'] },
    ball:    { s:['M12 3.4 a8.6 8.6 0 1 0 .01 0'],
               f:['M9.6 9.4 a1 1 0 1 0 .01 0','M14.4 9.4 a1 1 0 1 0 .01 0',
                  'M12 13.2 a1 1 0 1 0 .01 0','M9.6 16.8 a1 1 0 1 0 .01 0',
                  'M14.4 16.8 a1 1 0 1 0 .01 0'] },
    glove:   { s:['M9.4 9.6 V5.2 a1.3 1.3 0 0 1 2.6 0 V9.6','M13 9.6 V6 a1.3 1.3 0 0 1 2.6 0 V9.6',
                  'M7.6 12.6 L5.2 14.8'],
               f:['M7.6 9.6 h8.8 a2 2 0 0 1 2 2 v6.2 a3.4 3.4 0 0 1 -3.4 3.4 h-6 a3.4 3.4 0 0 1 -3.4 -3.4 v-6.2 a2 2 0 0 1 2 -2 z'] },
    flame:   { f:['M12 2.4 c3.4 4.6 5.6 6.6 5.6 10.2 a5.6 5.6 0 0 1 -11.2 0 c0 -2.6 1.6 -3.8 2.8 -5.4 c.8 1.8 1.8 1.8 2.8 .6 z'] },
    snow:    { s:['M12 2.4 V21.6','M3.8 7.2 L20.2 16.8','M20.2 7.2 L3.8 16.8',
                  'M9.6 4 L12 6.4 L14.4 4','M9.6 20 L12 17.6 L14.4 20'] },
    leaf:    { f:['M3.6 20.4 C3.6 10 11.4 3.6 20.4 3.6 C20.4 12.4 13.6 20.4 3.6 20.4 Z'],
               s:['M4.8 19.2 L16.2 7.8'] },
    ring:    { s:['M12 3 a9 9 0 1 0 .01 0'], f:['M12 8.4 a3.6 3.6 0 1 0 .01 0'] },
    grit:    { f:['M5.6 2.6 h12.8 v2 l-4.8 5.4 4.8 5.4 v2 h-12.8 v-2 l4.8 -5.4 -4.8 -5.4 z'] },
    shard:   { f:['M12 2 L18.4 9.2 L12 22 L5.6 9.2 Z'] },
    scroll:  { s:['M8.6 8.4 h7.4','M8.6 12 h7.4','M8.6 15.6 h4.8'],
               f:['M6.2 3 h11.6 v14.4 a3.6 3.6 0 0 1 -3.6 3.6 H6.2 a3.6 3.6 0 0 0 3.6 -3.6 z'] },
    flag:    { s:['M6.4 2.6 V21.4'], f:['M7.4 3.2 q7 -1.4 10.6 2.2 q-3.6 3.6 -10.6 2.2 z'] },
    trophy:  { f:['M7.6 2.6 h8.8 v4.6 a4.4 4.4 0 0 1 -8.8 0 z','M8.2 18.6 h7.6 v2.8 h-7.6 z'],
               s:['M7.6 4.2 H5 a2.6 2.6 0 0 0 2.6 4.4','M16.4 4.2 H19 a2.6 2.6 0 0 1 -2.6 4.4',
                  'M12 11.6 V15.6','M9.4 15.6 h5.2'] }
  },

  /* ---- upgrades bought with gold ---- */
  // Drive Power is the ONLY uncapped line. A second uncapped multiplier adds
  // its exponent to the first and leaves nothing to retire against. Everything
  // else is a long ladder that fills, contributes, and stops.
  // Every capped ladder now runs to 500. Per-level gain is cut so the ceiling
  // is not silly, and the cost step is cut so the ladder is still climbable --
  // but the total bill to max one is roughly the square of what it used to be,
  // so it is a long job rather than an afternoon.
  UPG: [
    { id:'drive',   k:'pow',  cap:0,   base:20,     r:1.0800, g:1.04000, n:'Drive Power',        d:'Yardage on every swing' },
    { id:'tempo',   k:'spd',  cap:500, base:150,    r:1.0287, g:1.00439, n:'Swing Tempo',        d:'Swings per second' },
    { id:'provis',  k:'mst',  cap:500, base:70,     r:1.0300, g:0,       n:'Provisional Ball',   d:'Chance to play a second ball on a swing' },
    { id:'face',    k:'crt',  cap:500, base:1200,   r:1.0317, g:0,       n:'Face Milling',       d:'Chance of a pure strike' },
    { id:'compress',k:'pow',  cap:500, base:1.1e4,  r:1.0271, g:1.00491, n:'Ball Compression',   d:'Yardage on every swing' },
    { id:'sweet',   k:'cpw',  cap:500, base:8.0e4,  r:1.0299, g:0,       n:'Sweet Spot',         d:'Pure strike payoff' },
    { id:'infuse',  k:'elm',  cap:500, base:3.0e5,  r:1.0308, g:1.00702, n:'Elemental Infusion', d:'Power of ball affinities' },
    { id:'shaft',   k:'pow',  cap:500, base:1.2e6,  r:1.0277, g:1.00509, n:'Shaft Flex',         d:'Yardage on every swing' },
    { id:'marker',  k:'drp',  cap:500, base:6.0e6,  r:1.0220, g:0,       n:'Ball Marker',        d:'Chance a hole drops gear' },
    { id:'grip',    k:'spd',  cap:500, base:1.1e7,  r:1.0284, g:1.00266, n:'Grip Pressure',      d:'Swings per second' },
    { id:'agent',   k:'gld',  cap:500, base:6.0e7,  r:1.0343, g:1.00587, n:'Player Agent',       d:'Prize money' },
    { id:'groove',  k:'prc',  cap:500, base:4.0e8,  r:1.0251, g:0,       n:'Groove Sharpening',  d:'Chance an affinity triggers' },
    { id:'van',     k:'pow',  cap:500, base:1.4e9,  r:1.0341, g:1.00631, n:'Tour Van',           d:'Yardage on every swing' },
    { id:'second',  k:'mst',  cap:500, base:8.0e9,  r:1.0330, g:0,       n:'Second Serve',       d:'Chance to play a second ball on a swing' },
    { id:'lantern', k:'dgn',  cap:500, base:8.0e10, r:1.0231, g:0,       n:'Caddie Lantern',     d:'Haul from the Depths' },
    { id:'forged',  k:'pow',  cap:500, base:1.2e12, r:1.0348, g:1.00652, n:'Forged Blades',      d:'Yardage on every swing' },
    { id:'simul',   k:'crt',  cap:500, base:9.0e13, r:1.0370, g:0,       n:'Swing Simulator',    d:'Chance of a pure strike' },
    { id:'windbook',k:'spd',  cap:500, base:6.0e15, r:1.0290, g:1.00249, n:'Wind Book',          d:'Swings per second' },
    { id:'links',   k:'pow',  cap:500, base:9.0e16, r:1.0405, g:1.00758, n:'Links Conditioning', d:'Yardage on every swing' },
    { id:'plate',   k:'elm',  cap:500, base:4.0e19, r:1.0352, g:1.00815, n:'Mythril Face Plate', d:'Power of ball affinities' },
    { id:'quantum', k:'pow',  cap:500, base:8.0e22, r:1.0414, g:1.00792, n:'Quantum Grooves',    d:'Yardage on every swing' }
  ],
  // THE HANDICAP
  // Cards are earned by playing, but nothing stopped you buying power far
  // faster than the course could grow, so every hole bottomed out at an Ace and
  // score stopped meaning anything. Range work is now priced against how far
  // ahead of your card you already are: at par it costs nothing extra, and the
  // further under par you are clearing holes, the dearer the next rung gets.
  // It is a rubber band, not a wall - it relaxes the moment the course catches
  // up, which happens every time a card grows or you climb.
  // Taxing the range alone could not hold the line, because most of your power
  // is free: gear, talents, paragon, trophies and honours all arrive without
  // being bought. So the course plays you off a handicap instead. A hole is
  // never shorter than what your bag can clear in HCP of par time, which keeps
  // the card honest no matter where the power came from. The purse still
  // follows the CARD, so getting ahead earns you nothing extra and climbing is
  // the only way to be paid more.
  // A hole stretched by your handicap pays for the extra yards, or buying power
  // would stop paying anything on the course. Sublinear, so climbing a card is
  // still worth more than sitting on one and out-hitting it.
  HCP: 0.34, HCP_PAY: 0.60,
  CRIT_ADD: { face:0.00132, simul:0.00108 },
  CPW_ADD: 0.0174, DROP_ADD: 0.000675, PROC_ADD: 0.00099, DGN_ADD: 0.00315,
  MST_ADD: { provis:0.0018, second:0.0022 },
  CAP_PER_LEGACY: 25,     // every retirement re-opens each capped ladder

  // Loopers are gone. Their slot in the build is now the Provisional: a chance
  // that a swing plays a second ball. It is a different animal to raw power --
  // more hits means more affinity rolls, but armour bites each one separately.
  MST_CAP: 3.0, MST_DMG: 0.60,

  /* ---- gear ---- */
  SLOTS: [
    { ic:'driver', id:'driver', n:'Driver', p:'pow', base:0.30 },
    { ic:'irons', id:'irons',  n:'Irons',  p:'pow', base:0.26 },
    { ic:'wedge', id:'wedge',  n:'Wedge',  p:'pow', base:0.22 },
    { ic:'putter', id:'putter', n:'Putter', p:'pow', base:0.22 },
    { ic:'ball', id:'ball',   n:'Ball',   p:'pow', base:0.24 },
    { ic:'glove', id:'glove',  n:'Glove',  p:'pow', base:0.18 }
  ],
  RARITY: [
    { n:'Common',    v:'--r0', aff:0, m:1.00, w:1000 },
    { n:'Uncommon',  v:'--r1', aff:1, m:1.40, w:400 },
    { n:'Rare',      v:'--r2', aff:2, m:2.00, w:135 },
    { n:'Epic',      v:'--r3', aff:3, m:2.90, w:38 },
    { n:'Legendary', v:'--r4', aff:4, m:4.20, w:8.5 },
    { n:'Mythic',    v:'--r5', aff:5, m:6.20, w:1.1 }
  ],
  // Rerolling blind means the locker is only ever a scrap heap. Locking an
  // affix lets you aim: pay more, keep the one roll that matters.
  LOCK_MULT: 2.6, LOCK_EACH: 1.9,
  ILVL_STEP: 1.27, ENH_STEP: 0.085, ENH_MAX: 15,
  ENH_SAFE: 5,            // guaranteed through +5, then a roll; failure costs nothing
  ENH_BASE: 12, ENH_R: 1.42,
  DROP_BASE: 0.09, BOSS_DROP: 1.0, BAG_CAP: 60,

  // Affix pool. Only 'pow' and 'elm' scale with item level; everything else is
  // flat, because a percentage that compounds with tier and also stacks six
  // slots deep stops being a build choice and starts being the whole build.
  AFFIX: [
    { id:'pow', n:'Swing Power',    sc:true,  lo:0.06, hi:0.14, sfx:'%' },

/* =========================================================================
   NUMBERS AND HELPERS
   ========================================================================= */
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const SUF = ['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
function fmt(n, dp){
  if(!isFinite(n)) return '\u221e';
  if(n < 0) return '\u2212' + fmt(-n, dp);
  if(n < 1000) return n < 10 && dp !== 0 ? (Math.round(n*10)/10).toString() : Math.round(n).toString();
  let e = Math.floor(Math.log10(n) / 3);
  if(e < SUF.length){
    const m = n / Math.pow(1000, e);
    return (m < 10 ? m.toFixed(2) : m < 100 ? m.toFixed(1) : Math.round(m)) + SUF[e];
  }
  // past decillion, two-letter tags: aa, ab, ac ...
  const i = e - SUF.length, a = Math.floor(i/26), b = i%26;
  const tag = String.fromCharCode(97+a) + String.fromCharCode(97+b);
  const m = n / Math.pow(1000, e);
  return (m < 10 ? m.toFixed(2) : m < 100 ? m.toFixed(1) : Math.round(m)) + tag;
}
const pct = v => (v*100 < 10 ? (v*100).toFixed(1) : Math.round(v*100)) + '%';
const pp  = v => '+' + (v*100).toFixed(1) + 'pp';
function hms(s){
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), q = s%60;
  return h ? h+'h '+m+'m' : m ? m+'m '+q+'s' : q+'s';
}
function hash32(n){
  n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4);
  n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15);
  return n >>> 0;
}
// deterministic per-hole RNG so a hole looks the same every time you see it
function seeded(seed){
  let s = hash32(seed) || 1;
  return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}
const roman = t => t < B.TIER_ROMAN.length ? B.TIER_ROMAN[t] : (t+1).toString();

/* ---- the calendar ---- */
const holeInRound  = h => ((h-1) % B.ROUND) + 1;
const dayIndex     = h => Math.floor((h-1) / B.ROUND) % B.DAYS;
const dayName      = h => B.DAY_NAMES[dayIndex(h)];
const roundIndex   = h => Math.floor((h-1) / B.ROUND);
const tournamentOf = h => Math.floor((h-1) / (B.ROUND*B.DAYS)) + 1;
const holesPlayed  = h => dayIndex(h)*B.ROUND + (holeInRound(h)-1);
const parOf = h => B.PAR_LAYOUTS[hash32(roundIndex(h)+7) % B.PAR_LAYOUTS.length][holeInRound(h)-1];
const slotOfEvent = t => B.SLOTS_SEASON[(t-1) % B.SEASON];
const COURSE_EVT = B.COURSE.filter(c => c.slot === 'event');
const COURSE_MAJ = B.COURSE.filter(c => c.slot === 'major');
const COURSE_FIN = B.COURSE.find(c => c.slot === 'finale');
function courseFor(t){
  const s = slotOfEvent(t);
  if(s === 'finale') return COURSE_FIN;
  if(s === 'major')  return COURSE_MAJ[Math.floor((t-1)/B.SEASON) % COURSE_MAJ.length];
  return COURSE_EVT[(t-1) % COURSE_EVT.length];
}
const eventName = t => courseFor(t).n;
function purseMult(t){
  const s = slotOfEvent(t);
  return s === 'finale' ? B.PURSE_FINALE : s === 'major' ? B.PURSE_MAJOR : 1;
}

/* ---- chaotic conditions, drawn per round ---- */
function chaosFor(h, tier){
  const r = roundIndex(h) + (S && S.chaosBump || 0);
  const a = B.CHAOS[hash32(r*2654435761 + tier*97) % B.CHAOS.length];
  const list = [a];
  if(tier >= B.CHAOS_SECOND_TIER){
    const b = B.CHAOS[hash32(r*40503 + tier*7919 + 31) % B.CHAOS.length];
    if(b !== a) list.push(b);
  }
  const out = { n: list.map(x=>x.n).join(' + '), y:1, g:1, s:1, c:0, p:0, dl:0 };
  for(const x of list){ out.y*=x.y; out.g*=x.g; out.s*=x.s; out.c+=x.c; out.p+=x.p; out.dl+=x.dl; }
  return out;
}

/* =========================================================================
   STATE
   ========================================================================= */
const KEY = 'mythic-mulligan-v1';
function defaultState(){ return {
  ver: 1, t: Date.now()/1000,
  gold: 0, tier: 0, hole: 1, elapsed: 0,
  upg: {}, equip: {}, bag: [], uid: 1,
  skillLv: {}, carry: [], cd: {},
  grit: 0, shard: 0, scroll: 0,
  dgnKeys: {}, dgnKeyT: {}, dgnFloor: {}, dgnRun: null, islandBank: 5,
  legacy: 0, relic: {}, retires: 0, cups: 0, points: 0,
  lv: 1, xp: 0, statPts: 0, talPts: 0, stat: {}, tal: {},
  tickets: 0, perkOn: {}, perkUsed: 0,
  tally: {}, achDone: {},
  para: 0, paraXp: 0, paraPts: {}, paraSpent: {},
  tourScore: 0,
  bestTier: 0, tierMax: 0, tierEvents: {}, eventsPlayed: 0, goldPeak: 0,
  totalHoles: 0, bestScore: 0, aces: 0,
  swingT: 0, frost: 0, burn: 0, burnT: 0, buff: {},
  scores: [], mult: 1,
  nine: null, bestNine: undefined, ninesWon: 0
}; }
let S = defaultState();
function initState(){
  B.UPG.forEach(u => { if(S.upg[u.id] === undefined) S.upg[u.id] = 0; });
  B.SLOTS.forEach(s => { if(S.equip[s.id] === undefined) S.equip[s.id] = null; });
  B.SKILL.forEach(k => { if(S.skillLv[k.id] === undefined) S.skillLv[k.id] = k.cost === 0 ? 1 : 0;
                         if(S.cd[k.id] === undefined) S.cd[k.id] = 0; });
  B.DGN.forEach(d => {
    if(S.dgnKeys[d.id] === undefined) S.dgnKeys[d.id] = d.cap;
    if(S.dgnKeyT[d.id] === undefined) S.dgnKeyT[d.id] = 0;
    if(S.dgnFloor[d.id] === undefined) S.dgnFloor[d.id] = 0;
  });
  B.TROPHY.forEach(r => { if(S.relic[r.id] === undefined) S.relic[r.id] = 0;
    else S.relic[r.id] = Math.min(B.TR_MAX, S.relic[r.id]); });
  B.STATS.forEach(s => { if(S.stat[s.id] === undefined) S.stat[s.id] = 0; });
  B.TREES.forEach(t => t.t.forEach(x => { if(S.tal[x.id] === undefined) S.tal[x.id] = 0; }));
  B.PARAGON.forEach(cat => {
    if(S.paraPts[cat.id] === undefined) S.paraPts[cat.id] = 0;
    cat.a.forEach(a => { if(S.paraSpent[cat.id + '.' + a.id] === undefined)
      S.paraSpent[cat.id + '.' + a.id] = 0; });
  });
  if(!S.carry.length) S.carry = ['thunder'];
  if(!S.perkOn) S.perkOn = {};
  if(!S.tally) S.tally = {};
  if(!B.BANK_OPTS.includes(S.islandBank)) S.islandBank = 5;
  if(!S.tierEvents) S.tierEvents = {};
  if(S.tierMax === undefined) S.tierMax = 0;
  if(S.eventsPlayed === undefined) S.eventsPlayed = 0;
  if(!S.achDone) S.achDone = {};
}
/* =========================================================================
   MIGRATION
   Saves outlive config. Anything the current build no longer defines is
   remapped or dropped here, before a single frame runs.
   ========================================================================= */
function migrate(){
  const okAff = new Set(B.AFFIX.map(a => a.id));
  const okEl  = new Set(B.ELEM.map(e => e.id));
  const fix = it => {
    if(!it) return;
    if(!Array.isArray(it.aff)) it.aff = [];
    it.aff = it.aff
      .filter(a => a && typeof a.roll === 'number')
      .map(a => okAff.has(a.k) ? a : { k:'mst', roll:a.roll });
    if(it.el && !okEl.has(it.el)) it.el = B.ELEM[0].id;
    if(!(it.rar >= 0)) it.rar = 0;
    if(!(it.ilvl >= 0)) it.ilvl = 0;
    if(!(it.enh >= 0)) it.enh = 0;
  };
  B.SLOTS.forEach(s => fix(S.equip[s.id]));
  if(!Array.isArray(S.bag)) S.bag = [];
  S.bag.forEach(fix);

  for(const k in S.upg)     if(!B.UPG.some(u => u.id === k)) delete S.upg[k];
  for(const k in S.relic)   if(!B.TROPHY.some(t => t.id === k)) delete S.relic[k];
  for(const k in S.tal)     if(!B.TREES.some(t => t.t.some(x => x.id === k))) delete S.tal[k];
  for(const k in S.skillLv) if(!B.SKILL.some(s => s.id === k)) delete S.skillLv[k];
  for(const k in S.stat)    if(!B.STATS.some(s => s.id === k)) delete S.stat[k];
  for(const k in S.perkOn)  if(!B.PERKS.some(p => p.id === k)) delete S.perkOn[k];
  if(S.dgnRun && !B.DGN.some(d => d.id === S.dgnRun.id && d.mode === S.dgnRun.mode)) S.dgnRun = null;
  for(const k in S.achDone) if(!B.ACH.some(a => a.id === k)) delete S.achDone[k];
  for(const k in S.paraSpent){
    const [ci, ai] = k.split('.');
    const cat = B.PARAGON.find(x => x.id === ci);
    if(!cat || !cat.a.some(x => x.id === ai)) delete S.paraSpent[k];
  }
  for(const k in S.paraPts) if(!B.PARAGON.some(c => c.id === k)) delete S.paraPts[k];

  S.carry = (S.carry || []).filter(id => B.SKILL.some(s => s.id === id));
  if(!S.carry.length) S.carry = ['thunder'];
  if(!S.skillLv.thunder) S.skillLv.thunder = 1;
  delete S.loopers;
}

// Reloading fires pagehide, which fires save, which wrote the state straight
// back over the file we had just deleted. Erasing has to switch saving off.
let WIPED = false;
function save(){
  if(WIPED) return;
  S.t = Date.now()/1000;
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}
function load(){
  let raw = null;
  try{ raw = localStorage.getItem(KEY); }catch(e){ return false; }
  if(!raw) return false;
  try{
    const o = JSON.parse(raw);
    if(!o) return false;
    // migrate() already drops anything this build no longer defines, so an
    // unfamiliar version number is something to migrate rather than a reason to
    // silently erase the save. Rejecting it here meant the day ver became 2
    // every player lost everything.
    if(typeof o.ver !== 'number') return false;
    Object.assign(S, o);
    return true;
  }catch(e){ return false; }
}

/* =========================================================================
   DERIVED STATS
   Everything the golfer is, assembled fresh each frame from upgrades, the
   bag, relics, live buffs and whatever the course is doing today.
   ========================================================================= */
const upgLv  = id => S.upg[id] || 0;
const relLv  = id => S.relic[id] || 0;
const capOf  = u => u.cap ? u.cap + S.retires * B.CAP_PER_LEGACY : Infinity;
const upgMult = k => B.UPG.reduce((a,u) => u.k === k && u.g ? a * Math.pow(u.g, upgLv(u.id)) : a, 1);

/* =========================================================================
   CAREER BONUSES
   Attributes, talents and paragon all land in one table. Standard keys are
   folded into gear stats so every downstream system already understands them;
   the rest are read by the systems they belong to.
   ========================================================================= */
const talLv = id => S.tal[id] || 0;
const paraLv = (c, a) => S.paraSpent[c + '.' + a] || 0;
const treeSpent = tree => tree.t.reduce((n, x) => n + talLv(x.id), 0);
const talentsUsed = () => B.TREES.reduce((n, t) => n + treeSpent(t), 0);
const paraTotal = () => Object.keys(S.paraSpent).reduce((n, k) => n + S.paraSpent[k], 0);

const trophyDef = id => B.TROPHY.find(t => t.id === id);
const found = id => (S.relic[id] || 0) > 0;
const trophiesFound = () => B.TROPHY.reduce((n, t) => n + (found(t.id) ? 1 : 0), 0);
// Everything a trophy grants that is not one of the ten special mechanics.
function trophyBonus(){
  const o = {};
  for(const t of B.TROPHY){
    if(t.k[0] === '*' || t.k[0] === '@') continue;
    const n = S.relic[t.id] || 0;
    if(n) o[t.k] = (o[t.k] || 0) + t.v * n;
  }
  return o;
}
/* ---- honours ---- */
const tally = k => S.tally[k] || 0;
function achMetric(m){
  switch(m){
    case 'holes':  return S.totalHoles || 0;
    case 'ace':    return S.aces || 0;
    case 'cups':   return S.cups || 0;
    case 'lv':     return S.lv || 1;
    case 'para':   return S.para || 0;
    case 'tier':   return S.bestTier || 0;
    case 'retire': return S.retires || 0;
    case 'perks':  return S.perkUsed || 0;
    case 'troph':  return trophiesFound();
    case 'mst':    return derive().mst;
    case 'set6e':  return B.SLOTS.reduce((n, s) => n + (S.equip[s.id] && S.equip[s.id].rar >= 3 ? 1 : 0), 0);
    case 'best':   return S.bestRound === undefined ? 0 : Math.max(0, -S.bestRound);
    case 'slots':  return B.SLOTS.reduce((n, s) => n + (S.equip[s.id] ? 1 : 0), 0);
    case 'set6':   return B.SLOTS.reduce((n, s) => n + (S.equip[s.id] && S.equip[s.id].rar >= 2 ? 1 : 0), 0);
    case 'floor':  return B.DGN.reduce((m2, d) => Math.max(m2, (S.dgnFloor[d.id] || 0) + 1), 0);
    case 'all4':   return B.DGN.every(d => (S.dgnFloor[d.id] || 0) + 1 >= 10) ? 1 : 0;
    default:       return tally(m);
  }
}
const achDone = id => !!S.achDone[id];
const achCount = () => B.ACH.reduce((n, a) => n + (achDone(a.id) ? 1 : 0), 0);
// Permanent bonuses from honours already earned.
function achBonus(){
  const o = {};
  for(const a of B.ACH){
    if(!achDone(a.id)) continue;
    const r = a.r;
    if(r.k === 'tick' || r.k === 'grit' || r.k === 'shard' || r.k === 'scroll' || r.k === 'legacy') continue;
    o[r.k] = (o[r.k] || 0) + r.v;
  }
  return o;
}

function career(){
  const o = { pow:0, spd:0, crt:0, cpw:0, elm:0, prc:0, gld:0, drp:0, dgn:0, mst:0,
              pierce:0, boss:0, clutch:0, cdr:0, xp:0, reson:0, dfloor:0, walk:0,
              cond:0, sharp:0, dbl:0, onesw:0 };
  for(const s of B.STATS){
    const n = S.stat[s.id] || 0; if(!n) continue;
    const v = B.STAT_V[s.id];
    for(const k in v) o[k] += v[k] * n;
  }
  for(const tree of B.TREES)
    for(const t of tree.t){
      const n = talLv(t.id); if(!n) continue;
      o[t.k] += t.v * n;
    }
  for(const cat of B.PARAGON)
    for(const a of cat.a){
      const n = paraLv(cat.id, a.id); if(!n) continue;
      o[a.k] += a.v * n;
    }
  const T = trophyBonus();
  for(const k in T) if(o[k] !== undefined) o[k] += T[k];
  const A = achBonus();
  for(const k in A) if(o[k] !== undefined) o[k] += A[k];
  return o;
}

function itemPrimary(it){
  const sl = B.SLOTS.find(s => s.id === it.slot);
  return sl.base * B.RARITY[it.rar].m * Math.pow(B.ILVL_STEP, it.ilvl) * (1 + B.ENH_STEP*it.enh);
}
function affixValue(it, a){
  const def = B.AFFIX.find(x => x.id === a.k);
  if(!def) return 0;                    // an affix from an older build
  const m = B.RARITY[it.rar] ? B.RARITY[it.rar].m : 1;
  let v = a.roll * (def.sc ? m : Math.sqrt(m));
  if(def.sc) v *= Math.pow(B.ILVL_STEP, it.ilvl) * (1 + B.ENH_STEP*it.enh);
  return v;
}
function itemScore(it){
  let s = itemPrimary(it);
  for(const a of it.aff){
    const def = B.AFFIX.find(x => x.id === a.k);
    if(!def) continue;
    s += affixValue(it, a) * (def.sc ? 1 : 0.35);
  }
  return s;
}
function activeSets(){
  const out = [];
  for(const set of B.SETS){
    let n = 0;
    for(const sl of B.SLOTS){ const it = S.equip[sl.id]; if(it && it.rar >= set.rar) n++; }
    let best = null;
    for(const t of set.tiers) if(n >= t.n) best = t;
    out.push({ set, n, tier: best });
  }
  return out;
}
function gearStats(){
  const g = { pow:0, elm:0, spd:0, crt:0, cpw:0, gld:0, drp:0, prc:0, mst:0, dgn:0 };
  for(const sl of B.SLOTS){
    const it = S.equip[sl.id]; if(!it) continue;
    g[sl.p] += itemPrimary(it);
    for(const a of it.aff) if(g[a.k] !== undefined) g[a.k] += affixValue(it, a);
  }
  for(const s of activeSets()){
    if(!s.tier) continue;
    for(const k of ['pow','crt','cpw','elm']) if(s.tier[k]) g[k] += s.tier[k];
  }
  const C = career();
  for(const k of ['pow','spd','crt','cpw','elm','prc','gld','drp','dgn','mst']) g[k] += C[k];
  return g;
}
// How the course treats the ball you are carrying today.
function resonance(el){
  if(!el || !S.courseEl) return 1;
  if(perkLeft('ley') > 0) return B.RESONATE;
  if(el === S.courseEl) return B.RESONATE;
  if(B.DAMPS[S.courseEl] === el) return Math.min(1, B.DAMPEN + career().reson);
  return 1;
}
const perkDef = id => B.PERKS.find(p => p.id === id);
const perkLeft = id => S.perkOn && S.perkOn[id] > 0 ? S.perkOn[id] : 0;
function perkMult(k){
  let m = 1;
  for(const id in S.perkOn){
    if(S.perkOn[id] <= 0) continue;
    const p = perkDef(id);
    if(p && p.k === k) m *= p.v;
  }
  return m;
}
function perkAdd(k){
  let a = 0;
  for(const id in S.perkOn){
    if(S.perkOn[id] <= 0) continue;
    const p = perkDef(id);
    if(p && p.k === k) a += p.v;
  }
  return a;
}

function buffVal(id){
  const b = S.buff[id];
  return b && b.t > 0 ? b.v : 0;
}
function derive(){
  const G = gearStats();
  const ch = S.chaos || { y:1, g:1, s:1, c:0, p:0, dl:0 };

  let pow = B.BASE_POWER * upgMult('pow') * (1 + G.pow) * Math.pow(1.45, relLv('heart')) * perkMult('pow');

  const spdRaw = B.BASE_SPEED * upgMult('spd') * (1 + G.spd) * ch.s * (1 + buffVal('gale')/100) * perkMult('spd');
  const spd = Math.min(B.SPEED_CAP, spdRaw);
  if(spdRaw > B.SPEED_CAP) pow *= 1 + (spdRaw/B.SPEED_CAP - 1) * B.SPEED_OVERFLOW;

  const crit = Math.min(B.CRIT_CAP, B.CRIT_BASE
    + upgLv('face')*B.CRIT_ADD.face + upgLv('simul')*B.CRIT_ADD.simul
    + G.crt + ch.c + buffVal('ace'));
  const cpw = B.CRIT_MULT + upgLv('sweet')*B.CPW_ADD + G.cpw;

  const ball0 = S.equip.ball;
  const reson = resonance(ball0 && ball0.el);
  const elem = upgMult('elm') * (1 + G.elm) * Math.pow(1.40, relLv('oath')) * reson;
  // Affinity chance is capped on the course, but the raw figure is kept: the
  // Floodlit Green reads the uncapped value, so over-investing in affinity has
  // somewhere to pay off.
  const procRaw = B.PROC_BASE + upgLv('groove')*B.PROC_ADD
    + G.prc + ch.p + relLv('ember')*B.EMBER_ADD;
  const proc = Math.min(B.PROC_CAP, procRaw);

  const gold = upgMult('gld') * (1 + G.gld) * Math.pow(1.50, relLv('gilded'))
    * ch.g * (1 + buffVal('windfall')/100) * perkMult('gold');
  const drop = clamp(B.DROP_BASE + upgLv('marker')*B.DROP_ADD + G.drp + ch.dl
    + relLv('sun')*B.SUN_ADD + perkAdd('drop'), 0, 1);
  const dgnY = (1 + upgLv('lantern')*B.DGN_ADD + G.dgn);

  // Provisional: the chance a swing plays a second ball. Whole numbers are
  // guaranteed extra balls, the remainder is a roll.
  let mst = upgLv('provis')*B.MST_ADD.provis + upgLv('second')*B.MST_ADD.second
    + G.mst + buffVal('rally')/100;
  mst *= Math.pow(1.30, relLv('ley'));
  mst = clamp(mst, 0, B.MST_CAP);

  // Elemental contribution to expected damage, which depends entirely on what
  // ball is in the bag. This is the whole reason to care which one you carry.
  const ball = S.equip.ball;
  // Every affinity earns its keep down one channel: four of them add yardage,
  // verdant adds purse. Both are metered against the same ELEM_CAP. An uncapped
  // multiplier on the purse channel defeats the ladder faster than one on the
  // damage channel, because gold is the exact thing TIER_G sitting under TIER_Y
  // is meant to starve, and affinity power is a growth axis that has no
  // business feeding income at all.
  let elemRaw = 0, elemPays = false;
  if(ball && ball.el){
    const v = B.ELEM_VAL[ball.el] * elem;
    if(ball.el === 'ember')   elemRaw = proc * v;
    if(ball.el === 'frost')   elemRaw = proc * v;
    if(ball.el === 'storm')   elemRaw = proc * v * 2;
    if(ball.el === 'void')    elemRaw = proc * v * 30;
    if(ball.el === 'verdant'){ elemRaw = proc * v; elemPays = true; }
  }
  const elemCapped = Math.min(elemRaw, B.ELEM_CAP);
  // Verdant pays the purse and never moves the ball, so it must stay out of
  // carry: counted here it would inflate every figure read off dps, from the
  // vitals panel to the Depths endurance floor.
  const elemDmg = elemPays ? 0 : elemCapped;
  // The cap has to bite on the swings that are actually simulated, not only on
  // these summary figures. doSwings settles as expected value above ten swings a
  // frame, but SPEED_CAP against TICK_MAX puts the real ceiling at 3.5, so in
  // ordinary play every swing goes through applyAffinity instead. Handing that
  // path an affinity multiplier scaled by however much the cap held back keeps
  // the two on the same number; left raw, the live one ignored ELEM_CAP
  // entirely and affinity was the cheapest way out of the ladder.
  const elemEff = elemRaw > 0 ? elem * (elemCapped / elemRaw) : elem;
  const god = S.godmode ? 1e12 : 1;
  const swingDps = pow * spd * (1 + crit*(cpw-1)) * (1 + elemDmg) * (1 + mst*B.MST_DMG) * god;
  const C = career();
  return { pow: pow*god, spd, spdRaw, crit, cpw, elem, elemEff, proc, procRaw, gold, drop, dgnY, mst,
           elemDmg, reson, C, dps: swingDps, ball };
}

/* =========================================================================
   LEVELS AND PARAGON
   ========================================================================= */
const xpNeed = lv => B.XP_LV * lv * lv;
const paraNeed = p => Math.round(B.PARA_BASE * Math.pow(1 + p, B.PARA_P));
const atMax = () => S.lv >= B.LV_MAX;

// A paragon point belongs to one category and can never leave it. If the
// category it is owed to is completely full, it falls through to Core, whose
// two primaries have no cap. That is exactly how Diablo handles paragon 800.
function catFull(cat){
  return cat.a.every(a => a.cap > 0 && paraLv(cat.id, a.id) >= a.cap);
}
function awardParagonPoint(){
  const idx = (S.para - 1) % B.PARAGON.length;
  let cat = B.PARAGON[idx];
  if(catFull(cat)) cat = B.PARAGON[0];
  S.paraPts[cat.id] = (S.paraPts[cat.id] || 0) + 1;
  return cat;
}
function addXp(n){
  if(!(n > 0)) return;
  n *= 1 + career().xp;
  if(!atMax()){
    S.xp += n;
    let gained = 0;
    while(!atMax() && S.xp >= xpNeed(S.lv)){
      S.xp -= xpNeed(S.lv); S.lv++; gained++;
      S.talPts += B.LV_TALENT; S.statPts += B.LV_STAT;
      S.tickets = Math.min(B.TICK_CAP, (S.tickets||0) + B.TICK_LEVEL);
    }
    if(gained){
      toast('Level <b>' + S.lv + '</b> \u00b7 +' + gained*B.LV_TALENT + ' talent, +'
        + gained*B.LV_STAT + ' attribute');
      if(atMax()) toast('Career level 60. <b>Paragon</b> begins.');
      if(typeof renderCareer === 'function') renderCareer();
    }
    if(!atMax()) return;
  }
  S.paraXp += n;
  let p = 0;
  while(S.paraXp >= paraNeed(S.para)){
    S.paraXp -= paraNeed(S.para); S.para++; awardParagonPoint(); p++;
    if(p > 5000) break;
  }
  if(p){
    toast('Paragon <b>' + S.para + '</b> \u00b7 +' + p + ' point' + (p>1?'s':''));
    if(typeof renderCareer === 'function') renderCareer();
  }
}


/* ---- costs ---- */
const costOf = (base, r, owned) => base * Math.pow(r, owned);
function costBulk(base, r, owned, k){
  if(k <= 1) return costOf(base, r, owned);
  return base * Math.pow(r, owned) * (Math.pow(r, k) - 1) / (r - 1);
}
function maxAffordable(base, r, owned, cash){
  const unit = base * Math.pow(r, owned);
  if(cash < unit) return 0;
  const k = Math.floor(Math.log(1 + cash*(r-1)/unit) / Math.log(r));
  return Math.max(0, k);
}

/* =========================================================================
   THE HOLE
   ========================================================================= */
const isClosing = h => holeInRound(h) === B.ROUND;
const isSunday  = h => dayIndex(h) === B.DAYS - 1;

// How far into the ladder you actually are. A Tour Card takes five events, and
// the course grows across those five rather than sitting still: you arrive on a
// new card carding bogeys and leave it carding aces. Without this you spend the
// whole card massively overpowered and every hole is an Ace, which makes score
// meaningless. Climbing is exactly neutral, because five events of growth is
// precisely one card step.
function tierProgress(tier){
  const t = tier === undefined ? S.tier : tier;
  return t + Math.min(1, (S.tierEvents && S.tierEvents[t] || 0) / B.EVENTS_PER_CARD);
}
function yardageFor(h, tier, ch){
  return B.Y0 * Math.pow(B.TIER_Y, tierProgress(tier)) * (parOf(h)/4) * ch.y
       * (isClosing(h) ? 2.2 : 1) * (isSunday(h) ? 1.25 : 1);
}
function parTimeFor(h){
  return B.PAR_TIME[parOf(h)] * (isClosing(h) ? 1.6 : 1) * (isSunday(h) ? 1.15 : 1);
}
function purseFor(h, tier, goldMult){
  // pay for the yards actually being played, not just the yards on the card
  const stretch = (S.carded > 0 && S.yardsMax > S.carded)
    ? Math.pow(S.yardsMax / S.carded, B.HCP_PAY) : 1;
  return B.G0 * Math.pow(B.TIER_G, tierProgress(tier)) * (parOf(h)/4) * goldMult * stretch
       * (isClosing(h) ? 3.2 : 1) * (isSunday(h) ? 1.4 : 1)
       * purseMult(tournamentOf(h));
}
function scoreFor(ratio){
  for(const s of B.SCORE) if(ratio <= s.r) return s;
  return B.SCORE[B.SCORE.length-1];
}

const courseElFor = (h, tier) => {
  const n = hash32(roundIndex(h)*7717 + tier*131 + (S.chaosBump||0)*17);
  return n % 5 === 4 ? null : B.ELEM[n % B.ELEM.length].id;   // one round in five plays neutral
};
function startHole(){
  S.courseEl = courseElFor(S.hole, S.tier);
  const D = derive();
  S.chaos = chaosFor(S.hole, S.tier);
  // Condition Grip only ever pulls a punishing course back toward fair; it
  // never turns a generous one MORE generous.
  if(D.C.cond > 0 && S.chaos.y > 1)
    S.chaos.y = Math.max(1, S.chaos.y * (1 - Math.min(0.6, D.C.cond)));
  S.parTime = parTimeFor(S.hole);
  // the card sets the hole, your bag sets the floor under it
  const carded = yardageFor(S.hole, S.tier, S.chaos);
  const handicap = D.dps * S.parTime * B.HCP;
  S.yardsMax = Math.max(carded, handicap);
  S.carded = carded;
  S.yards = S.yardsMax;
  S.purse = purseFor(S.hole, S.tier, D.gold);
  // a strike from a golfer at the tempo cap clearing this hole in par time
  const refSwing = S.yardsMax / (S.parTime * B.SPEED_CAP);
  S.armor = isClosing(S.hole) ? refSwing * B.ARMOR_MULT * (isSunday(S.hole) ? 1.45 : 1) : 0;
  S.walkMin = Math.max(B.WALK_MIN_FLOOR, B.WALK_MIN * (1 - Math.min(0.45, D.C.walk)));
  S.elapsed = 0; S.holeGold = 0; S.frost = 0; S.burn = 0; S.burnT = 0;
  S.swingT = 0;
  Scene.newHole(S.hole, S.tier);
}

// soft=true for continuous sources like burn, which armour taxes as a
// flat share instead of biting each tick to nothing.
function damage(amt, D, soft){
  if(amt <= 0 || S.yards <= 0) return 0;
  if(S.armor > 0){
    const C = D && D.C ? D.C : career();
    const armor = S.armor * Math.max(0, 1 - C.pierce);
    amt *= 1 + C.boss + C.clutch;
    amt = soft ? amt * B.ARMOR_IDLE : Math.max(amt * B.ARMOR_FLOOR, amt - armor);
  }
  if(amt <= 0) return 0;
  const applied = Math.min(amt, S.yards);
  S.yards -= applied;
  const g = (applied / S.yardsMax) * S.purse * B.SWING_SHARE;
  S.gold += g; S.holeGold += g; Meter.add(g);
  return applied;
}

function applyAffinity(D, dmg){
  const el = D.ball && D.ball.el; if(!el) return;
  const v = B.ELEM_VAL[el] * D.elemEff;
  if(el === 'ember'){ S.burn = dmg * v / 3; S.burnT = 3; }
  else if(el === 'frost'){ S.frost = 1; }
  else if(el === 'storm'){ damage(dmg * v, D); damage(dmg * v, D); Scene.spark('storm'); }
  else if(el === 'verdant'){ const g = (dmg/S.yardsMax)*S.purse*B.SWING_SHARE*v;
                             S.gold += g; S.holeGold += g; Meter.add(g); Scene.spark('verdant'); }
  else if(el === 'void'){ damage(S.yards * Math.min(v, B.VOID_MAX_SHARE), D); Scene.spark('void'); }
  if(el === 'ember') Scene.spark('ember');
  if(el === 'frost') Scene.spark('frost');
}

function oneSwing(D, visual){
  let dmg = D.pow;
  if(S.frost > 0){ dmg *= 1 + B.ELEM_VAL.frost * D.elemEff; S.frost = 0; }
  const crit = Math.random() < D.crit;
  if(crit) dmg *= D.cpw;
  let big = false;
  if(D.C.onesw){
    S.swCount = (S.swCount || 0) + 1;
    if(S.swCount % B.ONESWING_EVERY === 0){ dmg *= B.ONESWING_MULT; big = true; Scene.spark('crit'); }
  }
  if(D.ball && D.ball.el && Math.random() < D.proc){
    applyAffinity(D, dmg);
    if(D.C.dbl) applyAffinity(D, dmg);
  }
  let dealt = damage(dmg, D);
  // the provisional: whole numbers are guaranteed, the remainder is a roll
  let extra = Math.floor(D.mst) + (Math.random() < (D.mst % 1) ? 1 : 0);
  while(extra-- > 0 && S.yards > 0){
    let e = D.pow * B.MST_DMG;
    if(Math.random() < D.crit) e *= D.cpw;
    if(D.ball && D.ball.el && Math.random() < D.proc) applyAffinity(D, e);
    dealt += damage(e, D);
  }
  if(visual) Scene.swing(dealt, crit || big, D.ball && D.ball.el);
  return dealt;
}
function doSwings(n, D){
  if(n <= 0) return;
  if(n <= 10){ for(let i=0;i<n && S.yards>0;i++) oneSwing(D, i < 4); return; }
  // Past ten swings in a frame, resolving each one individually is wasted
  // work nobody can see. Fire four for the eyes, settle the rest as expected
  // value, which is what the crit and affinity rates mean anyway.
  for(let i=0;i<4 && S.yards>0;i++) oneSwing(D, true);
  const rest = n - 4;
  if(rest > 0 && S.yards > 0){
    const per = D.pow * (1 + D.crit*(D.cpw-1)) * (1 + D.elemDmg) * (1 + D.mst*B.MST_DMG);
    damage(per * rest, D);
  }
}

/* =========================================================================
   THE SHOT BOOK
   ========================================================================= */
const skillDef = id => B.SKILL.find(k => k.id === id);
const skillVal = (def, lv) => def.b + def.s * Math.max(0, lv-1);
function skillLabel(def, lv){
  const v = skillVal(def, lv);
  // whole numbers should read as whole numbers, and pp() already carries a sign
  const txt = def.id === 'ace' ? pp(v)
            : Number.isInteger(v) ? String(v)
            : v >= 10 ? Math.round(v) : v.toFixed(1);
  return def.d.replace('{v}', txt);
}
function addBuff(id, v, t){ S.buff[id] = { v, t }; }
function fireSkill(def, D){
  const lv = S.skillLv[def.id] || 1, v = skillVal(def, lv);
  switch(def.id){
    case 'thunder':  damage(Math.min(D.pow * v * (1 + D.elemDmg),
                       S.yardsMax * B.SKILL_BURST_CAP), D); Scene.burst('thunder'); break;
    case 'chain':    doSwings(Math.round(v), D); Scene.burst('chain'); break;
    case 'gale':     addBuff('gale', v, 8); Scene.burst('gale'); break;
    case 'ace':      addBuff('ace', v, 6); Scene.burst('ace'); break;
    case 'rally':    addBuff('rally', v, 10); Scene.burst('rally'); break;
    case 'mull':     S.elapsed = Math.max(0, S.elapsed * (1 - v/100)); Scene.burst('mull'); break;
    case 'eclipse':  damage(S.yards * v/100, D); Scene.burst('eclipse'); break;
    case 'windfall': addBuff('windfall', v, 12); Scene.burst('windfall'); break;
  }
  Scene.cast(def.g);
}
function autoCast(D, dt){
  for(const id of S.carry){
    const def = skillDef(id); if(!def || !S.skillLv[id]) continue;
    S.cd[id] = (S.cd[id] || 0) - dt;
    if(S.cd[id] <= 0){ S.cd[id] = def.cd * Math.max(0.25, 1 - D.C.cdr); fireSkill(def, D); }
  }
}

/* =========================================================================
