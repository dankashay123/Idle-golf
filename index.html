// Drawn on the same grid as everything else, then blitted as an image with
// pixelated rendering. A smooth vector icon sitting on pixel art reads as a
// sticker; this does not.
const DOMSPR = {};
// Sprites are baked pixels, so they need a real colour, not a CSS variable.
const BRASS = '#E3B457';
function pixUrl(id, col){
  const key = id + '|' + (col || '');
  if(DOMSPR[key] !== undefined) return DOMSPR[key];
  const sp = pixSprite(id, col || '#DFE9DC');
  try{ return DOMSPR[key] = sp ? sp.cv.toDataURL() : ''; }
  catch(e){ return DOMSPR[key] = ''; }
}
// Both 12x12 so they land at identical size in identical square buttons.
// The trophy was 12x13 and stretched, which is why it looked the larger of
// the two.

function honRows(w){
  const done = achCount(), tot = B.ACH.length;
  const A = achBonus();
  const live = Object.keys(A).map(k => achReward({ r:{ k, v:A[k] } })).join(' \u00b7 ');
  const near = achNear(3);
  let h = '<div class="hint"><b>' + done + '</b> of ' + tot + ' done'
    + (live ? ' \u00b7 earning <b style="color:var(--aurora)">' + live + '</b>' : '') + '</div>';
  if(near.length) h += '<div class="hint">Closest: '
    + near.map(a => '<b>' + a.n + '</b> ' + fmt(Math.min(achMetric(a.m), a.v), 0) + '/' + fmt(a.v, 0))
        .join(' \u00b7 ') + '.</div>';
  // Today's three, first: they turn over, the rest wait.
  if(S.daily){
    const Dy = S.daily, st = dailyStreak();
    const bonus = B.DAILY_ALL + B.DAILY_STREAK * Math.min(B.DAILY_STREAK_MAX, st + (Dy.all ? 0 : 1));
    h = '<div class="eyebrow" style="margin:6px 0 4px">Today \u00b7 new in ' + hms(featLeft())
        + (st ? ' \u00b7 ' + st + '-day streak' : '') + '</div>'
      + Dy.picks.map((id, i) => {
          const c = dailyDef(id); if(!c) return '';
          return '<div class="lb rep"><span>' + (Dy.done[i] ? '\u2713 ' : '') + nb(c.d) + '</span>'
            + '<span class="s">' + fmt(dailyHave(c, i), 0) + '/' + fmt(c.v, 0) + ' \u00b7 +'
            + B.DAILY_SOV + sovIc() + '</span></div>';
        }).join('')
      + '<div class="lb rep"><span><i>' + (Dy.all ? '\u2713 All three' : 'All three') + '</i></span>'
      + '<span class="s">+' + bonus + sovIc() + '</span></div>'
      + h;
  }
  // The ones that come round again, one line each: how far to the next, and
  // what it pays. Not .row, so the first row in the sheet is still the nearest
  // one-off.
  h += '<div class="eyebrow" style="margin:10px 0 4px">Every time</div>'
    + B.ACH_REP.map(a => {
        const have = achMetric(a.m) % a.step;
        return '<div class="lb rep"><span>' + a.n + ' <i>\u00b7 ' + nb(a.d) + '</i></span>'
          + '<span class="s">' + fmt(have, 0) + '/' + fmt(a.step, 0) + ' \u00b7 +' + a.sov + sovIc() + '</span></div>';
      }).join('')
    + '<div class="eyebrow" style="margin:12px 0 4px">Once</div>';
  // Nearest first, then the shelf. A checklist sorted by what you have already
  // done tells you nothing about what to go and play for.
  const rows = B.ACH.map(a => ({ a, done: achDone(a.id) ? 1 : 0, r: achRatio(a) }))
    .sort((x, y) => x.done - y.done || y.r - x.r).map(x => x.a);
  for(const a of rows){
    const got = achDone(a.id), have = achMetric(a.m), need = a.v;
    h += '<div class="row' + (got ? '' : ' locked') + '"><div>'
      + '<div class="nm">' + (got ? '\u2713 ' : '') + a.n + '</div>'
      + '<div class="ds">' + nb(a.d) + '</div>'
      + '<div class="mt">' + (got ? '<b>' + achReward(a) + '</b>'
          : '<i>' + fmt(Math.min(have, need), 0) + '</i> / ' + fmt(need, 0)
            + ' \u00b7 ' + achReward(a))
        + (a.sov ? ' \u00b7 +' + a.sov + sovIc() : '') + '</div></div>'
      + (got ? '' : '<div class="hbar"><i style="width:' + clamp(have/need,0,1)*100 + '%"></i></div>')
      + '</div>';
  }
  w.innerHTML = h;
}
function honoursSheet(){
  S.honSeen = achCount();
  showSheet('<h3>Honours</h3><div id="honSheetRows"></div>'
    + '<button class="act ghost" onclick="hideSheet()">Close</button>');
  const t = $('honSheetRows');
  if(t) honRows(t);
  renderHonBtn();
}
function renderHonBtn(){
  const b = $('honBtn'); if(!b) return;
  const n = achCount();
  if(!b._built){
    b._built = 1;
    $('honIcon').src = pixUrl('trophy', '#E3B457');
    b.onclick = honoursSheet;
  }
  b.classList.toggle('new', n > (S.honSeen || 0));
  // The button is a 12x12 sprite with no room for words, so the words go where
  // a long press and a screen reader both find them: the nearest one by name,
  // rather than a tally of the ones already won.
  const nx = achNear(1)[0];
  const lbl = nx ? 'Honours \u00b7 closest: ' + nx.n + ' ' + fmt(Math.min(achMetric(nx.m), nx.v), 0)
                   + ' of ' + fmt(nx.v, 0)
                 : 'Honours \u00b7 all ' + B.ACH.length + ' done';
  if(b._lbl !== lbl){ b._lbl = lbl; b.title = lbl; b.setAttribute('aria-label', lbl); }
  const p = $('perkBtn');
  if(p){
    if(!p._built){
      p._built = 1;
      $('perkIcon').src = pixUrl('star', '#F2D75E');
      p.onclick = perksSheet;
    }
    const live = B.PERKS.some(x => perkLeft(x.id) > 0);
    const can = B.PERKS.some(x => (S.tickets||0) >= x.cost && !perkLeft(x.id));
    p.classList.toggle('live', live);
    p.classList.toggle('ready', can && !live);
  }
  const sh = $('shopBtn');
  if(sh){
    if(!sh._built){
      sh._built = 1;
      $('shopIcon').src = pixUrl('proshop', '#C68BFF');
      sh.onclick = () => openShop();
    }
    // the dot is for the one-time offer, not for everything in the shop
    sh.classList.toggle('new', !S.starter);
  }
  const sb = $('setBtn');
  if(sb && !sb._built){
    sb._built = 1;
    $('setIcon').src = pixUrl('gear', '#DFE9DC');
    sb.onclick = () => settingsSheet();
  }
  const cb = $('hudClimb');
  if(cb){
    if(!cb._built){
      cb._built = 1;
      cb.onclick = () => {
        S.autoClimb = !S.autoClimb;
        toast('Auto-climb <b>' + (S.autoClimb ? 'on' : 'off') + '</b>');
        if(view === 'tour') renderTour();
        renderHonBtn();
      };
    }
    const on = !!S.autoClimb;
    if(cb._on !== on){
      cb._on = on;
      $('hudClimbIcon').src = pixUrl('autoclimb', on ? '#57E0BE' : '#8BA793');
      cb.classList.toggle('off', !on);
      cb.setAttribute('aria-label', 'Auto-climb ' + (on ? 'on' : 'off'));
    }
  }
}
function renderXp(){

// One readout for the course and for a wager, but a wager fills the strip under
// it with a shape of its own, so the four do not read as one contest in four
// colours. The whole panel also takes the contest's own accent.
function renderReadout(D){
  const R = S.dgnRun;
  let top, topR, big, unit, tag, tagCol, frac, barCol = 'var(--brass)';
  let strip = null, accent = null;
  if(R){
    const left = Math.max(0, R.dur - R.t);
    topR = left.toFixed(1) + 's';
    tagCol = 'var(--dim)';
    if(R.mode === 'drive'){
      top = 'Drive ' + R.shots + ' of ' + B.DRIVE_SHOTS;
      big = fmt(R.best); unit = 'best'; frac = R.shots / B.DRIVE_SHOTS;
      tag = 'Wind ' + R.wind.toFixed(2) + 'x';
      tagCol = R.wind >= 1 ? 'var(--verdant)' : 'var(--flag)';
      // six balls on the tee, each as tall as it went beside the longest
      const log = R.log || [];
      strip = [];
      for(let i = 0; i < B.DRIVE_SHOTS; i++){
        const v = log[i];
        if(v === undefined){ strip.push(['', 2]); continue; }
        const u = R.best > 0 ? clamp(v / R.best, 0, 1) : 0;
        strip.push([v >= R.best - 1e-9 ? 'hi' : 'on', 2 + Math.round(u*8)]);
      }
    }else if(R.mode === 'island'){
      top = 'Green ' + R.made + ' of ' + R.target;
      const ch = R.chance || islandChance(D, R.made);
      big = fmt(R.pot); unit = 'pot'; frac = ch;
      tag = Math.round(ch*100) + '% make';
      tagCol = ch > 0.6 ? 'var(--aurora)' : ch > 0.35 ? 'var(--brass)' : 'var(--flag)';
      // a ladder to the bank: each rung doubles what is on it, the last is the
      // one you walk off with
      strip = [];
      const n = Math.min(25, R.target);
      for(let i = 0; i < n; i++)
        strip.push([i < R.made ? (i === n-1 ? 'hi' : 'on') : '', 3 + Math.round(i/(n-1||1)*7)]);
    }else if(R.mode === 'chip'){
      top = 'Chip ' + R.shot + ' of ' + B.CHIP_SHOTS;
      big = fmt(R.pot); unit = 'pot'; frac = R.shot / B.CHIP_SHOTS;
      tag = R.made + ' dropped'; tagCol = 'var(--verdant)';
      // the rack: twenty five balls, lit as they are played, filled if dropped
      strip = [];
      const drops = R.drops || [];
      for(let i = 0; i < B.CHIP_SHOTS; i++)
        strip.push([i >= R.shot ? '' : drops[i] ? 'on' : 'lit', drops[i] ? 9 : 3]);
    }else if(R.mode === 'scramble'){
      top = 'Hole ' + R.shot + ' of ' + B.SCRAMBLE_HOLES;
      big = fmt(R.pot); unit = 'pot'; frac = R.shot / B.SCRAMBLE_HOLES;
      tag = R.made + ' holed'; tagCol = 'var(--verdant)';
      // nine flags: grey to play, dim for a hole lost, lit for a hole won --
      // taller for the holes where more balls went out
      strip = [];
      const log = R.log || [];
      for(let i = 0; i < B.SCRAMBLE_HOLES; i++){
        const h = log[i];
        strip.push(!h ? ['', 2] : [h.won ? 'on' : 'lit', 3 + Math.min(6, h.balls * 2)]);
      }
    }else if(R.mode === 'twilight'){
      top = 'Putt ' + R.shot + ' of ' + R.n;
      big = fmt(R.pot); unit = 'pot'; frac = R.n ? R.shot / R.n : 0;
      tag = R.made + ' dropped'; tagCol = 'var(--verdant)';
      // the last twenty putts, the light going as the run goes on -- twenty,
      // not the chips' twenty five, so the two do not draw the same picture
      strip = [];
      const log = R.log || [], from = Math.max(0, log.length - 20);
      for(let i = from; i < from + 20; i++){
        const v = log[i];
        strip.push(v === undefined ? ['', 2] : [v ? 'on' : 'lit', v ? 9 - Math.round(5 * i / Math.max(1, R.n)) : 3]);
      }
    }else{
      top = 'Floor ' + (R.floor + 1) + ' \u00b7 ' + R.cleared + ' banked';
      big = fmt(Math.max(0, R.work)); unit = 'left';
      frac = clamp(1 - R.work/Math.max(1e-9, R.full), 0, 1);
      tag = R.dead ? 'Turned back' : R.mod < 1 ? 'Slowed' : R.mod > 1 ? 'Running hot' : 'Digging';
      tagCol = R.dead || R.mod < 1 ? 'var(--flag)' : R.mod > 1 ? 'var(--verdant)' : 'var(--dim)';
      // a flight of stairs going down, the one underfoot filling as you dig
      strip = [];
      const show = 14, from = Math.max(0, R.cleared - show + 1);
      for(let i = from; i < from + show; i++){
        if(i > R.cleared){ strip.push(['', 2]); continue; }
        const h = 10 - Math.round((i - from)/(show-1)*7);
        strip.push([i === R.cleared ? 'hi' : 'on', i === R.cleared ? Math.max(2, Math.round(h*frac)) : h]);
      }
    }
    accent = (B.DGN_PAL[R.id] || {}).glow || null;
    if(left < 8) topR = '<span style="color:var(--flag)">' + topR + '</span>';
  }else{
    const ratio = S.elapsed / S.parTime, sc = scoreFor(ratio);
    top = 'Hole ' + holeInRound(S.hole) + ' \u00b7 Par ' + parOf(S.hole);
    topR = S.elapsed.toFixed(1) + ' / ' + Math.round(S.parTime) + 's';
    big = S.yards <= 0 ? '\u2014' : fmt(Math.max(0, S.yards));
    unit = S.yards <= 0 ? 'walking in' : 'yds';
    frac = clamp(S.yards/S.yardsMax, 0, 1);
    tag = sc.n;
    tagCol = sc.d <= -3 ? 'var(--myth)' : sc.d <= -2 ? 'var(--brass)' : sc.d === -1 ? 'var(--aurora)'
           : sc.d === 0 ? 'var(--chalk)' : 'var(--flag)';
  }
  $$('rTop').innerHTML = top;
  $$('rTopR').innerHTML = topR;
  $$('rBig').textContent = big;
  $$('rUnit').textContent = unit;
  const tg = $$('rTag');
  tg.textContent = tag; tg.style.color = tagCol;
  const fl = $$('rFill');
  fl.style.width = clamp(frac, 0, 1)*100 + '%';
  fl.style.background = barCol;

  const ro = $$('readout'), st = $$('rStrip');
  ro.style.setProperty('--rc', accent || 'var(--brass)');
  ro.style.borderColor = accent ? accent + '55' : '';
  $$('rBig').style.color = accent || '';
  if(!strip){ st.hidden = true; return; }
  st.hidden = false;
  // Rebuilt only when the cell COUNT changes; twenty five nodes thrown away
  // and remade every frame is the sort of thing that shows up as jitter on a
  // phone long before it shows up in a profile.
  if(st.children.length !== strip.length){
    st.innerHTML = '';
    for(let i = 0; i < strip.length; i++) st.appendChild(document.createElement('i'));
  }
  for(let i = 0; i < strip.length; i++){
    const el = st.children[i];
    if(el.className !== strip[i][0]) el.className = strip[i][0];
    const h = strip[i][1] + 'px';
    if(el.style.height !== h) el.style.height = h;
  }
}

/* ---- practice range ---- */
// What each stat looks like. Upgrades, trophies and contests all name a stat
// or a currency already, so every one of them can carry an icon without a
// single new field -- and the Range, the trophy room and the Depths stop being
// the three lists in the game that are just text.
const STAT_IC = {
  pow:'driver', spd:'gale', mst:'bounce', crt:'target', cpw:'bolt',
  elm:'ring', gld:'coins', drop:'flag', dgn:'shard', reson:'leaf',
  grit:'grit', shard:'shard', scroll:'scroll', gold:'coins', purse:'coins'
};
// Keyed on the thing itself, not on the stat it happens to move. Going off the
// stat meant seven of the twenty one range lines shared one club and seventeen
// things across the game all showed a golf ball.
const UPG_IC = {
  drive:'smash',   tempo:'metro',    provis:'twoball', face:'mill',
  compress:'press',sweet:'sweet',    infuse:'flask',   shaft:'shaft',
  marker:'marker', grip:'grip',      agent:'case',     groove:'groove',
  van:'van',       second:'chev',    lantern:'lantern',forged:'anvil',
  simul:'monitor', windbook:'book',  links:'dunes',    plate:'plate',
  quantum:'atom'
};
// One per trophy, drawn for the thing it is named after rather than for the
// stat it moves: thirty trophies were sharing ten icons.
const TROPHY_IC = {
  heart:'heart',   ley:'knot',       gilded:'card',    oath:'stone',
  sun:'sunburst',  chrono:'chrono',  seed:'purse',     rift:'key',
  ember:'ember',   hickory:'hickory',gutta:'gutta',    mythtee:'tee',
  feath:'feather', compass:'compass',brassie:'brassie',niblick:'niblick',
  spikes:'spikes', whistle:'arc',    yardage:'yardbook', glass:'stormglass',
  divot:'divot',   sunday:'sunday',  reader:'lens',    clock:'clock',
  deepwdg:'deepwdg', marker:'clover',token:'token',    watch:'watch',
  sock:'windsock', vault:'locker'
};
const statIcon = (k, cls, col) => svgIcon(STAT_IC[String(k||'').replace(/^\*/, '')] || 'ball', cls, col);
const idIcon = (map, id, k, cls, col) =>
  map[id] ? svgIcon(map[id], cls, col) : statIcon(k, cls, col);

function rowShell(ic){
  const d = document.createElement('div');
  d.className = 'row';
  d.innerHTML = (ic || '')
    + '<div><div class="nm"></div><div class="ds"></div><div class="mt"></div></div>'
    + '<button class="buy"><span class="lbl"></span><span class="amt"></span></button>';
  return d;
}
function buildUpg(){
  const w = $('upgRows'); w.innerHTML = ''; UPGREF = [];
  for(const u of B.UPG){
    const d = rowShell(idIcon(UPG_IC, u.id, u.k, 'ric'));
    const body = d.children[1], btn = d.children[2];
    body.children[0].textContent = u.n;
    body.children[1].textContent = u.d;
    btn.onclick = () => buyUpg(u);
    w.appendChild(d);
    UPGREF.push({ u, el:d, mt:body.children[2], btn,
                  lbl:btn.children[0], amt:btn.children[1] });
  }
  const mb = $('multBar'); mb.innerHTML = '';
  MULTS.forEach(m => {
    const b = document.createElement('button');
    b.className = 'mbtn' + (S.mult === m ? ' on' : '');
    b.textContent = m === 'Max' ? 'Max' : '\u00d7' + m;
    b.onclick = () => { S.mult = m; buildUpg(); refreshUpg(); };
    mb.appendChild(b);
  });
}
function bulkFor(base, r, owned, cap){
  let k = S.mult === 'Max' ? maxAffordable(base, r, owned, S.gold) : S.mult;
  if(isFinite(cap)) k = Math.min(k, Math.max(0, cap - owned));
  return Math.max(S.mult === 'Max' ? 0 : 1, k);
}
function effectLabel(u){
  const lv = upgLv(u.id);
  if(u.k === 'crt') return '+' + (lv*B.CRIT_ADD[u.id]*100).toFixed(1) + 'pp';
  if(u.k === 'cpw') return '+' + (lv*B.CPW_ADD).toFixed(2) + 'x';
  if(u.k === 'drp') return '+' + (lv*B.DROP_ADD*100).toFixed(1) + 'pp';
  if(u.k === 'prc') return '+' + (lv*B.PROC_ADD*100).toFixed(1) + 'pp';
  if(u.k === 'dgn') return '+' + Math.round(lv*B.DGN_ADD*100) + '%';
  if(u.k === 'mst') return '+' + (lv*B.MST_ADD[u.id]*100).toFixed(1) + 'pp';
  return '\u00d7' + Math.pow(u.g, lv).toFixed(2);
}
function refreshUpg(){
  // Every rung is on show from the first minute. Hiding them made the ladder
  // look shorter than it is, and rows that came and went with your balance
  // looked like the game losing your upgrades.
  let owned = 0;
  for(const r of UPGREF) if(upgLv(r.u.id) > 0) owned++;
  // an albatross or better on this card is a golfer who belongs on the next
  const ahead = S.tier < B.TIER_MAX && projectedRatio(S.tier) <= 0.27;
  const band = $('upgCount');
  if(band) band.textContent = owned + ' of ' + B.UPG.length + ' started';
  const note = $('upgTax');
  if(note) note.innerHTML = ahead
    ? (cardUnlocked(S.tier + 1)
        ? 'Your bag outdrives this card \u00b7 <b>climb</b> on the Tour tab'
        : 'Your bag outdrives this card \u00b7 win its <b>cup</b> to move up')
    : 'Playing the card as it lies';

  // The range used to carry a line of its own at the top naming the cheapest
  // rung in reach. That goes on the row it is about instead: a rung whose
  // button is grey says what purse lights it. It said how long the purse
  // needed, but an estimate off the current income moves every second and
  // read as a lock with a timer on it; the price is the actual condition.

  for(const r of UPGREF){
    const u = r.u, lv = upgLv(u.id), cap = capOf(u);
    const maxed = lv >= cap;
    const k = maxed ? 0 : bulkFor(u.base, u.r, lv, cap);
    const c = maxed ? 0 : costBulk(u.base, u.r, lv, k);
    // The wait is to the price the button is actually asking for, so it tracks
    // the multiplier: on x10 it is how long until ten of them, not one.
    const ok = !maxed && S.gold >= c && k > 0;
    r.mt.innerHTML = 'Lv <i>' + lv + (isFinite(cap) ? '/' + cap : '') + '</i> \u00b7 <b>'
      + effectLabel(u) + '</b>'
      + (!maxed && !ok ? ' \u00b7\u00a0<u>unlocks when you have\u00a0' + fmt(c) + '</u>' : '');
    if(maxed){
      r.btn.className = 'buy max'; r.lbl.textContent = 'Capped'; r.amt.textContent = '\u2014';
    }else{
      // On Max, bulkFor hands back 0 when you cannot afford even one, while
      // costBulk hands back the price of one regardless -- so the button read
      // "x0" over a real number, which is an offer to buy nothing for 1,200.
      // The price is what one costs, so the label says one.
      r.btn.className = 'buy' + (ok ? ' ok' : ' no');
      r.lbl.textContent = '\u00d7' + Math.max(1, k);
      r.amt.textContent = fmt(c);
    }
  }
}
function buyUpg(u){
  const lv = upgLv(u.id), cap = capOf(u);
  if(lv >= cap) return;
  const k = bulkFor(u.base, u.r, lv, cap);
  const c = costBulk(u.base, u.r, lv, k);
  if(k <= 0 || S.gold < c) return;
  S.gold -= c; S.upg[u.id] = lv + k;
  Sfx.play('buy');
  refreshUpg(); renderVitals();
}
/* ---- the bag ---- */
function affLine(it, max){
  const out = it.aff.filter(a => B.AFFIX.some(x => x.id === a.k)).map(a => {
    const d = B.AFFIX.find(x => x.id === a.k);
    const v = affixValue(it, a);
    const s = d.sfx === 'pp' ? '+' + (v*100).toFixed(1) + 'pp'
            : d.sfx === 'x' ? '+' + v.toFixed(2) + 'x'
            : '+' + (v*100 >= 1000 ? fmt(v*100) : (v*100).toFixed(0)) + '%';
    return d.n + ' ' + s;
  });
  // A five affix roll wrapped to four lines of mono and nobody read any of it.
  // The top few, then a count; the item sheet has the rest.
  return max && out.length > max
    ? out.slice(0, max).join(' \u00b7 ') + ' \u00b7 +' + (out.length - max) + '\u00a0more'
    : out.join(' \u00b7 ');
}
function itemHead(it){

    .map(([k,v,ic,col]) => '<div class="cur">' + svgIcon(ic, 'cic', col)

    : rz < 1 ? 'Your ' + elemOf(ball.el).n + ' ball is weak here, \u00d7' + rz.toFixed(2) + '\u00a0power'
    : 'Your ' + elemOf(ball.el).n + ' ball plays normally here';
  $('setBox').innerHTML =
    '<div class="row"><div><div class="nm">' + (ce ? ce.n + ' Course' : 'Neutral Course') + '</div>'
    + '<div class="ds">' + verdict + (ce ? '. ' + elemOf(B.DAMPS[ce.id]).n + ' balls are weak here.' : '.') + '</div></div>'
    + (ce ? svgIcon(ce.ic, 'bic', elemColor(ce.id)) : '') + '</div>'
    // A named set gets a row once a piece of it has turned up, equipped or in

      else if(S.autoEquip) toast('Nothing better on the bench');

    const r = document.createElement('div');
    r.className = 'item';
    r.innerHTML = '<div><div class="in">Scrap the spare ' + sl.n.toLowerCase() + '</div>'
      + '<div class="ib">' + spare.length + '\u00a0spare \u00b7 keeps the best</div></div>';
    const btn = document.createElement('button');
    btn.className = 'equipbtn';
    btn.textContent = 'Scrap ' + (spare.length - 1);
    btn.onclick = () => {
      const doomed = spare.slice(1);

      doomed.forEach(it => { sh += scrapValue(it); });
      S.bag = S.bag.filter(it => !doomed.includes(it));
      S.shard += sh;
      toast('Scrapped ' + doomed.length + ' for <b>' + sh + '</b> ' + plural(sh, 'shards'));
      renderBag(); renderVitals();
    };
    r.appendChild(btn);
    w.appendChild(r);
  }
}

// One club, the way the reference reads it: framed art, the rarity said out
// loud beside the name, what it is worth on its own line, and one button.
function bagRow(it, isWorn){
  const cur = S.equip[it.slot];
  const better = !isWorn && (!cur || itemScore(it) > itemScore(cur));
  const sl = B.SLOTS.find(s => s.id === it.slot);
  const col = RC(it.rar);
  const el = it.el ? elemOf(it.el) : null;
  const d = document.createElement('div');
  d.className = 'item card2' + (isWorn ? ' worn' : '');
  d.style.borderLeftColor = col;

  const primary = (sl.p === 'elm' || it.slot === 'ball' ? 'affinity power' : 'swing power');
  d.innerHTML = '<div class="thumb" style="border-color:' + col + '">'
      + '<img src="' + pixUrl(sl.ic, col) + '" alt="">'
      + (el ? '<span class="tel">' + svgIcon(el.ic, 'lel', elemColor(el.id)) + '</span>' : '')
    + '</div>'
    + '<div><div class="irow"><span class="in">' + itemHead(it) + '</span>'
      + '<span class="irar" style="color:' + col + '">' + B.RARITY[it.rar].n + '</span></div>'
    + '<div class="ib">' + sl.n + ' \u00b7 item level ' + it.ilvl
      + (it.set && setDef(it.set) ? ' \u00b7 <span style="color:var(--aurora)">' + setDef(it.set).n + '</span>' : '')
      + (it.enh ? ' \u00b7 +' + it.enh : '')
      + (isWorn ? ' \u00b7 <span style="color:var(--brass)">carrying</span>' : '') + '</div>'
    + '<div class="ia">\u00d7' + fmt(1 + itemPrimary(it)) + ' ' + primary + '</div>'
    + '<div class="ia">' + (affLine(it, 3) || 'no affixes') + '</div></div>';

  const btn = document.createElement('button');
  btn.className = 'equipbtn' + (isWorn ? ' worn' : better ? ' up' : '');
  btn.innerHTML = isWorn ? 'Equipped'
    : '<img src="' + pixUrl(sl.ic, better ? '#57E0BE' : '#E3B457') + '" alt="">'
      + (better ? 'Upgrade' : 'Equip');
  btn.onclick = e => { e.stopPropagation(); if(!isWorn) equipItem(it); };
  d.appendChild(btn);
  d.onclick = () => itemSheet(it, isWorn);
  return d;
}
// What the bag would look like carrying this instead. derive() reads S.equip
// and nothing else about the swap, and it has no side effects, so the honest
// way to answer "what does this do" is to put the club in, ask, and put the
// old one back. Restored in a finally, because a throw in here would otherwise
// leave you carrying something you never equipped.
function previewSwap(it){
  const slot = it.slot, had = S.equip[slot];
  if(had && had.uid === it.uid) return null;
  const before = derive(), beforeSets = activeSets().filter(x => x.tier)
    .map(x => x.set.n + ' ' + x.tier.n);
  let after, afterSets;
  try {
    S.equip[slot] = it;
    after = derive();
    afterSets = activeSets().filter(x => x.tier).map(x => x.set.n + ' ' + x.tier.n);
  } finally {
    if(had) S.equip[slot] = had; else delete S.equip[slot];
  }
  const gained = afterSets.filter(x => beforeSets.indexOf(x) < 0);
  const lost   = beforeSets.filter(x => afterSets.indexOf(x) < 0);
  return { before, after, gained, lost, had };
}

// One line of it: the old number, the new one, and the change said plainly.
function swapLine(label, a, b, fmtv, higherIsBetter){
  const up = b > a, same = Math.abs(b - a) < Math.abs(a) * 1e-9;
  const good = same ? null : (up === (higherIsBetter !== false));
  const pct = a > 0 ? (b / a - 1) * 100 : (b > 0 ? 100 : 0);
  const col = good === null ? 'var(--faint)' : good ? 'var(--aurora)' : 'var(--flag)';
  return '<div class="swrow"><span class="swk">' + label + '</span>'
    + '<span class="swa">' + fmtv(a) + '</span>'
    + '<span class="swar">\u2192</span>'
    + '<span class="swb" style="color:' + col + '">' + fmtv(b) + '</span>'
    + '<span class="swd" style="color:' + col + '">'
    + (same ? 'same' : (pct > 0 ? '+' : '') + (Math.abs(pct) >= 10 ? Math.round(pct)
        : pct.toFixed(1)) + '%') + '</span></div>';
}

function itemSheet(it, equipped){
  const el = it.el ? B.ELEM.find(e => e.id === it.el) : null;
  const canEnh = it.enh < B.ENH_MAX;
  let h = '<div class="sheethead">' + svgIcon(B.SLOTS.find(s=>s.id===it.slot).ic, 'bic', RC(it.rar))
    + '<h3 style="color:' + RC(it.rar) + ';margin:0">' + it.name + (it.enh ? ' +' + it.enh : '') + '</h3></div>';
  h += '<p>' + B.RARITY[it.rar].n + ' ' + B.SLOTS.find(s=>s.id===it.slot).n + ' \u00b7 item level ' + it.ilvl
    + (it.set && setDef(it.set) ? ' \u00b7 <span style="color:var(--aurora)">' + setDef(it.set).n + ' set</span>' : '') + '</p>';
  h += '<ul><li>Primary: +' + fmt(itemPrimary(it)*100) + '% '
     + (it.slot === 'ball' ? 'affinity power' : 'swing power') + '</li>';
  it.aff.forEach((a, i) => {
    const d = B.AFFIX.find(x => x.id === a.k); if(!d) return;
    const v = affixValue(it, a);
    h += '<li>' + (a.lock ? '<b style="color:var(--brass)">[locked]</b> ' : '') + d.n + ': '
      + (d.sfx === 'pp' ? '+' + (v*100).toFixed(1) + 'pp'
        : d.sfx === 'x' ? '+' + v.toFixed(2) + 'x' : '+' + fmt(v*100) + '%')
      + ' <button class="mini" style="padding:1px 6px;margin-left:6px" onclick="doLock('
      + it.uid + ',' + i + ')">' + (a.lock ? 'Unlock' : 'Lock') + '</button></li>';
  });
  if(el) h += '<li style="color:' + elemColor(el.id) + '">' + el.n + ': ' + el.d + '</li>';
  h += '</ul>';
  // What carrying it would actually do. Directly under the stats, because it is
  // the question the sheet gets opened to answer and it used to sit below three
  // buttons about reforging.
  if(!equipped){
    const sw = previewSwap(it);
    if(sw) h += '<div class="swap"><div class="swhead">'
      + (sw.had ? 'Instead of <b>' + sw.had.name + '</b>' : 'If you carry it') + '</div>'
      + swapLine('Carry',  sw.before.dps,  sw.after.dps,  v => fmt(v))
      + swapLine('Swing',  sw.before.pow,  sw.after.pow,  v => fmt(v))
      + swapLine('Purse',  sw.before.gold, sw.after.gold, v => '\u00d7' + fmt(v))
      + (sw.gained.length ? '<div class="swset ok">Completes ' + sw.gained.join(', ') + '</div>' : '')
      + (sw.lost.length ? '<div class="swset no">Breaks ' + sw.lost.join(', ') + '</div>' : '')
      + '</div>';
  }
  if(canEnh) h += '<button class="act" onclick="doEnh(' + it.uid + ')">Reforge to +' + (it.enh+1)
    + ' \u2014 ' + fmt(enhCost(it)) + ' grit, ' + Math.round(enhChance(it)*100) + '%</button>';
  const lk = lockCount(it);
  h += '<button class="act ghost" onclick="doReroll(' + it.uid + ')">Re-attune '
    + (lk ? 'the other ' + (it.aff.length - lk) : 'affixes') + ' \u2014 '
    + fmt(rerollCost(it), 0) + '\u00a0shards</button>'
    + (it.aff.length > 1 ? '<p style="font-size:11px;margin-top:6px">A lock keeps that roll. '
      + 'Each lock costs more.</p>' : '');
  if(it.rar < B.RARITY.length-1)
    h += '<button class="act ghost" onclick="doAscend(' + it.uid + ')">Ascend to '
      + B.RARITY[it.rar+1].n + ' \u2014 ' + ascendCost(it) + '\u00a0shards</button>';
  if(!equipped){
    h += '<button class="act" onclick="doEquip(' + it.uid + ')">Put in the bag</button>';
    h += '<button class="act danger" onclick="doSalvage(' + it.uid + ')">Scrap for '
      + scrapValue(it) + ' ' + plural(scrapValue(it), 'shards') + '</button>';
  }
  h += '<button class="act ghost" onclick="hideSheet()">Close</button>';
  showSheet(h);
}
const findItem = uid => S.bag.find(x => x.uid === uid)
  || B.SLOTS.map(s => S.equip[s.id]).filter(Boolean).find(x => x.uid === uid);
function doEnh(uid){ const it = findItem(uid); if(it){ enhance(it); itemSheet(it, !S.bag.includes(it)); } }
function doLock(uid, i){ const it = findItem(uid); if(it){ toggleLock(it, i); itemSheet(it, !S.bag.includes(it)); } }
function doReroll(uid){ const it = findItem(uid); if(it){ rerollItem(it); itemSheet(it, !S.bag.includes(it)); } }
function doAscend(uid){ const it = findItem(uid); if(it){ ascendItem(it); itemSheet(it, !S.bag.includes(it)); } }
function doEquip(uid){ const it = findItem(uid); if(it){ equipItem(it); hideSheet(); } }
function doSalvage(uid){ const it = findItem(uid); if(it){ salvageItem(it); hideSheet(); } }

/* ---- shot book ---- */
function renderSkills(){
  const w = $('sklRows'); w.innerHTML = '';
  $('sklNote').textContent = S.carry.length + ' / ' + B.SKILL_SLOTS + ' carried \u00b7 ' + fmt(S.scroll) + '\u00a0scrolls';
  for(const k of B.SKILL){
    const lv = S.skillLv[k.id] || 0;
    const owned = lv > 0;
    const carried = S.carry.includes(k.id);
    const cd = S.cd[k.id] || 0;
    const d = document.createElement('div');
    d.className = 'sk-row';
    const up = Math.ceil(B.SKILL_LV_COST * Math.pow(B.SKILL_LV_R, Math.max(0, lv-1)));
    const frac = carried && owned ? clamp(1 - cd/k.cd, 0, 1) : (owned ? 1 : 0);
    d.innerHTML = '<div class="glyph' + (carried ? ' eq' : '') + (owned ? '' : ' lock') + '">'
      + svgIcon(k.ic, 'kic') + '<div class="cd" style="height:' + (1-frac)*100 + '%"></div></div>'
      + '<div><div class="nm">' + k.n + '</div>'
      + '<div class="ds">' + nb(skillLabel(k, owned ? lv : 1)) + '</div>'
      + '<div class="mt">' + (owned ? 'Lv <i>' + lv + '</i> \u00b7 ' + k.cd + 's cooldown'
                                    : 'Not learned yet \u00b7 costs ' + k.cost + ' scrolls') + '</div></div>'
      + '<div class="btnrow"></div>';
    const br = d.querySelector('.btnrow');
    if(!owned){
      const b = document.createElement('button');
      b.className = 'mini' + (S.scroll >= k.cost ? ' go' : ' dim');
      b.textContent = 'Learn';
      b.onclick = () => {
        if(S.scroll < k.cost){ toast('Not enough scrolls'); return; }
        S.scroll -= k.cost; S.skillLv[k.id] = 1; toast('Learned <b>' + k.n + '</b>'); renderSkills();
      };
      br.appendChild(b);
    }else{
      const c = document.createElement('button');
      c.className = 'mini' + (carried ? ' go' : '');
      c.textContent = carried ? 'Carried' : 'Carry';
      c.onclick = () => {
        if(carried) S.carry = S.carry.filter(x => x !== k.id);
        else if(S.carry.length >= B.SKILL_SLOTS) toast('Only ' + B.SKILL_SLOTS + ' shots fit in the book');
        else { S.carry.push(k.id); S.cd[k.id] = k.cd; }
        renderSkills();
      };
      br.appendChild(c);
      if(lv < B.SKILL_LV_MAX){
        const b = document.createElement('button');
        b.className = 'mini' + (S.scroll >= up ? ' go' : ' dim');
        b.textContent = up + ' \u25b2';
        b.onclick = () => {
          if(S.scroll < up){ toast('Not enough scrolls'); return; }
          S.scroll -= up; S.skillLv[k.id]++; renderSkills();
        };
        br.appendChild(b);
      }
    }
    w.appendChild(d);
  }
}

// Which contests have their notes folded down. Kept out here because the
// Depths redraw on the key timer, and a class on the element is gone the next
// time they do.
const dgnOpen = {};
let cardHintOpen = false;
function renderDgn(){
  const w = $('dgnRows'); w.innerHTML = '';
  const D = derive();
  $('dgnNote').textContent = S.dgnRun ? 'On the stage \u00b7 the round is paused'
    : '';
  const feat = featWager();
  const fb = $('dgnFeat');
  if(fb) fb.innerHTML = '<span class="fn">' + feat.n + '</span>'
    + '<span class="fd">pays ' + B.DGN_FEAT_MULT + '\u00d7 today</span>'
    + '<span class="ft">turns over in ' + hms(featLeft()) + '</span>';
  for(const d of B.DGN){
    const run = S.dgnRun && S.dgnRun.id === d.id ? S.dgnRun : null;
    const keys = S.dgnKeys[d.id] || 0;
    const el = document.createElement('div');
    el.className = 'dgn' + (d.id === feat.id ? ' feat' : '');
    let keyHtml = '';
    for(let i=0;i<entryCap(d);i++) keyHtml += '<span class="key' + (i < keys ? ' on' : '') + '"></span>';
    const nextIn = keys >= entryCap(d) ? 'full' : hms(keyInterval(d) - (S.dgnKeyT[d.id]||0));

    // what your bag is actually bringing to this particular contest
    // A best is only a best in the units the contest is played in. All four
    // reported the same scoring floor, which is how four different games came
    // to look like one game with four hats on.
    const bv = S.dgnBest ? (S.dgnBest[d.id] || 0) : 0;
    const best = d.mode === 'drive'  ? 'longest ' + (bv > 0 ? fmt(bv) : '\u2014')
               : d.mode === 'island' ? 'best run ' + bv + '\u00a0green' + (bv === 1 ? '' : 's')
               : d.mode === 'chip'   ? 'best ' + bv + ' of ' + Math.max(B.CHIP_SHOTS, bv) + ' dropped'
               : d.mode === 'scramble' ? 'best ' + bv + ' of ' + B.SCRAMBLE_HOLES + ' holed'
               : d.mode === 'twilight' ? 'best ' + bv + ' dropped'
               :                       'deepest floor ' + (bv + 1);

    let reads;
    if(d.mode === 'drive') reads = 'Best swing about ' + fmt(D.pow * D.cpw * (1 + D.mst*B.MST_DMG));
    else if(d.mode === 'island') reads = 'Greens ' + Math.round(islandChance(D, 0)*100)
      + '% \u2192 ' + Math.round(islandChance(D, 4)*100)
      + '% \u2192 ' + Math.round(islandChance(D, 9)*100) + '% by the tenth';
    else if(d.mode === 'chip') reads = Math.round(chipChance(D)*100) + '% of chips drop';
    else if(d.mode === 'scramble'){
      const b = scrambleBalls(D);
      reads = (1 + b.fl + b.fr).toFixed(1) + ' balls a hole \u00b7 ' + Math.round(scrambleChance(D)*100) + '% of holes won';
    }
    else if(d.mode === 'twilight') reads = 'A putt every ' + twilightGap(D).toFixed(1) + 's \u00b7 '
      + twilightPutts(D, d.run * (D.C.sharp ? 1.4 : 1)) + ' before dark';
    else reads = 'Carry ' + fmt(D.dps) + '/sec';
    const P = dgnPayout(d, D);
    // the one note that helps a choice: how often the bank you picked is reached
    if(d.mode === 'island') reads += ' \u00b7 ' + P.note;

    el.innerHTML = '<div class="dh">' + svgIcon(d.ic || STAT_IC[d.cur] || 'ball', 'ric') + '<span class="dn">' + d.n + '</span>'
      + (d.id === feat.id ? '<span class="fstar">' + B.DGN_FEAT_MULT + '\u00d7 today</span>' : '')
      + '<span class="keys">' + keyHtml + '</span>'
      + '<button class="qm" aria-label="How it works">?</button></div>'
      + '<div class="dd">' + d.d + '</div>'
      + '<div class="dd fold" style="color:var(--faint);margin-top:4px">' + d.how + '</div>'
      + '<div class="dm">' + reads + '</div>'
      // what one entry pays, in what the currency buys; the basis of the
      // projection is the odds line above it, so it is not said twice
      + '<div class="dm" style="color:var(--brass)">Pays ' + d.cn + ' \u00b7 '
      + (P.buys < 0.1 ? 'under <b>0.1' : 'about <b>' + fmt(P.buys, P.buys < 10 ? undefined : 0)) + '</b>\u00a0'
      + DGN_BUYS[d.cur] + ' an entry</div>'
      + '<div class="dm">' + best.charAt(0).toUpperCase() + best.slice(1) + ' \u00b7 '
      + Math.round(d.run) + 's \u00b7 ' + (nextIn === 'full' ? 'entries full' : 'next entry ' + nextIn) + '</div>'
      + '<div class="bar"><i style="width:' + (run ? clamp(run.t/run.dur,0,1)*100 : 0) + '%"></i></div>'
      + '<div class="btnrow" style="margin-top:8px"></div>';
    el.classList.toggle('open', !!dgnOpen[d.id]);
    el.querySelector('.qm').onclick = e => {
      e.stopPropagation();
      dgnOpen[d.id] = !dgnOpen[d.id];
      el.classList.toggle('open', !!dgnOpen[d.id]);
    };
    const br = el.querySelector('.btnrow');

    // the Island Green is the one with a decision in it, so it gets a dial
    if(d.mode === 'island'){
      const cur = B.BANK_OPTS.includes(S.islandBank) ? S.islandBank : 5;
      const bb = document.createElement('button');
      bb.className = 'mini';
      bb.textContent = 'Bank at ' + cur;
      bb.onclick = () => {
        const i = B.BANK_OPTS.indexOf(cur);
        S.islandBank = B.BANK_OPTS[(i + 1) % B.BANK_OPTS.length];
        renderDgn();
      };
      br.appendChild(bb);
    }
    const b = document.createElement('button');
    if(run){
      b.className = 'mini go';
      b.textContent = run.mode === 'drive' ? 'On the tee \u00b7 drive ' + run.shots + '/' + B.DRIVE_SHOTS
        : run.mode === 'island' ? 'On the stage \u00b7 ' + run.made + ' greens'
        : run.mode === 'chip' || run.mode === 'twilight' ? 'On the stage \u00b7 ' + run.made + ' dropped'
        : run.mode === 'scramble' ? 'On the stage \u00b7 ' + run.made + ' holed'
        : 'On the stage \u00b7 floor ' + (run.floor+1);
    }else{
      b.className = 'mini' + (keys > 0 && !S.dgnRun ? ' go' : ' dim');
      b.textContent = S.dgnRun ? 'One at a time' : keys > 0 ? 'Play it' : 'No entry';
      b.onclick = () => startDgn(d);
    }
    br.appendChild(b);
    w.appendChild(el);
  }
}

// The three figures a climb actually turns on, which the screen has never shown:
// what a second pays after it, whether the holes get any longer, and how far
// ahead of the card your bag already is. Only worked out while the Tour screen
// is the one on show -- it walks seventy two holes twice and finishHole calls
// renderTour on every hole, so off-screen it would be two hundred derives a
// hole for a panel nobody is looking at.
function climbLines(){
  if(view !== 'tour' || S.tier >= B.TIER_MAX) return '';
  const C = climbPreview();
  const lb = (k, v, col) => '<div class="lb"><span class="p"></span><span>' + k + '</span>'
    + '<span class="s"' + (col ? ' style="color:var(' + col + ')"' : '') + '>' + v + '</span></div>';
  const near = x => Math.abs(x - 1) < 0.02;
  const pay = near(C.pay) ? 'unchanged' : '\u00d7' + C.pay.toFixed(2);
  const len = near(C.len) ? 'the same' : '\u00d7' + C.len.toFixed(2) + ' longer';
  // The number is not the answer. The answer is whether to press the button:
  // birdies or better up there, the purse keeping up, or a pay cut.
  const say = C.next.ratio <= 0.77
    ? 'Your bag outdrives this card: birdies or better up there too.'
    : C.pay >= 1
      ? 'Longer holes, but the purse keeps up.'
      : 'A pay cut until your bag catches up.';
  // Said plainly when the button underneath cannot be pressed yet: these are a
  // preview of a climb that is not offered, and reading "as cheap as climbing
  // gets" over a greyed out button is a nudge towards nothing.
  const locked = !cardUnlocked(Math.min(B.TIER_MAX, S.tier + 1));
  return lb((locked ? 'Purse per second if you climb' : 'Purse per second after'), pay,
            near(C.pay) ? '' : C.pay >= 1 ? '--aurora' : '--flag')
    + lb((locked ? 'Hole length if you climb' : 'Hole length after'), len,
         near(C.len) ? '' : '--brass')
    + '<div class="hint">' + (locked ? 'When it unlocks: ' : '') + say + '</div>';
}

/* ---- legacy ---- */
// What a retirement is worth, what would make it worth more, and what the
// result buys. The figure used to appear in one place -- the +N on the button,
// and only once the first event was in the book -- so the actual decision,
// one more Tour Card against signing now, could not be read off the screen.
function legacyBuys(P){
  if(P.left <= 0) return 'every trophy is already on the shelf';
  const more = P.after - P.held;
  if(more > 0) return more + (more === 1 ? ' more trophy' : ' more trophies') + ' out of the room';
  return fmt(discoveryGap(S.legacy + P.now)) + ' short of the next trophy';
}
function renderLegacy(){
  const P = legacyPreview(), gain = P.ready ? P.now : 0;
  $('legNote').textContent = fmt(S.legacy) + ' legacy held';
  const lb = (k, v, col) => '<div class="lb"><span class="p"></span><span>' + k + '</span>'
    + '<span class="s"' + (col ? ' style="color:var(' + col + ')"' : '') + '>' + v + '</span></div>';
  const capped = S.tier >= B.TIER_MAX;
  $('legBox').innerHTML = '<div class="hint">Resets purse and Range. Keeps bag, shots and currencies.</div>'
    + lb('Legacy on the card', fmt(P.now), '--brass')
    + lb('One more Tour Card', capped ? '\u2014' : '+' + fmt(P.card))
    + lb('One more cup', '+' + fmt(P.cup))
    + lb('It buys', legacyBuys(P))
    + (P.ready
      ? '<div class="row"><div><div class="nm">Sign the Card</div>'
        + '<div class="ds">Tour Card ' + roman(S.tier) + ' with ' + S.cups + ' cups banked.</div></div>'
        + '<button class="buy ok" id="retireBtn"><span class="lbl">Retire</span><span class="amt">+'
        + fmt(gain) + '</span></button></div>'
      : '<div class="empty">Opens after your first event \u00b7 '
        + holesPlayed(S.hole) + ' of ' + (B.ROUND*B.DAYS) + '\u00a0holes</div>');
  if(gain > 0) $('retireBtn').onclick = () => showSheet(
    '<h3>Sign the Card?</h3><p>Bank <b>' + fmt(gain) + '</b> legacy and restart on Card '
    + roman(retireCard()) + '.</p><p>' + legacyBuys(P).charAt(0).toUpperCase()
    + legacyBuys(P).slice(1) + '.</p>'
    + '<p>Wait a card: +' + fmt(P.card) + ' \u00b7 wait a cup: +' + fmt(P.cup) + '</p>'
    + '<button class="act" onclick="hideSheet();retire()">Retire</button>'
    + '<button class="act ghost" onclick="hideSheet()">Keep playing</button>');

  // The Trophy Room
  const dc = discoverCost(), n = trophiesFound(), tot = B.TROPHY.length;
  $('relicNote').textContent = n + ' / ' + tot + ' found';
  const rows = $('relicRows');
  rows.innerHTML = '<div class="row">' + svgIcon('trophy', 'ric', BRASS)
    + '<div><div class="nm">Discover a Trophy</div>'
    + '<div class="ds">' + (n >= tot ? 'Every trophy is on the shelf.'
        : 'Gold ones are rarest.') + '</div>'
    + '<div class="mt">Found <i>' + n + '</i> of ' + tot + '</div></div>'
    + '<button class="buy' + (S.legacy >= dc && n < tot ? ' ok' : ' no') + '" id="discBtn">'
    + '<span class="lbl">Discover</span><span class="amt">' + (n >= tot ? '\u2014' : fmt(dc)) + '</span></button></div>';
  if(n < tot) $('discBtn').onclick = () => discover();

  const order = { S:0, A:1, B:2 };
  const mine = B.TROPHY.filter(t => found(t.id))
    .sort((a,b) => order[a.t] - order[b.t] || a.n.localeCompare(b.n));
  if(!mine.length){
    rows.insertAdjacentHTML('beforeend',
      '<div class="empty">Nothing on the shelves yet.</div>');
  }
  for(const t of mine){
    const lv = S.relic[t.id] || 0, c2 = upgradeCost(t), tier = B.TR_TIER[t.t];
    const col = cssVar(tier.v);
    // every figure goes through fmt, and anything the game clamps is shown
    // clamped: a trophy that reads +5.05 into a stat that stops at 1.00 is a lie
    const M = t.g;
    let eff;
    if(M) eff = '\u00d7' + fmt(Math.pow(M, lv));
    else if(t.k === '@sun') eff = '+' + fmt(lv*B.SUN_ADD*100) + 'pp';
    else if(t.k === '@ember') eff = '+' + fmt(lv*B.EMBER_ADD*100) + 'pp';
    else if(t.k === '@chrono') eff = 'retire onto Card ' + roman(Math.min(B.TIER_MAX, lv)) + ' or higher';
    else if(t.k === '@vault'){ const kp = Math.min(500, lv*B.VAULT_UPG);
      eff = fmt(kp, 0) + ' levels kept' + (kp >= 500 ? ' (all)' : ''); }
    else if(t.k === '@rift'){ const w = Math.max(B.RIFT_MIN_WAIT, Math.pow(B.RIFT_REGEN, lv));
      eff = '\u2212' + Math.round((1-w)*100) + '% wait' + (w <= B.RIFT_MIN_WAIT ? ' (max)' : ''); }
    else if(t.k === '@seed') eff = 'start with ' + Math.min(6, lv) + ' cards of purse'
      + (lv >= 6 ? ' (max)' : '');
    else eff = '\u2014';
    const capped = lv >= B.TR_MAX;

    const d = rowShell(idIcon(TROPHY_IC, t.id, t.k, 'ric', col));
    d.style.borderLeft = '2px solid ' + col;
    const body = d.children[1];
    body.children[0].innerHTML = t.n
      + ' <span class="pill" style="border-color:' + col + ';color:' + col + '">' + tier.n + '</span>';
    body.children[1].textContent = t.d;
    body.children[2].innerHTML = 'Lv <i>' + lv + '</i>'
      + (capped ? '/' + B.TR_MAX : '') + ' \u00b7 <b>' + eff + '</b>';
    const btn = d.children[2];
    btn.className = 'buy' + (capped ? ' max' : S.legacy >= c2 ? ' ok' : ' no');
    btn.children[0].textContent = capped ? 'Capped' : 'Raise';
    btn.children[1].textContent = capped ? '\u2014' : fmt(c2);
    btn.onclick = () => upgradeTrophy(t.id);
    rows.appendChild(d);
  }
}

/* ---- tabs + full render ---- */
let bagSub = 'gear';
// The shot book and the trophy room no longer have tabs of their own, so the
// old names route to where they live now. Anything that used to ask for them
// by name still lands in the right place.
function setView(v){
  if(v === 'skl'){ bagSub = 'shots'; v = 'bag'; }
  if(v === 'leg'){ careerSub = 'leg'; v = 'career'; }
  view = v;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.v === v));
  document.querySelectorAll('.view').forEach(e => e.classList.toggle('on', e.id === 'v-' + v));
  if(v === 'bag'){ renderBag(); renderSkillsTab(); }
  if(v === 'dgn') renderDgn();
  // Looking at it is what clears the flash on the tab.
  if(v === 'tour'){ S.cardSeen = S.tierMax || 0; renderTour(); renderTourTab(); }
  if(v === 'career'){ renderLegacy(); renderCareer(); }
  $('panel').scrollTop = 0;
}
// Gear or shots: both are what you carry onto the hole.
function renderBagNav(){
  const subs = [['gear','Gear'], ['shots','Shots']];
  const n = $('bagNav');
  if(!n) return;
  n.innerHTML = subs.map(([id, t]) =>
    '<button class="sub' + (bagSub === id ? ' on' : '') + '" data-s="' + id + '">' + t + '</button>').join('');
  n.querySelectorAll('.sub').forEach(b =>
    b.onclick = () => { bagSub = b.dataset.s; renderBagNav(); $('panel').scrollTop = 0; });
  $('bagGear').hidden  = bagSub !== 'gear';
  $('bagShots').hidden = bagSub !== 'shots';
}
function renderAll(){
  renderCard(); renderVitals(); refreshUpg(); renderBag(); renderSkills();
  renderDgn(); renderTour(); renderLegacy(); renderCareer(); renderSkillsTab();
}

  upg(n){ B.UPG.forEach(u => S.upg[u.id] = Math.min(capOf(u), (S.upg[u.id]||0) + n)); this.re(); },
  maxCapped(){ B.UPG.forEach(u => { if(u.cap) S.upg[u.id] = capOf(u); }); this.re(); },

  enhAll(){ B.SLOTS.forEach(sl => { const it = S.equip[sl.id]; if(it) it.enh = B.ENH_MAX; }); this.re(); },
  clearBag(){ S.bag = []; this.re(); },

  named(id){ B.SLOTS.forEach(sl => { const it = makeItem(S.tier, 0, 2, sl.id);

  ball(el){ const it = S.equip.ball || makeItem(S.tier, 0, 3, 'ball');
            it.el = el; S.equip.ball = it; this.re(); },
  skills(){ B.SKILL.forEach(k => { if(!S.skillLv[k.id]) S.skillLv[k.id] = 1; }); this.re(); },
  skillMax(){ B.SKILL.forEach(k => S.skillLv[k.id] = B.SKILL_LV_MAX); this.re(); },
  nocd(){ B.SKILL.forEach(k => S.cd[k.id] = 0); this.re(); },
  fire(){ const D = derive(); S.carry.forEach(id => { const d = skillDef(id); if(d && S.skillLv[id]) fireSkill(d, D); });
          hideSheet(); },
  lv(n){ for(let i=0;i<n && !atMax();i++) addXp(xpNeed(S.lv) - S.xp + 1); this.re(); },
  para(n){ if(!atMax()) this.lv(60); for(let i=0;i<n;i++) addXp(paraNeed(S.para) - S.paraXp + 1); this.re(); },
  career0(){ S.lv=1; S.xp=0; S.para=0; S.paraXp=0; S.talPts=0; S.statPts=0;
    B.STATS.forEach(s=>S.stat[s.id]=0); B.TREES.forEach(t=>t.t.forEach(x=>S.tal[x.id]=0));
    B.PARAGON.forEach(c=>{ S.paraPts[c.id]=0; c.a.forEach(a=>S.paraSpent[c.id+'.'+a.id]=0); });
    this.re(); },
  tick(n){ S.tickets = Math.min(B.TICK_CAP, (S.tickets||0) + n); this.re(); },
  perks(){ B.PERKS.forEach(p => { if(p.dur) S.perkOn[p.id] = p.dur; }); this.re(); },
  perks0(){ S.perkOn = {}; this.re(); },
  ach(){ B.ACH.forEach(a => S.achDone[a.id] = 1); this.re(); },
  ach0(){ S.achDone = {}; S.achRep = {}; this.re(); },
  style(){ B.OUTFITS.forEach(o => S.styleOwn['o:' + o.id] = 1); B.TRAILS.forEach(t => S.styleOwn['t:' + t.id] = 1);
           this.re(); },
  style0(){ S.styleOwn = {}; S.outfit = 'classic'; S.trail = 'plain'; buildSprites(); this.re(); },
  // today's challenges done the honest way: the counter is moved back so the
  // target is met, and the normal check pays it
  daily(n){ dailyTick(); const Dy = S.daily; let k = 0;
    Dy.picks.forEach((id, i) => { const c = dailyDef(id);
      if(c && !Dy.done[i] && k < n){ Dy.base[c.m] = achMetric(c.m) - c.v; k++; } });
    checkAch(); this.re(); },
  streak(){ const day = dayNow();
    if(S.dailyLastAll !== day){ S.dailyStreak = dailyStreak() + 1; S.dailyLastAll = day - 1; }
    else S.dailyStreak = (S.dailyStreak || 0) + 1;
    this.re(); },
  streak0(){ S.dailyStreak = 0; delete S.dailyLastAll; this.re(); },
  legacy(n){ S.legacy += n; this.re(); },
  relics(n){ B.TROPHY.forEach(r => { if((S.relic[r.id]||0) > 0)

  relics0(){ B.TROPHY.forEach(r => S.relic[r.id] = 0); this.re(); },
  disc(n){ const pool = B.TROPHY.filter(t => !found(t.id));
    for(let i = 0; i < n && i < pool.length; i++) S.relic[pool[i].id] = 1; this.re(); },
  cups(n){ S.cups += n; this.re(); },

  skip(){ S.scores[holeInRound(S.hole)-1] = { d:0, n:'Par', par:parOf(S.hole) };

/* =========================================================================
   THE LOOP
   ========================================================================= */
function step(dt, D){
  // These run on wall time wherever you are: buff timers, perk timers, keys
  // coming back, the income meter.
  for(const k in S.buff){
    S.buff[k].t -= dt;
    if(S.buff[k].t <= 0) delete S.buff[k];
  }
  tickPerks(dt);
  tickShop(dt);
  regenKeys(dt);
  Meter.tick(dt);

  // You cannot be on the course and down a hole at the same time. While a run
  // is out the round stops dead: no swings, no clock, no purse. That is the
  // cost of going down there, and it is why the Depths pay what they pay.
  if(S.dgnRun){ tickDgn(dt, D); return; }

  S.elapsed += dt;
  autoCast(D, dt);

  if(S.burnT > 0){
    const d = Math.min(dt, S.burnT);
    damage(S.burn * d, D, true); S.burnT -= d;
  }

  S.swingT += D.spd * dt;
  const n = Math.floor(S.swingT);
  if(n > 0){ S.swingT -= n; doSwings(n, D); }

  if(S.yards <= 0 && S.elapsed >= (S.walkMin || B.WALK_MIN)) finishHole(D);
}

let last = 0, slowT = 0, saveT = 0;
let frameErr = 0;
function frame(now){
  try{ frameBody(now); }
  catch(e){
    // One bad frame used to kill the loop outright: no redraw, no input, black
    // screen. Now it reports once and keeps running.
    if(!frameErr){
      frameErr = 1;
      console.error(e);
      toast('Something went wrong \u00b7 the game carried on');
    }
  }
  requestAnimationFrame(frame);
}
function frameBody(now){
  now /= 1000;
  if(!last) last = now;
  const dt = Math.min(B.TICK_MAX, Math.max(0, now - last));
  last = now;

  const D = derive();
  step(dt, D);
  // No point painting the hole while the menu is over it. The sim runs on
  // regardless; only the drawing stops.
  if(!$('app').classList.contains('big') || (SIDEWAYS && SIDEWAYS.matches)) Scene.draw(dt, D);
  Sfx.tick(dt);
  renderLive();

  slowT += dt;
  if(slowT >= 0.22){
    slowT = 0;
    renderVitals();
    checkAch();
    if(!$('veil').classList.contains('on')) homeTip();
    if(view === 'upg') refreshUpg();
    else if(view === 'dgn') renderDgn();
    else if(view === 'bag' && bagSub === 'shots' && S.carry.length) renderSkills();
  }
  saveT += dt;
  if(saveT >= 12){ saveT = 0; save(); }
}

// A save as a code: the JSON, deflated where the browser can, then base64.
// "MM1z." marks a deflated code and "MM1." a plain one, so a code made on a
// browser without compression still loads everywhere.
const b64 = bytes => { let t = ''; for(let i = 0; i < bytes.length; i += 0x8000)
  t += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(t); };
const unb64 = txt => Uint8Array.from(atob(txt), c => c.charCodeAt(0));
async function saveCode(){
  S.t = Date.now()/1000;
  const raw = new TextEncoder().encode(JSON.stringify(S));
  if(window.CompressionStream){
    try{
      const z = new Uint8Array(await new Response(new Blob([raw]).stream()
        .pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());
      return 'MM1z.' + b64(z);
    }catch(e){}
  }
  return 'MM1.' + b64(raw);
}
async function readCode(code){
  code = String(code || '').replace(/\s+/g, '');
  let bytes;
  if(code.indexOf('MM1z.') === 0){
    if(!window.DecompressionStream) throw new Error('This browser cannot read that code');
    bytes = new Uint8Array(await new Response(new Blob([unb64(code.slice(5))]).stream()
      .pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  }else if(code.indexOf('MM1.') === 0) bytes = unb64(code.slice(4));
  else throw new Error('That is not a save code');
  const o = JSON.parse(new TextDecoder().decode(bytes));
  if(!o || typeof o.ver !== 'number') throw new Error('That code has no save in it');
  return o;
}
async function exportSheet(){
  save();
  const code = await saveCode();
  showSheet('<h3>Back Up Your Save</h3>'
    + '<textarea id="saveCode" readonly>' + code + '</textarea>'
    + '<div class="setbtns"><button class="mini go" id="copyCode">Copy</button>'
    + '<button class="mini" id="fileCode">Save as file</button></div>'
    + '<button class="act ghost" onclick="settingsSheet()">Back</button>');
  $('saveCode').onclick = e => e.target.select();
  $('copyCode').onclick = async () => {
    try{ await navigator.clipboard.writeText(code); toast('Save code copied'); }
    catch(e){ $('saveCode').select(); toast('Select the code and copy it'); }
  };
  $('fileCode').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([code], { type: 'text/plain' }));
    a.download = 'mythic-mulligan-save.txt';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  };
}
function importSheet(){
  showSheet('<h3>Load a Save</h3>'
    + '<textarea id="saveCode" placeholder="Paste a save code"></textarea>'
    + '<div class="setbtns"><button class="mini go" id="loadCode">Load</button></div>'
    + '<button class="act ghost" onclick="settingsSheet()">Back</button>');
  $('loadCode').onclick = async () => {
    let o;
    try{ o = await readCode($('saveCode').value); }
    catch(e){ toast(e.message || 'That code would not load'); return; }
    showSheet('<h3>Replace This Save?</h3><p>Level ' + (o.lv || 1) + ' · Tour Card '
      + roman(o.tier || 0) + ' · ' + fmt(o.gold || 0) + ' purse</p>'
      + '<button class="act danger" id="doImport">Load it</button>'
      + '<button class="act ghost" onclick="settingsSheet()">Cancel</button>');
    $('doImport').onclick = () => loadSaveObject(o);
  };
}
// Swapped in the way an erase rebuilds, and the save it replaces is kept
// aside first, so a wrong code is one step from undone.
function loadSaveObject(o){
  try{ localStorage.setItem(KEY + ':before-import', JSON.stringify(S)); }catch(e){}
  Object.keys(S).forEach(k => delete S[k]);
  Object.assign(S, defaultState(), o);
  initState(); migrate();
  fixHoles(o);                      // a code from before holes were fixed moves once, like a load
  S.t = Date.now()/1000;            // a code carries no away time with it
  S.dgnRun = null; S.buff = {};
  Scene.dFloor = -1; Scene.skyKey = null; Scene.dBgKey = null;
  Meter.buf.length = 0; Meter.acc = 0;
  if(!S.nine || S.nine.idx !== nineIndex(S.hole)) startNine();
  startHole();
  buildCard(); buildUpg(); renderAll(); setView('upg');
  save();
  hideSheet();
  toast('Save loaded');
}

// Safari clears script storage for a site not visited in seven days unless it
// is on the Home Screen. Asking for persistent storage is free where it is
// honoured; the tip is shown once, after a real session rather than at the door.
function homeTip(){
  if(S.homeTip || !isIOS() || isStandalone() || (S.totalHoles || 0) < 90) return;
  S.homeTip = 1;
  showSheet('<h3>Keep Your Save Safe</h3>'
    + '<p>Safari clears a website’s save after 7 days away. Added to the Home Screen, '
    + 'the game keeps it for good.</p><p>Tap <b>Share</b>, then <b>Add to Home Screen</b>.</p>'
    + '<button class="act" onclick="hideSheet()">Got it</button>');
}

function wipe(){
  showSheet('<h3>Erase the Save?</h3><p>Everything goes. This cannot be undone.</p>'
    + '<button class="act danger" onclick="reallyWipe()">Erase everything</button>'
    + '<button class="act ghost" onclick="hideSheet()">Cancel</button>');
}
function reallyWipe(){
  WIPED = true;
  // the backup too, or the next boot restores the save you just erased
  try{ localStorage.removeItem(KEY); localStorage.removeItem(BAK); }catch(e){}
  // Rebuilt in place rather than reloaded: a reload in an embedded browser is
  // not guaranteed, and the old path relied on one.
  Object.keys(S).forEach(k => delete S[k]);
  Object.assign(S, defaultState());
  initState(); migrate();
  Scene.dFloor = -1; Scene.skyKey = null; Scene.dBgKey = null;
  S.dgnRun = null; S.perkOn = {}; S.buff = {};
  Meter.buf.length = 0; Meter.acc = 0;
  WIPED = false;
  startHole();
  buildCard(); buildUpg(); renderAll(); setView('upg');
  hideSheet();
  toast('Save erased. Back to the first tee.');
}
// The browser stops the frame loop while the game is out of sight, and the
// first frame back clamps its step to TICK_MAX -- so ten minutes in another app
// used to be worth a quarter of a second, and the away card only ever turned up
// if the phone happened to throw the page away and reload it. A return now
// credits what a reload would have.
function catchUp(){
  const away = Math.max(0, Date.now()/1000 - (S.t || Date.now()/1000));
  last = 0;
  if(away >= 60){ offline(); return; }
  // Under a minute the away card is not worth raising: the round just carries
  // on from where it was, at full pace, as though it had never stopped.
  Sfx.hold++;
  try{ for(let t = away; t > 1e-6; t -= B.TICK_MAX) step(Math.min(B.TICK_MAX, t), derive()); }
  finally{ Sfx.hold--; }
  S.t = Date.now()/1000;
}
// The page carried no icon at all, so the tab showed the browser's blank page
// and a home screen shortcut on a phone was a screenshot of whatever was on
// the stage. Drawn here in the game's own pixel style: a dusk sky and a mythic
// moon, the gold flag, and a shot arcing in to finish beside the cup. Painted
// on a 36 pixel grid and blown up to the home screen's 180 at exactly 5x, so
// every pixel lands square; the 32 pixel tab icon is too small for a whole
// multiple and is smoothed down instead.
function drawIconArt(c){  // a 36 x 36 pixel grid
  const G = 36;
  const px = (x, y, col) => { c.fillStyle = col; c.fillRect(x, y, 1, 1); };
  const rect = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(x, y, w, h); };
  // dusk sky, banded with a checker dither between bands
  const sky = ['#0B1030', '#141640', '#221A4E', '#352058', '#4C275E', '#6A3160', '#8E4462'];
  const bandH = 3;
  for(let y = 0; y < 24; y++){
    const b = Math.min(sky.length - 1, Math.floor(y / bandH));
    for(let x = 0; x < G; x++){
      const edge = (y % bandH === bandH - 1) && b + 1 < sky.length && ((x + y) & 1);
      px(x, y, edge ? sky[b + 1] : sky[b]);
    }
  }
  // stars
  for(const [x, y, col] of [[3,3,'#DFE9DC'],[9,6,'#9FA7D8'],[15,2,'#DFE9DC'],[6,11,'#9FA7D8'],[31,18,'#9FA7D8'],[2,16,'#9FA7D8'],[13,9,'#6F76B0']]) px(x, y, col);
  // the moon, with a soft ring
  const mx = 26.5, my = 8.5;
  for(let y = 0; y < 20; y++) for(let x = 14; x < G; x++){
    const d = Math.hypot(x + 0.5 - mx, y + 0.5 - my);
    if(d <= 6.2) px(x, y, (Math.hypot(x + 0.5 - (mx - 2), y + 0.5 - (my - 2)) > 6.4) ? '#D8BE7E' : '#F4E3AE');
    else if(d <= 7.3 && ((x + y) & 1)) px(x, y, '#5A3A72');
  }
  // moon craters
  for(const [x, y] of [[28,6],[24,10],[29,11],[27,12]]) px(x, y, '#E6CC8E');
  // far ridge of pines
  const ridge = [21,20,21,19,20,21,20,18,19,20,21,20,19,17,18,19,20,21,20,19,20,18,19,20,21,20,19,18,19,20,21,20,19,20,21,20];
  for(let x = 0; x < G; x++){
    rect(x, ridge[x], 1, 24 - ridge[x], '#16233A');
    if(x % 3 === 1) rect(x, ridge[x] - 1, 1, 1, '#16233A');
  }
  // near treeline
  const near = [23,22,21,22,23,22,20,21,22,23,23,22,23,23,22,21,22,23,23,22,21,20,21,22,23,22,21,22,23,22,20,21,22,23,22,23];
  for(let x = 0; x < G; x++) rect(x, near[x], 1, 25 - near[x], '#0C1A13');
  // the fairway: rolling ground in mown stripes
  for(let y = 24; y < G; y++) for(let x = 0; x < G; x++){
    const roll = Math.round(Math.sin((x + 3) / 6) * 0.9);
    if(y + roll < 24) continue;
    const stripe = Math.floor((x + (y - 24) * 1.4) / 5) & 1;
    px(x, y, stripe ? '#2E6A3A' : '#27603A');
  }
  // the green
  for(let y = 23; y < 31; y++) for(let x = 3; x < 22; x++){
    const d = ((x + 0.5 - 12) / 9) ** 2 + ((y + 0.5 - 27) / 3.4) ** 2;
    if(d <= 1) px(x, y, d > 0.72 ? '#3F8A4B' : '#4C9E55');
  }
  // the cup
  rect(11, 27, 3, 1, '#06100C');
  rect(12, 28, 1, 1, '#06100C');
  // pole and flag
  rect(12, 10, 1, 17, '#DFE9DC');
  rect(12, 10, 1, 1, '#FFFFFF');
  const flag = [[13,10,7],[13,11,6],[13,12,5],[13,13,4],[13,14,2]];
  for(const [x, y, w] of flag) rect(x, y, w, 1, '#E3B457');
  for(const [x, y, w] of flag) rect(x, y, 1, 1, '#B8893A');
  rect(14, 10, 5, 1, '#F2CD78');
  // the shot: one clean arc, faint at the start and bright where it lands
  let last = null;
  for(let x = 34; x >= 17; x--){
    const t = (34 - x) / 17;
    const y = Math.round(31 + (25 - 31) * t - 4 * 10 * t * (1 - t));
    const col = t < 0.35 ? '#5A3A72' : t < 0.7 ? '#8C6BC9' : '#57E0BE';
    px(x, y, col);
    if(last !== null && Math.abs(y - last) > 1)   // no gaps where it climbs steeply
      for(let k = Math.min(y, last) + 1; k < Math.max(y, last); k++) px(x + 1, k, col);
    last = y;
  }
  // the ball, just short of the cup, with a glint
  rect(15, 25, 2, 2, '#FFFFFF');
  px(16, 26, '#C9D3CC');
  px(14, 24, '#F4E3AE'); px(17, 24, '#F4E3AE');
}
function setIcons(){
  const art = document.createElement('canvas'); art.width = art.height = 36;
  const ac = art.getContext('2d'); if(!ac) return;
  drawIconArt(ac);
  for(const [rel, size] of [['icon', 32], ['apple-touch-icon', 180]]){
    const cv = document.createElement('canvas'); cv.width = cv.height = size;
    const c = cv.getContext('2d');
    c.imageSmoothingEnabled = size % 36 !== 0;
    c.drawImage(art, 0, 0, size, size);
    let url = '';
    try{ url = cv.toDataURL('image/png'); }catch(e){}
    if(!url) continue;
    const l = document.createElement('link'); l.rel = rel; l.href = url;
    if(rel === 'icon') l.type = 'image/png';
    document.head.appendChild(l);
  }
}
// Side by side there is no pulled-up menu, only a field and a menu. Coming
// into that layout with the menu pulled up would leave the field showing but
// the frame loop still skipping it -- a frozen picture -- so the flag goes.
const SIDEWAYS = window.matchMedia ? matchMedia('(orientation:landscape) and (max-height:560px)') : null;
function sideways(){
  if(!SIDEWAYS || !SIDEWAYS.matches) return;
  if($('app').classList.contains('big')){
    $('app').classList.remove('big');
    $('drawer').setAttribute('aria-label', 'Expand the menu');
  }
  Scene.resize();
}
// what the phone says about itself, for the developer menu: the top bar's
// spacing depends on all of it and none of it can be seen from here
function screenLine(){
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top);'
    + 'padding-left:env(safe-area-inset-left)';
  document.body.appendChild(probe);
  const cs = getComputedStyle(probe), top = cs.paddingTop, left = cs.paddingLeft;
  probe.remove();
  return 'screen ' + screen.width + 'x' + screen.height + '  ·  view ' + innerWidth + 'x' + innerHeight
    + '  ·  inset ' + top + '/' + left + '  ·  ' + (isStandalone() ? 'home screen' : 'browser')
    + '  ·  top ' + (getComputedStyle(document.documentElement).getPropertyValue('--topPad') || 'default');
}
// Home Screen apps only. The status bar is solid ("black", not
// "black-translucent"): on iOS 26 the see-through one lays a blur over the top
// of the page and leaves the window a status bar short, a black band along the
// bottom that nothing in the page can paint (WebKit bug 301108). With a solid
// bar the page starts below it, so the top bar needs no room for the frost the
// browser puts there, only whatever inset the phone still reports.
function fitTop(){
  const r = document.documentElement;
  if(!isStandalone()){ r.style.removeProperty('--topPad'); return; }
  r.style.setProperty('--topPad', 'calc(env(safe-area-inset-top) + 6px)');
}
function intro(){
  showSheet('<h3>Mythic Mulligan</h3>'
    + '<p>The golf plays itself. Your job is to make your golfer better.</p>'
    + '<ul><li>Buy upgrades on the Range.</li>'
    + '<li>Beat the clock on each hole for a better score.</li>'
    + '<li>Clubs drop as you play. The best go in your bag.</li></ul>'
    + '<button class="act" onclick="hideSheet()">Play away</button>');
}
function boot(){
  const had = load();
  initState();
  migrate();
  if(S.mult === undefined) S.mult = 1;
  // on for a new golfer: on fixed holes, moving up when you can is the game
  if(S.autoClimb === undefined) S.autoClimb = true;
  fixHoles(had);                    // a save from before holes were fixed moves once

  Scene.init();
  setIcons();
  fitTop();
  window.addEventListener('resize', fitTop);
  // belt to the fixed body's braces: Safari settles a rotation over several
  // frames, so the page is put back at the top on each step of it
  const pin = () => { if(window.scrollX || window.scrollY) window.scrollTo(0, 0);
    document.documentElement.scrollTop = 0; document.body.scrollTop = 0; };
  window.addEventListener('scroll', pin);
  window.addEventListener('resize', pin);
  window.addEventListener('orientationchange', () => [0, 150, 400, 800].forEach(ms => setTimeout(pin, ms)));
  if(window.visualViewport) visualViewport.addEventListener('resize', pin);
  buildCard();
  buildUpg();

  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => setView(t.dataset.v);
    if(t.dataset.v === 'career') careerTab = t;
    if(t.dataset.v === 'tour') tourTab = t;
  });
  $('scrapBtn').onclick = () => {
    const keep = {}, doomed = [];
    S.bag.slice().sort((a,b) => itemScore(b) - itemScore(a)).forEach(it => {
      keep[it.slot] = (keep[it.slot] || 0) + 1;
      if(keep[it.slot] > 2) doomed.push(it);
    });
    if(!doomed.length){ toast('Nothing spare to scrap'); return; }
    let sh = 0;
    doomed.forEach(it => { sh += scrapValue(it); });
    S.bag = S.bag.filter(it => !doomed.includes(it));
    S.shard += sh;
    toast('Scrapped ' + doomed.length + ' for <b>' + sh + '</b> ' + plural(sh, 'shards'));
    renderBag();
  };
  $('xpStrip').onclick = () => setView('career');
  $('drawerIc').src = pixUrl('caret', '#E3B457');
  $('sovIcon').src = pixUrl('sov2', '#E3B457');
  $('drawer').onclick = () => {
    const big = $('app').classList.toggle('big');
    $('drawer').setAttribute('aria-label', big ? 'Shrink the menu' : 'Expand the menu');
    // the canvas has no box while it is away, so let it keep the one it had
    if(!big) Scene.resize();
  };
  $('veil').onclick = e => { if(e.target === $('veil')) hideSheet(); };
  // The dev menu writes straight to state with no cost, no gate and no undo,
  // and it used to open on a single tap of the most prominent text on screen.
  // One mis-tap on the course name and a save is finished. Held open instead:
  // a second and a half, cancelled by lifting or by moving a finger, so it
  // cannot happen by accident and no tap ever reaches it.
  (() => {
    const el = $('eventLine');
    let timer = null, sx = 0, sy = 0;
    const stop = () => { if(timer){ clearTimeout(timer); timer = null; } };
    el.addEventListener('pointerdown', e => {
      sx = e.clientX; sy = e.clientY;
      stop();
      timer = setTimeout(() => { timer = null; DEV.open(); }, 1500);
    });
    el.addEventListener('pointermove', e => {
      if(timer && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) stop();
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => el.addEventListener(ev, stop));
    el.addEventListener('contextmenu', e => e.preventDefault());
  })();

  // A reload used to throw away the nine you were halfway through and start
  // the hole you were on again. The nine's counts went back to zero, so "all
  // nine under par" was gone for good the moment a phone reloaded the tab, and
  // Appearance Fee paid out again on every reload. Both are in the save; only
  // the scenery has to be rebuilt.
  if(!S.nine || S.nine.idx !== nineIndex(S.hole)) startNine();
  if(had && S.yardsMax > 0 && isFinite(S.yards) && S.yards <= S.yardsMax) Scene.newHole(S.hole, S.tier);
  else startHole();
  renderAll();
  setView('upg');

  if(had) offline(); else intro();
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  document.addEventListener('pointerdown', () => Sfx.unlock(), { passive: true });

  if(SIDEWAYS){
    if(SIDEWAYS.addEventListener) SIDEWAYS.addEventListener('change', sideways);
    else if(SIDEWAYS.addListener) SIDEWAYS.addListener(sideways);
    sideways();
  }
  document.addEventListener('visibilitychange', () => {
    if(document.hidden) save(); else catchUp();
  });
  window.addEventListener('pagehide', save);
  requestAnimationFrame(frame);
}
boot();
</script>
</body>
</html>
