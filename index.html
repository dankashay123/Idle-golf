<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1811">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Mythic Mulligan</title>
<style>
:root{
  --ink:#06100C; --pine:#0C1A13; --panel:#112318; --raise:#17301F; --raise2:#1D3B28;
  --line:#22462F; --line-soft:#1A3524;
  /* --faint was 3.4:1 on the panel and 2.5:1 on a raised button, and it is
     the colour of every caption, unit and inactive tab: hard going on a phone
     in daylight. Lifted to 4.2-5:1 against where text actually sits, and --dim
     moved up the same step so the three shades stay three shades. */
  --chalk:#DFE9DC; --dim:#8BA793; --faint:#6B8874;
  --brass:#E3B457; --brass-dk:#8A6A26;
  --flag:#E4574A; --aurora:#57E0BE; --myth:#C68BFF;

  --r0:#93A69A; --r1:#64D07A; --r2:#4FA3F0; --r3:#B36BF5; --r4:#F0A03C; --r5:#FF5F86;
  --ember:#FF7A3D; --frost:#6FD9F2; --storm:#F2D75E; --verdant:#7ADB86; --void:#A86BF5;

  --disp:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --hair:1px solid var(--line-soft);

  /* One type scale, whole pixels, seven steps. There were eighteen sizes in
     here, several of them half a pixel apart, which no grid can land on and
     nobody can tell apart. */
  --f0:9px;   --f1:10px;  --f2:11px;  --f3:13px;
  --f4:15px;  --f5:20px;  --f6:24px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
/* Safari on an iPhone enlarges text it thinks is too small to read when the
   phone turns sideways, and does not always put it back on the way upright:
   the Range's names and captions came back half again their size. Every size
   here is chosen, so it may not adjust any of them. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* Pinned, not just unscrollable. Turning an iPhone on its side and back left
   the document scrolled by a status bar's height -- overflow:hidden does not
   stop Safari scrolling it -- so the top bar sat under the clock and a black
   band ran along the bottom. A fixed body has nothing to scroll. */
body{position:fixed;inset:0;
  background:var(--ink);color:var(--chalk);font-family:var(--sans);
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:manipulation;
  display:flex;justify-content:center;
}
button{font:inherit;color:inherit;background:none;border:0;touch-action:manipulation;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
#app{width:100%;max-width:660px;height:100%;display:flex;flex-direction:column;
  background:var(--pine);border-left:var(--hair);border-right:var(--hair);position:relative;
  /* A phone on its side puts the Dynamic Island on one edge, over the middle
     of the field: the readout, the nine, the shop button and the start of any
     big word on the stage sat under it. The phone says how wide that edge is;
     this keeps everything off it, and it is zero upright. The variables are
     there so a check can stand in for a phone that has an island. */
  padding-left:var(--sal, env(safe-area-inset-left, 0px));
  padding-right:var(--sar, env(safe-area-inset-right, 0px))}
#crest,#tabs,#card,#xpStrip{flex:0 0 auto}
#stage{flex:0 0 50%;min-height:0}
#panel{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

.eyebrow{font-size:var(--f0);letter-spacing:.2em;text-transform:uppercase;color:var(--faint);font-weight:700}
.mono{font-family:var(--mono)}

/* ---------- crest bar ---------- */
/* In Safari the status bar's inset is not the end of the blur. Newer iPhones frost the
   page behind the status bar and let the frost fade out well past the inset --
   about half as far again -- and the course name and the purse sat right in
   that fade, reading as out of focus on a Pro Max. Scaled off the inset, so a
   phone without one, a desktop, and a phone on its side (inset 0) keep 6px.
   From the Home Screen there is no frost, so fitTop() sets --topPad to the
   inset alone. */
#crest{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;
  padding:var(--topPad, calc(env(safe-area-inset-top) * 1.5 + 6px)) 12px 6px;border-bottom:var(--hair);
  background:linear-gradient(180deg,#0B1811,#0C1A13)}
#eventLine{font-family:var(--disp);font-size:var(--f4);letter-spacing:.02em;line-height:1.1;color:var(--chalk);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#sub{font-size:var(--f0);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-top:2px}
#gold{font-size:var(--f4)}
#purse{text-align:right}
#gold{font-family:var(--mono);font-size:var(--f5);font-weight:600;color:var(--brass);line-height:1}
#rate{font-size:var(--f1);color:var(--dim);margin-top:2px;font-family:var(--mono)}
#sovLine{display:flex;align-items:center;justify-content:flex-end;gap:3px;margin-top:2px;
  font-family:var(--mono);font-size:var(--f1);color:var(--brass)}
#sovIcon{width:12px;height:12px;image-rendering:pixelated;image-rendering:crisp-edges}

/* ---------- experience strip ---------- */
#xpStrip{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;
  width:100%;padding:6px 12px 7px;background:#0A170F;border-bottom:var(--hair);text-align:left}
#xpLv{font-family:var(--mono);font-size:var(--f1);font-weight:600;letter-spacing:.06em;
  color:var(--brass);white-space:nowrap}
#xpStrip.para #xpLv{color:var(--myth)}
#xpTrack{height:4px;border-radius:0;background:#0D1D14;overflow:hidden;position:relative}
#xpFill{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brass),#F3DFA6);
  transition:width .25s ease-out}
#xpStrip.para #xpFill{background:linear-gradient(90deg,#8E4FD0,var(--myth))}
#xpNum{font-family:var(--mono);font-size:var(--f0);color:var(--faint);white-space:nowrap}
/* Points waiting are the only reason to press this, so they get a chip rather
   than another run of small grey text alongside everything else. */
#xpStrip.ready #xpNum{color:var(--brass);border:1px solid var(--brass-dk);
  padding:2px 7px;background:#16120A;font-weight:600;letter-spacing:.04em}

/* ---------- scorecard strip ---------- */
#card{display:grid;grid-template-columns:repeat(18,1fr);background:#0A170F}
.cell{aspect-ratio:1/0.94;border-right:1px solid #14291C;display:flex;align-items:center;
  justify-content:center;position:relative;font-family:var(--mono);font-size:var(--f1);color:var(--faint)}
.cell:last-child{border-right:0}
.cell.now{background:#17301F;color:var(--chalk)}
.cell.now::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--brass)}
.cell b{font-weight:600}
.cell.s-3,.cell.s-4{color:var(--myth)} .cell.s-2{color:var(--brass)}
.cell.s-1{color:var(--aurora)} .cell.s0{color:var(--chalk)}
.cell.s1{color:var(--dim)} .cell.s2,.cell.s3,.cell.s4{color:var(--flag)}
.cell i{position:absolute;top:2px;left:3px;font-size:var(--f0);font-style:normal;color:var(--dim)}
.cell.done i{display:none}

/* the nine: a goal and a running total, so the round has a shape you can see */
#nineBar{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;
  padding:4px 12px 5px;background:#0A170F;border-bottom:var(--hair);
  font-size:var(--f0);letter-spacing:.1em;text-transform:uppercase;font-weight:700}
#nineWhich{color:var(--faint);white-space:nowrap}
#nineGoal{color:var(--dim);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  letter-spacing:.06em;text-transform:none;font-weight:400;font-size:var(--f1)}
#nineGoal b{color:var(--aurora);font-weight:600}
#nineGoal.done{color:var(--aurora)}
#nineScore{font-family:var(--mono);color:var(--brass);white-space:nowrap}

/* the pull tab: a notch on the corner of the menu, and the one thing in the
   layout allowed to sit outside its own box */
#tabs{position:relative}
#drawer{position:absolute;top:-24px;right:10px;width:48px;height:24px;padding:0;
  background:var(--panel);border:var(--hair);border-bottom:0;border-top:2px solid var(--brass);
  z-index:12;display:flex;align-items:center;justify-content:center;
  box-shadow:0 -2px 6px rgba(0,0,0,.45)}
#drawer:active{background:var(--raise)}
/* pulled up, the tab sits over the nine, so the nine gets out of its way */
#app.big #nineBar{padding-right:62px}
#drawer img{width:12px;height:12px;image-rendering:pixelated;image-rendering:crisp-edges;
  transition:transform .16s ease-out}
#app.big #drawer img{transform:scaleY(-1)}
#app.big #stage{display:none}
/* A phone on its side is 360-430px tall. The column gave the field half of
   that and pushed the tabs off the bottom, so the menu could only be reached
   through the pull tab -- not something anyone would guess. With the width to
   spare, the field and the menu sit side by side instead, and the pull tab has
   nothing left to do. */
@media (orientation:landscape) and (max-height:560px){
  #app{max-width:1180px;display:grid;
    grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);
    grid-template-rows:auto auto auto auto minmax(0,1fr);
    grid-template-areas:"crest tabs" "xp panel" "card panel" "nine panel" "stage panel"}
  #crest{grid-area:crest} #xpStrip{grid-area:xp} #card{grid-area:card} #nineBar{grid-area:nine}
  #stage{grid-area:stage} #tabs{grid-area:tabs}
  #panel{grid-area:panel;min-height:0;border-left:var(--hair)}
  #tabs{border-left:var(--hair);align-self:stretch}
  #drawer{display:none}
  #app.big #stage{display:block}
}

/* ---------- stage ---------- */
/* the field takes half the app, and the canvas fills whatever shape that is */
#stage{position:relative;background:#080D0A;border-bottom:var(--hair);overflow:hidden}
#hole{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
/* The old stage HUD is gone, and so are its styles. #hud, .hudrow, .plate,
   #chaosTag, #yardBar and #yardFill all outlived the markup they dressed, and
   #hud had inset:0 on it: it did nothing at all until a new left-hand column
   took the name, inherited right:0 and bottom:0 and stretched itself over the
   whole stage. A rule with nothing under it is not dead weight, it is the name
   waiting for whatever takes it next. test/checks/14-names.js fails on the
   next one. */

/* ---------- vitals ----------
   They sat in a bar of their own between the field and the tabs, on every
   screen. They are the Range's numbers -- what the rungs you buy move -- so
   they live at the top of the Range, and the menu gets their height back. */
#vitals{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:var(--hair);background:#0A170F}
.vital{padding:6px 4px;text-align:center;border-right:1px solid #14291C}
.vital:last-child{border-right:0}
.vital .k{font-size:var(--f0);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.vital .v{font-family:var(--mono);font-size:var(--f3);font-weight:600;margin-top:2px}

/* ---------- tabs ---------- */
#tabs{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:var(--hair);background:#0A170F}
.tab{padding:10px 2px 9px;font-size:var(--f1);letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);font-weight:700;border-right:1px solid #14291C;position:relative}
.tab:last-child{border-right:0}
.tab.on{color:var(--brass);background:var(--panel)}
.tab.on::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--brass)}
.tab .dot{position:absolute;top:5px;right:8px;width:5px;height:5px;border-radius:0;
  background:var(--aurora);display:none}
.tab.alert .dot{display:block}
/* A card you have unlocked and not been to see. The dot says there is
   something; the flash is what makes you look. It stops the moment the Tour
   screen is opened, and it never runs on the tab you are already on. */
@keyframes tabflash{0%,100%{color:var(--faint)}50%{color:var(--brass)}}
.tab.flash{animation:tabflash 1.5s ease-in-out infinite}
.tab.flash.on{animation:none}
@media (prefers-reduced-motion:reduce){.tab.flash{animation:none}}

/* ---------- panel ---------- */
.view{display:none;padding:0 0 calc(env(safe-area-inset-bottom) + 22px)}
.view.on{display:block}
.band{display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:9px 12px 7px;background:#0A170F;border-top:var(--hair);border-bottom:var(--hair);
  position:sticky;top:0;z-index:3}
.band .eyebrow{color:var(--dim)}
.band .note{font-size:var(--f1);color:var(--faint);font-family:var(--mono)}

/* Flex, not a two column grid: rows carry an icon now, and some carry two
   buttons, so the shape is icon / body / action rather than a fixed pair. */
.row{display:flex;gap:9px;align-items:center;
  padding:9px 12px;border-bottom:1px solid #12261A}
.row > div{flex:1;min-width:0}
.row > img,.row > button{flex:0 0 auto}
/* A row of buttons is a div too, and ".row > div{flex:1}" gave it half the row:
   the +1/+10 pair sat mid-row with nothing to its right while the words beside
   it wrapped into two lines. It takes the width its buttons need. */
.row > .btnrow{flex:0 0 auto}
/* Not scoped to .row: the Skills and Perks rows use .sk-row, so scoping these
   left their text completely unstyled and falling back to browser defaults. */
.ric{width:24px;height:24px;flex:0 0 auto;margin-top:1px}
.nm{font-family:var(--disp);font-size:var(--f3);letter-spacing:.01em}
.ds{font-size:var(--f1);color:var(--dim);margin-top:2px;line-height:1.35}
.mt{font-size:var(--f1);color:var(--faint);margin-top:4px;font-family:var(--mono);
  letter-spacing:.02em}
.mt b{color:var(--aurora);font-weight:700}
.mt i{color:var(--chalk);font-style:normal;font-weight:600}
.mt u{color:var(--dim);text-decoration:none}

/* The price on top, what it does underneath, the way a shop till reads. It was
   the other way round and both halves were the same weight, so the one number
   you are actually comparing across twenty rows was the small grey one.
   The spans are re-ordered in CSS rather than in the DOM: half a dozen places
   reach for children[0] and children[1] by index. */
.buy{display:flex;flex-direction:column;min-width:104px;background:var(--raise);
  border:1px solid var(--line);border-radius:0;padding:0;overflow:hidden;text-align:center;line-height:1.2}
.buy .amt{order:1;display:block;font-family:var(--mono);font-size:var(--f3);font-weight:700;
  color:var(--brass);padding:6px 7px 5px}
.buy .lbl{order:2;display:block;font-size:var(--f0);letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);background:rgba(255,255,255,.03);border-top:1px solid var(--line);padding:4px 7px}
.buy.ok{background:var(--raise2);border-color:var(--brass-dk)}
.buy.ok .amt{color:#FFD98A}
.buy.ok .lbl{color:var(--chalk);background:rgba(227,180,87,.13);border-top-color:var(--brass-dk)}
.buy:disabled,.buy.no{opacity:.4}
.buy.max{background:#12241A;border-color:var(--line-soft)}
.buy.max .amt{color:var(--faint)}

.pill{display:inline-block;font-size:var(--f0);letter-spacing:.1em;text-transform:uppercase;
  padding:2px 6px;border-radius:0;border:1px solid var(--line);color:var(--dim)}

/* ---------- multiplier switch ---------- */
#multBar{display:flex;gap:6px}
.mbtn{font-family:var(--mono);font-size:var(--f2);padding:3px 9px;min-height:24px;border:1px solid var(--line);
  border-radius:0;color:var(--dim)}
.mbtn.on{background:var(--raise2);border-color:var(--brass-dk);color:var(--brass)}

/* ---------- currency strip ---------- */
#purseStrip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#12261A}
.cur{background:#0A170F;padding:7px 6px;text-align:center}
.cur .k{font-size:var(--f0);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.cur .v{font-family:var(--mono);font-size:var(--f3);font-weight:600;margin-top:2px}

/* ---------- gear ---------- */
/* The slot strip is the rack AND the filter: each tile shows what you are
   carrying in that slot and picks the slot the locker below is showing. Two
   jobs in one row, which is why there is no separate grid of equipped gear any
   more and no band headings in the list. */
#bagGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:7px 8px 8px;
  background:var(--panel);border-bottom:1px solid var(--line)}
.slot{position:relative;background:#0D1D14;border:1px solid var(--line);padding:6px 2px;
  min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;border-radius:0}
.slot .sic{width:24px;height:24px}   /* 2x of 12, not 22 */
.slot .sk{font-size:8px;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slot.on{background:#16301F;border-color:var(--brass)}
.slot.on .sk{color:var(--brass)}
.slot.bare .sic{opacity:.3}
.slot .sct{position:absolute;top:0;right:0;min-width:13px;height:13px;line-height:13px;
  background:var(--raise2);border:1px solid var(--line);color:var(--chalk);font-size:8px;
  font-weight:700;text-align:center;padding:0 2px}
.slot .sct.up{background:var(--aurora);border-color:var(--aurora);color:#04150F}
/* top left, out of the way of the label along the bottom */
.slot .sel{position:absolute;top:1px;left:1px;width:9px;height:9px}

/* the locker header: how full it is, and what the tab is showing */
.lkhead{display:flex;align-items:baseline;gap:8px;padding:8px 12px 6px}
.lkhead .lkn{font-family:var(--disp);font-size:var(--f3);color:var(--chalk)}
.lkhead .lkc{margin-left:auto;font-family:var(--mono);font-size:var(--f1);color:var(--faint)}
.lkhead .lkc b{color:var(--brass)}
.lkhead .lkauto{border:1px solid var(--line);border-radius:0;background:transparent;
  color:var(--faint);font-size:var(--f0);letter-spacing:.09em;text-transform:uppercase;
  padding:3px 7px;min-height:24px;cursor:pointer;flex:0 0 auto}
.lkhead .lkauto.on{border-color:var(--brass-dk);color:var(--brass);background:rgba(227,180,87,.09)}

.item{padding:9px 12px;border-bottom:1px solid #12261A;display:grid;
  grid-template-columns:1fr auto;gap:9px;align-items:center;border-left:2px solid transparent}
.item .in{font-family:var(--disp);font-size:var(--f3);letter-spacing:.01em}
.item .ia{font-size:var(--f1);color:var(--dim);margin-top:3px;line-height:1.45;font-family:var(--mono)}
.item .ib{font-size:var(--f0);color:var(--faint);margin-top:2px}
/* a club in the locker: framed art, the rarity said out loud beside the name,
   and one button you can hit without aiming */
/* minmax(0,1fr) and not 1fr. A grid item will not shrink below its own
   min-content unless it is told it may, so a club with a long name pushed the
   middle column to 231px where only 222 was free: the row overran its own
   right padding and squeezed the button down to its min-width, which clipped
   the word UPGRADE in half. The name already knows how to ellipsis; it was
   never being given the chance. */
.item.card2{grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:start}
.item.worn{background:#12241A}
.thumb{position:relative;width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  background:#08130D;border:1px solid var(--line)}
.thumb img{width:36px;height:36px;image-rendering:pixelated;image-rendering:crisp-edges}
.thumb .tel{position:absolute;bottom:-1px;right:-1px;width:13px;height:13px;background:#08130D;
  border:1px solid var(--line);padding:1px}
.irow{display:flex;align-items:baseline;gap:8px}
.irow .in{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irow .irar{flex:0 0 auto;font-size:var(--f0);letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.equipbtn{min-width:88px;padding:9px 6px;border:1px solid var(--brass-dk);background:var(--raise2);
  color:var(--brass);border-radius:0;font-size:var(--f1);letter-spacing:.1em;text-transform:uppercase;
  font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px}
/* flex:0 0 auto or the button squeezes it: measured at 7.8x13 and 8.8x13 in
   the locker, which is a 12x12 drawing rendered two thirds as wide as it is
   tall. The other half of it is that 13 was never a whole multiple of 12. */
.equipbtn img{width:12px;height:12px;flex:0 0 auto;image-rendering:pixelated}
.equipbtn.up{border-color:var(--aurora);color:var(--aurora);background:rgba(87,224,190,.10)}
.equipbtn.worn{border-color:var(--line);color:var(--faint);background:transparent}
.tag{font-size:var(--f0);letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.mini{border:1px solid var(--line);border-radius:0;padding:5px 9px;min-height:24px;font-size:var(--f1);
  letter-spacing:.08em;text-transform:uppercase;color:var(--dim);background:var(--raise)}
.mini.go{border-color:var(--brass-dk);color:var(--brass)}
.mini.dim{opacity:.35}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- skills ---------- */
.sk-row.live{background:#16301F}
.sk-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
  padding:9px 12px;border-bottom:1px solid #12261A}
.glyph{width:34px;height:34px;border-radius:0;background:var(--raise);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:var(--f4);
  color:var(--aurora);position:relative;overflow:hidden}
.glyph .cd{position:absolute;left:0;bottom:0;width:100%;background:rgba(87,224,190,.18)}
.glyph.eq{border-color:var(--aurora)}
.glyph.lock{color:var(--faint);border-style:dashed}

/* ---------- dungeons ---------- */
.featbar{display:flex;align-items:baseline;gap:8px;padding:7px 12px;
  border-bottom:1px solid #12261A;background:rgba(227,180,87,.06);
  border-left:2px solid var(--brass-dk)}
.featbar .fn{font-family:var(--disp);font-size:var(--f2);color:var(--brass)}
.featbar .fd{font-size:var(--f1);color:var(--dim)}
.featbar .ft{margin-left:auto;font-family:var(--mono);font-size:var(--f1);color:var(--faint)}
.dgn.feat{background:rgba(227,180,87,.05);border-left:2px solid var(--brass-dk)}
.dgn .fstar{font-family:var(--mono);font-size:var(--f0);letter-spacing:.1em;
  text-transform:uppercase;color:#0C1A12;background:var(--brass);padding:1px 5px;white-space:nowrap}
.dgn{padding:10px 12px;border-bottom:1px solid #12261A}
.dgn .dh{display:flex;align-items:center;gap:7px}
.dgn .dn{flex:1}
.dgn .keys{flex:0 0 auto}
.dgn .dn{font-family:var(--disp);font-size:var(--f4);letter-spacing:.01em}
.dgn .dd{font-size:var(--f1);color:var(--dim);margin-top:3px;line-height:1.4}
.dgn .dm{font-size:var(--f1);color:var(--faint);margin-top:5px;font-family:var(--mono)}
.bar{height:4px;background:#0D1D14;border-radius:0;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--aurora);width:0}
.keys{display:flex;gap:3px;align-items:center}
.key{width:7px;height:7px;border-radius:0;border:1px solid var(--line)}
.key.on{background:var(--aurora);border-color:var(--aurora)}

/* ---------- leaderboard ---------- */
/* The first column held a place on the made-up leaderboard the card replaced,
   and has been an empty 26px indent on every stat row since. */
.lb{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 12px;font-size:var(--f2);
  border-bottom:1px solid #12261A}
.lb .p{display:none}
.lb .s{font-family:var(--mono);font-weight:600}
/* a repeating honour: no pip column, the name and its step, then progress */
.lb.rep{grid-template-columns:1fr auto;padding:5px 0}
.lb.rep i{font-style:normal;color:var(--dim)}

/* ---------- career ---------- */
#lvBox{padding:11px 12px 12px;background:#0A170F;border-bottom:var(--hair)}
.lvhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lvno{font-family:var(--disp);font-size:var(--f5);letter-spacing:.01em}
.lvxp{font-family:var(--mono);font-size:var(--f1);color:var(--faint)}
#lvBox .bar{margin-top:8px;height:5px}
#bagNav,#careerNav{display:flex;overflow-x:auto;gap:0;background:var(--panel);border-bottom:var(--hair);
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
#bagNav::-webkit-scrollbar,#careerNav::-webkit-scrollbar{display:none}
.sub{flex:0 0 auto;padding:9px 13px;font-size:var(--f1);letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);font-weight:700;white-space:nowrap;border-bottom:2px solid transparent}
.sub.on{color:var(--brass);border-bottom-color:var(--brass)}
#talNav{display:grid;grid-template-columns:repeat(3,1fr);background:#0A170F;
  border-bottom:var(--hair)}
.sub2{padding:9px 4px 8px;font-size:var(--f0);letter-spacing:.04em;color:var(--faint);
  font-weight:700;border-right:1px solid #12261A;border-bottom:2px solid transparent;
  display:flex;align-items:center;justify-content:center;gap:4px}
.sub2:last-child{border-right:0}
.sub2.on{color:var(--brass);border-bottom-color:var(--brass);background:var(--panel)}
.sub2 .tcount{font-family:var(--mono);font-size:var(--f0);color:var(--dim)}
.sub2.on .tcount{color:var(--brass)}
.tier{padding:7px 12px;font-size:var(--f0);letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);background:#0A170F;border-top:1px solid #12261A;border-bottom:1px solid #12261A}
.tier.open{color:var(--aurora)}
.row.locked{opacity:.55}
.hbar{width:44px;height:3px;background:#12261C;border-radius:0;overflow:hidden}
.hbar i{display:block;height:100%;background:var(--brass)}
/* the bar was a flex child like the words beside it, so it took half the row
   and squeezed the text into the other half; it goes underneath instead */
#honSheetRows .row{flex-wrap:wrap}
#honSheetRows .row > .hbar{flex:0 0 100%;width:100%;margin-top:-2px}
.pips{display:inline-flex;gap:3px;vertical-align:-1px;margin-right:5px}
.pip{width:7px;height:7px;border-radius:0;border:1px solid var(--line);display:block}
.pip.on{background:var(--brass);border-color:var(--brass)}

/* ---------- modal ---------- */
#veil{position:absolute;inset:0;background:rgba(4,10,7,.82);display:none;align-items:center;
  justify-content:center;padding:18px;z-index:40;backdrop-filter:blur(2px)}
#veil.on{display:flex}
#sheet{width:100%;max-width:400px;max-height:82%;overflow-y:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:0;padding:16px}
#sheet h3{font-family:var(--disp);font-size:var(--f5);font-weight:600;margin-bottom:8px;letter-spacing:.01em}
#sheet p{font-size:var(--f3);color:var(--dim);line-height:1.55;margin-bottom:9px}
#sheet .big{font-family:var(--mono);font-size:var(--f6);color:var(--brass);font-weight:600;margin:6px 0}
#sheet ul{margin:0 0 10px 15px;font-size:var(--f3);color:var(--dim);line-height:1.6}
.act{width:100%;padding:11px;border-radius:0;border:1px solid var(--brass-dk);background:var(--raise2);
  color:var(--brass);font-size:var(--f2);letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-top:6px}
.act.ghost{border-color:var(--line);color:var(--dim);background:transparent}
.act.danger{border-color:#7A2C25;color:var(--flag)}

/* ---------- icons ---------- */
.ic{display:block;flex:0 0 auto;image-rendering:pixelated;image-rendering:crisp-edges}
.sic{width:12px;height:12px;color:var(--faint)}
.lel{width:12px;height:12px;margin-top:3px}
.cic{width:12px;height:12px;margin:0 auto 3px;color:var(--faint)}
.kic{width:24px;height:24px;position:relative;z-index:2}
.bic{width:24px;height:24px;flex:0 0 auto}
.tic{width:12px;height:12px;display:inline-block;vertical-align:-2px;margin-right:5px}
#setBox .row{grid-template-columns:1fr auto}
.sheethead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.glyph .cd{background:rgba(6,16,12,.55);z-index:3;transition:height .2s linear}

/* ---------- developer ---------- */
.devread{font-family:var(--mono);font-size:var(--f1);line-height:1.75;color:var(--dim);
  background:#0A170F;border:1px solid var(--line);border-radius:0;padding:8px 9px;margin-bottom:12px}
.devrow{margin-bottom:11px}
.devlbl{font-size:var(--f0);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:700}
.devgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:5px}
.devbtn{border:1px solid var(--line);background:var(--raise);border-radius:0;padding:7px 3px;
  font-size:var(--f1);color:var(--chalk);line-height:1.2}
.devbtn:active{background:var(--raise2);border-color:var(--brass-dk);color:var(--brass)}

/* ---------- toast ---------- */
/* Pinned over the sky inside the stage. Anchored to the bottom of the app they
   sat on top of the upgrade rows, which is where you are actually tapping. */
/* The readout, in the same type as the rest of the chrome. Drawn on the canvas
   in the pixel font it was legible but bulky, and it could not match anything
   else on screen. */
#readout{position:relative;min-width:64%;max-width:100%;
  background:rgba(6,12,9,.74);border:1px solid #1B3A2E;border-radius:0;
  padding:4px 7px 5px;backdrop-filter:blur(2px);pointer-events:none}
/* nowrap and a fixed gap meant the hole label and the clock simply ran out of
   the box on a narrow phone -- measured 6px past it at 320. The clock keeps its
   width, the hole label gives way with an ellipsis. */
.rline{display:flex;justify-content:space-between;gap:8px;font-size:var(--f0);letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);font-weight:700;white-space:nowrap}
.rline #rTop{min-width:0;overflow:hidden;text-overflow:ellipsis}
.rline #rTopR{flex:0 0 auto}
.rmain{display:flex;align-items:baseline;gap:3px;margin-top:2px}
#rBig{font-family:var(--mono);font-size:var(--f4);font-weight:600;color:var(--brass);line-height:1}
.ru{font-size:var(--f0);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.rsp{flex:1 1 auto;min-width:8px}
#rTag{font-size:var(--f0);letter-spacing:.12em;text-transform:uppercase;font-weight:700;white-space:nowrap}
.rbar{height:2px;background:#12251C;border-radius:0;margin-top:5px;overflow:hidden}
.rbar i{display:block;height:100%;width:0;background:var(--rc,var(--brass));transition:width .12s linear}
/* The wager strip. One readout template served all four contests, so a drive
   contest and an endurance crawl differed by the words in them and nothing
   else. Each contest fills this with its own shape: six balls on the tee, a
   ladder of greens, a rack of twenty five chips, a flight of floors. */
.rstrip{display:flex;align-items:flex-end;gap:1px;height:10px;margin-top:5px}
/* a class selector beats the user agent rule for [hidden], so without this
   the strip from the last wager stayed on the readout all round */
.rstrip[hidden]{display:none}
/* the milestone an attribute is working toward */
.mile{margin-top:6px;opacity:.72}
.mile.on{opacity:1}
.mbar{height:2px;background:#12251C;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--dim)}
.mile.on .mbar i{background:var(--brass)}
.mtx{font-size:var(--f0);letter-spacing:.02em;color:var(--faint);margin-top:3px}
.mile.on .mtx{color:var(--brass)}
.mtx b{color:var(--chalk)}
.mile.on .mtx b{color:var(--brass)}
.mtx i{font-style:normal;color:var(--dim)}
/* what a club would do if you carried it */
.swap{border:1px solid var(--brass-dk);background:rgba(227,180,87,.05);padding:8px 9px;margin:10px 0 4px}
.swhead{font-size:var(--f0);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  margin-bottom:6px}
.swhead b{color:var(--chalk);letter-spacing:.02em;text-transform:none;font-size:var(--f1)}
.swrow{display:flex;align-items:baseline;gap:6px;font-family:var(--mono);font-size:var(--f1);
  padding:2px 0}
.swk{flex:0 0 46px;color:var(--faint);font-family:var(--sans);font-size:var(--f0);
  letter-spacing:.08em;text-transform:uppercase}
.swa{color:var(--dim)}
.swar{color:var(--faint)}
.swb{font-weight:700}
.swd{margin-left:auto;font-weight:700}
.swset{font-size:var(--f0);margin-top:5px;letter-spacing:.04em}
.swset.ok{color:var(--aurora)}
.swset.no{color:var(--flag)}
/* the away card */
.awgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);margin:4px 0 10px}
/* Three tiles, one of them in a bigger face. Left to flow from the top, the
   big one set the row height and the other two sat above their own middles,
   with the three captions on three different lines. The tile centres its
   content, and the value sits in a box the height of the BIGGEST face, so the
   captions land on one line across all three whatever is in them. */
.awst{background:var(--raise);padding:9px 4px;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.awv{font-family:var(--mono);font-size:var(--f4);font-weight:600;color:var(--chalk);line-height:1;
  min-height:var(--f5);display:flex;align-items:center;justify-content:center}
.awst.big .awv{color:var(--brass);font-size:var(--f5)}
.awk{font-size:var(--f0);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:4px}
.awband{font-size:var(--f0);letter-spacing:.14em;text-transform:uppercase;color:var(--brass);
  margin:12px 0 4px;padding-bottom:3px;border-bottom:1px solid var(--brass-dk)}
.awbest{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-left-width:2px;
  background:var(--raise);padding:8px 9px}
.awbest img{width:28px;height:28px;image-rendering:pixelated;flex:0 0 auto}
.awbn{font-family:var(--disp);font-size:var(--f3);line-height:1.2}
.awbs{font-size:var(--f0);color:var(--faint);margin-top:2px}
/* the pro shop */
.shopnav{display:flex;gap:0;margin:-4px -16px 10px;border-bottom:1px solid var(--line)}
.shopnav button{flex:1 1 0;padding:9px 2px;background:none;border:0;border-bottom:2px solid transparent;
  color:var(--dim);font-size:var(--f0);letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.shopnav button.on{color:var(--brass);border-bottom-color:var(--brass)}
.freebar{border:1px solid var(--r5);background:rgba(166,107,245,.10);padding:7px 9px;margin-bottom:10px;
  font-size:var(--f1);color:var(--chalk);line-height:1.5}
.freebar b{color:var(--r5)}
.shopnote{display:block;font-size:var(--f0);color:var(--dim);line-height:1.45;margin:0 0 9px}
/* A shop is a rack of things you are choosing between, not a list you read
   top to bottom, so the tiles carry the art and the price and nothing else. */
.srib{display:flex;align-items:center;gap:8px;margin:12px 0 8px}
.srib span{font-family:var(--disp);font-size:var(--f2);letter-spacing:.06em;color:var(--brass);
  text-transform:uppercase;white-space:nowrap}
.srib:before,.srib:after{content:"";flex:1 1 auto;height:1px;background:var(--brass-dk);opacity:.5}
.sgrid{display:grid;gap:7px}
.sgrid.c3{grid-template-columns:repeat(3,1fr)}
.sgrid.c2{grid-template-columns:repeat(2,1fr)}
.card{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--raise);
  border-radius:0;overflow:hidden;text-align:center}
.card.on{border-color:var(--brass-dk)}
.card .chd{padding:5px 4px;background:var(--raise2);border-bottom:1px solid var(--line);
  font-size:var(--f1);font-weight:700;color:var(--chalk);letter-spacing:.02em;line-height:1.25}
.card .cart{position:relative;flex:1 1 auto;display:flex;align-items:center;justify-content:center;
  padding:10px 4px;background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.07),transparent 66%)}
.card .cart img{width:48px;height:48px;image-rendering:pixelated;image-rendering:crisp-edges}
.sgrid.c3 .cart img{width:36px;height:36px}
.card .csub{padding:0 5px 6px;font-size:var(--f0);color:var(--dim);line-height:1.35}
.card .csub b{color:var(--aurora)}
.card .pips{display:flex;gap:2px;justify-content:center;padding:0 5px 6px}
.card .pips i{width:7px;height:3px;background:#17301F}
.card .pips i.on{background:var(--brass)}
.price{display:block;width:100%;padding:8px 4px;border:0;border-top:1px solid var(--brass-dk);
  background:var(--raise2);color:var(--brass);border-radius:0;text-align:center;
  font-weight:700;font-size:var(--f2);line-height:1.2;font-family:var(--mono)}
.price.no{border-top-color:var(--line);color:var(--dim);background:transparent}
.price.max{border-top-color:var(--line);color:var(--dim);background:transparent}
.price small{display:block;font-size:var(--f0);letter-spacing:.08em;color:var(--dim);
  font-weight:400;font-family:var(--sans);text-transform:uppercase;margin-top:1px}
/* On the art, not on the header: over the header it sat on top of the number,
   and a bonus badge that hides the amount it is a bonus on is worse than none.
   A short one like "+40%" tucks into the corner, but "BEST VALUE" is half the
   width of the card and was lying across the top of the drawing. The art makes
   room for it instead, and only when there is one: .cart takes the spare height
   in the card, so pushing the icon down does not move the price under it or
   leave this card taller than the one beside it. */
.badge{position:absolute;top:2px;right:2px;background:var(--r5);color:#120A1E;font-size:var(--f0);
  font-weight:700;padding:1px 4px;letter-spacing:.04em;z-index:2}
.card .cart.hasbadge{padding-top:22px}
.sovline{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;
  font-size:var(--f1);color:var(--dim)}
.sovline b{font-family:var(--mono);font-size:var(--f4);color:var(--r5)}
.rstrip i{flex:1 1 0;min-width:1px;height:2px;background:#162C22;transition:height .12s linear}
.rstrip i.lit{background:#2E4A3C}
.rstrip i.on{background:var(--rc,var(--brass))}
.rstrip i.hi{background:var(--chalk);box-shadow:0 0 0 1px var(--rc,var(--brass))}

/* the honours shelf, on the stage under the hole readout */
/* two stage buttons, drawn from the same pixel grid as the game */
/* The shop sits bottom left, the far corner from the two stage buttons and
   clear of the shot book icons the renderer draws up from that edge. */
/* Under the readout rather than down in the corner, and the size of the other
   two stage buttons rather than half again bigger than them.
   It sits in a column with the readout rather than at a percentage of the
   stage, because the readout is built out of fixed pixel type: it is about
   45px tall whatever the screen, which is 14% of a short stage and 9% of a tall
   one. Any single top% is wrong on one of them, and a calc() off 45px is a
   guess that the next line added to the readout would break. In the column it
   just follows whatever the readout turns out to be.
   The percentages inside #hudLeft are rebased on its 56%: the readout's old
   min-width of 36% of the stage is 64% of this, and its old max-width of 56%
   is all of it, so it still sizes to its text between the same two bounds. */
/* 29, which is what the readout carried on its own: below #toasts at 30, so a
   toast still paints over the readout rather than under it. Toasts are
   pointer-events:none, so the button underneath stays pressable either way. */
#hudLeft{position:absolute;left:2.2%;top:2.5%;width:56%;z-index:29;
  display:flex;flex-direction:column;align-items:flex-start;gap:12px;
  pointer-events:none}
/* min-width, or on a 320 phone the button comes to 19.7px around a 24px sprite
   and the drawing hangs outside its own tap target. */
#shopBtn{position:relative;width:11%;min-width:24px;aspect-ratio:1/1;flex:0 0 auto;pointer-events:auto;
  background:none;border:0;padding:0;display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.9))}
/* The button is a share of the stage so the tap target grows with the screen;
   the sprite inside is a fixed 24, which is 2x of 12. At 100% of the button it
   landed on 24.5 and 24.7 and the pixels came out in uneven widths. */
#shopIcon{display:block;width:24px;height:24px;object-fit:contain;
  image-rendering:pixelated;image-rendering:crisp-edges}
#shopBtn:active,#setBtn:active,#hudClimb:active{transform:translateY(1px)}
#setBtn,#hudClimb{position:relative;width:24px;height:24px;flex:0 0 auto;pointer-events:auto;
  background:none;border:0;padding:0;display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 0 1px #000) drop-shadow(0 0 1px #000) drop-shadow(0 1px 2px rgba(0,0,0,.9))}
#hudClimb.off{opacity:.55}
#setIcon,#hudClimbIcon{display:block;width:24px;height:24px;image-rendering:pixelated;image-rendering:crisp-edges}
/* settings sheet */
.setrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;
  border-bottom:1px solid var(--line-soft)}
.setrow .ds{margin-top:2px}
#saveCode{width:100%;height:86px;margin:8px 0 6px;background:var(--ink);color:var(--chalk);
  border:1px solid var(--line);font-family:var(--mono);font-size:var(--f0);padding:6px;resize:none;
  word-break:break-all}
.setbtns{display:flex;gap:6px;flex-wrap:wrap}
#shopDot{position:absolute;top:-8%;right:-8%;width:32%;height:32%;background:var(--r5);display:none}
#shopBtn.new #shopDot{display:block}
#honBtn,#perkBtn{position:absolute;right:2.5%;width:6.2%;min-width:24px;aspect-ratio:1/1;z-index:31;
  background:none;border:0;padding:0;display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.9))}
/* Pushed down from 24 and 35.5. The comment over #toasts says these sit below
   them; they did not. A toast is built out of fixed pixel type while these are
   a percentage of the stage, so the shorter the screen the further down the
   stack reaches: measured with the tallest pair the game can actually raise --
   two real unlocks, straight out of checkAch -- it comes to 34.1% of the stage
   on a 320x568 phone, 23.2% at 360x640 and 17.8% at 400x860. 37 clears the
   worst of those with room, rather than clearing the one screen I happened to
   measure first. */
#honBtn{top:37%}
/* One button and a gap below the first, rather than 11.5% further down. The
   buttons are sized off the stage's width and the gap was a share of its
   height, so on a phone on its side -- a stage 400 wide and 207 tall -- the two
   overlapped by two pixels. A margin's percentage reads the WIDTH, the same
   thing the buttons are sized from, so the gap now tracks the buttons. */
#perkBtn{top:37%;margin-top:calc(max(24px, 6.2%) + max(8px, 4%))}
/* The hole from above, under the two stage buttons and above the weather.
   Placed by placeMap(), which measures both, and left out when the stage is
   too short to hold it. Each map pixel is two screen pixels. */
#holeMap{position:absolute;right:2.5%;z-index:28;display:none;pointer-events:none;
  image-rendering:pixelated;image-rendering:crisp-edges;
  box-shadow:0 0 0 1px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.45)}
#honIcon,#perkIcon{display:block;width:24px;height:24px;object-fit:contain;
  image-rendering:pixelated;image-rendering:crisp-edges}
#honBtn:active,#perkBtn:active{transform:translateY(1px)}
@keyframes hpulse{0%,100%{opacity:1}50%{opacity:.62}}
#honBtn.new,#perkBtn.ready{animation:hpulse 4.6s ease-in-out infinite}
#perkDot{position:absolute;top:-6%;right:-6%;width:34%;height:34%;border-radius:0;
  background:var(--aurora);display:none}
#perkBtn.live #perkDot{display:block}
/* Top right corner, clear of the readout on the left and the two stage
   buttons below. Two at a time: any more and they became the view. */
/* 38 and not 52. The readout's column runs to 58.2% of the stage (2.2 + 56),
   so anything wider than 39.8 here reaches into it -- measured overlapping the
   readout by 39px at 320 wide and 10px at 400, on a comment that says these sit
   "clear of the readout on the left". They do now. */
#toasts{position:absolute;right:2%;top:2%;display:flex;flex-direction:column;
  align-items:flex-end;gap:3px;pointer-events:none;z-index:30;max-width:38%}
.toast{background:rgba(8,18,12,.9);border:1px solid var(--line);border-radius:0;
  padding:3px 8px;font-size:var(--f0);line-height:1.3;text-align:right;
  animation:tin .22s ease-out;backdrop-filter:blur(2px)}
.toast b{color:var(--brass)}
/* the sovereign coin, in place of the word: "sovereigns" in a toast made the
   stack tall enough to reach the honours button on a phone on its side */
.tsov{display:inline-block;width:12px;height:12px;vertical-align:middle;margin:-3px 0 -3px 2px;
  image-rendering:pixelated;image-rendering:crisp-edges}
.toast.ach{border-color:var(--brass-dk);background:rgba(28,20,6,.94);white-space:normal}
.toast.ach .achk{font-size:var(--f0);letter-spacing:.1em;text-transform:uppercase;color:var(--brass);
  display:block;margin-bottom:1px}
@keyframes tin{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

.empty{padding:26px 16px;text-align:center;color:var(--faint);font-size:var(--f3);line-height:1.6}
.hint{padding:9px 12px;font-size:var(--f1);color:var(--faint);line-height:1.5;border-bottom:1px solid #12261A}
/* Detail that is worth having but not worth reading every time. Folded away
   behind a tap rather than deleted: the screens were three paragraphs deep
   before you got to anything you could press. */
.fold{display:none}
.open .fold{display:block}
.foldhead{display:flex;align-items:flex-start;gap:6px}
.foldhead>span{flex:1}
.qm{flex:0 0 auto;width:24px;height:24px;border-radius:0;border:1px solid var(--line-soft);
  color:var(--faint);font-size:var(--f1);line-height:22px;text-align:center;font-weight:700;
  background:none;padding:0;margin-left:6px}
.open .qm{color:var(--brass);border-color:var(--brass-dk)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

<div id="app">

  <!-- Five destinations, not seven. Skills are part of what you take out on
       the hole, so they sit with the bag; retirement and the trophy room are

    <button class="tab" data-v="dgn">Wagers<span class="dot"></span></button>
    <button class="tab" data-v="tour">Tour<span class="dot"></span></button>
    <button class="tab" data-v="career">Career<span class="dot"></span></button>

        <div class="vital"><div class="k">Tempo</div><div class="v" id="vSpeed">0/s</div></div>
        <div class="vital"><div class="k">Carry</div><div class="v" id="vDps">0</div></div>
        <div class="vital"><div class="k">Pure</div><div class="v" id="vCrit">0%</div></div>
        <div class="vital"><div class="k">Prov</div><div class="v" id="vMst">0%</div></div>
      </div>
      <div class="band"><span class="eyebrow">Practice Range</span><span class="note" id="upgCount"></span></div>
      <div class="band" style="top:auto"><div id="multBar"></div></div>

        <div id="setBox"></div>

<script>
"use strict";
/* =========================================================================
   MYTHIC MULLIGAN
   An idle auto-battler. The golfer swings on his own; you build the golfer.

   THE THREE CURVES, and why they are set where they are:
     TIER_Y  yardage per Tour Card step        4
     TIER_G  purse per Tour Card step          2.16
     gear    ILVL_STEP per item level          1.27
   Purse sits deliberately BELOW yardage. Gold upgrades alone therefore lose
   ground every tier, and the deficit is what gear, skills, the Depths and
   relics are for. Set TIER_G at or above TIER_Y and the run never walls,
   which means retirement never has anything to push against.

   Par is an ABSOLUTE clock: par 3 is 6.5 seconds, par 4 9.8, par 5 13, at
   every tier forever. A Tour Card step multiplies yardage but not the clock,
   and holes are fixed to their card, so a golfer gets stronger on a card, sees
   it in the score, and moves up; climbing drops you back a few bands.
   ========================================================================= */
const B = {
  /* ---- the ladder ---- */
  // Each card's holes are 4x the one below and pay 2.16x. Holes are fixed to
  // their card: a card's purse buys about 4.6x the carry in upgrades, so at
  // 2.35x a card a golfer outran every card (card 30 and level 60 inside three
  // hours, nearly all aces), which the course used to hide by stretching every
  // hole to the golfer. At 4x, eight seeds of eight hours climb 7-10 cards in
  // the first hour while ahead, then one or two an hour; 3x ran away to card
  // 50 and 3.5x to card 16 in three hours.
  TIER_Y: 4, TIER_G: 2.16, Y0: 60, G0: 14, TIER_MAX: 400,
  // Retiring starts you on the highest card where a fresh par four would
  // still come in at this share of par time (a birdie), on the golfer you are
  // once the range resets -- never above the best card you had reached.
  RETIRE_FIT: 0.77,
  // a round averaging this many under par a hole opens the next card at once
  ROUND_OPEN: -2.5,
  // Two thirds of what they were (10/15/20), with the handicap raised from
  // 0.34 to 0.52 to match: a golfer ahead of the card plays exactly the same
  // hole in exactly the same time, but it now reads as a birdie rather than
  // an eagle. See HCP.
  PAR_TIME: { 3: 6.5, 4: 9.8, 5: 13 },
  TIER_ROMAN: ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV',
               'XVI','XVII','XVIII','XIX','XX','XXI','XXII','XXIII','XXIV','XXV'],

  /* ---- the round ---- */
  ROUND: 18, DAYS: 4,
  DAY_NAMES: ['Thursday','Friday','Saturday','Sunday'],
  PAR_LAYOUTS: [
    [4,5,4,3,4,4,5,3,4, 4,4,3,5,4,4,3,4,5],
    [4,4,3,5,4,3,4,5,4, 4,3,5,4,4,3,4,4,5],
    [5,4,3,4,4,4,3,5,4, 3,4,5,4,4,3,4,5,4]
  ],

  /* ---- scoring, read off the clock ----
     pay is 1.27x what it was when a golfer ahead of the card carded eagles:
     the same round now reads a band worse (mostly birdies), and the same
     round should pay what it did. Measured over 24 hours of play, the typical
     hole's pay rate fell from 1.95 to 1.53 without it. */
  SCORE: [
    { r:0.10, d:-4, n:'Ace',       pay:4.3 },
    { r:0.27, d:-3, n:'Albatross', pay:3.05 },
    { r:0.47, d:-2, n:'Eagle',     pay:2.4 },
    { r:0.77, d:-1, n:'Birdie',    pay:1.85 },
    { r:1.16, d: 0, n:'Par',       pay:1.27 },
    { r:1.85, d: 1, n:'Bogey',     pay:1.04 },
    { r:2.95, d: 2, n:'Double',    pay:0.86 },
    { r:4.70, d: 3, n:'Triple',    pay:0.74 },
    { r:1e18, d: 4, n:'Snowman',   pay:0.64 }
  ],
  // A hole pays this fraction of its purse out swing by swing, credited in
  // proportion to damage dealt. Tying the trickle to damage rather than to a
  // flat per-swing figure makes it immune to swing-speed inflation: the hole
  // is worth what it is worth however many swings you take to erase it.
  SWING_SHARE: 0.34,
  // You cannot finish a hole faster than you can walk up and putt out. Without
  // this floor, purse per second goes as 1/holeTime and runs away with no
  // ceiling: overshoot a Tour Card and every hole is an instant Ace, so income
  // outruns the cost of the next card forever and the ladder never walls.
  // Nine tenths of a second is also the shortest a hole can be and still be
  // worth watching, and it is what makes an Ace the genuine ceiling it should be.
  WALK_MIN: 0.9,

  /* ---- the swing ---- */
  BASE_POWER: 6, BASE_SPEED: 0.85,
  // Tempo is capped in the simulation because an uncapped attack rate is just
  // a second damage multiplier wearing a hat. Everything past the cap converts
  // to power at half rate, so tempo gear never becomes dead weight.
  SPEED_CAP: 14, SPEED_OVERFLOW: 0.5,
  CRIT_BASE: 0.03, CRIT_CAP: 0.80, CRIT_MULT: 4.0,
  PROC_BASE: 0.08, PROC_CAP: 0.55,
  VIS_SWING_CAP: 4.2,      // visual swings per second; the math runs uncapped


  /* =======================================================================
     ICONS
     One set of path data on a 24x24 grid, drawn as SVG in the panels and as
     Path2D on the canvas, so a skill looks identical in the shot book and on
     the HUD. 'f' paths fill (even-odd, so a hole in a shape is just a second

    sov6: ['XXXX.XXXX.XX','wXXx.wXXx.wX','xXXx.xXXx.xX','.XXx..XXx..X','XXXXXXXXXXXX','XwwwwwwwwwXx','XwXXXXXXXXXx','XwXXXXXXXXXx','XxXXXXXXXXXx','.XXXXXXXXXx.','..XXXXXXXx..','....XXXx....'],

  // THE HANDICAP
  // Cards are earned by playing, but nothing stopped you buying power far
  // faster than the course could grow, so every hole bottomed out at an Ace and
  // score stopped meaning anything. Range work is now priced against how far
  // ahead of your card you already are: at par it costs nothing extra, and the
  // further under par you are clearing holes, the dearer the next rung gets.
  // It is a rubber band, not a wall - it relaxes the moment the course catches
  // up, which happens every time a card grows or you climb.
  // Taxing the range alone could not hold the line, because most of your power
  // is free: gear, talents, paragon, trophies and honours all arrive without
  // being bought. So the course plays you off a handicap instead. A hole is
  // never shorter than what your bag can clear in HCP of par time, which keeps
  // the card honest no matter where the power came from. The purse still
  // follows the CARD, so getting ahead earns you nothing extra and climbing is
  // the only way to be paid more.
  // A hole stretched by your handicap pays for the extra yards, or buying power
  // would stop paying anything on the course. Sublinear, so climbing a card is
  // still worth more than sitting on one and out-hitting it.
  // (The handicap that stretched every hole to the golfer's power is gone:
  // holes are fixed to their card, and a golfer ahead of it moves up instead.
  // See TIER_Y.)
  CRIT_ADD: { face:0.00132, simul:0.00108 },
  CPW_ADD: 0.0174, DROP_ADD: 0.000675, PROC_ADD: 0.00099, DGN_ADD: 0.00315,
  MST_ADD: { provis:0.0018, second:0.0022 },
  CAP_PER_LEGACY: 25,     // every retirement re-opens each capped ladder

  // Loopers are gone. Their slot in the build is now the Provisional: a chance
  // that a swing plays a second ball. It is a different animal to raw power --
  // more hits means more affinity rolls, but armour bites each one separately.
  MST_CAP: 3.0, MST_DMG: 0.60,

  /* ---- the card ----
     There is no field. A rival leaderboard was inventing thirty names whose
     scores were derived from the player's own form, which is a mirror wearing a
     hat: it told you nothing you did not already know. You now play the course.
     Every event has a target, the target hardens with each cup you hold, and
     the purse follows how far under it you finish. ---- */
  // An Ace on all seventy two holes is the best card that exists, and the target
  // closes on it by this share of whatever is left each time you take a cup, so
  // the next cup is always harder than the last and the number is never free
  // twice. It used to harden by a flat nine a cup and then stop dead at -260,
  // which is inside what a maxed shot book can card: past about nineteen cups a
  // card that beat the number once beat it forever, and cups feed retirement
  // legacy at 1.16 a cup. Held to 0.968 rather than anything steeper because
  // Dynasty asks for fifty cups: at 0.968 the fiftieth asks for -248, which is
  // a hard card and not an impossible one, and the fiftieth is still six shots
  // harder than the flat floor ever got.
  // Set for the birdie-level scoring: a golfer ahead of the card posts about
  // -83 over four days, so the first cup asks -55 and the ladder closes on a
  // perfect card at 0.985 a cup. Eight seeds of three hours win 11.8 cups
  // (13.3 under the old eagle-level scoring against -86 and 0.968).
  TARGET_BASE: -55, TARGET_CLOSE: 0.985,

  PURSE_MAJOR: 1.5, PURSE_FINALE: 2.4,
  CUP_BASE: { event:500, major:800, finale:1200 },

  // is measured from where you stood when the day began. lv gates the two

  /* ---- retirement ---- */
  // A Tour Card is earned by playing, not by pressing a button. Five events on
  // a card unlock the next; once unlocked you may move up and down it freely.

  /* ---- the Trophy Room ----
     Relics were a shopping list: ten rows, bought top to bottom, done. Trophies
     are found. Legacy buys a DISCOVERY from a pool of thirty, weighted by tier,
     and what comes out is what you build around. The ten original relics are in
     the pool and keep their mechanics; the other twenty are new.
     A wall of 8/30 you are still filling is a reason to retire again. ---- */
  DISC_COST: 6, DISC_R: 1.215,
  // Cost has to outrun gain, or every level is cheaper per unit of power than
  // the one before and buying is infinitely profitable. The four multiplying
  // trophies were once at 1.45-1.50 gain against a 1.34 cost step, so their
  // exponent was BELOW one: a straight runaway. That was held by two constants

/* =========================================================================
   NUMBERS AND HELPERS
   ========================================================================= */
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const SUF = ['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
function fmt(n, dp){
  // NaN is a bug somewhere else, but it is not infinity, and saying so sent
  // anyone looking for it the wrong way
  if(Number.isNaN(n)) return '\u2014';
  if(!isFinite(n)) return '\u221e';
  if(n < 0) return '\u2212' + fmt(-n, dp);
  if(n < 1000){
    const r = n < 10 && dp !== 0 ? Math.round(n*10)/10 : Math.round(n);
    if(r < 1000) return r.toString();
    n = 1000;                    // 999.6 rounds up into the next unit
  }
  // Rounded to what will be shown BEFORE the unit is chosen. Chosen first,
  // 999,950 came out as "1000K", 9,996 as "10.00K" and 99,960 as "100.0K":
  // every unit boundary in the game read one digit too long.
  const show = x => x < 10 ? Math.round(x*100)/100 : x < 100 ? Math.round(x*10)/10 : Math.round(x);
  let e = Math.floor(Math.log10(n) / 3);
  let v = show(n / Math.pow(1000, e));
  if(v >= 1000){ e++; v = show(n / Math.pow(1000, e)); }
  const txt = v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : String(v);
  if(e < SUF.length) return txt + SUF[e];
  // past decillion, two-letter tags: aa, ab, ac ...
  const i = e - SUF.length;
  return txt + String.fromCharCode(97 + Math.floor(i/26)) + String.fromCharCode(97 + i%26);
}
const pct = v => (v*100 < 10 ? (v*100).toFixed(1) : Math.round(v*100)) + '%';
const pp  = v => '+' + (v*100).toFixed(1) + 'pp';
function hms(s){
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), q = s%60;
  return h ? (m ? h+'h '+m+'m' : h+'h') : m ? (q ? m+'m '+q+'s' : m+'m') : q+'s';
}
function hash32(n){
  n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4);
  n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15);
  return n >>> 0;
}
// deterministic per-hole RNG so a hole looks the same every time you see it
function seeded(seed){
  let s = hash32(seed) || 1;
  return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}
const roman = t => t < B.TIER_ROMAN.length ? B.TIER_ROMAN[t] : (t+1).toString();
// A number and the unit it carries do not get to sit on separate lines: "55 per
// cent" broke after "55 per", and "+1.2% swing power" after "+1.2%". One hard
// space, between the figure and the word it measures, and no further -- the
// rest of the line wraps as it likes.
const nb = t => String(t).replace(/([\d][\d.,]*\s*(?:%|pp|x|\u00d7)?)\s+(?=[A-Za-z])/g, '$1\u00a0');

/* ---- the calendar ---- */
const holeInRound  = h => ((h-1) % B.ROUND) + 1;
const dayIndex     = h => Math.floor((h-1) / B.ROUND) % B.DAYS;
const dayName      = h => B.DAY_NAMES[dayIndex(h)];
const roundIndex   = h => Math.floor((h-1) / B.ROUND);
const tournamentOf = h => Math.floor((h-1) / (B.ROUND*B.DAYS)) + 1;
const holesPlayed  = h => dayIndex(h)*B.ROUND + (holeInRound(h)-1);
const parOf = h => B.PAR_LAYOUTS[hash32(roundIndex(h)+7) % B.PAR_LAYOUTS.length][holeInRound(h)-1];
const slotOfEvent = t => B.SLOTS_SEASON[(t-1) % B.SEASON];
const COURSE_EVT = B.COURSE.filter(c => c.slot === 'event');
const COURSE_MAJ = B.COURSE.filter(c => c.slot === 'major');
const COURSE_FIN = B.COURSE.find(c => c.slot === 'finale');
// Regular stops are counted among regular stops. Indexed off the event number
// itself, any list whose length shared a factor with the season's slot pattern
// skipped courses for good: a season is event, event, major, event, event,
// finale, so every third number is taken, and with twelve regular courses four
// of them landed on those numbers every time and were never played.
const EVT_PER_SEASON = B.SLOTS_SEASON.filter(x => x === 'event').length;
function regularIndex(t){
  const season = Math.floor((t-1) / B.SEASON), pos = (t-1) % B.SEASON;
  let before = 0;

/* ---- chaotic conditions, drawn per round ---- */
function chaosFor(h, tier){
  const r = roundIndex(h) + (S && S.chaosBump || 0);
  const a = B.CHAOS[hash32(r*2654435761 + tier*97) % B.CHAOS.length];
  const list = [a];
  if(tier >= B.CHAOS_SECOND_TIER){
    const b = B.CHAOS[hash32(r*40503 + tier*7919 + 31) % B.CHAOS.length];

/* =========================================================================
   MIGRATION
   Saves outlive config. Anything the current build no longer defines is
   remapped or dropped here, before a single frame runs.
   ========================================================================= */
function migrate(){
  const okAff = new Set(B.AFFIX.map(a => a.id));
  const okEl  = new Set(B.ELEM.map(e => e.id));
  const fix = it => {
    if(!it) return;
    if(!Array.isArray(it.aff)) it.aff = [];
    it.aff = it.aff
      .filter(a => a && typeof a.roll === 'number')
      .map(a => okAff.has(a.k) ? a : { k:'mst', roll:a.roll });
    if(it.el && !okEl.has(it.el)) it.el = B.ELEM[0].id;
    // "at least zero" let a rarity of 99 through, and B.RARITY[99] is nothing:
    // the save loaded, and the first thing to score that club threw. A whole
    // number inside the table, or the bottom of it.
    it.rar = clamp(Math.floor(it.rar) || 0, 0, B.RARITY.length - 1);
    if(it.set && !setDef(it.set)) delete it.set;
    if(!(it.ilvl >= 0)) it.ilvl = 0;
    if(!(it.enh >= 0)) it.enh = 0;
  };
  B.SLOTS.forEach(s => {
    const it = S.equip[s.id];
    if(it){ fix(it); it.slot = s.id; }   // it is worn in this slot, so it is this slot's
  });
  if(!Array.isArray(S.bag)) S.bag = [];
  // a club for a slot this build does not have cannot be worn or scored
  S.bag = S.bag.filter(it => it && B.SLOTS.some(sl => sl.id === it.slot));
  S.bag.forEach(fix);

  for(const k in S.upg)     if(!B.UPG.some(u => u.id === k)) delete S.upg[k];
  for(const k in S.relic)   if(!B.TROPHY.some(t => t.id === k)) delete S.relic[k];
  // Ten talents stopped being a flat percentage of a Range stat and became
  // conditions on the course, which changes what a point in them buys. A point
  // spent on a line that no longer exists is the player's, not the line's, so
  // it comes back unspent -- the same way the paragon rebuild handed its
  // points back rather than deleting four hundred levels of work.
  for(const k in S.tal)
    if(!B.TREES.some(t => t.t.some(x => x.id === k))){
      const n = S.tal[k] || 0;
      if(n > 0){ S.talPts = (S.talPts || 0) + n; S.talRefund = (S.talRefund || 0) + n; }
      delete S.tal[k];
    }
  for(const k in S.skillLv) if(!B.SKILL.some(s => s.id === k)) delete S.skillLv[k];
  for(const k in S.stat)    if(!B.STATS.some(s => s.id === k)) delete S.stat[k];
  for(const k in S.perkOn)  if(!B.PERKS.some(p => p.id === k)) delete S.perkOn[k];
  if(S.dgnRun && !B.DGN.some(d => d.id === S.dgnRun.id && d.mode === S.dgnRun.mode)) S.dgnRun = null;
  for(const k in S.achDone) if(!B.ACH.some(a => a.id === k)) delete S.achDone[k];
  // Paragon lines and whole categories have changed shape, and a point spent on
  // a line that no longer exists belongs to the player, not to the line. They
  // come back as unspent points, dealt round the surviving categories the same
  // way paragon deals them in the first place. Deleting them silently is how a
  // save loses four hundred levels of work to a balance patch.
  let orphan = 0;
  for(const k in S.paraSpent){
    const [ci, ai] = k.split('.');
    const cat = B.PARAGON.find(x => x.id === ci);
    if(!cat || !cat.a.some(x => x.id === ai)){ orphan += S.paraSpent[k] || 0; delete S.paraSpent[k]; }
  }
  for(const k in S.paraPts)
    if(!B.PARAGON.some(c => c.id === k)){ orphan += S.paraPts[k] || 0; delete S.paraPts[k]; }
  for(let i = 0; i < orphan; i++){
    const cat = B.PARAGON[i % B.PARAGON.length];
    S.paraPts[cat.id] = (S.paraPts[cat.id] || 0) + 1;
  }
  if(orphan > 0) S.paraRefund = (S.paraRefund || 0) + orphan;

  S.carry = (S.carry || []).filter(id => B.SKILL.some(s => s.id === id));
  if(!S.carry.length) S.carry = ['thunder'];
  if(!S.skillLv.thunder) S.skillLv.thunder = 1;
  delete S.loopers;
}

// Reloading fires pagehide, which fires save, which wrote the state straight
// back over the file we had just deleted. Erasing has to switch saving off.
let WIPED = false;
// A second copy, written a minute behind the first. One unreadable save used to
// be the end of a career: boot could not parse it, started a fresh game, and
// twelve seconds later the fresh game saved straight over it.
const BAK = KEY + ':bak';
let saveN = 0, saveWarned = false;
function save(){
  if(WIPED) return;
  S.t = Date.now()/1000;
  try{
    const raw = JSON.stringify(S);
    localStorage.setItem(KEY, raw);
    if(!(saveN++ % 5)) localStorage.setItem(BAK, raw);
  }catch(e){
    // Private browsing and a full disk both land here, and it used to be
    // swallowed: hours of play, then nothing on the next visit and no word why.
    if(!saveWarned){ saveWarned = true; toast('This browser is not letting the game save'); }
  }
}
function readSave(k){
  try{
    const o = JSON.parse(localStorage.getItem(k) || 'null');
    // migrate() already drops anything this build no longer defines, so an
    // unfamiliar version number is something to migrate rather than a reason to
    // silently erase the save. Rejecting it here meant the day ver became 2
    // every player lost everything.
    return o && typeof o.ver === 'number' ? o : null;
  }catch(e){ return null; }
}
function load(){
  let o = readSave(KEY);
  if(!o){
    o = readSave(BAK);
    if(!o) return false;
    // Kept rather than overwritten, in case there is anything in it to rescue.
    try{
      const bad = localStorage.getItem(KEY);
      if(bad) localStorage.setItem(KEY + ':unreadable', bad);
    }catch(e){}
  }
  Object.assign(S, o);
  return o;
}

const TR_MULT = {};

function achMetric(m){

const achDone = id => !!S.achDone[id];

const achRatio = a => clamp(achMetric(a.m) / (a.v || 1), 0, 1);
// Decorated before the sort: achMetric('mst') calls derive(), and a comparator
// that asks for it on every comparison turns a thirty row list into a hundred
// and fifty derives four times a second. Measured: 0.052ms against 0.164ms for
// the naive comparator, 3.1x, and the two return the same order. renderHonBtn

    o[r.k] = (o[r.k] || 0) + r.v;

function career(){

              sharp:0, dbl:0, onesw:0,
              par5:0, shave:0, windy:0, cast:0, critproc:0, surge:0, mstcrit:0,
              sunday:0, look2:0, wfeat:0,
              // paragon's own territory: none of these touch a swing, and none
              // of them are sold anywhere else in the game
              pay:0, place:0, nine:0, tick:0,
              wdrive:0, wisland:0, wchip:0, wvault:0,
              reforge:0, attune:0, scrap:0, fit:0,
              plegacy:0, pdisc:0, pcurate:0, paway:0 };
  for(const s of B.STATS){
    const n = S.stat[s.id] || 0; if(!n) continue;
    const v = B.STAT_V[s.id];
    for(const k in v) o[k] += v[k] * n;
  }
  for(const tree of B.TREES)
    for(const t of tree.t){
      const n = talLv(t.id); if(!n) continue;

      o[a.k] += a.v * n;

function itemPrimary(it){
  const sl = B.SLOTS.find(s => s.id === it.slot);
  return sl.base * B.RARITY[it.rar].m * Math.pow(B.ILVL_STEP, it.ilvl) * (1 + B.ENH_STEP*it.enh);

function affixValue(it, a){

  const m = B.RARITY[it.rar] ? B.RARITY[it.rar].m : 1;
  let v = a.roll * (def.sc ? m : Math.sqrt(m));
  if(def.sc) v *= Math.pow(B.ILVL_STEP, it.ilvl) * (1 + B.ENH_STEP*it.enh);
  return v;
}
